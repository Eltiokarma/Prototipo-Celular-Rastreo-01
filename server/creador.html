                    este panel.
                  </div>
                </div>

                {/* La cuenta de gerencia se da acá y no en el panel de
                    Despacho: el gerente mira, entre otras cosas, cómo se está
                    corriendo la ruta — o sea el trabajo de Despacho. Nadie se
                    elige a su propio auditor. */}
                <div>
                  <div className="mono" style={{
                    fontSize: 11, letterSpacing: 1, color: 'var(--dim2)',
                    textTransform: 'uppercase', marginBottom: 8,
                  }}>Cuenta de gerencia</div>
                  <div className="campo">
                    <label>Usuario</label>
                    <input value={ger.usuario} placeholder="GERENTE-15"
                      onChange={ev => setGer({ ...ger, usuario: ev.target.value })} />
                  </div>
                  <div className="campo">
                    <label>Clave nueva</label>
                    <input value={ger.clave} onChange={ev => setGer({ ...ger, clave: ev.target.value })} />
                  </div>
                  <div className="campo">
                    <label>Alcance</label>
                    <select value={ger.routeId} onChange={ev => setGer({ ...ger, routeId: ev.target.value })}>
                      <option value="">Toda la cooperativa</option>
                      {e.rutas.map(r => (
                        <option key={r.routeId} value={r.routeId}>Solo la ruta {r.routeId}</option>
                      ))}
                    </select>
                  </div>
                  <button disabled={ocupado} onClick={() => correr(async () => {
                    await api(`/empresas/${e.companyId}/gerencia`, {
                      method: 'POST', body: JSON.stringify(ger),
                    });
                    setGer({ usuario: '', clave: '', routeId: '' });
                  }, 'Cuenta de gerencia lista')} style={{
                    padding: '8px 14px', fontSize: 13, background: 'var(--campo)',
                    color: 'var(--fg2)', border: '1px solid var(--line)',
                  }}>Crear o restablecer</button>
                  <div style={{ fontSize: 11, color: 'var(--dim2)', marginTop: 6, lineHeight: 1.45 }}>
                    Entra por el MISMO panel de Despacho, con más permisos: los
                    vehículos con su placa, los datos de la empresa y el logo son
                    suyos, y tiene la pestaña de números que Despacho no ve.
                    Despacho no le puede tocar la cuenta.
                    {e.gerencia && e.gerencia.length > 0 && (
                      <> Hoy: {e.gerencia.map(g =>
                        `${g.unitId} (${g.routeId || 'toda'}${g.lastLogin ? ` · entró ${fecha(g.lastLogin)}` : ' · nunca entró'})`
                      ).join(', ')}.</>
                    )}
                  </div>
                </div>
              </div>

              {/* Los trazados (variantes) de cada ruta se crean, renombran,
                  borran y DIBUJAN en la pestaña RUTAS: acá estaban repetidos
                  y a medias. Esta tarjeta administra la cooperativa; el mapa
                  y su cartografía viven allá. */}

            </div>
          )}
        </div>
      ))}

      {/* Suspender saca de circulación a una cooperativa entera en el acto:
          los choferes que están manejando pierden la pantalla y Despacho se
          queda sin mapa. Con las tarjetas una debajo de otra es demasiado
          fácil apretar la equivocada, así que se confirma, el cartel dice el
          nombre de cuál, y la consecuencia va contada en gente concreta.
          Habilitar no confirma: no rompe nada. */}
      {confirmar && (() => {
        const e = empresas.find(x => x.companyId === confirmar);
        if (!e) return null;
        // `personas` no cuenta las cuentas de Despacho: el total es la suma
        // de las dos. Restar una de la otra daba números que no cerraban.
        const total = e.personas + e.despacho.length;
        return (
          <div style={{
            position: 'fixed', inset: 0, zIndex: 4000, background: 'var(--velo)',
            display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16,
          }} onClick={() => setConfirmar(null)}>
            <div onClick={ev => ev.stopPropagation()} style={{
              width: 500, maxWidth: '100%', background: 'var(--surface)',
              border: '1px solid var(--line)', borderRadius: 16, padding: 24,
              boxShadow: '0 30px 60px -30px rgba(11,34,57,.55)',
            }}>
              <div className="mono" style={{
                fontSize: 10, fontWeight: 700, letterSpacing: 1.6,
                color: 'var(--red)', textTransform: 'uppercase', marginBottom: 10,
              }}>Confirmar suspensión</div>
              <div className="black" style={{ fontSize: 21, lineHeight: 1.25 }}>
                Suspender «{e.name}»
              </div>
              <div style={{
                background: 'var(--rojoFondo)', border: '1px solid var(--rojoBorde)',
                borderLeft: '3px solid var(--red)', borderRadius: 11, padding: 13,
                margin: '16px 0 20px', fontSize: 13, lineHeight: 1.6, color: 'var(--rojoTinta)',
              }}>
                Corta el acceso <strong>en el acto</strong> a {total === 1 ? 'la única persona' : `las ${total} personas`}
                {' '}de la cooperativa: {e.despacho.length} cuenta{e.despacho.length === 1 ? '' : 's'} de
                Despacho y {e.personas} chofer{e.personas === 1 ? '' : 'es'} y cobradores.
                Las unidades en ruta pierden la conexión y las sesiones abiertas se
                cierran en el momento.
              </div>
              <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                <button disabled={ocupado} onClick={() => { setConfirmar(null); correr(
                  () => api(`/empresas/${e.companyId}/estado`, {
                    method: 'POST', body: JSON.stringify({ activa: false }),
                  }), 'Cooperativa suspendida');
                }} style={{
                  height: 42, padding: '0 16px', fontSize: 13,
                  background: 'var(--red)', color: '#fff', borderRadius: 10,
                }}>Sí, suspender «{e.name}»</button>
                <button onClick={() => setConfirmar(null)} style={{
                  height: 42, padding: '0 16px', fontSize: 13, background: 'var(--surface)',
                  color: 'var(--dim2)', border: '1px solid var(--line)', borderRadius: 10,
                }}>No</button>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// ─── RUTAS: EL TRAZADOR ────────────────────────────────────────
// Las rutas las carga este nivel al dar de alta la cooperativa — igual que
// el logo: la cooperativa recibe el sistema ya configurado y Despacho a lo
// sumo corrige. La geometría y la edición viven en window.Trazador
// (server/trazador.js), que Node prueba con require(); acá solo está el
// mapa y el pegamento con React.
//
// Las herramientas que el trazador de Despacho no tiene, pedidas por quien
// lo usó ("más herramientas de desplazamiento y selección"):
//   · clic SOBRE la línea inserta en el medio (densificar una curva sin
//     rehacer desde ahí)
//   · SELECCIONAR dos puntos y borrar la cuadra que quedó entre ellos
//   · deshacer (Ctrl+Z)
//   · modo mano — y la barra espaciadora lo activa mientras se la tenga
//     apretada, que es como se usa en cualquier editor de dibujo

const CENTRO_JULIACA = [-15.4904, -70.1333];
// Geoapify (mismo diseño que las tiles claras de antes). La clave viene de
// /config.js — variable de entorno del servidor, nunca escrita acá.
const BALDOSAS = `https://maps.geoapify.com/v1/tile/positron/{z}/{x}/{y}{r}.png?apiKey=${window.TILES_KEY || ''}`;
const ATRIB_BALDOSAS = 'Powered by <a href="https://www.geoapify.com/">Geoapify</a> · © OpenMapTiles · © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
// Arriba de este tope los puntos dejan de ser arrastrables (miles de
// marcadores hacen inusable el mapa): queda la línea, y Deshacer.
const TOPE_ARRASTRABLES = 200;
// El dedo/cursor "toca" la línea hasta esta distancia en pantalla.
const UMBRAL_PX = 12;

function Rutas({ api, empresas, aviso, fallo, recargar }) {
  // Si Leaflet o la lógica del trazador no llegaron, se dice QUÉ faltó en
  // vez de reventar la página entera (pasó: sin leaflet.js, elegir una ruta
  // dejaba todo en blanco). La condición no cambia durante la vida de la
  // página —los <script> ya corrieron o ya fallaron al llegar acá—, así que
  // este return temprano nunca altera el orden de los hooks entre renders.
  if (typeof L === 'undefined' || !window.Trazador) {
    const falta = [
      typeof L === 'undefined' && 'el mapa (leaflet.js)',
      !window.Trazador && 'la lógica del trazador (trazador.js)',
    ].filter(Boolean).join(' y ');
    return (
      <div style={{
        background: 'var(--rojoFondo)', border: '1px solid var(--rojoBorde)',
        borderLeft: '3px solid var(--red)', borderRadius: 12, padding: 16,
        fontSize: 13, lineHeight: 1.6, color: 'var(--rojoTinta)', maxWidth: 640,
      }}>
        <div className="black" style={{ fontSize: 15, marginBottom: 6 }}>El trazador no pudo cargar</div>
        No llegó {falta} desde el servidor. Suele ser un corte de red de un
        momento: recargá la página (Ctrl+Shift+R). Si sigue pasando, avisanos.
      </div>
    );
  }
  const T = window.Trazador;
  const [companyId, setCompanyId] = React.useState('');
  const [routeId, setRouteId] = React.useState('');
  const [variantes, setVariantes] = React.useState(null);
  const [variantId, setVariantId] = React.useState(null);
  const [tramos, setTramos] = React.useState(null);       // { ida, vuelta } de [lat, lng]
  const [tramo, setTramo] = React.useState('ida');
  const [modo, setModo] = React.useState('dibujar');      // dibujar · mano · seleccionar
  const [manoTemporal, setManoTemporal] = React.useState(false);   // barra espaciadora
  const [seleccion, setSeleccion] = React.useState([]);   // índices elegidos: [] · [i] · [i, j]
  const [sucio, setSucio] = React.useState(false);
  const [guardando, setGuardando] = React.useState(false);

  const mapRef = React.useRef(null);
  const capaRef = React.useRef(null);
  const archivoRef = React.useRef(null);
  const encuadradoRef = React.useRef(false);
  const historialRef = React.useRef(T.crearHistorial());
  // Los manejadores de Leaflet viven fuera del flujo de React: leen refs.
  const tramosRef = React.useRef(null);
  const tramoRef = React.useRef('ida');
  const modoRef = React.useRef('dibujar');
  const manoRef = React.useRef(false);
  const sucioRef = React.useRef(false);
  React.useEffect(() => { tramosRef.current = tramos; }, [tramos]);
  React.useEffect(() => { tramoRef.current = tramo; }, [tramo]);
  React.useEffect(() => { modoRef.current = modo; setSeleccion([]); }, [modo]);
  React.useEffect(() => { manoRef.current = manoTemporal; }, [manoTemporal]);
  React.useEffect(() => { sucioRef.current = sucio; }, [sucio]);

  const empresa = empresas.find(e => e.companyId === companyId) || null;
  const rutas = empresa ? empresa.rutas : [];
  const variante = (variantes || []).find(v => v.variantId === variantId) || null;

  // Cambiar de dibujo con trabajo sin guardar merece una pregunta. Es un
  // confirm() pelado y no un modal: herramienta interna, y la alternativa
  // real es perder media hora de puntos.
  const confirmarDescarte = () =>
    !sucioRef.current || window.confirm('Hay cambios sin guardar en este recorrido. ¿Descartarlos?');

  const elegirEmpresa = (id) => {
    if (!confirmarDescarte()) return;
    setCompanyId(id); setRouteId(''); setVariantes(null); setVariantId(null);
    setTramos(null); setSucio(false); setSeleccion([]);
  };
  const elegirRuta = (id) => {
    if (!confirmarDescarte()) return;
    setRouteId(id); setVariantes(null); setVariantId(null);
    setTramos(null); setSucio(false); setSeleccion([]);
  };
  const elegirVariante = (id) => {
    if (!confirmarDescarte()) return;
    setVariantId(id); setSucio(false); setSeleccion([]);
  };

  // Los trazados de la ruta elegida. Se arranca por el que está MIDIENDO,
  // que es el caso normal.
  React.useEffect(() => {
    if (!companyId || !routeId) return;
    let vivo = true;
    api(`/empresas/${encodeURIComponent(companyId)}/rutas/${encodeURIComponent(routeId)}/variantes`)
      .then(d => {
        if (!vivo) return;
        setVariantes(d.variantes);
        const inicial = (d.variantes.find(v => v.activa) || d.variantes[0] || {}).variantId || null;
        setVariantId(inicial);
      })
      .catch(e => fallo(e.message));
    return () => { vivo = false; };
  }, [companyId, routeId]);

  // El dibujo que ya tenía ese trazado. Historial nuevo: deshacer no tiene
  // por qué poder cruzar a la variante anterior.
  React.useEffect(() => {
    if (!variantId) return;
    let vivo = true;
    setTramos(null);
    historialRef.current = T.crearHistorial();
    encuadradoRef.current = false;
    api(`/empresas/${encodeURIComponent(companyId)}/rutas/${encodeURIComponent(routeId)}/recorrido?variantId=${variantId}`)
      .then(d => {
        if (!vivo) return;
        setTramos({
          ida: (d.tramos?.ida || []).map(p => [p.lat, p.lng]),
          vuelta: (d.tramos?.vuelta || []).map(p => [p.lat, p.lng]),
        });
      })
      .catch(e => { fallo(e.message); if (vivo) setTramos({ ida: [], vuelta: [] }); });
    return () => { vivo = false; };
  }, [variantId]);

  // TODA mutación pasa por acá: guarda el estado en el historial ANTES de
  // cambiar nada — eso es lo que Ctrl+Z devuelve después.
  const aplicar = (fn) => {
    const ts = tramosRef.current;
    if (!ts) return;
    historialRef.current.guardar(ts);
    setTramos({ ...ts, [tramoRef.current]: fn(ts[tramoRef.current]) });
    setSucio(true);
  };

  const deshacer = () => {
    const antes = historialRef.current.deshacer();
    if (!antes) return;
    setTramos(antes); setSucio(true); setSeleccion([]);
  };

  // Ctrl+Z y la barra espaciadora, mientras esta pestaña esté abierta.
  React.useEffect(() => {
    const abajo = (e) => {
      if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); deshacer(); }
      else if (e.key === ' ') { e.preventDefault(); setManoTemporal(true); }
      else if (e.key === 'Escape') setSeleccion([]);
    };
    const arriba = (e) => { if (e.key === ' ') setManoTemporal(false); };
    window.addEventListener('keydown', abajo);
    window.addEventListener('keyup', arriba);
    return () => {
      window.removeEventListener('keydown', abajo);
      window.removeEventListener('keyup', arriba);
    };
  }, []);

  const initMap = React.useCallback((node) => {
    // React llama esto con null cuando el div del mapa se DESMONTA — y eso
    // pasa cada vez que se cambia de ruta (el bloque entero se va mientras
    // cargan los trazados nuevos). Hay que matar el mapa viejo acá: si no,
    // al volver el div, mapRef sigue apuntando al mapa del div anterior, no
    // se crea uno nuevo, y queda un rectángulo blanco muerto — con los
    // efectos dibujando sobre un mapa que ya no está en la página.
    if (!node) {
      if (mapRef.current) { try { mapRef.current.remove(); } catch {} }
      mapRef.current = null;
      capaRef.current = null;
      return;
    }
    if (mapRef.current) return;
    const map = L.map(node, { center: CENTRO_JULIACA, zoom: 14, zoomControl: true, attributionControl: true });
    map.attributionControl.setPrefix(false);
    L.tileLayer(BALDOSAS, { maxZoom: 19, attribution: ATRIB_BALDOSAS }).addTo(map);
    capaRef.current = L.layerGroup().addTo(map);

    map.on('click', (e) => {
      const ts = tramosRef.current;
      if (!ts || manoRef.current || modoRef.current === 'mano') return;
      if (modoRef.current === 'seleccionar') { setSeleccion([]); return; }   // clic al vacío: afuera
      const p = [e.latlng.lat, e.latlng.lng];
      // El umbral va en pantalla (px) pero la geometría en metros: se
      // convierte con el zoom del momento. Sobre la línea inserta; lejos,
      // agrega al final — el clic decide solo.
      const umbralM = UMBRAL_PX * T.metrosPorPixel(p[0], map.getZoom());
      const d = T.dondeVa(ts[tramoRef.current], p, umbralM);
      aplicar(ps => d.accion === 'insertar' ? T.insertar(ps, d.i, p) : T.agregar(ps, p));
    });

    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 80);
    setTimeout(() => map.invalidateSize(), 400);
  }, []);

  // Redibuja todo cada vez que algo cambia. Barato con cientos de puntos, y
  // mucho más simple que reconciliar marcadores uno a uno.
  React.useEffect(() => {
    const map = mapRef.current, capa = capaRef.current;
    if (!map || !capa || !tramos) return;
    capa.clearLayers();

    // El tramo que NO se edita, punteado y apagado de fondo: la vuelta se
    // dibuja pegada a la ida y hay que verla para calzarla.
    const otro = tramo === 'ida' ? 'vuelta' : 'ida';
    if (tramos[otro].length > 1) {
      L.polyline(tramos[otro], { color: 'var(--dim3)', weight: 4, opacity: 0.5, dashArray: '6 6' })
        .addTo(capa);
    }

    // Ámbar cuando lo que se dibuja NO es el trazado que mide hoy: mismo
    // aviso de color que usa el trazador de Despacho.
    const tinta = variante && !variante.activa ? '#A67300' : '#1668C4';
    const puntos = tramos[tramo];
    if (puntos.length > 1) {
      L.polyline(puntos, { color: tinta, weight: 5, opacity: 0.9 }).addTo(capa);
    }

    const [selA, selB] = seleccion.length === 2
      ? [Math.min(...seleccion), Math.max(...seleccion)] : [null, null];
    const enSeleccion = (i) => selA !== null
      ? i >= selA && i <= selB
      : seleccion.length === 1 && seleccion[0] === i;

    const editando = modo === 'dibujar' && !manoTemporal;
    const eligiendo = modo === 'seleccionar' && !manoTemporal;
    const arrastrables = editando && puntos.length <= TOPE_ARRASTRABLES;

    puntos.forEach((p, i) => {
      const extremo = i === 0 || i === puntos.length - 1;

      if (eligiendo) {
        // En selección, TODOS los puntos son clicleables aunque sean miles:
        // los circleMarker aguantan donde los divIcon no.
        const marcado = enSeleccion(i);
        const c = L.circleMarker(p, {
          radius: marcado ? 7 : 5, weight: 2,
          color: marcado ? '#C2001D' : tinta,
          fillColor: marcado ? '#C2001D' : '#fff', fillOpacity: 1,
        }).addTo(capa);
        c.on('click', (e) => {
          L.DomEvent.stopPropagation(e);
          setSeleccion(sel => sel.length === 1 && sel[0] !== i ? [sel[0], i] : [i]);
        });
        return;
      }

      if (!arrastrables) {
        L.circleMarker(p, { radius: 4, color: tinta, weight: 2, fillColor: '#fff', fillOpacity: 1 })
          .addTo(capa);
        return;
      }

      // A y B se quedan siempre: son lo único que dice en qué sentido se maneja.
      const etiqueta = i === 0 ? 'A' : i === puntos.length - 1 ? 'B' : '';
      const marcador = L.marker(p, {
        draggable: true,
        icon: L.divIcon({
          className: '',
          iconSize: [extremo ? 22 : 12, extremo ? 22 : 12],
          iconAnchor: [extremo ? 11 : 6, extremo ? 11 : 6],
          html: `<div style="width:100%;height:100%;border-radius:50%;
            background:#fff; border:2px solid ${tinta}; color:${tinta};
            box-sizing:border-box;
            display:flex;align-items:center;justify-content:center;
            font:700 11px/1 system-ui,sans-serif;">${etiqueta}</div>`,
        }),
      }).addTo(capa);
      marcador.on('dragstart', () => {
        // El historial guarda el estado de ANTES del arrastre entero, no
        // cada pixel del camino.
        historialRef.current.guardar(tramosRef.current);
      });
      marcador.on('dragend', (e) => {
        const { lat, lng } = e.target.getLatLng();
        const ts = tramosRef.current;
        setTramos({ ...ts, [tramoRef.current]: T.mover(ts[tramoRef.current], i, [lat, lng]) });
        setSucio(true);
      });
      // Tocar un punto lo borra (arrastrar no dispara click en Leaflet)
      marcador.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        aplicar(ps => T.borrar(ps, i));
      });
    });

    // Encuadrar una sola vez, cuando llega el dibujo que ya existía
    const todos = [...tramos.ida, ...tramos.vuelta];
    if (!encuadradoRef.current && todos.length > 1) {
      map.fitBounds(L.latLngBounds(todos).pad(0.15));
      encuadradoRef.current = true;
    }

    // El modo mano se nota en el cursor, no solo en el botón
    const nodo = map.getContainer();
    nodo.style.cursor = (modo === 'mano' || manoTemporal) ? 'grab'
      : modo === 'seleccionar' ? 'pointer' : 'crosshair';
  }, [tramos, tramo, modo, manoTemporal, seleccion, variante]);

  const importar = (texto) => {
    try {
      const crudos = T.leerRecorrido(texto);
      const simple = T.simplificar(crudos, 10).slice(0, 2000);
      aplicar(() => simple);
      encuadradoRef.current = false;
      aviso(`Importados ${crudos.length} puntos a la ${tramo}, simplificados a ${simple.length} sin cambiar la forma`);
    } catch (e) {
      fallo('No se pudo leer el archivo: ' + e.message);
    }
  };

  const borrarSeleccion = () => {
    if (seleccion.length !== 2) return;
    aplicar(ps => T.borrarEntre(ps, seleccion[0], seleccion[1]));
    setSeleccion([]);
    aviso('Cuadra borrada. El hueco quedó unido en línea recta: clic encima para redibujarla.');
  };

  const guardar = async () => {
    setGuardando(true);
    try {
      const aPuntos = (ps) => ps.map(p => ({ lat: p[0], lng: p[1] }));
      const r = await api(`/empresas/${encodeURIComponent(companyId)}/rutas/${encodeURIComponent(routeId)}/recorrido`, {
        method: 'PUT',
        body: JSON.stringify({ variantId, tramos: { ida: aPuntos(tramos.ida), vuelta: aPuntos(tramos.vuelta) } }),
      });
      setSucio(false);
      // El conteo de puntos del selector de trazados quedó viejo
      setVariantes(vs => (vs || []).map(v => v.variantId === variantId
        ? { ...v, puntos: r.puntos.ida + r.puntos.vuelta } : v));
      aviso(`Guardado: ida ${r.puntos.ida} pts · vuelta ${r.puntos.vuelta} pts · ${(r.largoM / 1000).toFixed(1)} km` +
        (variante?.activa ? ' — ya está en el mapa de todos' : ''));
    } catch (e) { fallo(e.message); }
    setGuardando(false);
  };

  // Guardar con un tramo a medias sería un circuito roto: mismas reglas que
  // valida el servidor, dichas ANTES del viaje.
  const idaIncompleta = tramos && tramos.ida.length === 1;
  const vueltaIncompleta = tramos && tramos.vuelta.length === 1;
  const sinIda = tramos && !tramos.ida.length && tramos.vuelta.length > 0;
  const trabado = guardando || !tramos || !sucio || idaIncompleta || vueltaIncompleta || sinIda;

  const kmDe = (ps) => (T.largoDe(ps || []) / 1000).toFixed(1);

  // La gestión de los trazados vive ACÁ, al lado del selector — antes
  // estaba repetida en la tarjeta de la cooperativa, a medias y sin mapa.
  const [gestion, setGestion] = React.useState(null);   // 'renombrar' | 'nuevo' | null
  const [nombreRuta, setNombreRuta] = React.useState('');
  const [nuevoTrazado, setNuevoTrazado] = React.useState({ name: '', copiarDe: '', desde: '', hasta: '', dias: [] });
  const [gestionando, setGestionando] = React.useState(false);

  const urlVariantes = () =>
    `/empresas/${encodeURIComponent(companyId)}/rutas/${encodeURIComponent(routeId)}/variantes`;

  const renombrarRuta = async () => {
    setGestionando(true);
    try {
      await api(`/empresas/${encodeURIComponent(companyId)}/rutas/${encodeURIComponent(routeId)}`, {
        method: 'PUT', body: JSON.stringify({ name: nombreRuta }),
      });
      aviso('Ruta renombrada');
      setGestion(null);
      if (recargar) await recargar();
    } catch (e) { fallo(e.message); }
    setGestionando(false);
  };

  const crearTrazado = async () => {
    if (!confirmarDescarte()) return;   // crear también CAMBIA al trazado nuevo
    setGestionando(true);
    try {
      const r = await api(urlVariantes(), { method: 'POST', body: JSON.stringify(nuevoTrazado) });
      aviso(`Trazado «${r.name}» creado — quedó elegido para dibujar`);
      setNuevoTrazado({ name: '', copiarDe: '', desde: '', hasta: '', dias: [] });
      setGestion(null);
      const d = await api(urlVariantes());
      setVariantes(d.variantes);
      setVariantId(r.variantId);
      setSucio(false);
    } catch (e) { fallo(e.message); }
    setGestionando(false);
  };

  const borrarTrazado = async () => {
    if (!variante || variante.activa) return;
    if (!window.confirm(`¿Borrar el trazado «${variante.name}»? Su dibujo se pierde.`)) return;
    setGestionando(true);
    try {
      await api(`/variantes/${variante.variantId}`, { method: 'DELETE' });
      aviso('Trazado borrado');
      const d = await api(urlVariantes());
      setVariantes(d.variantes);
      setVariantId(((d.variantes.find(v => v.activa) || d.variantes[0]) || {}).variantId || null);
      setSucio(false);
    } catch (e) { fallo(e.message); }
    setGestionando(false);
  };

  const btnChico = (extra) => ({
    height: 34, padding: '0 12px', fontSize: 12, background: 'var(--campo)',
    color: 'var(--fg2)', border: '1px solid var(--line)', ...extra,
  });

  const botonModo = (m, texto, titulo) => (
    <button key={m} onClick={() => setModo(m)} title={titulo} style={{
      height: 34, padding: '0 12px', fontSize: 12,
      background: modo === m ? 'var(--fg)' : 'var(--campo)',
      color: modo === m ? '#fff' : 'var(--fg2)',
      border: modo === m ? 'none' : '1px solid var(--line)',
    }}>{texto}</button>
  );

  return (
    <div>
      {/* Elegir sobre qué se dibuja: cooperativa → ruta → trazado */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 10, marginBottom: 12 }}>
        <div>
          <label>Cooperativa</label>
          <select value={companyId} onChange={e => elegirEmpresa(e.target.value)}>
            <option value="">Elegí una…</option>
            {empresas.map(e => <option key={e.companyId} value={e.companyId}>{e.name} ({e.companyId})</option>)}
          </select>
        </div>
        <div>
          <label>Ruta</label>
          <select value={routeId} disabled={!empresa} onChange={e => elegirRuta(e.target.value)}>
            <option value="">{empresa && !rutas.length ? 'No tiene rutas' : 'Elegí una…'}</option>
            {rutas.map(r => <option key={r.routeId} value={r.routeId}>{r.routeId}{r.name ? ` · ${r.name}` : ''}</option>)}
          </select>
        </div>
        <div>
          <label>Trazado</label>
          <select value={variantId || ''} disabled={!variantes}
            onChange={e => elegirVariante(Number(e.target.value))}>
            {(variantes || []).map(v => (
              <option key={v.variantId} value={v.variantId}>
                {v.name}{v.activa ? ' — MIDIENDO' : ''}{v.puntos ? '' : ' (sin dibujar)'}
                {v.dias ? ` · ${String(v.dias).split(',').map(d => ['Do', 'Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sá'][Number(d)] || d).join(' ')}` : ''}
              </option>
            ))}
          </select>
        </div>
      </div>

      {/* Renombrar la ruta, crear un trazado nuevo, borrar el elegido:
          todo lo de cartografía junto, al lado del selector. */}
      {routeId && variantes && (
        <div style={{ marginBottom: 12 }}>
          {gestion === null && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
              <button style={btnChico()} onClick={() => {
                setNombreRuta((rutas.find(r => r.routeId === routeId) || {}).name || '');
                setGestion('renombrar');
              }}>Renombrar ruta</button>
              <button style={btnChico()} onClick={() => setGestion('nuevo')}>+ Nuevo trazado</button>
              {variante && !variante.activa && (
                <button disabled={gestionando} onClick={borrarTrazado}
                  style={btnChico({ color: 'var(--red)' })}>Borrar este trazado</button>
              )}
            </div>
          )}
          {gestion === 'renombrar' && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
              <span className="mono" style={{ fontSize: 12, fontWeight: 800 }}>{routeId}</span>
              <input value={nombreRuta} autoFocus
                onChange={ev => setNombreRuta(ev.target.value)}
                onKeyDown={ev => { if (ev.key === 'Escape') setGestion(null); }}
                style={{ width: 280, height: 34, fontSize: 13 }} />
              <button disabled={gestionando || !nombreRuta.trim()} onClick={renombrarRuta} style={{
                height: 34, padding: '0 12px', fontSize: 12, background: 'var(--bright)', color: '#fff',
              }}>Guardar</button>
              <button style={btnChico({ color: 'var(--dim2)' })} onClick={() => setGestion(null)}>Cancelar</button>
              <span style={{ fontSize: 11, color: 'var(--dim3)' }}>
                El código {routeId} no se cambia: cuelga de él todo lo demás.
              </span>
            </div>
          )}
          {gestion === 'nuevo' && (
            <div style={{
              background: 'var(--surface)', border: '1px solid var(--line)',
              borderRadius: 12, padding: 14,
            }}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 10 }}>
                <div>
                  <label>Nombre del trazado nuevo</label>
                  <input value={nuevoTrazado.name} placeholder="Obra Av. Circunvalación" autoFocus
                    onChange={ev => setNuevoTrazado({ ...nuevoTrazado, name: ev.target.value })} />
                </div>
                <div>
                  <label>Copiar de</label>
                  <select value={nuevoTrazado.copiarDe}
                    onChange={ev => setNuevoTrazado({ ...nuevoTrazado, copiarDe: ev.target.value })}>
                    <option value="">Empezar vacío</option>
                    {variantes.map(v => <option key={v.variantId} value={v.variantId}>{v.name}</option>)}
                  </select>
                </div>
                <div>
                  <label>Rige desde / hasta (opcional)</label>
                  <div style={{ display: 'flex', gap: 6 }}>
                    <input type="date" value={nuevoTrazado.desde}
                      onChange={ev => setNuevoTrazado({ ...nuevoTrazado, desde: ev.target.value })} />
                    <input type="date" value={nuevoTrazado.hasta}
                      onChange={ev => setNuevoTrazado({ ...nuevoTrazado, hasta: ev.target.value })} />
                  </div>
                </div>
                <div>
                  <label>O ciertos días, todas las semanas</label>
                  <div style={{ display: 'flex', gap: 4 }}>
                    {['Do', 'Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sá'].map((rot, dia) => {
                      const puesto = nuevoTrazado.dias.includes(dia);
                      return (
                        <button key={dia} type="button"
                          title={puesto ? `Quitar ${rot}` : `Regir los ${rot}`}
                          onClick={() => setNuevoTrazado({
                            ...nuevoTrazado,
                            dias: puesto ? nuevoTrazado.dias.filter(d => d !== dia)
                                         : [...nuevoTrazado.dias, dia],
                          })} style={{
                            width: 34, height: 34, fontSize: 11, fontWeight: 700,
                            background: puesto ? 'var(--fg)' : 'var(--campo)',
                            color: puesto ? '#fff' : 'var(--dim2)',
                            border: puesto ? 'none' : '1px solid var(--line)',
                          }}>{rot}</button>
                      );
                    })}
                  </div>
                </div>
              </div>
              <div style={{ marginTop: 10, display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
                <button disabled={gestionando} onClick={crearTrazado} style={{
                  padding: '8px 14px', fontSize: 13, background: 'var(--bright)', color: '#fff',
                }}>Crear trazado</button>
                <button style={btnChico({ color: 'var(--dim2)' })} onClick={() => setGestion(null)}>Cancelar</button>
                <span style={{ fontSize: 11, color: 'var(--dim2)' }}>
                  Copiar del de siempre y corregir dos cuadras suele ser más
                  rápido que dibujarlo de nuevo. Con fechas, se activa y se
                  desactiva solo el día que corresponde; con días de la
                  semana («los domingos»), rige esos días y vuelve solo al
                  de siempre — el cambio pasa a la medianoche, antes de que
                  salga la primera combi. Con las dos cosas, rige esos días
                  solo dentro del período. Y si un día Despacho activa otro
                  trazado a mano, la mano manda hasta la medianoche.
                </span>
              </div>
            </div>
          )}
        </div>
      )}

      {!variantId && (
        <div style={{ fontSize: 13, color: 'var(--dim2)', lineHeight: 1.6, maxWidth: 640 }}>
          Elegí cooperativa y ruta para dibujar su recorrido. Acá se crean
          los trazados y acá se dibujan; la tarjeta de COOPERATIVAS
          administra cuentas y datos. Lo que se guarda sobre el trazado que
          está midiendo sale en el mapa de esa cooperativa al instante.
        </div>
      )}

      {variantId && (
        <div>
          {variante && !variante.activa && (
            <div style={{
              background: 'var(--ambarFondo)', border: '1px solid var(--ambarBorde)',
              borderLeft: '3px solid var(--amber)', borderRadius: 10,
              padding: '9px 12px', marginBottom: 10, fontSize: 13, color: 'var(--ambarTinta)',
            }}>
              Estás dibujando <strong>«{variante.name}»</strong>, que no es el
              trazado que está midiendo. Se guarda sin mover el mapa de nadie,
              hasta que Despacho lo active.
            </div>
          )}

          {/* La barra de herramientas */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', marginBottom: 10 }}>
            {botonModo('dibujar', 'DIBUJAR', 'Clic agrega al final · clic sobre la línea inserta en el medio · arrastrá para mover · clic en un punto lo borra')}
            {botonModo('mano', 'MANO', 'Moverse por el mapa sin sembrar puntos (o mantené la barra espaciadora)')}
            {botonModo('seleccionar', 'SELECCIONAR', 'Dos clics: desde acá hasta acá, y borrás la cuadra entera')}
            <span style={{ width: 1, height: 22, background: 'var(--divider)' }} />
            {['ida', 'vuelta'].map(tr => (
              <button key={tr} onClick={() => { setTramo(tr); setSeleccion([]); }} style={{
                height: 34, padding: '0 12px', fontSize: 12,
                background: tramo === tr ? 'var(--bright)' : 'var(--campo)',
                color: tramo === tr ? '#fff' : 'var(--fg2)',
                border: tramo === tr ? 'none' : '1px solid var(--line)',
              }}>{tr.toUpperCase()} {kmDe(tramos?.[tr])} km</button>
            ))}
            <span style={{ width: 1, height: 22, background: 'var(--divider)' }} />
            <button onClick={deshacer} title="Ctrl+Z" style={{
              height: 34, padding: '0 12px', fontSize: 12, background: 'var(--campo)',
              color: 'var(--fg2)', border: '1px solid var(--line)',
            }}>Deshacer</button>
            <button onClick={() => archivoRef.current?.click()} style={{
              height: 34, padding: '0 12px', fontSize: 12, background: 'var(--campo)',
              color: 'var(--fg2)', border: '1px solid var(--line)',
            }}>Importar GPX</button>
            {modo === 'seleccionar' && (
              <button onClick={borrarSeleccion} disabled={seleccion.length !== 2} style={{
                height: 34, padding: '0 12px', fontSize: 12,
                background: seleccion.length === 2 ? 'var(--red)' : 'var(--campo)',
                color: seleccion.length === 2 ? '#fff' : 'var(--dim3)',
                border: seleccion.length === 2 ? 'none' : '1px solid var(--line)',
              }}>
                {seleccion.length === 2 ? 'Borrar la cuadra elegida' :
                 seleccion.length === 1 ? 'Elegí el otro extremo…' : 'Elegí dos puntos'}
              </button>
            )}
            <div style={{ flex: 1 }} />
            {(idaIncompleta || vueltaIncompleta || sinIda) && (
              <span style={{ fontSize: 12, color: 'var(--amber)', fontWeight: 700 }}>
                {sinIda ? 'Falta la ida: el circuito arranca por ahí'
                  : `La ${idaIncompleta ? 'ida' : 'vuelta'} tiene un solo punto: dos como mínimo, o ninguno`}
              </span>
            )}
            <button disabled={trabado} onClick={guardar} style={{
              height: 36, padding: '0 18px', fontSize: 13,
              background: trabado ? 'var(--dim3)' : 'var(--bright)', color: '#fff',
            }}>{guardando ? 'Guardando…' : sucio ? 'Guardar' : 'Guardado'}</button>
          </div>

          <div ref={initMap} style={{
            height: 'max(420px, calc(100vh - 340px))', borderRadius: 12,
            border: '1px solid var(--line)', overflow: 'hidden',
          }} />
          {!tramos && <div style={{ fontSize: 12, color: 'var(--dim2)', marginTop: 8 }}>Cargando el recorrido…</div>}

          <div style={{ fontSize: 12, color: 'var(--dim3)', marginTop: 8, lineHeight: 1.6 }}>
            Clic agrega al final · clic <b>sobre la línea</b> inserta en el
            medio · arrastrá un punto para moverlo · clic en un punto lo borra
            · <b>espacio</b> = mano · <b>Ctrl+Z</b> deshace
            {tramos && tramos[tramo].length > TOPE_ARRASTRABLES &&
              ` · con más de ${TOPE_ARRASTRABLES} puntos no se arrastran (usá SELECCIONAR y Deshacer)`}
          </div>

          <input ref={archivoRef} type="file" accept=".gpx,.json,.geojson,application/gpx+xml"
            style={{ display: 'none' }}
            onChange={(ev) => {
              const f = ev.target.files?.[0];
              ev.target.value = '';
              if (!f) return;
              const lector = new FileReader();
              lector.onload = () => importar(lector.result);
              lector.onerror = () => fallo('No se pudo leer el archivo');
              lector.readAsText(f);
            }} />
        </div>
      )}
    </div>
  );
}

// ─── SALUD DEL SISTEMA ─────────────────────────────────────────
// Los respaldos de la base, y la pieza que completa el esquema: BAJARSE uno.
//
// El automático queda en el mismo disco que la base — cubre corrupción y
// borrados por error, no la pérdida del volumen. Descargar el archivo a otra
// máquina ES el respaldo fuera del servidor. Por eso el botón de descarga no
// es un extra: es la mitad del plan.
function Respaldos({ datos, api, recargar, aviso, fallo, token }) {
  const [ocupado, setOcupado] = React.useState(false);
  if (!datos) return <div style={{ color: 'var(--dim)' }}>Cargando…</div>;

  const kb = (b) => b >= 1024 * 1024 ? (b / 1024 / 1024).toFixed(1) + ' MB' : Math.round(b / 1024) + ' kB';
  const hace = (ms) => {
    if (!ms) return '';
    const min = Math.round((Date.now() - ms) / 60000);
    return min < 60 ? `hace ${min} min` : min < 60 * 48 ? `hace ${Math.round(min / 60)} h` : `hace ${Math.round(min / 1440)} días`;
  };
  const crear = async () => {
    setOcupado(true);
    try { await api('/respaldos', { method: 'POST' }); aviso('Respaldo creado y verificado'); await recargar(); }
    catch (e) { fallo(e.message); }
    setOcupado(false);
  };
  // La descarga va por fetch + blob y NO con el token en la URL: una URL con
  // token queda en la barra de direcciones, el historial y los logs.
  const bajar = async (archivo) => {
    try {
      const r = await fetch(BASE + '/respaldos/' + archivo, {
        headers: { Authorization: 'Bearer ' + token },
      });
      if (!r.ok) throw new Error('No se pudo descargar');
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = archivo; a.click();
      URL.revokeObjectURL(url);
    } catch (e) { fallo(e.message); }
  };

  return (
    <div>
      {datos.enMemoria && (
        <div style={{
          background: 'var(--rojoFondo)', border: '1px solid var(--rojoBorde)',
          borderLeft: '3px solid var(--red)', borderRadius: 11,
          padding: '11px 13px', marginBottom: 14, fontSize: 13, fontWeight: 700,
          color: 'var(--rojoTinta)',
        }}>La base está EN MEMORIA: no hay nada que respaldar ni que salvar. Montá el volumen primero.</div>
      )}
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 14, flexWrap: 'wrap' }}>
        <button disabled={ocupado || datos.enMemoria} onClick={crear} style={{
          padding: '10px 18px', fontSize: 13, fontWeight: 700,
          background: 'var(--brand)', color: '#fff', border: 'none', borderRadius: 8,
        }}>{ocupado ? 'Creando…' : 'Respaldar ahora'}</button>
        <span style={{ fontSize: 12, color: 'var(--dim2)' }}>
          Automático cada {datos.cadaHoras} h · se conservan {datos.conservar} ·
          y cada tanto <b>bajate uno</b>: el archivo en tu máquina es el respaldo
          que sobrevive a perder el servidor.
        </span>
      </div>
      {(datos.respaldos || []).length === 0 && !datos.enMemoria && (
        <div style={{ color: 'var(--dim)', fontSize: 13 }}>
          Todavía no hay ninguno. El primero sale solo, o con el botón de arriba.
        </div>
      )}
      {(datos.respaldos || []).map(r => (
        <div key={r.archivo} style={{
          display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap',
          background: 'var(--surface)', border: '1px solid var(--divider)',
          borderRadius: 10, padding: '10px 14px', marginBottom: 8,
        }}>
          <span className="mono" style={{ fontSize: 12, flex: '1 1 240px' }}>{r.archivo}</span>
          <span style={{ fontSize: 12, color: 'var(--dim2)' }}>{kb(r.bytes)} · {hace(r.cuando)}</span>
          <button onClick={() => bajar(r.archivo)} style={{
            padding: '7px 13px', fontSize: 12, background: 'var(--campo)',
            color: 'var(--fg2)', border: '1px solid var(--line)', borderRadius: 7,
          }}>Descargar</button>
        </div>
      ))}
    </div>
  );
}

function Sistema({ datos }) {
  if (!datos) return <div style={{ color: 'var(--dim)' }}>Cargando…</div>;
  // El respaldo se considera VIEJO pasadas dos vueltas del automático (o si
  // no hay ninguno): una vuelta perdida puede ser un reinicio; dos, no.
  const resp = datos.ultimoRespaldo;
  const cadaMs = (datos.respaldoCadaHoras || 6) * 3600 * 1000;
  const respaldoViejo = !datos.baseEnMemoria &&
    (!resp || (datos.ahora - resp.cuando) > 2 * cadaMs);
  const tarjetas = [
    ['Encendido hace', duracion(datos.ahora - datos.arrancadoEn)],
    ['Último respaldo', resp ? `hace ${duracion(datos.ahora - resp.cuando)}` : 'nunca'],
    ['Unidades en el mapa', datos.unidades],
    ['Conexiones', datos.conexiones],
    ['Cooperativas', `${datos.empresasActivas} de ${datos.empresas}`],
    ['Rutas', datos.rutas],
    ['Vehículos', datos.vehiculos],
    ['Personas', datos.personas],
    ['Sesiones abiertas', datos.sesionesAbiertas],
    ['Base de datos', `${datos.baseMb} MB`],
    ['Memoria', `${datos.memoriaMb} MB`],
    ['Node', datos.node],
    ['Sesiones de creador', datos.sesionesCreador],
  ];
  // Los avisos van ARRIBA de las tarjetas de salud, no debajo: son lo único
  // de esta pantalla que pide hacer algo hoy. Un número más entre doce no lo
  // es. Cada uno nombra el riesgo en su título, para que se lea en un barrido.
  const Aviso = ({ tono, titulo, children }) => (
    <div style={{
      background: tono === 'red' ? 'var(--rojoFondo)' : 'var(--ambarFondo)',
      border: `1px solid ${tono === 'red' ? 'var(--rojoBorde)' : 'var(--ambarBorde)'}`,
      borderLeft: `3px solid ${tono === 'red' ? 'var(--red)' : 'var(--amber)'}`,
      borderRadius: 12, padding: '15px 16px',
      display: 'flex', gap: 14, alignItems: 'baseline', flexWrap: 'wrap',
    }}>
      <span className="black" style={{
        fontSize: 14, flexShrink: 0,
        color: tono === 'red' ? 'var(--red)' : 'var(--amber)',
      }}>{titulo}</span>
      <span style={{
        flex: '1 1 300px', fontSize: 13, lineHeight: 1.6,
        color: tono === 'red' ? 'var(--rojoTinta)' : 'var(--ambarTinta)',
      }}>{children}</span>
    </div>
  );

  return (
    <div>
      {/* Dónde vive la base es el aviso más caro de todos: si está
          equivocado, un despliegue borra las cuentas de todos los choferes
          y el historial entero. Por eso son TRES estados y no dos — antes
          decía "persistente" en verde con la base adentro del contenedor,
          que es exactamente el caso que hay que denunciar. */}
      <div style={{ display: 'grid', gap: 12, marginBottom: 20 }}>
        {datos.baseEnMemoria && (
          <Aviso tono="red" titulo="RIESGO DE PÉRDIDA">
            La base está <strong>en memoria</strong>. Todo lo que se cargue se
            pierde al reiniciar: cuentas, historial, vueltas y turnos. Hay que
            montar un volumen y apuntarle <code>DB_FILE</code>.
          </Aviso>
        )}
        {!datos.baseEnMemoria && datos.baseEnDiscoAparte === false && (
          <Aviso tono="red" titulo="RIESGO DE PÉRDIDA">
            La base está en el <strong>mismo disco que la aplicación</strong>
            {' '}(<code>{datos.base}</code>). En un servidor que redespliega
            —Railway y cualquier contenedor— ese disco se rehace de cero en cada
            despliegue: se borran las cuentas, el historial, las vueltas y los
            turnos. Hay que montar un volumen y apuntarle <code>DB_FILE</code>.
            {' '}<em>Si esto corre en tu computadora, es normal y no pasa nada.</em>
          </Aviso>
        )}
        {datos.baseEnDiscoAparte === null && (
          <Aviso tono="amber" titulo="SIN CONFIRMAR">
            No se pudo averiguar si la base está en un disco aparte
            (<code>{datos.base}</code>). Conviene confirmarlo a mano antes de
            cargar datos de verdad.
          </Aviso>
        )}
        {respaldoViejo && (
          <Aviso tono="amber" titulo={resp ? 'RESPALDO VIEJO' : 'SIN RESPALDO'}>
            {resp ? (
              <>El último respaldo es de hace{' '}
              <strong>{duracion(datos.ahora - resp.cuando)}</strong> y el
              automático corre cada {datos.respaldoCadaHoras || '—'} h: algo lo
              está frenando. La pestaña RESPALDOS permite crear uno a pedido y
              <strong> descargarlo</strong> — el archivo en otra máquina es el
              que sobrevive a perder el servidor.</>
            ) : (
              <>Todavía no hay <strong>ningún respaldo</strong> de la base. La
              pestaña RESPALDOS permite crear uno ahora y
              <strong> descargarlo</strong> — el archivo en otra máquina es el
              que sobrevive a perder el servidor.</>
            )}
          </Aviso>
        )}
        {!datos.segundoFactor && (
          <Aviso tono="amber" titulo="UN SOLO FACTOR">
            Este panel entra <strong>solo con clave</strong>. Es el nivel que
            puede crear y suspender cooperativas: falta el segundo factor
            (<code>CREATOR_TOTP_SECRET</code>).
          </Aviso>
        )}
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 12 }}>
        {tarjetas.map(([etiqueta, valor]) => (
          <div key={etiqueta} style={{
            background: 'var(--surface)', border: '1px solid var(--divider)',
            borderRadius: 12, padding: '13px 14px',
          }}>
            <div className="black" style={{ fontSize: 20 }}>{valor}</div>
            <div className="mono" style={{
              fontSize: 9, fontWeight: 700, letterSpacing: 1.3, color: 'var(--dim3)',
              textTransform: 'uppercase', marginTop: 5,
            }}>{etiqueta}</div>
          </div>
        ))}
      </div>
      <div style={{ fontSize: 12, color: 'var(--dim2)', marginTop: 16, lineHeight: 1.55 }}>
        La base vive en <code>{datos.base}</code>
        {datos.baseEnDiscoAparte === true && ', en un disco aparte del de la aplicación: sobrevive a los redespliegues'}
        . El tamaño cuenta el archivo y su WAL juntos: el WAL puede crecer más
        que el archivo principal y es lo primero que llena un volumen chico.
      </div>
    </div>
  );
}

// ─── ACTIVIDAD ─────────────────────────────────────────────────
function Actividad({ eventos }) {
  if (!eventos) return <div style={{ color: 'var(--dim)' }}>Cargando…</div>;
  return (
    <div>
      <div style={{
        fontSize: 13, color: 'var(--dim2)', marginBottom: 16,
        lineHeight: 1.5, maxWidth: 640,
      }}>
        Todas las cooperativas juntas — es el único lugar del sistema donde se
        ven así. Las acciones del creador figuran como <code>CREADOR</code>.
      </div>
      <div style={{
        background: 'var(--surface)', border: '1px solid var(--divider)',
        borderRadius: 12, padding: '0 14px 6px', overflowX: 'auto',
      }}>
        <table>
          <thead>
            <tr><th>Cuándo</th><th>Empresa</th><th>Quién</th><th>Qué</th><th>Sobre</th><th>Detalle</th></tr>
          </thead>
          <tbody>
            {eventos.map((e, i) => (
              <tr key={i}>
                <td className="mono" style={{ color: 'var(--dim)', whiteSpace: 'nowrap' }}>{fecha(e.timestamp)}</td>
                <td className="mono" style={{ color: 'var(--dim)' }}>{e.companyId || '—'}</td>
                <td style={{ fontWeight: 700, color: e.actor === 'CREADOR' ? 'var(--bright)' : 'var(--fg2)' }}>{e.actor}</td>
                <td>{e.action}</td>
                <td className="mono" style={{ color: 'var(--dim)' }}>{e.target || ''}</td>
                <td style={{ color: 'var(--dim)' }}>{e.detail || ''}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── PANEL ─────────────────────────────────────────────────────
function Panel({ token, onSalir }) {
  const [pestana, setPestana] = React.useState('empresas');
  const [empresas, setEmpresas] = React.useState([]);
  const [sistema, setSistema] = React.useState(null);
  const [respaldos, setRespaldos] = React.useState(null);
  const [eventos, setEventos] = React.useState(null);
  const [aviso, setAviso] = React.useState(null);
  const [error, setError] = React.useState(null);

  const api = async (ruta, opciones = {}) => {
    const res = await fetch(BASE + ruta, {
      ...opciones,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opciones.headers || {}) },
    });
    const data = await res.json().catch(() => ({}));
    // La sesión dura 2 horas y no se renueva sola: cuando vence, afuera.
    if (res.status === 401) { onSalir(); throw new Error('Sesión vencida'); }
    if (!res.ok) throw new Error(data.error || 'Error del servidor');
    return data;
  };

  const cargarEmpresas = () => api('/empresas').then(d => setEmpresas(d.empresas)).catch(e => setError(e.message));
  const cargarSistema = () => api('/sistema').then(setSistema).catch(e => setError(e.message));
  const cargarRespaldos = () => api('/respaldos').then(setRespaldos).catch(e => setError(e.message));
  const cargarActividad = () => api('/actividad').then(d => setEventos(d.eventos)).catch(e => setError(e.message));

  React.useEffect(() => { cargarEmpresas(); }, []);
  React.useEffect(() => {
    setError(null);
    if (pestana === 'empresas' || pestana === 'rutas') cargarEmpresas();
    if (pestana === 'sistema') cargarSistema();
    if (pestana === 'respaldos') cargarRespaldos();
    if (pestana === 'actividad') cargarActividad();
  }, [pestana]);

  // El aviso se borra solo a los 4 segundos, pero hay que cancelar el
  // temporizador del anterior: si no, dos acciones seguidas hacen que el
  // reloj de la primera apague el cartel de la segunda a mitad de camino.
  const relojAviso = React.useRef(null);
  const avisar = (m) => {
    clearTimeout(relojAviso.current);
    setError(null); setAviso(m);
    relojAviso.current = setTimeout(() => setAviso(null), 4000);
  };
  const fallar = (m) => { clearTimeout(relojAviso.current); setAviso(null); setError(m); };

  const salir = () => {
    fetch(BASE + '/salir', { method: 'POST', headers: { Authorization: 'Bearer ' + token } })
      .catch(() => {})
      .finally(onSalir);
  };

  return (
    <div>
      <div style={{
        height: 58, background: 'var(--surface)',
        borderBottom: '1px solid var(--divider)',
      }}>
        <div style={{
          maxWidth: 1120, margin: '0 auto', height: '100%', padding: '0 18px',
          display: 'flex', alignItems: 'center', gap: 16,
        }}>
          <div className="black" style={{ fontSize: 16 }}>Creador</div>
          {/* Que lo diga la pantalla, no el manual: esta sesión no se guarda
              en ningún lado y cerrar la pestaña la cierra. */}
          <div className="mono" style={{
            fontSize: 9, fontWeight: 700, letterSpacing: 1.3, color: 'var(--dim3)',
            textTransform: 'uppercase', minWidth: 0,
            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
          }}>Herramienta interna · la sesión muere al cerrar la pestaña</div>
          <div style={{ flex: 1 }} />
          {[['empresas', 'COOPERATIVAS'], ['rutas', 'RUTAS'], ['respaldos', 'RESPALDOS'], ['sistema', 'SISTEMA'], ['actividad', 'ACTIVIDAD']].map(([k, etiqueta]) => (
            <button key={k} onClick={() => setPestana(k)} style={{
              background: 'transparent', padding: '0 0 4px', fontSize: 11, letterSpacing: 1,
              borderRadius: 0, flexShrink: 0,
              color: pestana === k ? 'var(--fg)' : 'var(--dim2)',
              borderBottom: pestana === k ? '2px solid var(--bright)' : '2px solid transparent',
            }} className="mono">{etiqueta}</button>
          ))}
          <button onClick={salir} style={{
            height: 32, padding: '0 12px', fontSize: 12, background: 'var(--surface)',
            color: 'var(--dim2)', border: '1px solid var(--line)', flexShrink: 0,
          }}>Salir</button>
        </div>
      </div>

      <div style={{ maxWidth: 1120, margin: '0 auto', padding: '22px 18px 60px' }}>
      {aviso && (
        <div style={{
          background: 'var(--verdeFondo)', border: '1px solid var(--verdeBorde)',
          borderRadius: 11, padding: '11px 13px', marginBottom: 14,
          fontSize: 13, fontWeight: 700, color: 'var(--verdeTinta)',
        }}>{aviso}</div>
      )}
      {error && (
        <div style={{
          background: 'var(--rojoFondo)', border: '1px solid var(--rojoBorde)',
          borderLeft: '3px solid var(--red)',
          borderRadius: 11, padding: '11px 13px', marginBottom: 14,
          fontSize: 13, fontWeight: 700, color: 'var(--rojoTinta)',
        }}>{error}</div>
      )}

      {pestana === 'empresas' && (
        <Empresas api={api} empresas={empresas} recargar={cargarEmpresas} aviso={avisar} fallo={fallar} />
      )}
      {pestana === 'rutas' && (
        <Rutas api={api} empresas={empresas} aviso={avisar} fallo={fallar} recargar={cargarEmpresas} />
      )}
      {pestana === 'sistema' && <Sistema datos={sistema} />}
      {pestana === 'respaldos' && (
        <Respaldos datos={respaldos} api={api} recargar={cargarRespaldos}
          aviso={avisar} fallo={fallar} token={token} />
      )}
      {pestana === 'actividad' && <Actividad eventos={eventos} />}
      </div>
    </div>
  );
}

function App() {
  // El token vive en memoria y nada más. Cerrar la pestaña cierra la sesión.
  const [token, setToken] = React.useState(null);
  return token
    ? <Panel token={token} onSalir={() => setToken(null)} />
    : <Puerta onEntrar={setToken} />;
}

// El muro de contención. Con React 18, un error no atrapado en un render o
// un efecto DESMONTA el árbol entero: página en blanco, sin una palabra.
// Pasó en producción y lo único que se pudo mandar de vuelta fue "quedó
// blanco". Esto lo convierte en un cartel que dice el error de verdad, que
// es exactamente lo que hace falta para arreglarlo a la distancia.
class Muro extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div style={{
        maxWidth: 640, margin: '80px auto', padding: 24,
        background: 'var(--rojoFondo)', border: '1px solid var(--rojoBorde)',
        borderLeft: '3px solid var(--red)', borderRadius: 14,
        color: 'var(--rojoTinta)', fontSize: 14, lineHeight: 1.6,
      }}>
        <div className="black" style={{ fontSize: 18, marginBottom: 8 }}>El panel se rompió</div>
        <div>
          Es un error del programa, no tuyo. Recargá la página; si vuelve a
          pasar, mandanos una captura de este cartel — el renglón de abajo
          dice exactamente qué se rompió.
        </div>
        <code style={{
          display: 'block', marginTop: 12, padding: '10px 12px',
          background: 'rgba(255,255,255,.6)', borderRadius: 8,
          whiteSpace: 'pre-wrap', wordBreak: 'break-word', fontSize: 12,
        }}>{String((this.state.error && (this.state.error.message || this.state.error)) || 'error desconocido')}</code>
        <button onClick={() => location.reload()} style={{
          marginTop: 14, padding: '10px 18px', fontSize: 14,
          background: 'var(--red)', color: '#fff', borderRadius: 9,
        }}>Recargar</button>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<Muro><App /></Muro>);
</script>
</body>
</html>

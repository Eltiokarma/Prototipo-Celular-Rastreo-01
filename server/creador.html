<!doctype html>
<html lang="es">

<!-- Sin manifest y sin service worker a propósito: este panel no se instala
     ni se guarda en caché. No tiene que quedar nada de él en el disco de la
     máquina desde la que se abrió. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; }
  /* Mismos tokens que el panel de Despacho: el creador es sobrio, no
     oscuro. Lo que lo hace herramienta interna es no tener marca, no tener
     gradientes y no ofrecer "recordarme", no el fondo negro. */
  :root {
    --bg: #F7FAFD; --surface: #FFFFFF; --line: #C3D4E4; --divider: #E1E9F2;
    --fg: #0B2239; --fg2: #2A4864; --dim: #41627F; --dim2: #496A86; --dim3: #5A7591;
    --hueco: #EDF2F8; --campo: #FFFFFF;
    --bright: #1668C4; --green: #1F8A4F; --amber: #A67300; --red: #C2001D;
    /* Superficies de estado */
    --verdeFondo: #E9F7EF; --verdeBorde: #BEE3CD; --verdeTinta: #0B6B33;
    --ambarFondo: #FDF6E4; --ambarBorde: #E4C88A; --ambarTinta: #4A3200;
    --rojoFondo: #FCEBEE;  --rojoBorde: #E6BFC6;  --rojoTinta: #5C0010;
    --velo: rgba(11,34,57,.42);
  }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .black { font-family: "Archivo Black", system-ui, sans-serif; }
  input, select, button, textarea { font-family: inherit; }
  input, select, textarea {
    width: 100%; height: 40px; padding: 0 12px; font-size: 14px;
    background: var(--campo); color: var(--fg);
    border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  textarea { height: auto; min-height: 72px; padding: 10px 12px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--bright); }
  label { display: block; font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: 9px; font-weight: 700; letter-spacing: 1.3px;
          text-transform: uppercase; color: var(--dim3); margin-bottom: 6px; }
  .campo { margin-bottom: 10px; }
  button { cursor: pointer; border: none; border-radius: 9px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-family: "JetBrains Mono", ui-monospace, monospace;
       font-size: 9px; color: var(--dim3); font-weight: 700;
       text-transform: uppercase; letter-spacing: 1.3px; padding: 10px 8px; }
  td { padding: 11px 8px; border-top: 1px solid var(--hueco); vertical-align: top; }
  code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .92em; }
</style>

<!-- Leaflet y la lógica del trazador (server/trazador.js) los sirve el
     PROPIO panel, no un CDN. Pasó de verdad: unpkg no entregó leaflet.js y
     elegir una ruta dejaba la página en blanco. La ruta del panel la fija
     el servidor (CREATOR_PATH), así que los src se arman con la URL de
     esta página. El trazador además es el mismo archivo que Node prueba
     con require() — acá llega como window.Trazador, sin copia. -->
<script>
(function () {
  var BASE = location.pathname.replace(/\/+$/, '');
  document.write('<link rel="stylesheet" href="' + BASE + '/leaflet.css" />');
  document.write('<script src="' + BASE + '/leaflet.js"><\/script>');
  document.write('<script src="' + BASE + '/trazador.js"><\/script>');
})();
</script>

<!-- La clave de las tiles del mapa (window.TILES_KEY). La genera el servidor
     desde su variable de entorno GEOAPIFY_API_KEY: en este archivo nunca hay
     una clave escrita. Ruta absoluta: este panel vive bajo CREATOR_PATH. -->
<script src="/config.js"></script>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>

<body>
<div id="root"></div>

<!-- Si React o Babel no llegan del CDN, nada de lo de abajo corre y la
     página queda en blanco sin decir palabra. Esto espera un rato y, si el
     panel sigue sin dibujarse, lo dice en HTML pelado. Si el panel carga
     después (red lenta), React pisa este cartel al renderizar: no estorba. -->
<script>
setTimeout(function () {
  var root = document.getElementById('root');
  if (root && !root.children.length) {
    root.innerHTML =
      '<div style="max-width:560px;margin:80px auto;padding:24px;' +
      'font-family:system-ui,sans-serif;font-size:14px;line-height:1.6;' +
      'background:#FCEBEE;border:1px solid #E6BFC6;border-left:3px solid #C2001D;' +
      'border-radius:14px;color:#5C0010;">' +
      '<strong>El panel no pudo cargar sus librerías.</strong><br>' +
      'React o Babel no llegaron desde el CDN (unpkg.com). Suele ser un corte ' +
      'de red de un momento: recargá con Ctrl+Shift+R. Si sigue pasando, ' +
      'fijate si tu red bloquea unpkg.com.</div>';
  }
}, 6000);
</script>

<script type="text/babel" data-presets="react">
// ═══════════════════════════════════════════════════════════════
// PANEL DEL CREADOR
//
// El nivel de arriba de todas las cooperativas. Deliberadamente sobrio: es
// una herramienta de operación, no un producto que se le muestra a nadie.
//
// La sesión vive SOLO EN MEMORIA de esta pestaña: no se guarda en
// localStorage como en los otros paneles. Cerrar la pestaña es cerrar la
// sesión, y una máquina prestada no queda con la puerta abierta.
// ═══════════════════════════════════════════════════════════════

// La ruta del panel la fija el servidor por variable de entorno, así que la
// página no puede tenerla escrita: la lee de su propia URL.
const BASE = location.pathname.replace(/\/+$/, '');

function fecha(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleString('es-PE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function diaConAnio(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function duracion(ms) {
  const min = Math.floor(ms / 60000);
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60);
  if (h < 48) return `${h} h ${min % 60} min`;
  return `${Math.floor(h / 24)} días`;
}

// ─── PUERTA ────────────────────────────────────────────────────
function Puerta({ onEntrar }) {
  const [clave, setClave] = React.useState('');
  const [codigo, setCodigo] = React.useState('');
  const [error, setError] = React.useState(null);
  const [yendo, setYendo] = React.useState(false);

  const entrar = async () => {
    setYendo(true); setError(null);
    try {
      const res = await fetch(BASE + '/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: clave, codigo }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'No se pudo entrar');
      onEntrar(data.token);
    } catch (e) {
      setError(e.message === 'Failed to fetch' ? 'No se pudo conectar' : e.message);
      setClave(''); setCodigo('');
      setYendo(false);
    }
  };

  return (
    <div style={{
      minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20,
    }}>
      <div style={{
        width: 340, background: 'var(--surface)', border: '1px solid var(--line)',
        borderRadius: 18, padding: 26,
      }} onKeyDown={e => { if (e.key === 'Enter' && !yendo) entrar(); }}>
        <div className="black" style={{ fontSize: 22 }}>Creador</div>
        <div className="mono" style={{
          fontSize: 9, fontWeight: 700, letterSpacing: 1.3, color: 'var(--dim3)',
          textTransform: 'uppercase', marginBottom: 22,
        }}>Herramienta interna · la sesión muere al cerrar la pestaña</div>

        <div className="campo">
          <label>Clave</label>
          <input type="password" value={clave} autoFocus onChange={e => setClave(e.target.value)} />
        </div>
        {/* El campo del segundo factor se muestra siempre: si el servidor no
            lo pide, se manda vacío y no molesta. Preguntarle al servidor si
            lo exige sería contarle a cualquiera cómo está configurado. */}
        <div className="campo">
          <label>Código (si está configurado el segundo factor)</label>
          <input value={codigo} inputMode="numeric" maxLength={6}
            onChange={e => setCodigo(e.target.value.replace(/\D/g, ''))} />
        </div>

        {error && (
          <div style={{
            background: 'var(--rojoFondo)', border: '1px solid var(--rojoBorde)',
            borderLeft: '3px solid var(--red)',
            borderRadius: 10, padding: '9px 11px', margin: '12px 0',
            fontSize: 13, fontWeight: 700, color: 'var(--rojoTinta)',
          }}>{error}</div>
        )}

        <button disabled={yendo} onClick={entrar} style={{
          width: '100%', padding: '13px', fontSize: 15, marginTop: 8,
          background: yendo ? 'var(--dim3)' : 'var(--bright)', color: '#fff',
        }}>{yendo ? 'Verificando…' : 'Entrar'}</button>
      </div>
    </div>
  );
}

// ─── COOPERATIVAS ──────────────────────────────────────────────
// El escudo de una cooperativa en el listado.
//
// El listado NO trae los logos —son hasta 200 kB cada uno y una lista que
// crece con la cantidad de cooperativas es lo que no aguanta cuando esto
// escale—, así que se pide el suyo solo si tiene, y solo una vez.
function Escudo({ empresa, api, tam = 30 }) {
  const [logo, setLogo] = React.useState(null);
  React.useEffect(() => {
    if (!empresa.tieneLogo) { setLogo(null); return; }
    let vivo = true;
    api(`/empresas/${empresa.companyId}/marca`)
      .then(r => { if (vivo && r?.marca?.logo) setLogo(r.marca.logo); })
      .catch(() => {});
    return () => { vivo = false; };
  }, [empresa.companyId, empresa.tieneLogo]);

  const caja = {
    width: tam, height: tam, borderRadius: 7, flexShrink: 0,
    display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden',
  };
  if (logo) {
    return <img src={logo} alt={empresa.name} title={empresa.name}
      style={{ ...caja, objectFit: 'contain', background: '#fff' }} />;
  }
  // Nunca un hueco: dos letras se leen como "todavía no tiene logo", que es
  // la verdad; un cuadro vacío se lee como que el panel está roto.
  return (
    <div style={{ ...caja, background: empresa.color || 'var(--brand)' }} title={empresa.name}>
      <span className="black" style={{ fontSize: Math.round(tam * 0.42), color: '#fff' }}>
        {empresa.iniciales || '·'}
      </span>
    </div>
  );
}

// Subir el logo desde acá arriba. Se achica en el navegador a 256 px: lo que
// una persona tiene a mano es el archivo del diseñador, de 2000 px y 3 MB, y
// esto termina viajando al celular de cada chofer.
const LADO_LOGO = 256;

function achicarLogo(archivo) {
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onerror = () => reject(new Error('No se pudo leer el archivo'));
    lector.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Ese archivo no es una imagen'));
      img.onload = () => {
        const escala = Math.min(1, LADO_LOGO / Math.max(img.width, img.height));
        const lienzo = document.createElement('canvas');
        lienzo.width = Math.max(1, Math.round(img.width * escala));
        lienzo.height = Math.max(1, Math.round(img.height * escala));
        // PNG y no JPEG: un logo suele tener fondo transparente y el JPEG lo
        // rellena de negro. Es la diferencia entre un escudo y un cuadrado.
        lienzo.getContext('2d').drawImage(img, 0, 0, lienzo.width, lienzo.height);
        resolve(lienzo.toDataURL('image/png'));
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}

// Corregir los datos de una cooperativa sin darla de baja y de alta: un RUC
// mal tipeado o un contacto que cambió no pueden costar más que esto. El
// código no se edita — cuelga de él todo lo demás — y la pantalla lo dice.
function DatosDeEmpresa({ empresa, api, correr, ocupado }) {
  const [form, setForm] = React.useState({
    name: empresa.name || '', ruc: empresa.ruc || '', contacto: empresa.contacto || '',
  });
  // Si el listado se recargó (guardar, u otra acción), el formulario se
  // realinea con lo que quedó guardado de verdad.
  React.useEffect(() => {
    setForm({ name: empresa.name || '', ruc: empresa.ruc || '', contacto: empresa.contacto || '' });
  }, [empresa.name, empresa.ruc, empresa.contacto]);

  const distinto = form.name !== (empresa.name || '') ||
    form.ruc !== (empresa.ruc || '') || form.contacto !== (empresa.contacto || '');

  return (
    <div>
      <div className="mono" style={{
        fontSize: 11, letterSpacing: 1, color: 'var(--dim2)',
        textTransform: 'uppercase', marginBottom: 8,
      }}>Datos</div>
      <div className="campo">
        <label>Nombre</label>
        <input value={form.name} onChange={ev => setForm({ ...form, name: ev.target.value })} />
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
        <div className="campo">
          <label>RUC</label>
          <input value={form.ruc} onChange={ev => setForm({ ...form, ruc: ev.target.value })} />
        </div>
        <div className="campo">
          <label>Contacto</label>
          <input value={form.contacto} onChange={ev => setForm({ ...form, contacto: ev.target.value })} />
        </div>
      </div>
      <button disabled={ocupado || !distinto || !form.name.trim()} onClick={() => correr(
        () => api(`/empresas/${empresa.companyId}/datos`, {
          method: 'PUT', body: JSON.stringify(form),
        }), 'Datos guardados',
      )} style={{
        padding: '8px 14px', fontSize: 13, background: 'var(--campo)',
        color: distinto ? 'var(--fg2)' : 'var(--dim3)', border: '1px solid var(--line)',
      }}>Guardar datos</button>
      <div style={{ fontSize: 11, color: 'var(--dim2)', marginTop: 6, lineHeight: 1.45 }}>
        El código <code>{empresa.companyId}</code> no se cambia: cuelga de él
        todo lo demás — cuentas, rutas, historial.
      </div>
    </div>
  );
}

function LogoDeEmpresa({ empresa, api, correr, ocupado }) {
  const entrada = React.useRef(null);
  const [version, setVersion] = React.useState(0);

  const mandar = (logo) => correr(async () => {
    await api(`/empresas/${empresa.companyId}/logo`, {
      method: 'PUT', body: JSON.stringify({ logo }),
    });
    setVersion(v => v + 1);
  }, logo ? 'Logo actualizado' : 'Logo quitado');

  return (
    <div>
      <div className="mono" style={{
        fontSize: 11, letterSpacing: 1, color: 'var(--dim2)',
        textTransform: 'uppercase', marginBottom: 8,
      }}>Logo</div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <Escudo key={version} empresa={empresa} api={api} tam={56} />
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <button disabled={ocupado} onClick={() => entrada.current?.click()} style={{
            padding: '8px 14px', fontSize: 13, background: 'var(--campo)',
            color: 'var(--fg2)', border: '1px solid var(--line)',
          }}>{empresa.tieneLogo ? 'Cambiar' : 'Subir'}</button>
          {empresa.tieneLogo && (
            <button disabled={ocupado} onClick={() => mandar(null)} style={{
              padding: '8px 14px', fontSize: 13, background: 'var(--campo)',
              color: 'var(--dim2)', border: '1px solid var(--line)',
            }}>Quitar</button>
          )}
        </div>
      </div>
      <div style={{ fontSize: 12, color: 'var(--dim3)', marginTop: 8, lineHeight: 1.5 }}>
        PNG, JPG o WEBP. Se achica solo a {LADO_LOGO} px.
        Dejalo puesto al dar de alta: así la cooperativa recibe el sistema con su marca.
      </div>
      <input ref={entrada} type="file" accept="image/png,image/jpeg,image/webp"
        style={{ display: 'none' }}
        onChange={async (ev) => {
          const f = ev.target.files?.[0];
          ev.target.value = '';
          if (!f) return;
          try { await mandar(await achicarLogo(f)); } catch (err) { /* lo informa correr */ }
        }} />
    </div>
  );
}

// El canal del nivel de arriba hacia la cooperativa: el aviso aparece como
// banner en su panel de Despacho hasta que alguien lo marque visto. Acá se
// manda y se ve si lo vieron, cuándo y quién — que es la mitad que importa
// cuando el aviso es una deuda.
function AvisosDeEmpresa({ empresa, api, correr, ocupado }) {
  const [texto, setTexto] = React.useState('');
  const [routeId, setRouteId] = React.useState('');
  const [lista, setLista] = React.useState(null);

  const cargar = React.useCallback(() => {
    api(`/empresas/${empresa.companyId}/avisos`)
      .then(d => setLista(d.avisos || []))
      .catch(() => setLista([]));
  }, [empresa.companyId]);
  React.useEffect(cargar, [cargar]);

  return (
    <div>
      <div className="mono" style={{
        fontSize: 11, letterSpacing: 1, color: 'var(--dim2)',
        textTransform: 'uppercase', marginBottom: 8,
      }}>Aviso a la cooperativa</div>
      <div className="campo">
        <label>Mensaje</label>
        <textarea value={texto} maxLength={500}
          placeholder="Ej.: Tienen pendiente el pago de agosto. Coordinar con administración."
          onChange={ev => setTexto(ev.target.value)} />
      </div>
      {empresa.rutas.length > 1 && (
        <div className="campo">
          <label>Alcance</label>
          <select value={routeId} onChange={ev => setRouteId(ev.target.value)}>
            <option value="">Toda la cooperativa</option>
            {empresa.rutas.map(r => (
              <option key={r.routeId} value={r.routeId}>Solo la ruta {r.routeId}</option>
            ))}
          </select>
        </div>
      )}
      <button disabled={ocupado || !texto.trim()} onClick={() => correr(async () => {
        await api(`/empresas/${empresa.companyId}/avisos`, {
          method: 'POST', body: JSON.stringify({ texto, ...(routeId ? { routeId } : {}) }),
        });
        setTexto('');
        cargar();
      }, 'Aviso enviado')} style={{
        padding: '8px 14px', fontSize: 13, background: 'var(--campo)',
        color: texto.trim() ? 'var(--fg2)' : 'var(--dim3)', border: '1px solid var(--line)',
      }}>Enviar aviso</button>
      <div style={{ fontSize: 11, color: 'var(--dim2)', marginTop: 6, lineHeight: 1.45 }}>
        Aparece como banner en su panel de Despacho hasta que alguien lo
        marque visto. No les toca el chat de las rutas.
      </div>
      {lista && lista.length > 0 && (
        <div style={{ marginTop: 8 }}>
          {lista.slice(0, 5).map(a => (
            <div key={a.id} style={{ fontSize: 11, lineHeight: 1.5, color: 'var(--dim2)', marginBottom: 4 }}>
              <span className="mono" style={{
                fontWeight: 700,
                color: a.vistoEn ? 'var(--verdeTinta)' : 'var(--amber)',
              }}>{a.vistoEn ? `VISTO ${fecha(a.vistoEn)} · ${a.vistoPor}` : 'PENDIENTE'}</span>
              {a.routeId ? <span className="mono"> · {a.routeId}</span> : null}
              {' · '}{a.texto.length > 90 ? a.texto.slice(0, 90) + '…' : a.texto}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function Empresas({ api, empresas, recargar, aviso, fallo }) {
  const [abierta, setAbierta] = React.useState(null);
  const [nueva, setNueva] = React.useState(null);
  const [form, setForm] = React.useState({
    companyId: '', name: '', ruc: '', contacto: '',
    ruta: '', nombreRuta: '', despacho: '', clave: '',
  });
  const [sub, setSub] = React.useState({ usuario: '', clave: '' });
  const [ger, setGer] = React.useState({ usuario: '', clave: '', routeId: '' });
  const [rutaNueva, setRutaNueva] = React.useState({ routeId: '', name: '' });
  const [confirmar, setConfirmar] = React.useState(null);
  const [ocupado, setOcupado] = React.useState(false);

  const correr = async (fn, mensaje) => {
    setOcupado(true);
    try { await fn(); aviso(mensaje); await recargar(); }
    catch (e) { fallo(e.message); }
    setOcupado(false);
  };

  const suspendidas = empresas.filter(e => !e.activa).length;

  const crear = () => correr(async () => {
    await api('/empresas', { method: 'POST', body: JSON.stringify(form) });
    setForm({ companyId: '', name: '', ruc: '', contacto: '', ruta: '', nombreRuta: '', despacho: '', clave: '' });
    setNueva(null);
  }, 'Cooperativa creada');

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 14 }}>
        <div className="mono" style={{
          fontSize: 9, fontWeight: 700, letterSpacing: 1.3, color: 'var(--dim3)',
          textTransform: 'uppercase',
        }}>
          {empresas.length} cooperativa{empresas.length === 1 ? '' : 's'}
          {suspendidas ? ` · ${suspendidas} suspendida${suspendidas === 1 ? '' : 's'}` : ''}
        </div>
        <div style={{ flex: 1 }} />
        {/* Tinta y no el azul de producto: la acción principal del creador
            no compite con la de Despacho, que es otra pantalla y otro rol. */}
        <button onClick={() => setNueva(nueva ? null : true)} style={{
          height: 38, padding: '0 14px', fontSize: 13,
          background: nueva ? 'var(--surface)' : 'var(--fg)',
          border: nueva ? '1px solid var(--line)' : 'none',
          color: nueva ? 'var(--dim2)' : '#fff',

      </div>

      {nueva && (
        <div style={{
          background: 'var(--surface)', border: '1px solid var(--line)',

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
            <div className="campo">
              <label>Código *</label>
              <input value={form.companyId} placeholder="COOP-15"
                onChange={e => setForm({ ...form, companyId: e.target.value })} />
            </div>
            <div className="campo">
              <label>Nombre *</label>
              <input value={form.name} placeholder="Cooperativa Santa Rosa"
                onChange={e => setForm({ ...form, name: e.target.value })} />
            </div>
            <div className="campo">
              <label>RUC</label>
              <input value={form.ruc} onChange={e => setForm({ ...form, ruc: e.target.value })} />
            </div>
            <div className="campo">
              <label>Contacto</label>
              <input value={form.contacto} onChange={e => setForm({ ...form, contacto: e.target.value })} />
            </div>
            <div className="campo">
              <label>Primera ruta</label>
              <input value={form.ruta} placeholder="R-15"
                onChange={e => setForm({ ...form, ruta: e.target.value })} />
            </div>
            <div className="campo">
              <label>Nombre de la ruta</label>
              <input value={form.nombreRuta} placeholder="Plaza ↔ Salida Cusco"
                onChange={e => setForm({ ...form, nombreRuta: e.target.value })} />

            <div className="campo">
              <label>Usuario de Despacho</label>
              <input value={form.despacho} placeholder="DESPACHO-15"

            <div className="campo">

          <div style={{ fontSize: 12, color: 'var(--dim2)', lineHeight: 1.5, margin: '4px 0 12px' }}>

            y sin cuenta de Despacho no hay quien la administre. La clave se

          <button disabled={ocupado} onClick={crear} style={{
            padding: '10px 18px', fontSize: 14, background: 'var(--bright)', color: '#fff',

      {empresas.map(e => (
        // data-empresa deja claro en el DOM de qué cooperativa es cada
        // tarjeta: con varias una debajo de otra y botones que suspenden,
        // saber cuál es cuál sin leer el texto vale la pena.
        <div key={e.companyId} data-empresa={e.companyId} style={{
          background: e.activa ? 'var(--surface)' : 'var(--bg)',

        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
            <Escudo empresa={e} api={api} />

            <div className="mono" style={{
              fontSize: 10, fontWeight: 700, letterSpacing: 1, padding: '3px 7px', borderRadius: 5,

            <div style={{ flex: 1 }} />
            <button onClick={() => setAbierta(abierta === e.companyId ? null : e.companyId)} style={{

              <button disabled={ocupado} onClick={() => setConfirmar(e.companyId)} style={{

                    {e.despacho.length > 0 && (
                      <> Hoy: {e.despacho.map(d =>

                </div>

                <div>
                  <div className="mono" style={{
                    fontSize: 11, letterSpacing: 1, color: 'var(--dim2)',
                    textTransform: 'uppercase', marginBottom: 8,

                  <div className="campo">
                    <label>Código</label>

                  <div className="campo">
                    <label>Nombre</label>
                    <input value={rutaNueva.name} placeholder="Circunvalación"

                  <button disabled={ocupado} onClick={() => correr(async () => {
                    await api(`/empresas/${e.companyId}/rutas`, {

                    color: 'var(--fg2)', border: '1px solid var(--line)',

                  <div style={{ fontSize: 11, color: 'var(--dim2)', marginTop: 6, lineHeight: 1.45 }}>

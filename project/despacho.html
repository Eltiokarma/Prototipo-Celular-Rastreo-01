// El escudo de la cooperativa: su logo, o sus iniciales sobre su color.
//
// NUNCA un hueco. Un cuadro vacío donde va la marca se lee como que el panel
// está roto; dos letras se leen como "todavía no subieron el logo", que es la
// verdad, y funciona desde el primer día sin que nadie haga nada.
function Marca({ marca, tam = 30 }) {
  const caja = {
    width: tam, height: tam, borderRadius: 7, flexShrink: 0,
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    overflow: 'hidden',
  };
  if (marca?.logo) {
    return <img src={marca.logo} alt={marca.nombre || ''} title={marca.nombre || ''}
      style={{ ...caja, objectFit: 'contain', background: '#fff' }} />;
  }
  return (
    <div style={{ ...caja, background: marca?.color || HUD.brand }} title={marca?.nombre || ''}>
      <span style={{ fontFamily: black, fontSize: Math.round(tam * 0.42), color: '#fff', letterSpacing: 0.5 }}>
        {marca?.iniciales || '·'}
      </span>
    </div>
  );
}

// Subir el logo. Se achica ACÁ, en el navegador, antes de mandarlo.
//
// Nadie tiene a mano un PNG de 256 px: lo que sube una persona es el archivo
// que le pasó el diseñador, de 2000 px y 3 MB. Rechazarlo y pedirle que lo
// achique es empujarle un problema que la máquina resuelve en un segundo —y
// que además hay que resolver igual, porque este logo va a viajar al celular
// de cada chofer.
const LADO_LOGO = 256;

function achicarLogo(archivo) {
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onerror = () => reject(new Error('No se pudo leer el archivo'));
    lector.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Ese archivo no es una imagen'));
      img.onload = () => {
        const escala = Math.min(1, LADO_LOGO / Math.max(img.width, img.height));
        const lienzo = document.createElement('canvas');
        lienzo.width = Math.max(1, Math.round(img.width * escala));
        lienzo.height = Math.max(1, Math.round(img.height * escala));
        // PNG y no JPEG: un logo suele tener fondo transparente, y el JPEG lo
        // rellena de negro. Es la diferencia entre un escudo y un cuadrado.
        lienzo.getContext('2d').drawImage(img, 0, 0, lienzo.width, lienzo.height);
        resolve(lienzo.toDataURL('image/png'));
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}

function SubirLogo({ marca, token, onListo, onOk, onError }) {
  const entrada = React.useRef(null);
  const [ocupado, setOcupado] = React.useState(false);

  const mandar = async (logo) => {
    setOcupado(true); onError?.(null); onOk?.(null);
    try {
      const r = await fetch(`${HTTP_URL}/admin/company/logo`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ logo }),
      });
      const cuerpo = await r.json().catch(() => ({}));
      if (!r.ok) { onError?.(cuerpo.error || 'No se pudo guardar el logo'); return; }
      onOk?.(logo ? 'Logo actualizado' : 'Logo quitado');
      onListo?.();
    } catch {
      onError?.('No se pudo guardar el logo');
    } finally {
      setOcupado(false);
      if (entrada.current) entrada.current.value = '';
    }
  };

  return (
    <div>
      <div style={{ ...rotulo(9), marginBottom: 6 }}>Logo de la cooperativa</div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
        <Marca marca={marca} tam={64} />
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <button disabled={ocupado} style={btnSecundario(40)}
            onClick={() => entrada.current?.click()}>
            {ocupado ? 'Subiendo…' : marca?.logo ? 'Cambiar' : 'Subir logo'}
          </button>
          {marca?.logo && (
            <button disabled={ocupado} style={btnSecundario(40)} onClick={() => mandar(null)}>
              Quitar
            </button>
          )}
        </div>
      </div>
      <div style={{ fontSize: 12, color: HUD.dim2, marginTop: 8, lineHeight: 1.5 }}>
        PNG, JPG o WEBP. Se achica solo a {LADO_LOGO} px — no hace falta que lo prepares.
        Sin logo se muestran las iniciales, que es lo que ven hoy tus choferes.
      </div>
      <input ref={entrada} type="file" accept="image/png,image/jpeg,image/webp"
        style={{ display: 'none' }}
        onChange={async (e) => {
          const f = e.target.files?.[0];
          if (!f) return;
          try { await mandar(await achicarLogo(f)); }
          catch (err) { onError?.(err.message); setOcupado(false); }
        }} />
    </div>
  );
}

// La marca se pide aparte del login: así Despacho la cambia y las pantallas
// la ven sin que nadie tenga que volver a entrar, y cada login no arrastra
// ~100 kB de imagen.
function useMarca(token) {
  const [marca, setMarca] = React.useState(null);
  const traer = React.useCallback(() => {
    if (!token) return;
    fetch(`${HTTP_URL}/marca`, { headers: { Authorization: 'Bearer ' + token } })
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d?.marca) setMarca(d.marca); })
      .catch(() => {});
  }, [token]);
  React.useEffect(() => { traer(); }, [traer]);
  return [marca, traer];
}

function Panel({ session, onLogout, onAuthError, modo, onAlternarModo }) {
  const [marca, refrescarMarca] = useMarca(session.token);
  const [connected, setConnected] = React.useState(false);
  const [units, setUnits] = React.useState([]);
  const [gaps, setGaps] = React.useState({});
  const [messages, setMessages] = React.useState([]);
  const [sos, setSos] = React.useState(null); // alerta activa hasta que se atienda
  const [adminOpen, setAdminOpen] = React.useState(false);
  // Multi-ruta: la ruta que se está mirando y los datos que llegan de ella
  const [routes, setRoutes] = React.useState([]);
  const [trazado, setTrazado] = React.useState({ ida: [], vuelta: [] });
  // Conversación privada abierta (vehicleId) o null = el grupo de la ruta
  const [privadoCon, setPrivadoCon] = React.useState(null);
  // Privados sin leer por unidad, para el punto en la lista
  const [noLeidos, setNoLeidos] = React.useState({});
  const [routeInfo, setRouteInfo] = React.useState({
    routeId: session.routeId || null,
    routeName: session.routeName || null,
    targetGapMin: TARGET_GAP_DEFAULT,
  });
  const esSupervisor = !!session.supervisor;

  // El mismo panel sirve en PC y en celular: bajo 900px pasa a vista
  // única (Unidades / Mapa / Chat) con navegación inferior.
  const [isMobile, setIsMobile] = React.useState(window.innerWidth < 900);
  const [view, setView] = React.useState('map');
  React.useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < 900);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  // Cambiar de tema cambia los tiles sin recargar la página
  React.useEffect(() => {
    if (tilesRef.current) tilesRef.current.setUrl(HUD.tiles);
  }, [modo]);

  // El recorrido de la ruta, debajo de las unidades. La vuelta va punteada
  // para distinguirla de la ida cuando comparten calle.
  React.useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    if (trazadoRef.current) { trazadoRef.current.remove(); trazadoRef.current = null; }
    const capa = L.layerGroup();
    let hay = false;
    if (trazado?.ida?.length > 1) {
      L.polyline(trazado.ida, { color: HUD.bright, weight: 5, opacity: 0.55 }).addTo(capa);
      hay = true;
    }
    if (trazado?.vuelta?.length > 1) {
      L.polyline(trazado.vuelta, {
        color: HUD.bright, weight: 5, opacity: 0.55, dashArray: '8 8',
      }).addTo(capa);
      hay = true;
    }
    if (hay) { capa.addTo(map); trazadoRef.current = capa; }
  }, [trazado, modo]);

  // Leaflet necesita re-medirse cuando su contenedor aparece o cambia
  React.useEffect(() => {
    if (mapRef.current && (!isMobile || view === 'map')) {
      setTimeout(() => mapRef.current.invalidateSize(), 60);
    }
  }, [isMobile, view]);
  const wsRef = React.useRef(null);
  const mapRef = React.useRef(null);
  const tilesRef = React.useRef(null);
  const trazadoRef = React.useRef(null);   // la polilínea del recorrido en el mapa
  const markersRef = React.useRef({});
  const fittedRef = React.useRef(false);

  const pushMsg = (m) => setMessages(ms => [...ms.slice(-149), m]);

  const mapMsg = (m, kind) => {
    const own = m.unitId === session.unitId;
    if (kind === 'sos') {
      return {
        // El ancla para cuando llegue el tipo (`sos_tipo`): la emergencia
        // del hilo se actualiza en el lugar, no se duplica.
        sosId: m.sosId ?? null,
        from: m.driverName || m.unitId, unit: m.vehicleId || null, tone: 'sos',
        text: `SOS — ${m.driverName || m.unitId} pide ayuda${m.vehicleId ? ' desde ' + m.vehicleId : ''}` +
          (TIPOS_SOS[m.sosTipo] ? ` · ${TIPOS_SOS[m.sosTipo].toUpperCase()}` : ''),
        time: nowTime(m.timestamp),
      };
    }
    const base = {
      from: m.role === 'dispatch' ? 'DESPACHO' : m.role === 'manager' ? 'GERENCIA' : (m.driverName || m.unitId || 'Conductor'),
      role: own ? 'dispatch-self' : m.role,
      unit: m.role === 'dispatch' ? null : (m.vehicleId || null),
      // Con qué unidad es la conversación privada; null = mensaje del grupo
      para: m.toVehicleId || null,
      time: nowTime(m.timestamp),
      tone: 'normal',
    };
    if (kind === 'voice') return { ...base, voice: m.duration, audio: m.data || null, expired: m.expired };
    // La foto puede llegar sin imagen: el servidor solo conserva las últimas
    // 20. El pie de foto se queda, para que se sepa que existió.
    if (kind === 'photo') return { ...base, photo: true, image: m.data || null, text: m.text || 'Foto' };
    return { ...base, text: m.text };
  };

  // ─── WebSocket propio del panel (sin GPS: Despacho no está en ruta)
  React.useEffect(() => {
    let closedByUs = false;
    let reconnect = null;
    let ws = null;

    const open = () => {
      ws = new WebSocket(SERVER_URL);
      wsRef.current = ws;
      ws.onopen = () => {
        setConnected(true);
        ws.send(JSON.stringify({ type: 'identify', token: session.token }));
      };
      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === 'state') {
          setUnits(msg.units || []);
          setGaps(msg.gaps || {});
          setRouteInfo({
            routeId: msg.routeId,
            routeName: msg.routeName,
            targetGapMin: msg.targetGapMin || TARGET_GAP_DEFAULT,
            desvio: msg.desvio || null,
          });
          fittedRef.current = false; // reencuadrar el mapa al cambiar de ruta
          setRouteInfo(prev => {
            // Cambió la ruta: la conversación privada abierta era de la otra
            if (prev.routeId && prev.routeId !== msg.routeId) {
              setPrivadoCon(null);
              setNoLeidos({});
            }
            return prev;
          });
        } else if (msg.type === 'routes') {
          setRoutes(msg.routes || []);
        } else if (msg.type === 'route_geometry') {
          // El trazado llega una vez (al conectar, al cambiar de ruta o
          // cuando alguien lo edita), no en cada estado
          setTrazado(msg.tramos || { ida: [], vuelta: [] });
        } else if (msg.type === 'chat_msg') {
          pushMsg(mapMsg(msg, 'chat'));
          // Privado de una unidad que no estoy mirando: queda marcado
          if (msg.toVehicleId && msg.role !== 'dispatch') {
            setPrivadoCon(actual => {
              if (actual !== msg.toVehicleId) {
                setNoLeidos(n => ({ ...n, [msg.toVehicleId]: (n[msg.toVehicleId] || 0) + 1 }));
              }
              return actual;
            });
          }
        } else if (msg.type === 'voice_msg') {
          pushMsg(mapMsg(msg, 'voice'));
        } else if (msg.type === 'photo_msg') {
          pushMsg(mapMsg(msg, 'photo'));
        } else if (msg.type === 'sos_alert') {
          pushMsg(mapMsg(msg, 'sos'));
          setSos({ ...msg, receivedAt: Date.now() });
        } else if (msg.type === 'sos_tipo') {
          // El chofer le puso nombre a la emergencia ya disparada: "falla
          // mecánica" pide una grúa, "accidente" una ambulancia, "policía"
          // otra llamada. Se actualizan el cartel y la línea del hilo — la
          // emergencia sigue siendo UNA, ahora con más información.
          if (TIPOS_SOS[msg.tipo]) {
            setSos(actual => (actual && actual.sosId === msg.sosId)
              ? { ...actual, sosTipo: msg.tipo } : actual);
            // El sufijo viejo se quita con un patrón DERIVADO de TIPOS_SOS:
            // una copia a mano de las etiquetas era una segunda lista que se
            // separaba sola al agregar un tipo — y las correcciones del
            // chofer acumulaban etiquetas en vez de reemplazarlas.
            const sufijos = new RegExp(' · (' +
              Object.values(TIPOS_SOS).map(t => t.toUpperCase()).join('|') + ')$');
            setMessages(ms => ms.map(x => (x.sosId != null && x.sosId === msg.sosId)
              ? { ...x, text: x.text.replace(sufijos, '') +
                              ` · ${TIPOS_SOS[msg.tipo].toUpperCase()}` }
              : x));
          }
        } else if (msg.type === 'chat_history') {
          setMessages((msg.items || []).map(it => mapMsg(
            { ...it, expired: (it.kind === 'voice' || it.kind === 'photo') && !it.data },
            it.kind
          )));
        } else if (msg.type === 'auth_error') {
          closedByUs = true;
          try { localStorage.removeItem('r14_dispatch_session'); } catch {}
          onAuthError();
        }
      };
      ws.onclose = () => {
        setConnected(false);
        if (!closedByUs) reconnect = setTimeout(open, 3000);
      };
    };
    open();

    return () => {
      closedByUs = true;
      clearTimeout(reconnect);
      if (ws) ws.close();
    };
  }, [session.token]);

  // ─── Leaflet
  const initMap = React.useCallback((node) => {
    if (!node || mapRef.current) return;
    const map = L.map(node, { center: JULIACA_CENTER, zoom: 14, zoomControl: true, attributionControl: true });
    map.attributionControl.setPrefix(false);
    tilesRef.current = L.tileLayer(HUD.tiles, { maxZoom: 19, attribution: TILES_ATRIB }).addTo(map);
    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 100);
  }, []);

  // Marcadores: un pin con etiqueta por unidad en ruta
  React.useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    const existing = markersRef.current;
    const ids = new Set(units.filter(u => u.lat).map(u => u.unitId));

    Object.keys(existing).forEach(id => {
      if (!ids.has(id)) { existing[id].remove(); delete existing[id]; }
    });

    units.forEach(u => {
      if (!u.lat || !u.lng) return;
      const isSos = sos && sos.unitId === u.unitId;
      // El pin lleva el mismo color que la fila: mirando el mapa se ve dónde
      // está el pelotón sin cruzar con la lista.
      const g = gaps[u.unitId] || {};
      const cA = gapColor(g.toAhead, routeInfo.targetGapMin);
      const cB = gapColor(g.toBehind, routeInfo.targetGapMin);
      const color = isSos ? HUD.red
        : [HUD.red, HUD.amber, HUD.green, HUD.dim3].find(c => c === cA || c === cB) || HUD.dim3;
      // El desvío también se ve en el mapa, no solo en la lista: es donde
      // Despacho está mirando cuando pasa. Anillo ámbar alrededor del punto.
      const fuera = !!u.fueraDeRuta;
      const halo = fuera
        ? `box-shadow:0 0 0 3px ${HUD.bg},0 0 0 6px ${HUD.amber};`
        : '';
      // La que perdió señal se dibuja apagada y hueca: el punto está donde
      // estuvo, no donde está. Un pin lleno del color de su brecha diría que
      // esa posición es de ahora, y es de hace minutos.
      const callada = !!u.sinSenal;
      // Las que no están EN la cadena se apagan igual que las calladas: la
      // ausente está comiendo y la que va yendo todavía no pisó el trazado.
      // Ninguna de las dos es una combi contra la que alguien se mida.
      const fueraDeCadena = u.presencia === 'ausente' || (u.presencia === 'ruta' && u.enRuta === false);
      const colorPin = (callada || fueraDeCadena) ? HUD.dim3 : color;
      const relleno = (callada || fueraDeCadena) ? HUD.bg : '#fff';
      const sufijo = u.presencia === 'ausente' ? ' · AUSENTE'
        : (u.presencia === 'ruta' && u.enRuta === false) ? ' · YENDO' : '';
      // width:max-content porque el icono de Leaflet mide 0×0: sin eso la
      // etiqueta se parte en dos líneas dentro de un contenedor sin ancho.
      const html = `<div style="width:max-content;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:${fuera ? 6 : 3}px;${(callada || fueraDeCadena) ? 'opacity:.65;' : ''}">
        <div style="font-family:${black};font-size:11px;color:#fff;background:${colorPin};padding:2px 6px;border-radius:5px;white-space:nowrap;">${escaparHtml(u.unitId)}${fuera ? ' ◇' : ''}${callada ? ' ⌁' : ''}${sufijo}</div>
        <div style="width:10px;height:10px;border-radius:50%;background:${relleno};border:3px solid ${colorPin};box-sizing:content-box;${halo}"></div>
      </div>`;
      const icon = L.divIcon({ html, className: '', iconSize: [0, 0], iconAnchor: [0, 0] });
      if (existing[u.unitId]) {
        existing[u.unitId].setLatLng([u.lat, u.lng]);
        existing[u.unitId].setIcon(icon);
      } else {
        existing[u.unitId] = L.marker([u.lat, u.lng], { icon }).addTo(map);
      }
    });

    // Encuadrar la flota la primera vez que hay unidades
    const withGps = units.filter(u => u.lat);
    if (!fittedRef.current && withGps.length) {
      fittedRef.current = true;
      const bounds = L.latLngBounds(withGps.map(u => [u.lat, u.lng]));
      map.fitBounds(bounds.pad(0.4), { maxZoom: 15 });
    }
  }, [units, sos, gaps, routeInfo.targetGapMin, modo]);

  const focusUnit = (u) => {
    if (u.lat && mapRef.current) mapRef.current.panTo([u.lat, u.lng], { animate: true });
  };

  const sendChat = (text) => {
    const ws = wsRef.current;
    if (ws && ws.readyState === WebSocket.OPEN) {
      // Con una conversación abierta el mensaje va solo a esa unidad
      ws.send(JSON.stringify({
        type: 'chat', text, to: privadoCon || undefined, timestamp: Date.now(),
      }));
    }
  };

  const silenciarDesvio = async (minutos) => {
    if (!routeInfo.routeId) return;
    try {
      await fetch(`${HTTP_URL}/admin/routes/${encodeURIComponent(routeInfo.routeId)}/desvio`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.token },
        body: JSON.stringify({ silenciarMin: minutos }),
      });
    } catch {}
  };

  const abrirPrivado = (vehicleId) => {
    setPrivadoCon(vehicleId);
    setNoLeidos(n => ({ ...n, [vehicleId]: 0 }));
    if (isMobile) setView('chat');
  };

  // Cambiar de ruta: el servidor responde con el estado y el chat de la nueva
  const cambiarRuta = (routeId) => {
    const ws = wsRef.current;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    setUnits([]); setGaps({}); setMessages([]);
    ws.send(JSON.stringify({ type: 'watch', routeId }));
  };

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
      {/* header */}
      <div style={{
        height: 60, flexShrink: 0, display: 'flex', alignItems: 'center',
        gap: isMobile ? 6 : 14,
        padding: isMobile ? '0 8px' : '0 18px',
        borderBottom: `1px solid ${HUD.divider}`, background: HUD.surface,
        overflow: 'hidden',
      }}>
        {/* La marca de la cooperativa, no una marca fija: el mismo panel lo
            usan empresas distintas y cada una tiene que ver la suya. En el
            celular queda SOLO el escudo: ocupa 30 px y sigue diciendo de
            quién es esta pantalla, que es lo que importa. */}
        <Marca marca={marca} />
        {!isMobile && (
          <span style={{
            fontFamily: black, fontSize: 17, maxWidth: 210,
            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
          }} title={marca?.nombre || session.companyName || ''}>
            {marca?.nombre || session.companyName || session.companyId || 'Despacho'}
          </span>
        )}
        {/* En un celular el chip sobra: la pantalla ES el panel de Despacho,
            y el ancho hace falta para lo que sí cambia. */}
        {!isMobile && (
          <>
            <span style={{
              ...rotulo(10, HUD.bright), letterSpacing: 1.5,
              background: HUD.azulFondo, border: `1px solid ${HUD.azulBorde}`,
              borderRadius: 6, padding: '4px 8px', flexShrink: 0,
            }}>Despacho</span>
            <span style={{ width: 1, height: 26, background: HUD.divider, flexShrink: 0 }} />
          </>
        )}

        {/* Selector de ruta: el supervisor cambia; el de ruta la ve fija.
            El <select> nativo va encima, transparente: conserva el desplegable
            del sistema (en celular es el único usable) y deja que debajo se
            dibuje el código y el nombre con tipografías distintas. */}
        {esSupervisor && routes.length > 0 ? (
          <span style={{
            position: 'relative', display: 'flex', alignItems: 'center', gap: 8,
            height: 36, padding: '0 12px', background: HUD.surface,
            border: `1px solid ${HUD.line}`, borderRadius: 9,
            maxWidth: isMobile ? 'none' : 320, minWidth: 0, flexShrink: 0,
          }}>
            <span style={{ fontFamily: black, fontSize: 14, flexShrink: 0 }}>{routeInfo.routeId || '—'}</span>
            {!isMobile && (
              <span style={{
                fontSize: 13, color: HUD.dim, minWidth: 0,
                overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
              }}>{routeInfo.routeName || ''}</span>
            )}
            <span style={{ fontSize: 11, color: HUD.dim3, flexShrink: 0 }}>▾</span>
            <select
              value={routeInfo.routeId || ''}
              onChange={e => cambiarRuta(e.target.value)}
              title="Ruta que estás mirando"
              style={{
                position: 'absolute', inset: 0, width: '100%', height: '100%',
                opacity: 0, cursor: 'pointer', fontFamily: 'inherit',
              }}>
              {routes.map(r => (
                <option key={r.routeId} value={r.routeId}>{r.routeId} · {r.name}</option>
              ))}
            </select>
          </span>
        ) : (
          <span style={{
            display: 'flex', alignItems: 'center', gap: 8, height: 36, padding: '0 12px',
            background: HUD.surface, border: `1px solid ${HUD.line}`, borderRadius: 9,
            maxWidth: isMobile ? 'none' : 320, minWidth: 0, flexShrink: 0,
          }}>
            <span style={{ fontFamily: black, fontSize: 14, flexShrink: 0 }}>{routeInfo.routeId || '—'}</span>
            {!isMobile && (
              <span style={{
                fontSize: 13, color: HUD.dim, minWidth: 0,
                overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
              }}>{routeInfo.routeName || ''}</span>
            )}
          </span>
        )}

        <span style={{
          display: 'flex', alignItems: 'center', gap: 7, height: 36, padding: '0 11px',
          borderRadius: 9, flexShrink: 0, minWidth: 0,
          background: connected ? HUD.verdeFondo : HUD.ambarFondo,
          border: `1px solid ${connected ? HUD.verdeBorde : HUD.ambarBorde}`,
        }}>
          <span style={{
            width: 8, height: 8, borderRadius: '50%', flexShrink: 0,
            background: connected ? HUD.green : HUD.amber,
          }} />
          <span style={{
            fontFamily: mono, fontSize: 11, fontWeight: 700,
            color: connected ? HUD.verdeTinta : HUD.ambarTinta2,
            whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
          }}>
            {connected ? (isMobile ? `${units.length} EN RUTA` : `EN VIVO · ${units.length} EN RUTA`) : 'RECONECTANDO…'}
          </span>
        </span>

        <div style={{ flex: 1 }} />

        {/* El objetivo de brecha es el número contra el que se lee toda la
            pantalla. Antes solo estaba adentro de Gestión. */}
        {!isMobile && (
          <div style={{ textAlign: 'right', lineHeight: 1.1, flexShrink: 0 }}>
            <div style={rotulo(9)}>Objetivo de brecha</div>
            <div style={{ fontFamily: black, fontSize: 16, marginTop: 2 }}>
              {fmtMin(routeInfo.targetGapMin)}
              <span style={{ fontFamily: mono, fontSize: 10, fontWeight: 700, color: HUD.dim2, marginLeft: 4 }}>MIN</span>
            </div>
          </div>
        )}
        <button onClick={() => setAdminOpen(true)} style={{ ...btnPrimario(36), flexShrink: 0 }}>Gestión</button>
        <button onClick={onAlternarModo}
          title={modo === 'day' ? 'Pasar a modo noche' : 'Pasar a modo día'}
          style={{
            ...btnSecundario(36), width: 36, padding: 0, color: HUD.dim,
            fontSize: 15, lineHeight: 1, flexShrink: 0,
          }}>{modo === 'day' ? '☾' : '☀'}</button>
        <button onClick={onLogout} style={{ ...btnSecundario(36), flexShrink: 0 }}>Salir</button>
      </div>

      {adminOpen && (
        <AdminModal
          session={session}
          onClose={() => setAdminOpen(false)}
          onAuthError={onAuthError}
          routes={routes}
          currentRoute={routeInfo.routeId}
        />
      )}

      {/* banner SOS activo */}
      {sos && (
        <div style={{
          flexShrink: 0, background: HUD.red, color: '#fff',
          padding: '13px 18px', display: 'flex', alignItems: 'center', gap: 16,
          flexWrap: isMobile ? 'wrap' : 'nowrap',
          animation: 'sosPulse 1.2s ease-in-out infinite',
        }}>
          <span style={{ fontFamily: black, fontSize: 20, letterSpacing: 3 }}>SOS</span>
          <span style={{ fontSize: 15, fontWeight: 700 }}>
            {(sos.driverName || sos.unitId || 'Unidad').toUpperCase()}
            {sos.vehicleId ? ` · ${sos.vehicleId.toUpperCase()}` : ''} pide ayuda
            {TIPOS_SOS[sos.sosTipo] ? ` — ${TIPOS_SOS[sos.sosTipo].toUpperCase()}` : ''} · {nowTime(sos.timestamp)}
            {sos.routeId && sos.routeId !== routeInfo.routeId ? ` · RUTA ${sos.routeId}` : ''}
            {sos.lat ? ` · ${sos.lat.toFixed(4)}, ${sos.lng.toFixed(4)}` : ''}
          </span>
          <div style={{ flex: 1 }} />
          {sos.lat && (
            <button onClick={() => { if (isMobile) setView('map'); mapRef.current?.panTo([sos.lat, sos.lng]); }} style={{
              height: 34, padding: '0 12px', background: 'rgba(255,255,255,.16)',
              border: '1px solid rgba(255,255,255,.55)', borderRadius: 8,
              color: '#fff', fontSize: 13, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit',
            }}>Ver en mapa</button>
          )}
          <button onClick={() => setSos(null)} style={{
            height: 34, padding: '0 12px', background: '#fff', border: 'none', borderRadius: 8,
            color: HUD.red, fontSize: 13, fontWeight: 800, cursor: 'pointer', fontFamily: 'inherit',
          }}>ATENDIDO</button>
        </div>
      )}

      {/* cuerpo: en PC tres columnas; en celular una vista a la vez */}
      <div style={isMobile
        ? { flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }
        : { flex: 1, display: 'grid', gridTemplateColumns: '312px 1fr 372px', minHeight: 0 }}>
        {/* unidades */}
        <div style={{
          overflowY: 'auto', minHeight: 0, background: HUD.surface,
          ...(isMobile
            ? { flex: 1, display: view === 'units' ? 'block' : 'none' }
            : { borderRight: `1px solid ${HUD.divider}` }),
        }}>
          <div style={{ padding: '14px 16px 10px', display: 'flex', alignItems: 'baseline', gap: 8 }}>
            <span style={{ ...rotulo(10, HUD.dim2), letterSpacing: 1.6 }}>Unidades en ruta</span>
            <div style={{ flex: 1 }} />
            <span style={{ fontFamily: black, fontSize: 14 }}>{units.length}</span>
          </div>

          {/* Desvíos: se agrupan acá en vez de gritar uno por uno. En una
              ciudad siempre hay alguno, así que lo importante es poder
              silenciarlo cuando ya se sabe (obra, desfile, embotellamiento). */}
          {(() => {
            const fuera = units.filter(u => u.fueraDeRuta);
            const mudo = routeInfo.desvio?.mudoHasta;
            if (!fuera.length && !mudo) return null;
            return (
              <div style={{
                margin: '0 12px 10px', padding: '11px 12px', borderRadius: 11,
                background: mudo ? HUD.hueco : HUD.ambarFondo,
                border: `1px solid ${mudo ? HUD.line : HUD.ambarBorde}`,
                borderLeft: `3px solid ${mudo ? HUD.line : HUD.amber}`,
              }}>
                <div style={{
                  fontFamily: black, fontSize: 13, color: mudo ? HUD.dim2 : HUD.ambarTinta,
                  marginBottom: fuera.length ? 6 : 9,
                }}>
                  {mudo
                    ? `Desvíos silenciados hasta ${nowTime(mudo)}`
                    : `${fuera.length} unidad${fuera.length === 1 ? '' : 'es'} fuera del recorrido`}
                </div>
                {fuera.length > 0 && (
                  <div style={{
                    fontFamily: mono, fontSize: 11, fontWeight: 700,
                    color: mudo ? HUD.dim2 : HUD.ambarTinta2, marginBottom: 9,
                  }}>
                    {fuera.map(u => `${u.unitId} (${u.desvioM} m)`).join(' · ')}
                  </div>
                )}
                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                  {mudo ? (
                    <button onClick={() => silenciarDesvio(0)}
                      style={{ ...btnChico(HUD.fg2, HUD.line), fontSize: 11 }}>Volver a avisar</button>
                  ) : (
                    [['Silenciar 1 h', 60], ['3 h', 180], ['el turno', 480]].map(([etiqueta, min]) => (
                      <button key={min} onClick={() => silenciarDesvio(min)}
                        title="Cuando el desvío ya se sabe: una obra, un desfile, un embotellamiento"
                        style={{ ...btnChico(HUD.ambarTinta, HUD.ambarBorde), fontSize: 11 }}>{etiqueta}</button>
                    ))
                  )}
                </div>
              </div>
            );
          })()}
          {units.length === 0 && (
            <div style={{ padding: '8px 16px', fontSize: 14, color: HUD.dim3 }}>
              Sin unidades conectadas.
            </div>
          )}
          {units.map(u => {
            const g = gaps[u.unitId] || {};
            const isSos = sos && sos.unitId === u.unitId;
            const cAdelante = gapColor(g.toAhead, routeInfo.targetGapMin);
            const cAtras = gapColor(g.toBehind, routeInfo.targetGapMin);
            // El borde y el fondo de la fila los manda el peor de los dos
            // lados: si de un lado va pegada, la fila tiene que gritar aunque
            // del otro esté bien.
            const orden = [HUD.red, HUD.amber, HUD.green, HUD.dim3];
            const peor = isSos ? HUD.red
              : orden.find(c => c === cAdelante || c === cAtras) || HUD.dim3;
            return (
              <div key={u.unitId} onClick={() => focusUnit(u)} style={{
                padding: '12px 16px 13px', cursor: 'pointer',
                borderBottom: `1px solid ${HUD.divider}`,
                background: peor === HUD.red ? HUD.filaCritica : HUD.surface,
                borderLeft: `3px solid ${peor}`,
              }}>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
                  <span style={{ fontFamily: black, fontSize: 16, color: isSos ? HUD.red : HUD.fg }}>{u.unitId}</span>
                  <span style={{ fontFamily: mono, fontSize: 11, fontWeight: 700, color: HUD.dim2 }}>
                    {u.speed || 0} KM/H
                  </span>
                  <div style={{ flex: 1 }} />
                  {u.tramo && (
                    <span title="Tramo del circuito en el que va" style={{
                      fontFamily: mono, fontSize: 10, fontWeight: 700,
                      color: u.tramo === 'vuelta' ? HUD.dim2 : HUD.bright,
                    }}>{u.tramo === 'vuelta' ? '↩ VUELTA' : '↪ IDA'}</span>
                  )}
                </div>
                {u.driverName && u.driverName !== u.unitId && (
                  <div style={{
                    fontSize: 12, color: HUD.dim2, marginTop: 2,
                    overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                  }}>{u.driverName}{u.label ? ` · ${u.label}` : ''}</div>
                )}
                {/* Las dos brechas son lo que más se mira de la fila: van en
                    celda propia y en el tamaño de un dato, no como dos
                    números pegados al pie. */}
                <div style={{
                  display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginTop: 9,
                }}>
                  {[['+1 ADELANTE', g.toAhead, cAdelante], ['−1 ATRÁS', g.toBehind, cAtras]].map(([et, val, color]) => {
                    const palabra = gapWord(val, routeInfo.targetGapMin);
                    return (
                      <div key={et} style={{ padding: '6px 8px', borderRadius: 8, background: HUD.celda }}>
                        <div style={{ ...rotulo(9), letterSpacing: 1 }}>{et}</div>
                        <div style={{ fontFamily: black, fontSize: 17, lineHeight: 1.2, color }}>{val || '—'}</div>
                        {/* El juicio en palabras, porque el color solo no lo
                            dice para un daltónico rojo-verde. Ver
                            LIMITACIONES.md, sección Accesibilidad. */}
                        {palabra && (
                          <div style={{
                            fontFamily: mono, fontSize: 9, fontWeight: 700,
                            letterSpacing: .8, color, marginTop: 1,
                          }}>{palabra}</div>
                        )}
                      </div>
                    );
                  })}
                </div>
                {/* No se puede esconder ni resumir: es el aviso por el que
                    Despacho levanta el teléfono. */}
                {u.fueraDeRuta && (
                  <div title={`A ${u.desvioM} m del recorrido${u.fueraDesde ? ' desde ' + nowTime(u.fueraDesde) : ''}`}
                    style={{
                      fontFamily: mono, fontSize: 10, fontWeight: 700, letterSpacing: .6,
                      color: HUD.amber, marginTop: 8,
                    }}>FUERA DE RUTA · {u.desvioM} M</div>
                )}
                {/* Dejó de reportar. La posición que se ve en el mapa es la
                    última conocida, así que se dice desde cuándo: sin eso,
                    Despacho manda a alguien a un lugar donde la combi estuvo
                    hace tres minutos. Las brechas de arriba ya salen en "—"
                    porque el servidor no las calcula contra una unidad así. */}
                {u.sinSenal && (
                  <div title={`Última posición recibida a las ${nowTime(u.sinSenalDesde || u.timestamp)}`}
                    style={{
                      fontFamily: mono, fontSize: 10, fontWeight: 700, letterSpacing: .6,
                      color: HUD.amber, marginTop: 8,
                    }}>SIN SEÑAL DESDE {nowTime(u.sinSenalDesde || u.timestamp)}</div>
                )}
                {/* La presencia declarada desde la app. AUSENTE: comiendo o
                    en un repuesto — fuera de la cadena, a la vista. YENDO:
                    marcó "en ruta" pero el GPS todavía no lo vio sobre el
                    trazado (la brecha sale en "—" a propósito). */}
                {u.presencia === 'ausente' && (
                  <div style={{
                    fontFamily: mono, fontSize: 10, fontWeight: 700, letterSpacing: .6,
                    color: HUD.dim2, marginTop: 8,
                  }}>AUSENTE — FUERA DE LA CADENA</div>
                )}
                {u.presencia === 'ruta' && u.enRuta === false && (
                  <div style={{
                    fontFamily: mono, fontSize: 10, fontWeight: 700, letterSpacing: .6,
                    color: HUD.amber, marginTop: 8,
                  }}>YENDO A LA RUTA — ENTRA AL PISAR EL TRAZADO</div>
                )}
                {!u.lat && (
                  <div style={{ fontFamily: mono, fontSize: 10, fontWeight: 700, color: HUD.amber, marginTop: 8 }}>SIN GPS</div>
                )}
                {/* Conversación privada con esta unidad. El click no debe
                    disparar también el foco del mapa de la fila. */}
                <button
                  onClick={(e) => { e.stopPropagation(); abrirPrivado(u.unitId); }}
                  title={`Escribirle solo a ${u.unitId}`}
                  style={{
                    ...btnChico(privadoCon === u.unitId ? '#fff' : HUD.fg2, HUD.line),
                    marginTop: 9, background: privadoCon === u.unitId ? HUD.bright : HUD.surface,
                    borderRadius: 8, display: 'inline-flex', alignItems: 'center', gap: 6,
                  }}>
                  Mensaje directo
                  {noLeidos[u.unitId] > 0 && (
                    <span style={{
                      background: HUD.amber, color: HUD.oscuro ? '#000' : '#fff',
                      borderRadius: 9, minWidth: 18, padding: '0 5px',
                      fontFamily: mono, fontSize: 11, fontWeight: 800, textAlign: 'center',
                    }}>{noLeidos[u.unitId]}</span>
                  )}
                </button>
              </div>
            );
          })}
        </div>

        {/* mapa */}
        <div style={{
          position: 'relative', minHeight: 0,
          ...(isMobile ? { flex: 1, display: view === 'map' ? 'block' : 'none' } : {}),
        }}>
          <div ref={initMap} style={{ position: 'absolute', inset: 0 }} />
          {/* Los tres colores de la fila y del pin no se explican solos.
              Con el objetivo en el header, esto termina de contar contra qué
              se está leyendo cada número. */}
          <div style={{
            position: 'absolute', left: 14, bottom: 14, zIndex: 500,
            padding: '11px 13px', borderRadius: 11,
            background: HUD.flotante, border: `1px solid ${HUD.line}`,
          }}>
            <div style={{ ...rotulo(9), marginBottom: 7 }}>Brecha contra el objetivo</div>
            {[[HUD.green, 'Hasta 15 % de desvío'], [HUD.amber, 'Hasta 30 %'], [HUD.red, 'Crítica · pelotón']].map(([c, t]) => (
              <div key={t} style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 5 }}>
                <span style={{ width: 10, height: 10, borderRadius: 3, background: c, flexShrink: 0 }} />
                <span style={{ fontSize: 13, color: HUD.fg2 }}>{t}</span>
              </div>
            ))}
          </div>
        </div>

        {/* chat */}
        <div style={{
          minHeight: 0,
          ...(isMobile
            ? { flex: 1, display: view === 'chat' ? 'flex' : 'none', flexDirection: 'column' }
            : { borderLeft: `1px solid ${HUD.divider}` }),
        }}>
          <ChatColumn messages={messages} onSend={sendChat} routeId={routeInfo.routeId}
            privadoCon={privadoCon} onCerrarPrivado={() => setPrivadoCon(null)} />
        </div>
      </div>

      {/* navegación inferior — solo celular */}
      {isMobile && (
        <div style={{
          flexShrink: 0, display: 'flex',
          borderTop: `1px solid ${HUD.divider}`, background: HUD.surface,
        }}>
          {[['units', `UNIDADES (${units.length})`], ['map', 'MAPA'], ['chat', 'CHAT']].map(([k, l]) => (
            <button key={k} onClick={() => setView(k)} style={{
              flex: 1, padding: '14px 0 18px',
              background: 'transparent', border: 'none', cursor: 'pointer',
              fontFamily: black, fontSize: 13, letterSpacing: 0.5,
              color: view === k ? HUD.bright : HUD.dim3,
              borderTop: view === k ? `3px solid ${HUD.bright}` : '3px solid transparent',
              WebkitTapHighlightColor: 'transparent',
            }}>{l}</button>
          ))}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// ROOT
// ═══════════════════════════════════════════════════════════════
function Root() {
  // El tema elegido se recuerda en el dispositivo. De fábrica, DÍA.
  const [modo, setModo] = React.useState(() => {
    try {
      const g = localStorage.getItem('r14_modo_panel');
      if (g && TEMAS[g]) return g;
    } catch {}
    return 'day';
  });
  // Antes de renderizar: HUD es un objeto que se muta, así que tiene que
  // estar en su valor final cuando los hijos lo leen.
  aplicarTema(modo);
  React.useEffect(() => {
    try { localStorage.setItem('r14_modo_panel', modo); } catch {}
    const r = document.documentElement.style;
    r.setProperty('--bg', HUD.bg);
    r.setProperty('--fg', HUD.fg);
  }, [modo]);
  const alternarModo = () => setModo(m => (m === 'day' ? 'night' : 'day'));

  const [session, setSession] = React.useState(() => {
    try {
      const s = JSON.parse(localStorage.getItem('r14_dispatch_session') || 'null');
      return s?.token && s?.role === 'dispatch' ? s : null;
    } catch { return null; }
  });
  const [notice, setNotice] = React.useState(null);

  const logout = () => {
    try { localStorage.removeItem('r14_dispatch_session'); } catch {}
    setSession(null);
    setNotice(null);
  };

  if (!session) {
    return <Login notice={notice} onSuccess={(s) => { setSession(s); setNotice(null); }} />;
  }
  return <Panel
    session={session}
    onLogout={logout}
    modo={modo}
    onAlternarModo={alternarModo}
    onAuthError={() => { setSession(null); setNotice('Tu sesión expiró. Ingresá de nuevo.'); }}
  />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);

</script>

<!-- PWA: el panel registra su propio service worker. Antes solo lo hacía la
     app del chofer, así que un encargado que instalara únicamente el panel en
     su celular se quedaba sin caché offline. -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(() => console.log('Service Worker registrado'))
        .catch((err) => console.log('Service Worker falló:', err));
    });
  }
</script>
</body>

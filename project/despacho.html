// Confirmación que nombra sobre qué. Se usa en los dos únicos lugares donde
// una acción de Despacho le cambia el día a gente que está manejando.
//
// El botón de aceptar se arma recién a los 700 ms de abrir: un doble clic
// sobre el botón que la abrió no puede pasar de largo y aceptar (auditoría
// 11/11). Ni Escape ni el clic afuera aceptan nunca; cancelan.
function Confirmacion({ kicker, tono, titulo, cuerpo, aceptar, onAceptar, onCancelar }) {
  const [armado, setArmado] = React.useState(false);
  React.useEffect(() => {
    const t = setTimeout(() => setArmado(true), 700);
    const esc = (e) => { if (e.key === 'Escape') onCancelar && onCancelar(); };
    window.addEventListener('keydown', esc);
    return () => { clearTimeout(t); window.removeEventListener('keydown', esc); };
  }, []);
  const fondo = tono === 'red' ? HUD.rojoFondo : HUD.ambarFondo;
  const borde = tono === 'red' ? HUD.rojoBorde : HUD.ambarBorde;
  const tinta = tono === 'red' ? HUD.rojoTinta : HUD.ambarTinta;
  const fuerte = tono === 'red' ? HUD.red : HUD.amber;
  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 4000, background: HUD.velo,
      display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16,
      animation: 'velo .18s ease-out',
    }} onClick={onCancelar}>
      <div role="dialog" aria-modal="true" onClick={e => e.stopPropagation()} style={{
        width: 520, maxWidth: '100%', background: HUD.surface,
        border: `1px solid ${HUD.line}`, borderRadius: 18, padding: 24,
        boxShadow: HUD.sombraAlta, animation: 'aparecer .2s ease-out',
      }}>
        <div style={{ ...rotulo(10, tono === 'red' ? HUD.rojoTinta : HUD.ambarTinta), fontWeight: 800,
          marginBottom: 10, display: 'flex', alignItems: 'center', gap: 6 }}>
          <Icono n="alerta" tam={16} grosor={2} style={{ color: fuerte }} />{kicker}
        </div>
        <div style={{ fontFamily: black, fontSize: 21, lineHeight: 1.25 }}>{titulo}</div>
        <div style={{
          background: fondo, border: `1px solid ${borde}`,
          borderRadius: 12, padding: 14, margin: '16px 0 20px',
          fontSize: 14, lineHeight: 1.6, color: tinta,
        }}>{cuerpo}</div>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <button data-confirmar-aceptar onClick={() => { if (armado) onAceptar(); }} disabled={!armado} style={{
            ...btnPrimario(42), background: fuerte, borderRadius: 10,
            opacity: armado ? 1 : 0.55, cursor: armado ? 'pointer' : 'default',
          }}>{aceptar}</button>
          <button onClick={onCancelar} style={{ ...btnSecundario(42), borderRadius: 10 }}>
            No cambiar nada
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── ALTA DE MUCHAS PERSONAS DESDE UNA PLANILLA (PENDIENTES 0.7) ──────
// La planilla que la cooperativa ya tiene: Excel (.xlsx), LibreOffice o
// Google Sheets (.ods), CSV, o las celdas copiadas y pegadas. Dos pasos:
// REVISAR (no guarda nada: dice fila por fila qué se crearía y qué no) y
// CREAR (guarda las buenas y devuelve las claves, una sola vez).
function CargaMasiva({ api, onListo }) {
  const [archivo, setArchivo] = React.useState(null);     // { nombre, base64 }
  const [texto, setTexto] = React.useState('');
  const [revision, setRevision] = React.useState(null);
  const [hecho, setHecho] = React.useState(null);
  const [error, setError] = React.useState(null);
  const [ocupado, setOcupado] = React.useState(false);
  const elegir = (e) => {
    const f = e.target.files && e.target.files[0];
    setRevision(null); setHecho(null); setError(null);
    if (!f) { setArchivo(null); return; }
    const lector = new FileReader();
    lector.onload = () => setArchivo({ nombre: f.name, base64: String(lector.result) });
    lector.onerror = () => setError('No se pudo leer el archivo');
    lector.readAsDataURL(f);
  };
  const cuerpo = (confirmar) => JSON.stringify(texto.trim()
    ? { texto, confirmar } : { archivo: archivo && archivo.base64, nombre: archivo && archivo.nombre, confirmar });
  const pedir = async (confirmar) => {
    setOcupado(true); setError(null);
    try {
      const r = await api('/admin/users/importar', { method: 'POST', body: cuerpo(confirmar) });
      if (confirmar) { setHecho(r); setRevision(null); onListo && onListo(); } else setRevision(r);
    } catch (e) { setError(e.message); }
    setOcupado(false);
  };
  // Las claves, para repartir: un CSV que abre bien en Excel (con BOM)
  const bajarClaves = () => {
    const filas = [['Usuario', 'Nombre', 'Rol', 'Combi', 'Clave']]
      .concat(hecho.filas.filter(f => f.ok).map(f => [f.usuario, f.nombre, f.rol === 'collector' ? 'cobrador' : 'chofer', f.combi || '', f.clave]));
    // Un nombre de la planilla que empieza con = + - @ sería una FÓRMULA al
    // abrir este archivo en Excel, al lado de la clave: se le antepone un
    // apóstrofo, igual que en server/csv.js (revisión integral del 04/11)
    const celda = (c) => { let t = String(c ?? ''); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return `"${t.replace(/"/g, '""')}"`; };
    const csv = '\uFEFF' + filas.map(f => f.map(celda).join(';')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'claves-personas-nuevas.csv'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const hayAlgo = !!archivo || !!texto.trim();
  const lista = (r) => (
    <div style={{ display: 'grid', gap: 4, marginTop: 10 }}>
      {r.filas.map(f => (
        <div key={f.fila} data-fila-planilla={f.fila} style={{
          display: 'grid', gridTemplateColumns: '54px 150px 1fr 90px 70px 1.3fr', gap: 8, alignItems: 'baseline',
          fontSize: 12, padding: '6px 8px', borderRadius: 8,
          background: f.ok ? HUD.surface : HUD.ambarFondo, border: `1px solid ${f.ok ? HUD.divider : HUD.ambarBorde}`,
        }}>
          <span style={{ fontFamily: mono, color: HUD.dim2 }}>fila {f.fila}</span>
          <span style={{ fontFamily: mono, fontWeight: 700, overflow: 'hidden', textOverflow: 'ellipsis' }}>
            {f.usuario || '—'}{f.usuarioGenerado && f.usuario ? <span style={{ color: HUD.dim3, fontWeight: 400 }}> (armado)</span> : null}
          </span>
          <span style={{ overflow: 'hidden', textOverflow: 'ellipsis' }}>{f.nombre || '—'}</span>
          <span>{f.rol === 'collector' ? 'cobrador' : f.rol === 'driver' ? 'chofer' : '¿?'}</span>
          <span style={{ fontFamily: mono }}>{f.combi || '—'}</span>
          <span style={{ color: f.ok ? HUD.verdeTinta : HUD.ambarTinta, fontWeight: 700 }}>
            {f.ok ? (r.confirmado ? `creado · clave ${f.clave}` : `se crea${f.claveGenerada ? ' (clave generada)' : ''}`) : f.motivo}
          </span>
        </div>
      ))}
    </div>
  );
  return (
    <div data-carga-masiva style={{
      background: HUD.bg, border: `1px solid ${HUD.divider}`, borderRadius: 12, padding: 14, marginBottom: 16,
    }}>
      <div style={{ ...rotulo(9), marginBottom: 8 }}>Cargar muchas personas desde una planilla</div>
      <div style={{ fontSize: 13, color: HUD.fg2, lineHeight: 1.55, marginBottom: 10 }}>
        Excel (.xlsx), LibreOffice o Google Sheets (.ods), CSV, o copiá las celdas y pegalas abajo.
        La primera fila tiene que decir qué es cada columna: <b>Nombre</b> y <b>Combi</b> (obligatorias, la
        combi tiene que existir), y si querés <b>Usuario</b>, <b>Rol</b> (chofer o cobrador), <b>Clave</b>, <b>Alias</b>, <b>Ruta</b>.
        Sin usuario se arma uno con el nombre; sin clave, se genera una.
        {' '}<a href="planilla-alta-ejemplo.xlsx" download style={{ color: HUD.bright, fontWeight: 700 }}>Bajar una planilla de ejemplo</a>
      </div>
      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center', marginBottom: 8 }}>
        <input type="file" data-planilla-archivo accept=".xlsx,.ods,.csv,.tsv,.txt,.xls"
          onChange={elegir} style={{ fontSize: 13 }} />
      </div>
      <textarea data-planilla-texto value={texto} rows={3}
        placeholder="…o pegá acá las celdas copiadas de Excel o Google Sheets (con la fila de títulos)"
        onChange={e => { setTexto(e.target.value); setRevision(null); setHecho(null); }}
        style={{ ...campo(80), width: '100%', boxSizing: 'border-box', fontFamily: mono, fontSize: 12, padding: 8, resize: 'vertical' }} />
      {error && <div role="alert" style={{ marginTop: 8, fontSize: 13, color: HUD.ambarTinta, background: HUD.ambarFondo, border: `1px solid ${HUD.ambarBorde}`, borderRadius: 8, padding: '8px 10px' }}>{error}</div>}
      {!hecho && (
        <div style={{ display: 'flex', gap: 8, marginTop: 10, flexWrap: 'wrap', alignItems: 'center' }}>
          <button data-planilla-revisar disabled={!hayAlgo || ocupado} onClick={() => pedir(false)} style={btnSecundario(36)}>
            {ocupado && !revision ? 'Revisando…' : 'Revisar'}
          </button>
          {revision && (
            <button data-planilla-crear disabled={!revision.buenas || ocupado} onClick={() => pedir(true)} style={btnPrimario(36)}>
              Crear {revision.buenas} persona{revision.buenas === 1 ? '' : 's'}
            </button>
          )}
          {revision && (
            <span style={{ fontSize: 12, color: HUD.dim2 }}>
              {revision.buenas} se crean{revision.conError ? `, ${revision.conError} con algo que corregir (se saltan)` : ''}.
              {' '}Columnas: {Object.entries(revision.columnas).map(([k, t]) => `${t} → ${k}`).join(', ')}
              {revision.ignoradas.length ? `. No se usan: ${revision.ignoradas.join(', ')}` : ''}
            </span>
          )}
        </div>
      )}
      {revision && lista(revision)}
      {hecho && (
        <div style={{ marginTop: 10 }}>
          <div role="status" style={{
            fontSize: 13, color: HUD.verdeTinta, background: HUD.verdeFondo, border: `1px solid ${HUD.verdeBorde}`,
            borderRadius: 8, padding: '8px 10px', lineHeight: 1.5,
          }}>
            Se crearon {hecho.buenas} persona{hecho.buenas === 1 ? '' : 's'}{hecho.conError ? ` (${hecho.conError} se saltaron)` : ''}.
            {' '}<b>Las claves se ven ahora y no se vuelven a mostrar:</b> bajalas para repartirlas.
          </div>
          <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
            <button data-planilla-claves onClick={bajarClaves} style={btnPrimario(36)}>Bajar las claves (CSV)</button>
            <button onClick={() => { setHecho(null); setArchivo(null); setTexto(''); }} style={btnSecundario(36)}>Cargar otra</button>
          </div>
          {lista(hecho)}
        </div>
      )}
    </div>
  );
}

function AdminModal({ session, onClose, onAuthError, routes, currentRoute, marca, refrescarMarca, onEscribir }) {
  const [tab, setTab] = React.useState('users'); // users | vehicles | routes | metrics | audit
  const [users, setUsers] = React.useState(null);
  const [events, setEvents] = React.useState(null);
  const [consentVigente, setConsentVigente] = React.useState(null);
  // La Actividad por tipo (PENDIENTES 0.9): '' = todo
  const [claseAudit, setClaseAudit] = React.useState('');
  const [auditMas, setAuditMas] = React.useState(false);
  const [plazosAudit, setPlazosAudit] = React.useState(null);
  const [metrics, setMetrics] = React.useState(null);
  const [routeList, setRouteList] = React.useState(routes || []);
  const [vehicles, setVehicles] = React.useState(null);
  const [shifts, setShifts] = React.useState(null);
  const [masivaAbierta, setMasivaAbierta] = React.useState(false);
  // Corregir horas a mano (PENDIENTES 0.6): qué turno se está corrigiendo
  // (su id, o 'nuevo' para agregar uno que faltó), el formulario, su
  // historial y el paso de confirmar una anulación
  const [corrigiendo, setCorrigiendo] = React.useState(null);
  const [corrForm, setCorrForm] = React.useState({ inicio: '', fin: '', motivo: '', personId: '', vehicleId: '' });
  const [historialTurno, setHistorialTurno] = React.useState(null);
  const [confirmarAnular, setConfirmarAnular] = React.useState(false);
  const [rangoTurnos, setRangoTurnos] = React.useState('hoy'); // hoy | ayer | semana
  const [vueltas, setVueltas] = React.useState(null);
  // Alta de persona: cerrada de entrada. Ocho formularios abiertos a la vez
  // era lo que hacía que la pantalla se leyera como un tablero de controles.
  const [altaAbierta, setAltaAbierta] = React.useState(false);
  const [filtroRol, setFiltroRol] = React.useState('');
  // Rango de los informes, en fechas y no en botones de "últimos N días":
  // la cooperativa pide "del 1 al 15", no "los últimos 14 días".
  const [rangoInf, setRangoInf] = React.useState(() => {
    // Fecha LOCAL: `toISOString` es UTC, y después de las 19:00 en Juliaca
    // el «hasta» por defecto era mañana (barrido del 22/9).
    const iso = (t) => { const d = new Date(t);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
    return { desde: iso(Date.now() - 29 * 86400e3), hasta: iso(Date.now()) };
  });
  // Cambio del trazado con el que se mide: { ruta, v, actual }
  const [confirmVar, setConfirmVar] = React.useState(null);
  // Mover una combi a otra ruta de la cooperativa: { v, destino }
  const [confirmMover, setConfirmMover] = React.useState(null);
  // Bajo 900 px el riel no cabe al lado del contenido. No vuelve a ser una
  // fila de ocho pestañas: se convierte en un desplegable.
  const [angosto, setAngosto] = React.useState(window.innerWidth < 900);
  React.useEffect(() => {
    const onResize = () => setAngosto(window.innerWidth < 900);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  const [empresa, setEmpresa] = React.useState(null);
  const [empForm, setEmpForm] = React.useState({ name: '', ruc: '', contacto: '' });
  // Los números de gerencia (pestaña Números, solo del gerente)
  const [resumenGer, setResumenGer] = React.useState(null);
  // Dónde se traba la ruta (E9): las paradas, los cortes de señal y las
  // anomalías, que el servidor servía en `/admin/paradas`, `/admin/huecos` y
  // `/admin/anomalias` sin que ninguna pantalla los pidiera.
  const [trabas, setTrabas] = React.useState(null);
  const [diasTrabas, setDiasTrabas] = React.useState(7);
  const [diasGer, setDiasGer] = React.useState(7);
  // La ruta que mira el gerente de cooperativa en Números ('' = todas). El
  // gerente de ruta no elige: el servidor lo ata a la suya (`alcance.fijo`).
  const [rutaGer, setRutaGer] = React.useState('');
  const [nuevoVeh, setNuevoVeh] = React.useState({ vehicleId: '', label: '' });
  // Ruta cuyo recorrido se está trazando (null = trazador cerrado)
  const [trazando, setTrazando] = React.useState(null);
  const esSupervisor = !!session.supervisor;
  // El gerente usa este mismo panel con más permisos: los ACTIVOS (vehículos
  // con placa, datos de la empresa, logo) son suyos; la operación del día es
  // de los dos.
  const esGerente = session.role === 'manager';
  const [error, setError] = React.useState(null);
  const [okMsg, setOkMsg] = React.useState(null);
  // personRole: 'driver' (chofer, maneja y reporta GPS) | 'collector' (cobrador)
  // name es obligatorio; alias es opcional y es lo que se muestra en el chat.
  const [form, setForm] = React.useState({
    unitId: '', name: '', alias: '', personRole: 'driver', vehicleId: '', password: '',
    routeId: session.routeId || currentRoute || '',
  });
  const [resetFor, setResetFor] = React.useState(null);
  const [resetPass, setResetPass] = React.useState('');
  // Corregir nombre/alias de alguien ya cargado (las cuentas viejas quedaron
  // con el código de la unidad como nombre)
  const [editFor, setEditFor] = React.useState(null);
  const [editForm, setEditForm] = React.useState({ name: '', alias: '' });
  // Las combis que puede manejar cada uno (habilitaciones, 30/10): la lista,
  // la de hoy, y si es comodín de su ruta
  const [combisFor, setCombisFor] = React.useState(null);
  const [combisForm, setCombisForm] = React.useState({ combis: [], actual: null, todaLaRuta: false });
  const [confirmDel, setConfirmDel] = React.useState(null);
  const [busy, setBusy] = React.useState(false);
  const [filter, setFilter] = React.useState('');
  // Credenciales recién generadas: se muestran UNA vez, para dictarlas o
  // anotarlas. Después ya no hay forma de recuperar la clave (va cifrada).
  const [credential, setCredential] = React.useState(null);
  const [copied, setCopied] = React.useState(false);

  const api = async (path, opts = {}) => {
    const res = await fetch(HTTP_URL + path, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + session.token,
        ...(opts.headers || {}),
      },
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) {
      const cuerpo = await res.clone().json().catch(() => ({}));
      onAuthError(cuerpo.error || null);
      throw new Error('Sesión expirada');
    }
    if (!res.ok) throw new Error(data.error || 'Error del servidor');
    return data;
  };

  const load = () => api('/admin/users')
    .then(d => { setUsers(d.users); setConsentVigente(d.consentimientoVigente || null); })
    .catch(e => setError(e.message));

  // `antes`: el id del último que se ve, para seguir hacia atrás
  const loadAudit = (clase = claseAudit, antes = null) => api(
      '/admin/audit?' + new URLSearchParams({ ...(clase ? { clase } : {}), ...(antes ? { antes } : {}) }))
    .then(d => {
      setEvents(ev => antes ? [...(ev || []), ...d.events] : d.events);
      setAuditMas(!!d.hayMas);
      if (d.plazos) setPlazosAudit(d.plazos);
    })
    .catch(e => setError(e.message));

  // El período del cuadro por unidad. Abre en 7 días como el resto del panel:
  // juntar todo el historial retenido costaba un segundo de servidor, y ese
  // segundo es la ingesta de GPS de toda la flota parada (`COSTOS.md` §3).
  // `null` = todo el historial, que sigue estando pero como elección expresa.
  const [diasMetrics, setDiasMetrics] = React.useState(7);
  // El período SERVIDO, que es con el que se rotula. No se rotula con
  // `diasMetrics` —lo que el panel creyó pedir— porque el servidor recorta el
  // pedido a [1, 365]: si alguna vez los dos no coinciden, gana el que trajo
  // los datos. Un rótulo tiene que describir lo que hay en la tabla.
  const [periodoMetrics, setPeriodoMetrics] = React.useState(null);
  // Con la MISMA ruta que la tabla de vueltas: el supervisor veía los
  // números de su ruta arriba y todas mezcladas abajo (barrido del 22/9).
  const loadMetrics = (dias = diasMetrics) => api(
    '/admin/metrics' + (dias === null ? '?todo=1' : `?dias=${dias}`) +
    (esSupervisor && currentRoute ? `&routeId=${encodeURIComponent(currentRoute)}` : ''))
    .then(d => { setMetrics(d.metrics); setPeriodoMetrics(d.periodo || null); })
    .catch(e => setError(e.message));

  const loadRoutes = () => api('/admin/routes')
    .then(d => { setRouteList(d.routes || []); })
    .catch(e => setError(e.message));

  const loadVehicles = () => api('/admin/vehicles')
    .then(d => { setVehicles(d.vehicles || []); })
    .catch(e => setError(e.message));

  // «Ayer» se pide con su `hasta` (la medianoche de hoy): sin él, el turno de
  // ayer 22:00 a hoy 02:00 sumaba las horas de hoy, y la lista de 500 más
  // nuevas podía dejar afuera los de ayer (barrido del 22/9).
  const inicioDeHoy = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const loadShifts = (rango = rangoTurnos) => {
    const hoy = inicioDeHoy();
    const desde = rango === 'hoy' ? hoy : rango === 'ayer' ? hoy - 86400e3 : hoy - 6 * 86400e3;
    return api(`/admin/shifts?desde=${desde}${rango === 'ayer' ? `&hasta=${hoy}` : ''}`)
      .then(d => setShifts({ ...d, rango }))
      .catch(e => setError(e.message));
  };

  // <input type="datetime-local"> habla en hora local, sin zona
  const aLocal = (ts) => {
    if (!ts) return '';
    const d = new Date(ts), p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const deLocal = (v) => (v ? new Date(v).getTime() : NaN);
  const abrirCorreccion = (t) => {
    setCorrigiendo(t.id); setConfirmarAnular(false); setHistorialTurno(null);
    setCorrForm({ inicio: aLocal(t.startedAt), fin: aLocal(t.endedAt || t.lastSeenAt), motivo: '', personId: '', vehicleId: '' });
    api(`/admin/shifts/${t.id}/correcciones`).then(d => setHistorialTurno(d.correcciones || [])).catch(() => setHistorialTurno([]));
  };
  const guardarCorreccion = (t, anular = false) => run(async () => {
    if (corrigiendo === 'nuevo') {
      await api('/admin/shifts', { method: 'POST', body: JSON.stringify({
        personId: corrForm.personId, vehicleId: corrForm.vehicleId || undefined,
        startedAt: deLocal(corrForm.inicio), endedAt: deLocal(corrForm.fin), motivo: corrForm.motivo,
      }) });
    } else {
      await api(`/admin/shifts/${t.id}/correccion`, { method: 'POST', body: JSON.stringify(anular
        ? { anular: true, motivo: corrForm.motivo }
        : { startedAt: deLocal(corrForm.inicio), endedAt: deLocal(corrForm.fin), motivo: corrForm.motivo }) });
    }
    setCorrigiendo(null); setConfirmarAnular(false);
    await loadShifts();
  }, corrigiendo === 'nuevo' ? 'Turno agregado' : anular ? 'Turno anulado' : 'Turno corregido');

  const loadVueltas = () => {
    const ruta = esSupervisor && currentRoute ? `?routeId=${encodeURIComponent(currentRoute)}` : '';
    return api('/admin/vueltas' + ruta)
      .then(d => setVueltas(d))
      .catch(e => setError(e.message));
  };

  // Días de CALENDARIO, no rodantes (revisión del 10/9, E14). Con
  // `hasta - dias × 86400000` el período arrancaba a la hora en que se abrió
  // la pantalla: a las 15:00, «7 días» empezaba el lunes a las 15:00, y la
  // tendencia por día abría con una barra de nueve horas comparada contra
  // seis días enteros. El único día parcial tiene que ser hoy.
  // Dónde empieza un período de N días, en días de CALENDARIO contando hoy.
  // Lo usan el resumen y los CSV de Números, que antes no coincidían: el
  // resumen contaba una cosa y el archivo que el gerente bajaba al lado,
  // otra (REVISION-2026-09-10.md, E19).
  const inicioDePeriodo = (dias) => {
    const d = new Date(inicioDeHoy());
    d.setDate(d.getDate() - (Math.max(1, dias) - 1));
    return d.getTime();
  };
  const loadGerencia = (dias = diasGer, ruta = rutaGer) => {
    const hasta = Date.now();
    const desde = inicioDePeriodo(dias);
    return api(`/gerencia/resumen?desde=${desde}&hasta=${hasta}${ruta ? `&routeId=${encodeURIComponent(ruta)}` : ''}`)
      .then(setResumenGer).catch(e => setError(e.message));
  };
  // Los tres en una sola pasada: se miran juntos o no se miran. Un tramo que
  // aparece en las tres listas —se para, se corta la señal y saltan
  // anomalías— es un lugar, no tres problemas.
  const loadTrabas = (dias = diasTrabas) => {
    const q = `?dias=${dias}`;
    return Promise.all([
      api('/admin/paradas' + q), api('/admin/huecos' + q), api('/admin/anomalias' + q),
    ]).then(([p, h, a]) => setTrabas({
      dias, paradas: p.paradas || [], huecos: h.huecos || [], anomalias: a.anomalias || [],
    })).catch(e => setError(e.message));
  };

  const loadEmpresa = () => api('/admin/company')
    .then(d => {
      setEmpresa(d);
      setEmpForm({
        name: d.empresa.name || '', ruc: d.empresa.ruc || '',
        contacto: d.empresa.contacto || '', telefonoCentral: d.empresa.telefonoCentral || '',
      });
    })
    .catch(e => setError(e.message));

  React.useEffect(() => { load(); loadRoutes(); loadVehicles(); }, []);
  React.useEffect(() => {
    if (tab === 'audit') loadAudit();
    if (tab === 'metrics') { loadMetrics(); loadVueltas(); }
    if (tab === 'routes') loadRoutes();
    if (tab === 'vehicles') loadVehicles();
    if (tab === 'shifts') loadShifts();
    if (tab === 'empresa') loadEmpresa();
    if (tab === 'gerencia') loadGerencia();
    if (tab === 'trabas') loadTrabas();
  }, [tab]);

  const run = async (fn, ok) => {
    setBusy(true); setError(null); setOkMsg(null); setCredential(null); setCopied(false);
    try { await fn(); if (ok) setOkMsg(ok); await load(); }
    catch (e) { setError(e.message); }
    setBusy(false);
  };

  // Cambiar el trazado con el que se mide una ruta le cambia el mapa a todos
  // los que están manejando en ese momento y descarta las vueltas en curso.
  // Por eso se confirma, y el cartel dice qué se pierde.
  const pedirCambioDeTrazado = (ruta, variantId) => {
    const v = (ruta.variantes || []).find(x => x.variantId === variantId);
    if (!v || v.activa) return;
    if (!v.puntos) {
      setError(`"${v.name}" todavía no tiene recorrido dibujado. Cargalo antes de activarla.`);
      return;
    }
    setConfirmVar({ ruta, v, actual: (ruta.variantes || []).find(x => x.activa) || null });
  };

  const confirmarCambioDeTrazado = () => {
    const { ruta, v } = confirmVar;
    setConfirmVar(null);
    run(async () => {
      await api(`/admin/routes/${encodeURIComponent(ruta.routeId)}/variantes/${v.variantId}/activar`,
        { method: 'POST' });
      await loadRoutes();
    }, `${ruta.routeId} ahora mide con "${v.name}"`);
  };

  const cambiarObjetivo = (routeId, cambio) => run(async () => {
    await api(`/admin/routes/${encodeURIComponent(routeId)}/target`, {
      method: 'POST', body: JSON.stringify(cambio),
    });
    await loadRoutes();
  }, 'Objetivo actualizado');

  // La 18A y la 18B rotan combis: el supervisor la pasa de una a otra. La
  // gente asignada va con ella, y si está en ruta sale de un mapa y entra al
  // otro (ver `moverCombiDeRuta` en el servidor).
  const moverCombi = () => {
    const { v, destino } = confirmMover;
    setConfirmMover(null);
    return run(async () => {
      await api(`/admin/vehicles/${encodeURIComponent(v.vehicleId)}/ruta`, {
        method: 'POST', body: JSON.stringify({ routeId: destino }),
      });
      await Promise.all([loadVehicles(), load()]);
    }, `${v.vehicleId} ahora trabaja en ${destino}`);
  };

  const crearVehiculo = () => run(async () => {
    await api('/admin/vehicles', {
      method: 'POST',
      body: JSON.stringify({ ...nuevoVeh, routeId: form.routeId || undefined }),
    });
    setNuevoVeh({ vehicleId: '', label: '' });
    await loadVehicles();
  }, 'Vehículo creado');

  // Clave fácil de dictar por teléfono: sin caracteres ambiguos
  // Dos palabras y cuatro números, con el azar del navegador para claves
  // (no Math.random). La misma lista que el servidor (`claveGenerada`): era
  // una de ocho palabras y 72 000 claves posibles (auditoría 11/11).
  const suggestPassword = () => {
    const words = [
      'lago', 'cerro', 'puno', 'andes', 'combi', 'ruta', 'sol', 'luna', 'rio', 'pampa', 'nube', 'viento',
      'piedra', 'llama', 'alpaca', 'vicuna', 'condor', 'puma', 'quinua', 'papa', 'maiz', 'trigo', 'ichu', 'totora',
      'balsa', 'isla', 'playa', 'puerto', 'puente', 'camino', 'plaza', 'mercado', 'feria', 'fiesta', 'danza', 'banda',
      'zampona', 'charango', 'tambor', 'poncho', 'chullo', 'manta', 'lana', 'hilo', 'nevado', 'helada', 'lluvia', 'granizo',
      'rayo', 'trueno', 'estrella', 'cielo', 'campo', 'chacra', 'surco', 'semilla', 'cosecha', 'molino', 'horno', 'pan',
      'queso', 'leche', 'miel', 'sal',
    ];
    const azar = new Uint32Array(3);
    crypto.getRandomValues(azar);
    return `${words[azar[0] % words.length]}-${words[azar[1] % words.length]}-${1000 + (azar[2] % 9000)}`;
  };

  const create = () => run(async () => {
    const payload = { ...form, password: form.password || suggestPassword() };
    const r = await api('/admin/users', { method: 'POST', body: JSON.stringify(payload) });
    setCredential({
      unitId: payload.unitId, password: payload.password, routeId: r.routeId,
      isNew: true, name: payload.name, alias: payload.alias,
      role: r.role, vehicleId: r.vehicleId,
    });
    setForm(f => ({
      unitId: '', name: '', alias: '', personRole: f.personRole,
      vehicleId: '', password: '', routeId: f.routeId,
    }));
    // Un alta de chofer puede haber creado su vehículo sola
    await loadVehicles();
  }, null);

  const editarIdentidad = (unitId) => run(async () => {
    await api(`/admin/users/${encodeURIComponent(unitId)}/identity`, {
      method: 'POST', body: JSON.stringify(editForm),
    });
    setEditFor(null);
    await loadVehicles();
  }, 'Identidad actualizada');

  const guardarCombis = (unitId) => run(async () => {
    await api(`/admin/users/${encodeURIComponent(unitId)}/combis`, {
      method: 'POST', body: JSON.stringify(combisForm),
    });
    setCombisFor(null);
    await loadVehicles();
  }, 'Combis actualizadas');

  const resetPassword = (unitId) => run(async () => {
    const password = resetPass || suggestPassword();
    await api(`/admin/users/${encodeURIComponent(unitId)}/password`, {
      method: 'POST', body: JSON.stringify({ password }),
    });
    setCredential({ unitId, password, isNew: false });
    setResetFor(null); setResetPass('');
  }, null);

  const remove = (unitId) => run(async () => {
    await api(`/admin/users/${encodeURIComponent(unitId)}`, { method: 'DELETE' });
    setConfirmDel(null);
  }, `${unitId} dado de baja`);

  // Buscar por cualquiera de sus datos: quien atiende despacho puede saber
  // el alias y no el nombre, o tener a mano solo el número de la combi.
  const coincide = (u, q) =>
    [u.unitId, u.name, u.alias, u.driverName, u.vehicleId, u.routeId]
      .filter(Boolean).join(' ').toLowerCase().includes(q);

  if (trazando) {
    return (
      <Trazador
        routeId={trazando.routeId}
        routeName={trazando.name}
        variantes={trazando.variantes}
        api={api}
        onClose={() => setTrazando(null)}
        onGuardado={() => loadRoutes()}
      />
    );
  }

  // El riel en tres grupos. Nombra para qué es cada cosa antes de nombrar la
  // cosa: "operación del día" y "ruta y medición" no se mezclan aunque las
  // ocho secciones vivan en el mismo lugar.
  const GRUPOS = [
    ['Operación del día', [
      ['users', 'Personas', users ? users.length : null],
      ['vehicles', 'Vehículos', vehicles ? vehicles.length : null],
      ['shifts', 'Turnos', null],
    ]],
    ['Ruta y medición', [
      ['routes', 'Rutas', routeList.length || null],
      ['metrics', 'Vueltas', vueltas ? vueltas.resumen.cerradas : null],
      ['trabas', 'Dónde se traba', trabas ? trabas.paradas.filter(p => p.medida).length || null : null],
      ['informes', 'Informes', null],
    ]],
    ['La cooperativa', [
      ['empresa', 'Empresa', null],
      // Los números del período — la vieja pantalla de gerencia.html, ahora
      // adentro del panel. Solo la ve la cuenta de gerencia: nadie audita su
      // propio trabajo.
      ...(esGerente ? [['gerencia', 'Números', null]] : []),
      ['audit', 'Actividad', null],
    ]],
  ];
  const TITULOS = {
    users: ['Personas', 'Choferes, cobradores y encargados de la cooperativa. Acá se dan de alta, se corrigen los datos, se resetean claves y se dan de baja.'],
    vehicles: ['Vehículos', 'Las combis físicas de la cooperativa y quién va arriba de cada una hoy.'],
    routes: ['Rutas', 'Objetivo de brecha, recorrido cargado y con cuál de los trazados se está midiendo. Los trazados los crea el nivel de arriba; acá se elige.'],
    shifts: ['Turnos', 'Entradas y salidas de la jornada, por unidad.'],
    metrics: ['Vueltas', 'Cada vuelta cerrada con su duración y la brecha promedio que mantuvo.'],
    trabas: ['Dónde se traba', 'En qué punto del recorrido y a qué hora se detienen las combis, y en qué tramo se corta siempre la señal. Es de la RUTA, no de un chofer.'],
    informes: ['Informes', 'Descargas para la cooperativa: vueltas, brechas y turnos en un rango de fechas.'],
    empresa: ['Empresa', 'Datos de la cooperativa que se muestran en el panel y en la app del chofer.'],
    audit: ['Actividad', 'Todo lo que se hizo en el panel de esta cooperativa. Solo la de ustedes.'],
    gerencia: ['Números', 'Cumplimiento, vueltas, horas y SOS del período, por unidad. Cada vuelta se juzga contra el objetivo que regía cuando se cerró.'],
  };

  const fmtSeg = (s) => s == null ? '—'
    : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
  const hhmm = (ts) => {
    const d = new Date(ts);
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  };

  const ICONO_TAB = {
    users: 'personas', vehicles: 'vehiculo', shifts: 'reloj', routes: 'ruta', metrics: 'vueltas',
    trabas: 'traba', informes: 'informe', empresa: 'empresa', gerencia: 'numeros', audit: 'actividad',
  };
  const rielItem = (key, etiqueta, cuenta) => (
    <button key={key} onClick={() => setTab(key)} aria-current={tab === key ? 'page' : undefined} style={{
      display: 'flex', alignItems: 'center', gap: 10, width: '100%', height: 38,
      padding: '0 10px', borderRadius: 10, border: 'none', cursor: 'pointer',
      textAlign: 'left', fontSize: 14, fontWeight: tab === key ? 700 : 600, fontFamily: 'inherit',
      background: tab === key ? HUD.azulFondo : 'transparent',
      color: tab === key ? HUD.azulTinta : HUD.fg2,
    }}>
      <Icono n={ICONO_TAB[key]} tam={18} style={{ color: tab === key ? HUD.bright : HUD.dim }} />
      <span style={{ flex: 1, minWidth: 0 }}>{etiqueta}</span>
      {cuenta !== null && cuenta !== undefined && (
        <span style={{
          ...dato(11, tab === key ? HUD.azulTinta : HUD.dim2),
          background: tab === key ? HUD.surface : HUD.hueco, borderRadius: 10, padding: '1px 7px',
        }}>{cuenta}</span>
      )}
    </button>
  );

  const [tituloSec, bajadaSec] = TITULOS[tab] || ['', ''];

  // Gestión es una vista del mismo panel: la cabecera de arriba sigue (con
  // su botón para volver al mapa), y esto ocupa el resto. Antes era un
  // overlay a pantalla completa con su propia cabecera y una «✕ Volver al
  // mapa» que la hacía parecer otra aplicación.
  return (
    <div style={{
      flex: 1, minHeight: 0, background: HUD.bg,
      display: 'flex', flexDirection: 'column',
    }}>
      <div style={{
        flex: 1, minHeight: 0,
        display: 'grid', gridTemplateColumns: angosto ? '1fr' : '250px 1fr',
      }}>
        {!angosto && (
          <nav aria-label="Secciones de Gestión" style={{
            background: HUD.surface, borderRight: `1px solid ${HUD.divider}`,
            padding: '14px 12px', overflowY: 'auto', overflowX: 'hidden',
          }}>
            <button onClick={onClose} style={{
              ...btnFantasma(36), width: '100%', justifyContent: 'flex-start', marginBottom: 14, color: HUD.bright,
            }}><Icono n="atras" tam={16} grosor={2.2} />Volver al mapa</button>
            {GRUPOS.map(([titulo, items]) => (
              <div key={titulo} style={{ marginBottom: 16 }}>
                <div style={{ ...rotulo(9), padding: '0 10px 6px' }}>{titulo}</div>
                <div style={{ display: 'grid', gap: 2 }}>{items.map(([k, e, c]) => rielItem(k, e, c))}</div>
              </div>
            ))}
            <div style={{ padding: '4px 10px', fontSize: 12, color: HUD.dim2, lineHeight: 1.45 }}>
              {session.companyName || session.companyId || ''}{currentRoute ? <span style={dato(11, HUD.dim2)}> · {currentRoute}</span> : null}
            </div>
          </nav>
        )}

        {/* contenido: aprovecha el ancho (antes 940 px fijos y vacío a la derecha) */}
        <div style={{ overflowY: 'auto', overflowX: 'hidden', minWidth: 0, padding: angosto ? '16px 14px 40px' : '28px 36px 48px' }}>
          <div style={{ maxWidth: tab === 'gerencia' ? 1440 : 1200 }}>
            {angosto && (
              <select value={tab} onChange={e => setTab(e.target.value)}
                style={{ ...campo(44), width: '100%', marginBottom: 18, fontWeight: 700, cursor: 'pointer' }}>
                {GRUPOS.map(([titulo, items]) => (
                  <optgroup key={titulo} label={titulo}>
                    {items.map(([k, e2, c]) => (
                      <option key={k} value={k}>{e2}{c !== null && c !== undefined ? ` (${c})` : ''}</option>
                    ))}
                  </optgroup>
                ))}
              </select>
            )}
            {error && (
              <div role="alert" style={{
                display: 'flex', gap: 8, alignItems: 'flex-start',
                background: HUD.rojoFondo, border: `1px solid ${HUD.rojoBorde}`,
                borderRadius: 12, padding: '11px 13px', marginBottom: 16,
                fontSize: 13, fontWeight: 700, color: HUD.rojoTinta, animation: 'aparecer .18s ease-out',
              }}><Icono n="alerta" tam={16} style={{ marginTop: 1 }} />{error}</div>
            )}
            {okMsg && (
              <div style={{
                display: 'flex', gap: 8, alignItems: 'flex-start',
                background: HUD.verdeFondo, border: `1px solid ${HUD.verdeBorde}`,
                borderRadius: 12, padding: '11px 13px', marginBottom: 16,
                fontSize: 13, fontWeight: 700, color: HUD.verdeTinta, animation: 'aparecer .18s ease-out',
              }}><Icono n="check" tam={16} grosor={2.2} style={{ marginTop: 1 }} />{okMsg}</div>
            )}

            <Seccion key={tab} titulo={tituloSec} bajada={bajadaSec}>

            {/* ─── PERSONAS ─────────────────────────────────────── */}
            {tab === 'users' && (<div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 14 }}>
                <input placeholder="Buscar por nombre, alias o unidad" value={filter}
                  onChange={e => setFilter(e.target.value)}
                  style={{ ...campo(40), flex: '1 1 260px' }} />
                <span style={{ position: 'relative', display: 'inline-flex' }}>
                  <span style={{
                    display: 'flex', alignItems: 'center', gap: 8, height: 40, padding: '0 12px',
                    background: HUD.surface, border: `1px solid ${HUD.line}`, borderRadius: 10,
                    fontSize: 13, fontWeight: 700, color: HUD.fg2, whiteSpace: 'nowrap',
                  }}>
                    {{ '': 'Todos los roles', driver: 'Choferes', collector: 'Cobradores', dispatch: 'Despacho', manager: 'Gerencia' }[filtroRol]}
                    <span style={{ fontSize: 11, color: HUD.dim3 }}>▾</span>
                  </span>
                  <select value={filtroRol} onChange={e => setFiltroRol(e.target.value)}
                    style={{ position: 'absolute', inset: 0, opacity: 0, cursor: 'pointer', width: '100%' }}>
                    <option value="">Todos los roles</option>
                    <option value="driver">Choferes</option>
                    <option value="collector">Cobradores</option>
                    <option value="dispatch">Despacho</option>
                    <option value="manager">Gerencia</option>
                  </select>
                </span>
                <button onClick={() => setAltaAbierta(a => !a)} style={btnPrimario(40)}>
                  {altaAbierta ? '✕ Cerrar' : '+ Persona'}
                </button>
                {/* Muchas de una vez, desde la planilla que ya tienen (0.7) */}
                <button data-abrir-planilla onClick={() => setMasivaAbierta(a => !a)} style={btnSecundario(40)}>
                  {masivaAbierta ? '✕ Cerrar' : 'Cargar una planilla'}
                </button>
              </div>

              {masivaAbierta && <CargaMasiva api={api} onListo={() => load()} />}

              {/* alta de PERSONA: nombre obligatorio, alias opcional, rol y vehículo */}
              {altaAbierta && (
                <div style={{
                  background: HUD.bg, border: `1px solid ${HUD.divider}`,
                  borderRadius: 12, padding: 14, marginBottom: 16,
                }}>
                  <div style={{ ...rotulo(9), marginBottom: 10 }}>Alta de persona</div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 8 }}>
                    <span style={{ display: 'flex', flex: '0 0 auto', borderRadius: 10, overflow: 'hidden', border: `1px solid ${HUD.line}` }}>
                      {[['driver', 'CHOFER'], ['collector', 'COBRADOR']].map(([k, l]) => (
                        <button key={k} onClick={() => setForm(f => ({ ...f, personRole: k }))}
                          title={k === 'driver'
                            ? 'Maneja y su celular reporta la posición de la unidad'
                            : 'Va arriba, ve brechas y chat, pero no reporta posición'}
                          style={{
                            border: 'none', padding: '0 14px', height: 40, cursor: 'pointer',
                            fontFamily: mono, fontSize: 11, fontWeight: 700, letterSpacing: 1,
                            background: form.personRole === k ? HUD.bright : HUD.surface,
                            color: form.personRole === k ? '#fff' : HUD.dim2,
                          }}>{l}</button>
                      ))}
                    </span>
                    <input placeholder="Nombre y apellido *" value={form.name}
                      onChange={e => setForm(f => ({ ...f, name: e.target.value }))}
                      title="Obligatorio: es el nombre que queda en los registros de la empresa"
                      style={{ ...campo(40), flex: '2 1 180px' }} />
                    <input placeholder="Alias (opcional)" value={form.alias}
                      onChange={e => setForm(f => ({ ...f, alias: e.target.value }))}
                      title="Cómo lo llaman en la ruta. Si lo pones, es lo que se ve en el chat"
                      style={{ ...campo(40), flex: '1 1 130px' }} />
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                    {esSupervisor && routeList.length > 0 && (
                      <select value={form.routeId}
                        onChange={e => setForm(f => ({ ...f, routeId: e.target.value, vehicleId: '' }))}
                        title="Ruta en la que trabaja"
                        style={{ ...campo(40), flex: '0 1 110px', cursor: 'pointer' }}>
                        {routeList.map(r => <option key={r.routeId} value={r.routeId}>{r.routeId}</option>)}
                      </select>
                    )}
                    <input placeholder="Usuario para entrar *" value={form.unitId}
                      onChange={e => setForm(f => ({ ...f, unitId: e.target.value }))}
                      title="Con esto se identifica en la app (ej. M-21 para el chofer, M-21C para su cobrador)"
                      style={{ ...campo(40), flex: '1 1 140px' }} />
                    <select value={form.vehicleId}
                      onChange={e => setForm(f => ({ ...f, vehicleId: e.target.value }))}
                      title="Vehículo en el que va"
                      style={{ ...campo(40), flex: '1 1 150px', cursor: 'pointer' }}>
                      <option value="">
                        {form.personRole === 'driver' ? 'Vehículo: crear con su código' : 'Vehículo… (obligatorio)'}
                      </option>
                      {(vehicles || [])
                        .filter(v => !form.routeId || v.routeId === form.routeId)
                        .map(v => (
                          <option key={v.vehicleId} value={v.vehicleId}>
                            {v.vehicleId}{v.label ? ` · ${v.label}` : ''}
                          </option>
                        ))}
                    </select>
                    <span style={{ display: 'flex', flex: '1 1 150px', gap: 4, minWidth: 0 }}>
                      <input placeholder="Contraseña (o generar →)" value={form.password}
                        onChange={e => setForm(f => ({ ...f, password: e.target.value }))}
                        style={{ ...campo(40), flex: 1 }} />
                      <button title="Generar una clave fácil de dictar"
                        onClick={() => setForm(f => ({ ...f, password: suggestPassword() }))}
                        style={{ ...btnSecundario(40), width: 40, padding: 0 }}>⟳</button>
                    </span>
                    <button onClick={create} disabled={busy} style={btnPrimario(40)}>+ Alta</button>
                  </div>
                  <div style={{ fontSize: 12, color: HUD.dim3, marginTop: 10, lineHeight: 1.5 }}>
                    {form.personRole === 'driver'
                      // Crear la combi al vuelo es crear un ACTIVO: sólo la
                      // gerencia. A Despacho el servidor le contesta 403, y
                      // el texto le prometía lo contrario (recorrido del 28/10).
                      ? (esGerente
                        ? 'El chofer maneja: su celular es el que reporta la posición de la unidad. Si no elegís vehículo, se crea uno con el mismo código del usuario.'
                        : 'El chofer maneja: su celular es el que reporta la posición de la unidad. Elegí la combi en la que va: las combis las da de alta la cuenta de gerencia.')
                      : 'El cobrador necesita un vehículo ya creado. Ve brechas, mapa y chat, pero su GPS no se usa.'}
                  </div>
                </div>
              )}

              {/* credenciales para dictar — se ven una sola vez */}
              {credential && (
                <div style={{
                  background: HUD.verdeFondo, border: `1px solid ${HUD.verdeBorde}`,
                  borderLeft: `3px solid ${HUD.green}`,
                  borderRadius: 12, padding: 16, marginBottom: 16,
                }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: HUD.verdeTinta, marginBottom: 10 }}>
                    {credential.isNew
                      ? `✓ ${credential.role === 'collector' ? 'Cobrador' : 'Chofer'} dado de alta${
                          credential.vehicleId ? ' en ' + credential.vehicleId : ''}${
                          credential.routeId ? ' · ruta ' + credential.routeId : ''}`
                      : '✓ Contraseña reseteada — su sesión fue cerrada'}
                    {' '}· anotá o dictá estos datos ahora
                  </div>
                  {credential.isNew && credential.name && (
                    <div style={{ fontSize: 14, color: HUD.fg2, marginBottom: 10 }}>
                      {credential.name}{credential.alias ? ` — le dicen “${credential.alias}”` : ''}
                    </div>
                  )}
                  <div style={{ display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'flex-end' }}>
                    <div>
                      <div style={rotulo(9)}>Usuario</div>
                      <div style={{ fontFamily: black, fontSize: 22 }}>{credential.unitId}</div>
                    </div>
                    <div>
                      <div style={rotulo(9)}>Contraseña</div>
                      <div style={{ fontFamily: black, fontSize: 22, color: HUD.okClave, userSelect: 'all' }}>{credential.password}</div>
                    </div>
                    <div style={{ flex: 1 }} />
                    <span style={{ display: 'flex', gap: 8 }}>
                      <button onClick={() => {
                        const txt = `Unidad: ${credential.unitId}\nContraseña: ${credential.password}`;
                        navigator.clipboard?.writeText(txt).then(() => setCopied(true)).catch(() => {});
                      }} style={btnChico(HUD.verdeTinta, HUD.verdeBorde)}>{copied ? '✓ Copiado' : 'Copiar'}</button>
                      <button onClick={() => setCredential(null)} style={btnChico(HUD.dim2)}>Ocultar</button>
                    </span>
                  </div>
                  <div style={{ fontSize: 12, color: HUD.dim2, marginTop: 10, lineHeight: 1.5 }}>
                    Las contraseñas se guardan cifradas y no se pueden volver a ver: si un
                    chofer la pierde, se le genera una nueva con <strong>Clave</strong>.
                  </div>
                </div>
              )}

              <PanelConsentimiento users={users} vigente={consentVigente} api={api} run={run} busy={busy} />
              {!users && <Vacio>Cargando…</Vacio>}
              {users && (() => {
                const q = filter.trim().toLowerCase();
                // La gerencia es su propio rol: se listaba como «Chofer» y con
                // Editar y Baja, que el servidor rechaza (barrido del 22/9).
                const rolDe = (u) => u.role === 'dispatch' ? 'dispatch'
                  : u.role === 'manager' ? 'manager'
                  : u.role === 'collector' ? 'collector' : 'driver';
                const lista = users.filter(u =>
                  (!q || coincide(u, q)) && (!filtroRol || rolDe(u) === filtroRol));
                const cols = '170px minmax(0, 1fr) 90px 100px 150px 230px';
                return (
                  <Tabla cols={cols} ancho={900}
                    cabeceras={['Persona', 'Identidad', 'Rol', 'Unidad', 'Última conexión', 'Acciones']}>
                    {lista.length === 0 && <Vacio>Nadie coincide con lo buscado.</Vacio>}
                    {lista.map(u => (
                      <React.Fragment key={u.unitId}>
                        <FilaTabla cols={cols}>
                          <span style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
                            <Avatar nombre={u.name || u.driverName || u.unitId} tam={30} />
                            <Punto on={u.online} title={u.online ? 'Conectado' : 'Desconectado'} />
                            <span style={{
                              fontFamily: black, fontSize: 14, minWidth: 0,
                              overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                            }}>{u.unitId}</span>
                          </span>
                          <span style={{
                            fontSize: 13, color: HUD.fg2, minWidth: 0,
                            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                          }}>
                            {u.alias
                              ? <>{u.name || u.driverName} <span style={{ color: HUD.dim3 }}>({u.alias})</span></>
                              : (u.name || u.driverName || '—')}
                          </span>
                          <span style={rotulo(10, HUD.dim2)}>
                            {u.role === 'dispatch' ? 'Despacho' : u.role === 'manager' ? 'Gerencia' : u.role === 'collector' ? 'Cobrador' : 'Chofer'}
                          </span>
                          {/* La de hoy, y cuántas más puede elegir en la puerta */}
                          <span title={(u.combis || []).length > 1 || u.todaLaRuta
                              ? `Puede manejar: ${(u.combis || []).join(', ')}${u.todaLaRuta ? ' y cualquiera de su ruta' : ''}` : undefined}
                            style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color: HUD.fg2 }}>
                            {u.vehicleId || '—'}
                            {(u.combis || []).length > 1 && (
                              <span style={{ color: HUD.dim3, fontWeight: 400 }}> +{u.combis.length - 1}</span>

                            {/* Qué APK tiene (lo declara la app al entrar y en cada envío):

                          <span style={{ display: 'flex', gap: 4, justifyContent: 'flex-end', alignItems: 'center' }}>
                            {(() => {
                              const deRuta = u.role !== 'dispatch' && u.role !== 'manager';

                              return (<>
                                {deRuta && onEscribir ? (
                                  <button title="Escribirle en privado, solo a esta persona (en la combi que esté)"
                                    onClick={() => onEscribir(u.unitId, u.alias || u.name || u.unitId, u.routeId)}

                                ) : u.role !== 'manager' && (u.role !== 'dispatch' || esGerente) ? (
                                  // La clave de una cuenta de Despacho la cambia la
                                  // gerencia (o su dueño, desde su perfil): entre
                                  // colegas no (auditoría 11/11; el servidor también
                                  // lo rechaza)
                                  <button onClick={abrirClave} style={btnChico(HUD.fg2)}><Icono n="llave" tam={14} />Clave</button>

                                <Menu titulo={`Más acciones para ${u.unitId}`} data={{ 'data-acciones': u.unitId }} items={[
                                  deRuta && onEscribir && { label: 'Clave nueva', icono: 'llave', onClick: abrirClave },
                                  deRuta && { label: 'Combis', icono: 'vehiculo', onClick: () => {
                                    setCombisFor(u.unitId);
                                    // Las habilitadas más la de hoy (que puede no estar entre
                                    // ellas), y «la de hoy» nunca vacía si hay alguna: con
                                    // `vehicleId` null el select mostraba la primera y se
                                    // guardaba nada (revisión previa a la APK)
                                    const combis = [...new Set([...(u.combis || []), u.vehicleId].filter(Boolean))];
                                    setCombisForm({
                                      combis, actual: u.vehicleId || combis[0] || null, todaLaRuta: !!u.todaLaRuta,
                                    });
                                    setEditFor(null); setResetFor(null); setConfirmDel(null);
                                  } },
                                  deRuta && { label: 'Editar', icono: 'editar', onClick: () => {
                                    setEditFor(u.unitId);
                                    setEditForm({ name: u.name || u.driverName || '', alias: u.alias || '' });
                                    setResetFor(null); setConfirmDel(null); setCombisFor(null);
                                  } },
                                  deRuta && { label: 'Baja', icono: 'baja', tono: 'rojo', onClick: () => {
                                    setConfirmDel(u.unitId); setResetFor(null); setEditFor(null); setCombisFor(null);
                                  } },
                                ]} />
                                {/* La baja no tiene vuelta atrás: se confirma en un
                                    diálogo que nombra a quién y qué se pierde, con el
                                    botón en otro lugar y armado un momento después
                                    (auditoría 11/11: un doble clic daba de baja) */}
                                {confirmDel === u.unitId && (
                                  <Confirmacion kicker="Dar de baja" tono="red"
                                    titulo={`¿Dar de baja a ${u.name || u.driverName || u.unitId} (${u.unitId})?`}
                                    cuerpo={<>No se puede deshacer. Se cierra su sesión en el acto
                                      {u.vehicleId ? ` y, si está manejando ${u.vehicleId}, sale de ruta` : ''}.
                                      Se borran sus mensajes privados que no se guardaron como evidencia.
                                      Sus horas y sus vueltas quedan en los informes.</>}
                                    aceptar={busy ? 'Dando de baja…' : 'Sí, dar de baja'}
                                    onAceptar={() => { if (!busy) remove(u.unitId); }}
                                    onCancelar={() => setConfirmDel(null)} />
                                )}
                              </>);
                            })()}
                          </span>
                        </FilaTabla>
                        {/* Las combis que puede manejar. Se marcan las que
                            puede elegir en la puerta y cuál es la de hoy;
                            la de hoy no se le cambia a alguien en ruta (el
                            servidor lo rechaza y lo dice). */}
                        {combisFor === u.unitId && (
                          <div data-combis-de={u.unitId} style={{
                            padding: '12px 14px', background: HUD.bg, borderBottom: `1px solid ${HUD.hueco}`,
                          }}>
                            <div style={{ ...rotulo(9), marginBottom: 8 }}>Combis que puede manejar {u.unitId}</div>
                            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 10 }}>
                              {(vehicles || []).map(v => {
                                const marcada = combisForm.combis.includes(v.vehicleId);
                                const hoy = combisForm.actual === v.vehicleId;
                                return (
                                  <button key={v.vehicleId} data-habilitar={v.vehicleId} aria-pressed={marcada}
                                    disabled={hoy}
                                    title={hoy ? 'Es la de hoy: para sacarla, elegí otra como la de hoy' : (v.label || undefined)}
                                    onClick={() => setCombisForm(f => ({
                                      ...f,
                                      combis: marcada ? f.combis.filter(c => c !== v.vehicleId) : [...f.combis, v.vehicleId],
                                    }))}
                                    style={{
                                      ...btnChico(marcada ? HUD.bright : HUD.dim2, marcada ? HUD.bright : HUD.line),
                                      fontFamily: mono, fontWeight: 700, cursor: hoy ? 'default' : 'pointer',
                                      borderWidth: marcada ? 2 : 1,
                                    }}>
                                    {marcada ? '✓ ' : ''}{v.vehicleId}{hoy ? ' · hoy' : ''}
                                  </button>
                                );
                              })}
                            </div>
                            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center' }}>
                              <label style={{ fontSize: 13, color: HUD.fg2, display: 'flex', alignItems: 'center', gap: 6 }}>
                                La de hoy
                                <select value={combisForm.actual || ''}
                                  onChange={e => setCombisForm(f => ({ ...f, actual: e.target.value }))}
                                  style={{ ...campo(34), cursor: 'pointer' }}>
                                  {combisForm.combis.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                              </label>
                              <label style={{ fontSize: 13, color: HUD.fg2, display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
                                <input type="checkbox" checked={combisForm.todaLaRuta}
                                  onChange={e => setCombisForm(f => ({ ...f, todaLaRuta: e.target.checked }))} />
                                Cualquiera de su ruta (suplente)
                              </label>
                              <span style={{ flex: 1 }} />
                              <button onClick={() => guardarCombis(u.unitId)} disabled={busy} style={btnPrimario(34)}>Guardar</button>
                              <button onClick={() => setCombisFor(null)} style={btnSecundario(34)}>Cancelar</button>
                            </div>
                            <div style={{ fontSize: 12, color: HUD.dim2, marginTop: 8, lineHeight: 1.45 }}>
                              Entre éstas elige en la puerta, al salir a ruta. Si elige una que está manejando otro,
                              la app le pide confirmar el relevo.
                            </div>
                          </div>
                        )}
                        {/* El formulario abre debajo de su fila en vez de
                            exprimirse dentro de la columna de acciones */}
                        {editFor === u.unitId && (
                          <div style={{
                            display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center',
                            padding: '12px 14px', background: HUD.bg,
                            borderBottom: `1px solid ${HUD.hueco}`,
                          }}>
                            <span style={rotulo(9)}>Corregir</span>
                            <input autoFocus placeholder="Nombre y apellido *" value={editForm.name}
                              onChange={e => setEditForm(f => ({ ...f, name: e.target.value }))}
                              onKeyDown={e => { if (e.key === 'Enter') editarIdentidad(u.unitId); }}
                              style={{ ...campo(36), flex: '1 1 200px' }} />
                            <input placeholder="Alias" value={editForm.alias}
                              onChange={e => setEditForm(f => ({ ...f, alias: e.target.value }))}
                              onKeyDown={e => { if (e.key === 'Enter') editarIdentidad(u.unitId); }}
                              style={{ ...campo(36), flex: '1 1 140px' }} />
                            <button onClick={() => editarIdentidad(u.unitId)} disabled={busy}
                              style={btnPrimario(36)}>Guardar</button>
                            <button onClick={() => setEditFor(null)} style={btnSecundario(36)}>Cancelar</button>
                            {/* Todo lo que el sistema tiene de esta persona, para
                                entregárselo si lo pide (Ley 29733, PENDIENTES 0.14) */}
                            <div style={{ flexBasis: '100%', display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap',
                              marginTop: 4, fontSize: 12, color: HUD.dim2 }}>
                              <button data-bajar-datos={u.unitId} disabled={busy}
                                onClick={() => run(async () => {
                                  const r = await fetch(`${HTTP_URL}/admin/users/${encodeURIComponent(u.unitId)}/datos.zip`,
                                    { headers: { Authorization: 'Bearer ' + session.token } });
                                  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'No se pudo armar el archivo');
                                  const url = URL.createObjectURL(await r.blob());
                                  const a = document.createElement('a');
                                  a.href = url;
                                  a.download = `datos-${u.unitId}.zip`;
                                  a.click();
                                  setTimeout(() => URL.revokeObjectURL(url), 5000);
                                }, `Bajados todos los datos de ${u.name || u.driverName || u.unitId}`)}

                              <span>Lo que el sistema tiene de {u.name || u.driverName || u.unitId}, para entregárselo si lo pide. Queda en la Actividad.</span>
                            </div>
                          </div>

                          <div style={{
                            display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center',

                              style={btnSecundario(36)}>Cancelar</button>
                          </div>
                        )}
                      </React.Fragment>
                    ))}
                  </Tabla>
                );
              })()}
              <Pie>
                Cada persona tiene <strong>su propia cuenta</strong>: el alta se hace
                solo desde acá y el login de la app rechaza usuarios no registrados.
                Resetear la clave o dar de baja cierra su sesión al instante, y no
                toca a nadie más que vaya en el mismo vehículo.
              </Pie>
            </div>)}

            {/* ─── VEHÍCULOS ────────────────────────────────────── */}
            {tab === 'vehicles' && (<div>
              {!esGerente && (
                <div style={{
                  background: HUD.bg, border: `1px solid ${HUD.divider}`,

                  fontSize: 13, color: HUD.dim2, lineHeight: 1.5,

                  Los vehículos (con su placa) los da de alta la <strong>cuenta de

                </div>

              {esGerente && (
              <div style={{
                background: HUD.bg, border: `1px solid ${HUD.divider}`,

                display: 'flex', flexWrap: 'wrap', gap: 8,

                <div style={{ ...rotulo(9), width: '100%' }}>Alta de vehículo</div>

                  <select value={form.routeId}
                    onChange={e => setForm(f => ({ ...f, routeId: e.target.value }))}

                    {routeList.map(r => <option key={r.routeId} value={r.routeId}>{r.routeId}</option>)}
                  </select>
                )}
                <input placeholder="Código (ej. M-21)" value={nuevoVeh.vehicleId}
                  onChange={e => setNuevoVeh(v => ({ ...v, vehicleId: e.target.value }))}
                  style={{ ...campo(40), flex: '1 1 130px' }} />
                <input placeholder="Placa o descripción (opcional)" value={nuevoVeh.label}
                  onChange={e => setNuevoVeh(v => ({ ...v, label: e.target.value }))}
                  style={{ ...campo(40), flex: '1 1 180px' }} />
                <button onClick={crearVehiculo} disabled={busy} style={btnPrimario(40)}>+ Vehículo</button>
              </div>
              )}

              {!vehicles && <Vacio>Cargando…</Vacio>}
              {vehicles && vehicles.length === 0 && (
                <Vacio>Todavía no hay vehículos. Los da de alta la cuenta de gerencia (o se crean solos cuando la gerencia carga a un chofer con su combi).</Vacio>
              )}
              {vehicles && vehicles.length > 0 && (() => {
                const cols = '120px 84px 1fr 220px 96px';
                return (
                  <Tabla cols={cols} ancho={760}
                    cabeceras={['Vehículo', 'Ruta', 'Placa', 'Tripulación', 'Estado']}>
                    {vehicles.map(v => {
                      const asignados = (users || []).filter(u => u.vehicleId === v.vehicleId);
                      // Los que hoy van en otra pero también la pueden manejar
                      // (habilitaciones): se dicen aparte, después
                      const tambien = (v.habilitados || []).filter(h => !asignados.some(u => u.unitId === h.personId));
                      const arriba = (v.tripulacion || []).length;
                      return (
                        <FilaTabla key={v.vehicleId} cols={cols}>
                          <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                            <Punto on={v.enLinea} title={v.enLinea ? 'En ruta ahora' : 'Fuera de ruta'} />
                            <span style={{ fontFamily: black, fontSize: 14 }}>{v.vehicleId}</span>
                          </span>
                          {esSupervisor && routeList.length > 1 ? (
                            <select value={v.routeId || ''} disabled={busy}
                              title="Pasar esta combi a otra ruta de la cooperativa"
                              onChange={e => {
                                const destino = e.target.value;
                                if (destino && destino !== v.routeId) setConfirmMover({ v, destino });
                              }}
                              style={{
                                ...campo(30), width: '100%', padding: '0 4px', cursor: 'pointer',
                                fontFamily: mono, fontSize: 11, fontWeight: 700, color: HUD.bright,
                              }}>
                              {routeList.map(r => <option key={r.routeId} value={r.routeId}>{r.routeId}</option>)}
                            </select>
                          ) : (
                            <span style={{ fontFamily: mono, fontSize: 11, fontWeight: 700, color: HUD.bright }}>
                              {v.routeId || '—'}
                            </span>
                          )}
                          <span style={{
                            fontSize: 13, color: v.label ? HUD.fg2 : HUD.dim3, minWidth: 0,
                            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',

                          <span title={tambien.length ? `También la pueden manejar: ${tambien.map(h => h.nombre).join(', ')}` : undefined}
                            style={{
                              fontFamily: mono, fontSize: 11, color: HUD.dim2, minWidth: 0,
                              overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                            }}>
                            {asignados.length === 0 ? 'sin asignar'
                              : asignados.map(u => `${u.alias || u.name}${u.role === 'collector' ? ' (cobr.)' : ''}`).join(' · ')}
                            {tambien.length > 0 && (
                              <span style={{ color: HUD.dim3 }}> · también {tambien.map(h => h.nombre).join(', ')}</span>
                            )}
                          </span>
                          <span style={{
                            ...rotulo(10, arriba ? HUD.green : v.enLinea ? HUD.amber : HUD.dim3),
                            textAlign: 'right',
                          }}>{arriba ? `${arriba} arriba` : v.enLinea ? 'en línea' : 'parada'}</span>
                        </FilaTabla>
                      );
                    })}
                  </Tabla>
                );
              })()}
              <Pie>
                El vehículo es la combi física; las personas se dan de alta en
                <strong> Personas</strong> y se le asignan. Pueden ir dos arriba
                (chofer y cobrador) pero <strong>solo el chofer reporta la
                posición</strong>: así la unidad no salta entre dos celulares.
                {esSupervisor && routeList.length > 1 && (
                  <> Para pasar una combi a otra ruta de la cooperativa —la que rota
                  entre la A y la B—, cambiá su ruta en la columna Ruta: va con su gente.</>
                )}
              </Pie>
            </div>)}

            {/* ─── RUTAS ────────────────────────────────────────── */}
            {tab === 'routes' && (<div>
              {routeList.length === 0 && <Vacio>Cargando…</Vacio>}
              {routeList.map(r => {
                const activa = (r.variantes || []).find(v => v.activa);
                const modo = r.objetivo ? r.objetivo.modo : null;
                const chip = !r.objetivo ? null
                  : modo === 'auto'
                    ? [`AUTO · ${r.objetivo.vueltas} vueltas`, HUD.verdeFondo, HUD.verdeTinta]
                    : modo === 'esperando'
                      ? [r.objetivo.motivo === 'unidades'
                          ? 'AUTO · sin unidades en ruta'
                          : `AUTO · faltan vueltas (${r.objetivo.vueltas}/3)`, HUD.ambarFondo, HUD.ambarTinta2]
                      : ['A MANO', HUD.hueco, HUD.dim2];
                return (
                  <div key={r.routeId} style={{
                    border: `1px solid ${r.routeId === currentRoute ? HUD.azulBorde : HUD.divider}`, borderRadius: 16, padding: 18, marginBottom: 14,
                    background: r.routeId === currentRoute ? HUD.filaActiva : HUD.surface,
                  }}>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, flexWrap: 'wrap', marginBottom: 12 }}>
                      <span style={{ fontFamily: black, fontSize: 19 }}>{r.routeId}</span>

                      <div style={{ flex: 1 }} />
                      <span style={{
                        display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 13, fontWeight: 700,

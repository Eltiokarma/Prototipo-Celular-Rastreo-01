                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 12 }}>
                      <div style={{ padding: '12px 14px', borderRadius: 12, background: HUD.bg }}>
                        <div style={rotulo(9)}>Objetivo de brecha</div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', margin: '6px 0 10px' }}>
                          <span style={{ fontFamily: black, fontSize: 20 }}>
                            {fmtMin(r.objetivo ? r.objetivo.min : r.targetGapMin)}
                          </span>
                          {chip && (
                            <span title={
                              modo === 'auto'
                                ? `Vuelta promedio de ${r.objetivo.dia || 'todos los días'} sobre ${r.objetivo.unidades} unidades en ruta`
                                : modo === 'esperando'
                                  ? `Por ahora vale el manual de ${r.targetGapMin} min`
                                  : 'Fijado a mano'
                            } style={{
                              ...rotulo(10, chip[2]),
                              background: chip[1], borderRadius: 5, padding: '3px 7px',
                            }}>{chip[0]}</span>
                          )}
                        </div>
                        <button
                          onClick={() => cambiarObjetivo(r.routeId, { auto: !r.autoTarget })}
                          title={r.autoTarget
                            ? 'Volver al objetivo fijado a mano'
                            : 'Calcular el objetivo solo: vuelta promedio ÷ unidades en ruta'}
                          disabled={busy} style={btnChico(HUD.fg2)}>
                          {r.autoTarget ? 'Automático encendido' : 'Automático apagado'}
                        </button>
                      </div>

                      <div style={{ padding: '12px 14px', borderRadius: 12, background: HUD.bg }}>
                        <div style={rotulo(9)}>Recorrido cargado</div>
                        {/* Sin recorrido no es una alarma: es lo que falta hacer, y
                            el botón para hacerlo es lo que tiene que verse. */}
                        <div style={{
                          fontFamily: r.puntos ? black : 'inherit', fontSize: r.puntos ? 20 : 15,
                          fontWeight: r.puntos ? 400 : 700, margin: '6px 0 10px',
                          color: r.puntos ? HUD.fg : HUD.fg2,
                        }}>
                          {r.puntos ? `${r.puntos} pts · ${(r.largoM / 1000).toFixed(1)} km` : 'Todavía sin recorrido dibujado'}
                        </div>
                        <button onClick={() => setTrazando(r)}
                          title="Cargar o corregir el recorrido de esta ruta en el mapa"
                          style={r.puntos ? btnSecundario(34) : btnPrimario(36)}><Icono n="editar" tam={15} />Abrir trazador</button>
                      </div>

                      {/* Despacho ELIGE entre los trazados cargados; crearlos y
                          borrarlos es cartografía y se hace desde el nivel de
                          arriba. Con uno solo, elegir no es una decisión. */}
                      <div style={{ padding: '12px 14px', borderRadius: 12, background: HUD.bg }}>
                        <div style={rotulo(9)}>Se mide con</div>
                        <div style={{
                          fontFamily: black, fontSize: 20, margin: '6px 0 10px',
                          overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                        }}>{activa ? activa.name : '—'}</div>
                        {r.variantes && r.variantes.length > 1 ? (
                          <span style={{ position: 'relative', display: 'inline-flex' }}>
                            <span style={btnChico(HUD.fg2)}>Cambiar trazado…</span>
                            <select value={activa ? activa.variantId : ''} disabled={busy}
                              onChange={e => pedirCambioDeTrazado(r, Number(e.target.value))}
                              title="Cambia el trazado con el que se miden progreso, brechas y desvíos"
                              style={{ position: 'absolute', inset: 0, opacity: 0, cursor: 'pointer', width: '100%' }}>
                              {r.variantes.map(v => (
                                <option key={v.variantId} value={v.variantId}>
                                  {v.name}{v.puntos ? '' : ' (sin dibujar)'}
                                </option>
                              ))}
                            </select>
                          </span>
                        ) : (
                          <span style={{ fontSize: 12, color: HUD.dim3 }}>Es el único cargado</span>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
              <Pie>
                Despacho <strong>elige</strong> con cuál de los trazados cargados se
                mide. Crearlos y borrarlos es cartografía y se hace desde el nivel de
                arriba, igual que dar de alta una ruta nueva.
                {' '}El <strong>objetivo</strong> es la separación ideal entre unidades
                y el recorrido cuánto tarda de punta a punta: con esos dos números se
                convierte la distancia en minutos. Con <strong>Automático</strong> el
                objetivo se calcula solo — vuelta promedio ÷ unidades en ruta — y
                hasta juntar 3 vueltas sigue valiendo el número cargado a mano.
              </Pie>
            </div>)}

            {/* ─── TURNOS ───────────────────────────────────────── */}
            {tab === 'shifts' && (<div>
              <div style={{
                display: 'inline-flex', background: HUD.hueco, borderRadius: 10,
                padding: 3, marginBottom: 16,
              }}>
                {[['hoy', 'Hoy'], ['ayer', 'Ayer'], ['semana', 'Esta semana']].map(([k, l]) => (
                  <button key={k} onClick={() => { setRangoTurnos(k); setShifts(null); setCorrigiendo(null); loadShifts(k); }}
                    style={{
                      padding: '7px 14px', borderRadius: 8, border: 'none', cursor: 'pointer',
                      fontSize: 13, fontWeight: 700, fontFamily: 'inherit',
                      background: rangoTurnos === k ? HUD.tinta : 'transparent',
                      color: rangoTurnos === k ? (HUD.oscuro ? HUD.bg : '#fff') : HUD.dim2,
                    }}>{l}</button>
                ))}
              </div>
              {/* El turno que no se registró (el teléfono se apagó, se cayó
                  el servidor): se agrega a mano, con motivo */}
              <button data-agregar-turno onClick={() => {
                setCorrigiendo(corrigiendo === 'nuevo' ? null : 'nuevo'); setConfirmarAnular(false);
                const ahora = Date.now();
                setCorrForm({ inicio: aLocal(ahora - 8 * 3600e3), fin: aLocal(ahora), motivo: '', personId: '', vehicleId: '' });
              }} style={{ ...btnSecundario(34), marginLeft: 12, verticalAlign: 'top' }}>
                {corrigiendo === 'nuevo' ? 'Cerrar' : 'Agregar un turno que faltó'}
              </button>

              {!shifts && <Vacio>Cargando…</Vacio>}
              {shifts && (() => {
                // "Ayer" se recorta acá: el endpoint toma desde, no hasta.
                const hoy = inicioDeHoy();
                const turnos = rangoTurnos === 'ayer'
                  ? shifts.turnos.filter(t => t.startedAt < hoy)
                  : shifts.turnos;
                const vacio = !turnos.length;
                const horas = (sec) => {
                  // Se redondea a minutos PRIMERO y después se parte en horas:
                  // al revés, 4 h 59 min 59 s salía como "4 h 60 min".
                  const min = Math.round(sec / 60);
                  const h = Math.floor(min / 60);
                  return h ? `${h} h ${String(min % 60).padStart(2, '0')} min` : `${min} min`;
                };
                const cols = '110px 1fr 110px 110px 120px 92px';
                // De qué día es cada fila. «Esta semana» son hasta 500 filas
                // con la hora sola: «08:12» no dice si fue hoy o el martes, y
                // sin eso la lista no se puede leer ni discutir con nadie
                // (REVISION-2026-09-10.md, E12). Se pone UN rótulo por día, no
                // una columna más en cada fila: los turnos ya vienen ordenados
                // del más nuevo al más viejo, así que el día cambia de a
                // bloques. En «Hoy» no se muestra —sobra— y en los otros
                // rangos sí, incluso si todo cayó el mismo día.
                const claveDia = (ts) => {
                  const d = new Date(ts);
                  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
                };
                const DIAS = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];
                const rotuloDia = (ts) => {
                  const d = new Date(ts);
                  const hoy0 = inicioDeHoy();
                  const delDia = new Date(ts); delDia.setHours(0, 0, 0, 0);
                  const dif = Math.round((hoy0 - delDia.getTime()) / 86400e3);
                  const fecha = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
                  if (dif === 0) return `HOY · ${fecha}`;
                  if (dif === 1) return `AYER · ${fecha}`;
                  return `${DIAS[d.getDay()]} ${fecha}`;
                };
                const conDia = rangoTurnos !== 'hoy';
                const fila = (t) => (
                      <FilaTabla key={t.id} cols={cols}>
                        <span style={{ fontFamily: black, fontSize: 14 }}>{t.vehicleId}</span>
                        <span style={{
                          fontSize: 13, color: HUD.fg2, minWidth: 0,
                          overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                        }}>
                          {t.alias || t.name || t.personId}
                          {t.role === 'collector' && <span style={{ color: HUD.dim3 }}> · cobrador</span>}
                        </span>
                        <span style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color: HUD.dim2 }}>
                          {hhmm(t.startedAt)}
                        </span>
                        <span style={{
                          fontFamily: mono, fontSize: 12, fontWeight: 700,
                          color: t.abierto ? HUD.green : HUD.dim2,
                        }}>
                          {t.abierto ? 'en ruta' : hhmm(t.endedAt)}
                          {/* El turno que cruza la medianoche cierra en el día
                              SIGUIENTE al del rótulo. Sin esta marca, «22:40 →
                              01:15» se lee como un turno de veintitrés horas. */}
                          {!t.abierto && t.endedAt && claveDia(t.endedAt) !== claveDia(t.startedAt) &&
                            <span style={{ color: HUD.dim3 }}> +1</span>}
                        </span>
                        <span style={{ fontFamily: black, fontSize: 14, textAlign: 'right' }}>
                          {t.anulado ? <span style={{ color: HUD.dim2 }}>anulado</span> : horas(t.duracionSec)}
                          {/* Corregido a mano: se dice en la fila, con quién y por
                              qué en el título. Nadie lee las horas de un turno
                              corregido como si las hubiera medido el sistema. */}
                          {t.correccion && (
                            <div title={`${t.correccion.tipo === 'agregar' ? 'Agregado' : t.correccion.tipo === 'anular' ? 'Anulado' : 'Corregido'} por ${t.correccion.quien}: ${t.correccion.motivo}`}
                              data-corregido={t.id}
                              style={{ fontFamily: mono, fontSize: 9, fontWeight: 700, letterSpacing: .6, color: HUD.amber, marginTop: 2 }}>
                              {t.correccion.tipo === 'agregar' ? 'AGREGADO A MANO' : t.correccion.tipo === 'anular' ? 'ANULADO A MANO' : 'CORREGIDO A MANO'}
                            </div>
                          )}
                        </span>
                        <span style={{ textAlign: 'right' }}>
                          <button data-corregir-turno={t.id} onClick={() => corrigiendo === t.id ? setCorrigiendo(null) : abrirCorreccion(t)}
                            style={btnChico(HUD.fg2)}>{corrigiendo === t.id ? 'Cerrar' : 'Corregir'}</button>
                        </span>
                      </FilaTabla>
                );
                // El formulario abre debajo de su fila. Corregir NO es editar a
                // escondidas: el motivo es obligatorio, y queda el antes y el
                // después con quién lo hizo.
                const editor = (t) => {
                  const nuevo = t === 'nuevo';
                  const personas = (users || []).filter(u => u.role === 'driver' || u.role === 'collector');
                  const quien = !nuevo && (t.alias || t.name || t.personId);
                  return (
                    <div key={'corr-' + (nuevo ? 'nuevo' : t.id)} data-editor-turno={nuevo ? 'nuevo' : t.id} style={{
                      ...tarjeta('14px 16px'), margin: '8px 0 12px', background: HUD.bg,
                      display: 'grid', gap: 10,
                    }}>
                      <div style={{ fontSize: 13, fontWeight: 700 }}>
                        {nuevo ? 'Agregar un turno que no se registró' : `Corregir el turno de ${quien} en ${t.vehicleId}`}
                      </div>
                      {nuevo && (
                        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                          <label style={{ fontSize: 12, color: HUD.fg2, display: 'grid', gap: 4 }}>Persona
                            <select data-turno-persona value={corrForm.personId}
                              onChange={e => setCorrForm(f => ({ ...f, personId: e.target.value }))}
                              style={{ ...campo(36), minWidth: 200 }}>
                              <option value="">Elegí…</option>
                              {personas.map(u => <option key={u.unitId} value={u.unitId}>{u.alias || u.name || u.unitId} ({u.unitId})</option>)}
                            </select>
                          </label>
                          <label style={{ fontSize: 12, color: HUD.fg2, display: 'grid', gap: 4 }}>Combi
                            <select data-turno-combi value={corrForm.vehicleId}
                              onChange={e => setCorrForm(f => ({ ...f, vehicleId: e.target.value }))}
                              style={{ ...campo(36), minWidth: 120 }}>
                              <option value="">La de hoy</option>
                              {(vehicles || []).map(v => <option key={v.vehicleId} value={v.vehicleId}>{v.vehicleId}</option>)}
                            </select>
                          </label>
                        </div>
                      )}
                      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                        <label style={{ fontSize: 12, color: HUD.fg2, display: 'grid', gap: 4 }}>Entrada
                          <input type="datetime-local" data-turno-inicio value={corrForm.inicio}
                            onChange={e => setCorrForm(f => ({ ...f, inicio: e.target.value }))} style={campo(36)} />
                        </label>
                        <label style={{ fontSize: 12, color: HUD.fg2, display: 'grid', gap: 4 }}>Salida
                          <input type="datetime-local" data-turno-fin value={corrForm.fin}
                            onChange={e => setCorrForm(f => ({ ...f, fin: e.target.value }))} style={campo(36)} />
                        </label>
                        <label style={{ fontSize: 12, color: HUD.fg2, display: 'grid', gap: 4, flex: '1 1 260px' }}>Motivo (obligatorio, queda registrado)
                          <input data-turno-motivo value={corrForm.motivo} maxLength={200}
                            placeholder="Ej.: se olvidó de salir de ruta; volvió a las 18:10"
                            onChange={e => setCorrForm(f => ({ ...f, motivo: e.target.value }))} style={campo(36)} />
                        </label>
                      </div>
                      {confirmarAnular && !nuevo ? (
                        <div role="alert" style={{
                          background: HUD.ambarFondo, border: `1px solid ${HUD.ambarBorde}`, borderRadius: 10,
                          padding: '10px 12px', fontSize: 13, color: HUD.ambarTinta, lineHeight: 1.5,
                        }}>
                          ¿Anular el turno de <b>{quien}</b> en <b>{t.vehicleId}</b> del {new Date(t.startedAt).toLocaleDateString('es-PE', { day: '2-digit', month: '2-digit' })}, {hhmm(t.startedAt)}–{t.abierto ? 'ahora' : hhmm(t.endedAt)}?
                          {' '}Sus horas quedan en cero. El turno no se borra: queda anulado, con el motivo.
                          <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
                            <button data-turno-anular-si disabled={busy} onClick={() => guardarCorreccion(t, true)} style={btnPrimario(34)}>Sí, anular</button>
                            <button onClick={() => setConfirmarAnular(false)} style={btnSecundario(34)}>No</button>
                          </div>
                        </div>
                      ) : (
                        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                          <button data-turno-guardar disabled={busy} onClick={() => guardarCorreccion(t)} style={btnPrimario(34)}>
                            {nuevo ? 'Agregar turno' : 'Guardar corrección'}
                          </button>
                          {!nuevo && !t.anulado && (
                            <button data-turno-anular onClick={() => setConfirmarAnular(true)} style={btnSecundario(34)}>Anular este turno…</button>
                          )}
                          <button onClick={() => setCorrigiendo(null)} style={btnSecundario(34)}>Cancelar</button>
                        </div>
                      )}
                      {!nuevo && historialTurno && historialTurno.length > 0 && (
                        <div data-historial-turno style={{ fontSize: 12, color: HUD.dim2, lineHeight: 1.6 }}>
                          <div style={rotulo(9)}>Correcciones anteriores</div>
                          {historialTurno.map((c, i) => (
                            <div key={i}>
                              {hhmm(c.en)} · <b style={{ color: HUD.fg2 }}>{c.quienNombre}</b>:{' '}
                              {c.tipo === 'anular' ? 'lo anuló' : c.tipo === 'agregar' ? `lo agregó (${hhmm(c.despuesInicio)}–${hhmm(c.despuesFin)})`
                                : `${hhmm(c.antesInicio)}–${hhmm(c.antesFin)} → ${hhmm(c.despuesInicio)}–${hhmm(c.despuesFin)}`}
                              {' '}· «{c.motivo}»
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                };
                let diaImpreso = null;
                const filas = [];
                for (const t of turnos) {
                  const k = claveDia(t.startedAt);
                  if (conDia && k !== diaImpreso) {
                    diaImpreso = k;
                    filas.push(
                      <div key={'dia-' + k} style={{
                        ...rotulo(9, HUD.dim2),
                        padding: '8px 14px', background: HUD.hueco,
                        borderBottom: `1px solid ${HUD.divider}`,
                      }}>{rotuloDia(t.startedAt)}</div>
                    );
                  }
                  filas.push(fila(t));
                  if (corrigiendo === t.id) filas.push(editor(t));
                }
                return (
                  <div>
                    {corrigiendo === 'nuevo' && editor('nuevo')}
                    {vacio ? (
                      <Vacio>
                        {rangoTurnos === 'hoy'
                          ? 'Todavía nadie salió a ruta hoy. El turno se abre solo cuando alguien entra a su unidad.'
                          : 'No hay turnos en ese rango.'}
                      </Vacio>
                    ) : (
                      <Tabla cols={cols} ancho={800}
                        cabeceras={['Unidad', 'Tripulación', 'Entrada', 'Salida', 'En ruta', '']}>
                        {filas}
                      </Tabla>
                    )}
                  </div>
                );
              })()}
              <Pie>
                El turno se abre solo cuando alguien entra a su unidad y se cierra
                cuando se va. Un corte de señal <strong>no</strong> parte el turno: si
                vuelve dentro de los 15 minutos, se retoma el mismo. Si el servidor se
                reinicia, los turnos que quedaron abiertos se cierran con la última
                señal que se les vio.
                {' '}Cuando eso no refleja lo que pasó, <strong>Corregir</strong> cambia la
                entrada o la salida, o anula el turno, y <strong>Agregar un turno que faltó</strong>
                {' '}suma uno que no se registró. Siempre con motivo, hasta 31 días atrás:
                queda quién lo hizo, el antes y el después, y el informe de horas lo dice.
              </Pie>
            </div>)}

            {/* ─── VUELTAS ──────────────────────────────────────── */}
            {tab === 'metrics' && (<div>
              {!vueltas && <Vacio>Cargando…</Vacio>}
              {vueltas && (() => {
                const R = vueltas.resumen;
                const obj = vueltas.objetivoSec;
                const kpis = [
                  ['Vueltas cerradas hoy', R.cerradas,
                    `${R.unidades} unidad${R.unidades === 1 ? '' : 'es'}${vueltas.routeId ? ' · ' + vueltas.routeId : ''}`],
                  ['Vuelta promedio', fmtSeg(R.duracionProm),
                    R.duracionPromAyer ? `ayer ${fmtSeg(R.duracionPromAyer)}` : 'sin dato de ayer'],
                  ['Brecha promedio', fmtSeg(R.brechaProm),
                    obj ? `objetivo ${fmtSeg(obj)}` : 'mirando todas las rutas'],
                  ['Vueltas en pelotón', R.enPeloton === null ? '—' : R.enPeloton,
                    R.umbralPelotonSec ? `brecha bajo ${fmtSeg(R.umbralPelotonSec)}` : 'hace falta elegir una ruta'],
                  // Medias vueltas. Van al lado de las enteras porque el dato
                  // que importa es la DIFERENCIA: idas muy por encima de
                  // retornos es gente que salió y no volvió, y ese número no
                  // existía en ninguna pantalla.
                  ['Idas completadas', R.idas,
                    R.idaDurProm ? `${fmtSeg(R.idaDurProm)} promedio` : 'sin dato'],
                  ['Retornos completados', R.retornos,
                    R.idas > R.retornos ? `${R.idas - R.retornos} ida${R.idas - R.retornos === 1 ? '' : 's'} sin retorno`
                      : (R.retornoDurProm ? `${fmtSeg(R.retornoDurProm)} promedio` : 'sin dato')],
                ];
                const cols = '110px 130px 130px 1fr 120px';
                return (
                  <div>
                    <div style={{
                      display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))',
                      gap: 12, marginBottom: 18,
                    }}>
                      {kpis.map(([et, val, nota]) => (
                        <div key={et} style={{ ...tarjeta(14), background: HUD.bg }}>
                          <div style={rotulo(9)}>{et}</div>
                          <div style={{ fontFamily: black, fontSize: 26, margin: '6px 0 4px' }}>{val}</div>
                          <div style={{ fontSize: 11, color: HUD.dim2 }}>{nota}</div>
                        </div>
                      ))}
                    </div>

                    {R.sinBrecha > 0 && (
                      <div style={{
                        background: HUD.ambarFondo, border: `1px solid ${HUD.ambarBorde}`,
                        borderLeft: `3px solid ${HUD.amber}`, borderRadius: 11,
                        padding: '11px 13px', marginBottom: 16,
                        fontSize: 13, lineHeight: 1.55, color: HUD.ambarTinta,
                      }}>
                        {R.sinBrecha} de {R.cerradas} vueltas no tienen brecha guardada
                        —{' '}son de antes de que existiera el dato, o se dieron con una
                        sola unidad en ruta. No entran en el promedio: no cuentan como cero.
                      </div>
                    )}

                    {/* Las vueltas de unidades que entraron a la ruta empezada.
                        Se dicen en vez de esconderse: duran una fracción, no
                        entran en ningún promedio de arriba, y aparecen en la
                        lista marcadas para que nadie las lea como vueltas. */}
                    {R.parciales > 0 && (
                      <div style={{
                        background: HUD.ambarFondo, border: `1px solid ${HUD.ambarBorde}`,
                        borderLeft: `3px solid ${HUD.amber}`, borderRadius: 11,
                        padding: '11px 13px', marginBottom: 16,
                        fontSize: 13, lineHeight: 1.55, color: HUD.ambarTinta,
                      }}>
                        {R.parciales} {R.parciales === 1 ? 'vuelta no se midió entera' : 'vueltas no se midieron enteras'}:
                        la medición arrancó con la ruta ya avanzada. Puede ser que la unidad
                        se haya metido en el medio en vez de salir del paradero inicial, o que
                        haya estado sin señal más de tres minutos y la vuelta se partiera.
                        Están abajo marcadas como <strong>PARCIAL</strong> y no entran en
                        ninguno de los promedios de arriba — duran una fracción de una vuelta
                        y la bajarían sin que se note. Las que el sistema sí puede atribuir a
                        una entrada por el medio llevan <strong>↳ ENTRÓ</strong> en la unidad,
                        en vivo, y quedan en Actividad.
                      </div>
                    )}

                    {vueltas.vueltas.length === 0 && (
                      <Vacio>
                        Todavía no se cerró ninguna vuelta hoy. Se registran solas cuando
                        una unidad recorre la ruta de punta a punta.
                      </Vacio>
                    )}
                    {vueltas.vueltas.length > 0 && (
                      <Tabla cols={cols} ancho={760}
                        cabeceras={['Unidad', 'Salió', 'Volvió', 'Brecha promedio', 'Vuelta']}>
                        {vueltas.vueltas.map(l => {
                          // La barra se lee contra el objetivo: llena = en el
                          // objetivo, corta = pegada al de adelante. Contra el
                          // de ESA vuelta si lo tiene guardado: con objetivo
                          // automático el número se mueve dentro del mismo día,
                          // y esta lista abarca las últimas 24 horas.
                          const vara = l.objetivoSec || obj;
                          const color = l.brechaProm === null ? HUD.dim3
                            : gapColor(fmtSeg(l.brechaProm), vara ? vara / 60 : TARGET_GAP_DEFAULT);
                          const parte = l.brechaProm === null || !vara ? 0
                            : Math.max(0.04, Math.min(1, l.brechaProm / vara));
                          return (
                            <FilaTabla key={l.id} cols={cols}>
                              <span style={{ fontFamily: black, fontSize: 14 }}>{l.unitId}</span>
                              <span style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color: HUD.dim2 }}>
                                {hhmm(l.startedAt)}
                              </span>
                              <span style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color: HUD.dim2 }}>
                                {hhmm(l.finishedAt)}
                              </span>
                              <span style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0 }}>
                                <span style={{
                                  flex: 1, minWidth: 40, height: 6, borderRadius: 3,
                                  background: HUD.hueco, overflow: 'hidden',
                                }}>
                                  <span style={{
                                    display: 'block', height: '100%', width: `${parte * 100}%`,
                                    background: color, borderRadius: 3,

                                </span>
                                <span style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color, flexShrink: 0 }}>
                                  {l.brechaProm === null ? '—' : fmtSeg(l.brechaProm)}
                                </span>
                              </span>
                              <span style={{ fontFamily: black, fontSize: 14, textAlign: 'right' }}>
                                {fmtSeg(l.durationSec)}

                                    style={{
                                      display: 'block', fontFamily: mono, fontSize: 9,
                                      fontWeight: 700, color: HUD.amber, marginTop: 2,
                                    }}>PARCIAL · {Math.round((l.progresoInicial || 0) * 100)}%</span>
                                )}
                              </span>
                            </FilaTabla>
                          );
                        })}
                      </Tabla>
                    )}
                  </div>
                );
              })()}

              {/* El cuadro por unidad sigue estando: es lo que se mira para
                  comparar entre combis, no vuelta por vuelta. Lo que cambió es
                  que ahora muestra UN PERÍODO y no todo el historial, y el
                  rótulo lo dice — decía "Acumulado" y eso ya no sería cierto.
                  Un despachador que lee "acumulado" y está viendo 7 días tiene
                  un número mal, y con estos números se toman decisiones sobre
                  personas. */}
              {metrics && (() => {
                const cols = '110px 70px 70px 90px 90px 1fr 100px 100px';
                const PERIODOS = [[7, '7 días'], [30, '30 días'], [90, '90 días'], [null, 'Todo']];
                // Del período que contestó el servidor; si todavía no
                // contestó, del pedido, que es lo único que se sabe.
                const p = periodoMetrics;
                const nombrePeriodo = (p ? p.todo : diasMetrics === null)
                  ? 'todo el historial retenido'
                  : `últimos ${p ? p.dias : diasMetrics} días`;
                return (
                  <div style={{ marginTop: 26 }}>
                    <div style={{ display: 'flex', gap: 8, alignItems: 'baseline', flexWrap: 'wrap', marginBottom: 10 }}>
                      <div style={rotulo(9)}>Por unidad · {nombrePeriodo}</div>
                      <div style={{ flex: 1 }} />
                      {PERIODOS.map(([d, etiqueta]) => (
                        <button key={etiqueta} disabled={busy}
                          title={d === null
                            ? 'Todo lo que la base retiene. Es la consulta más cara del panel: mientras se arma, las combis no reportan posición.'

                          onClick={() => { setDiasMetrics(d); setMetrics(null); loadMetrics(d); }}
                          style={{
                            ...btnSecundario(30),

              <Pie>
                La <strong>brecha promedio</strong> es la separación que la unidad

                existir el día que se enciende: las vueltas viejas quedan sin el dato
                y no se puede reconstruir. La base retiene 120 días de vueltas.
                Una <strong>vuelta</strong> es el circuito entero (ida y retorno);
                las columnas <strong>Idas</strong> y <strong>Retornos</strong> cuentan

                {' '}El cuadro por unidad muestra <strong>el período elegido arriba</strong>,

            </div>)}

            {/* ─── DÓNDE SE TRABA ───────────────────────────────
                Los tres endpoints que el servidor servía y ninguna pantalla
                pedía: `/admin/paradas`, `/admin/huecos` y `/admin/anomalias`
                (REVISION-2026-09-10.md, E9). Existían, estaban probados,

                Lo que contesta esta pantalla es una pregunta DE LA RUTA, no
                de un chofer: dónde y a qué hora se detienen las combis, y en
                qué tramo se corta siempre la señal. Por eso lo primero que se
                ve son los AGRUPADOS —el punto del circuito y la hora del
                día—, y las listas crudas van después: una parada suelta no
                dice nada, veinte en el mismo punto son una obra, un semáforo
                o un paradero mal puesto.

                Agrupar por punto del circuito y no por coordenada es a
                propósito: dos combis nunca frenan en el mismo metro, y un

            {tab === 'trabas' && (<div>

                // fila (repaso del 21/9). Se agrupa con la ruta en la clave y,
                // si hay más de una en juego, se dice cuál es cada fila.
                const rutasEnJuego = Array.from(new Set(
                  [...trabas.paradas, ...trabas.huecos].map(x => x.routeId).filter(Boolean)));

                // Sin trazado cargado el progreso que llega es el que estimó
                // el cliente —o 0 si no estimó nada—, y agrupar por él es
                // inventar un lugar: esa ruta va entera a su propia franja.
                const sinTrazado = (id) => { const r = rutaDe(id); return !!r && !r.puntos; };
                // El punto del circuito, en franjas de 5 %. El progreso viene
                // 0..1; sin progreso no hay punto que agrupar.
                const franja = (p, routeId) => {
                  if (sinTrazado(routeId)) return null;
                  if (p == null || !Number.isFinite(p)) return null;
                  const i = Math.min(19, Math.max(0, Math.floor(p * 20)));
                  return i;

                const nombreFranja = (i) => i == null ? 'Sin recorrido cargado'

                // Cuánto mide una franja en cada ruta: el 5 % es una fracción,
                // y «acá» son metros. En una ruta de 12 km son 600 m; en una
                // de 40, dos kilómetros — y eso el que lee tiene que saberlo.
                const metrosFranja = (id) => { const r = rutaDe(id); return r && r.largoM ? Math.round(r.largoM / 20) : null; };
                const fmtM = (m) => m >= 1000 ? `${(m / 1000).toFixed(1).replace('.', ',')} km` : `${m} m`;
                const tamanoFranjas = rutasEnJuego
                  .map(id => ({ id, m: metrosFranja(id) })).filter(x => x.m);

                const recortado = [trabas.paradas, trabas.huecos, trabas.anomalias].some(l => l.length >= 500);
                const min = (sec) => `${Math.max(1, Math.round((sec || 0) / 60))}′`;
                const agrupar = (filas, clave) => {
                  const m = new Map();
                  for (const f of filas) {
                    const k = clave(f);
                    if (!m.has(k)) m.set(k, []);
                    m.get(k).push(f);
                  }
                  return m;
                };

                // ── Dónde: paradas MEDIDAS por franja y tramo
                const medidas = trabas.paradas.filter(p => p.medida);
                const porPunto = Array.from(
                  agrupar(medidas, p => `${p.routeId || '—'}|${p.tramo || '—'}|${franja(p.progreso, p.routeId)}`).entries()
                ).map(([k, ls]) => {
                  const [ruta, tramo, f] = k.split('|');
                  return {
                    k, ruta, tramo,
                    franja: f === 'null' ? null : Number(f),
                    veces: ls.length,
                    segundos: ls.reduce((a, x) => a + (x.durationSec || 0), 0),
                    unidades: new Set(ls.map(x => x.vehicleId)).size,
                    avisadas: ls.filter(x => x.confirmado).length,
                    ejemplo: ls[0],

                }).sort((a, b) => b.segundos - a.segundos || b.veces - a.veces);

                // ── A qué hora: la hora del día en que empezó cada parada
                const porHora = Array.from(agrupar(medidas, p => new Date(p.startedAt).getHours()).entries())
                  .map(([h, ls]) => ({
                    hora: Number(h), veces: ls.length,
                    segundos: ls.reduce((a, x) => a + (x.durationSec || 0), 0),
                  }))
                  .sort((a, b) => a.hora - b.hora);
                const picoHora = porHora.reduce((a, x) => Math.max(a, x.segundos), 0);

                // ── Dónde se corta la señal: los huecos por franja
                const porCorte = Array.from(
                  agrupar(trabas.huecos, h => `${h.routeId || '—'}|${franja(h.progresoDesde, h.routeId)}`).entries()
                ).map(([k, ls]) => ({
                  k,
                  ruta: k.split('|')[0],
                  franja: k.split('|')[1] === 'null' ? null : Number(k.split('|')[1]),
                  veces: ls.length,
                  segundos: ls.reduce((a, x) => a + (x.durationSec || 0), 0),
                  unidades: new Set(ls.map(x => x.vehicleId)).size,

                  // volver. Si no llegan, el teléfono estaba apagado o la app
                  // muerta — y eso no es un problema de la ruta.
                  sinDatos: ls.filter(x => !x.recuperadas).length,
                })).sort((a, b) => b.veces - a.veces || b.segundos - a.segundos);

                    <Vacio>

                              display: 'grid', gridTemplateColumns: (variasRutas ? '80px ' : '') + '90px 140px 1fr 1fr 1fr 1.4fr',
                              gap: 12, alignItems: 'center', padding: '11px 14px',
                              borderBottom: `1px solid ${HUD.hueco}`, fontSize: 13,
                            }}>
                              {variasRutas && <div style={{ fontFamily: mono, fontWeight: 800 }}>{g.ruta}</div>}
                              <div style={{ ...rotulo(9, HUD.dim2) }}>{g.tramo === '—' ? '—' : g.tramo}</div>
                              <div style={{ fontFamily: mono, fontWeight: 800 }}>{nombreFranja(g.franja)}</div>
                              <div style={{ fontFamily: mono }}>{g.veces}</div>
                              <div style={{ fontFamily: mono, fontWeight: 800 }}>{min(g.segundos)}</div>
                              {/* Una combi veinte veces es una combi; ocho
                                  combis veinte veces es la ruta. */}
                              <div title={g.unidades === 1 ? 'Una sola combi: puede ser de ella, no de la ruta' : undefined}
                                style={{ fontFamily: mono, color: g.unidades > 1 ? HUD.fg : HUD.dim3 }}>{g.unidades}</div>
                              <div style={{ fontFamily: mono, color: g.avisadas ? HUD.fg2 : HUD.dim3 }}>
                                {g.avisadas} de {g.veces}
                              </div>
                            </div>
                          ))}
                        </Tabla>
                        <Pie>
                          El servidor abre una parada cuando la combi lleva más de tres minutos

                          {tamanoFranjas.length > 0 && (
                            <span>
                              {' '}Cada franja es el 5 % del circuito: {tamanoFranjas.map(x => `en ${x.id}, unos ${fmtM(x.m)}`).join('; ')}.
                            </span>

                      </div>

                    {/* ── A QUÉ HORA ── */}
                    {porHora.length > 0 && (

                    {medidas.length > 0 && (
                      <div style={{ marginTop: 22 }}>

                          Las más largas
                        </div>
                        <Tabla cols="150px 110px 80px 130px 90px 1.2fr" ancho={800}
                          cabeceras={['Cuándo', 'Unidad', 'Duró', 'Punto', 'Avisó', 'Cómo terminó']}>

                            <div key={'parada-' + p.id} style={{

                              </div>

                              <div style={{ ...rotulo(9, HUD.dim2) }}>{CIERRE_PARADA[p.cierre] || p.cierre || 'ABIERTA'}</div>

                    {trabas.anomalias.length > 0 && (
                      <div style={{ marginTop: 22 }}>
                        <div style={{ ...rotulo(10, HUD.dim2), margin: '0 0 8px 14px' }}>

                        </div>
                        <Tabla cols="150px 110px 170px 1.6fr" ancho={760}

                          {trabas.anomalias.slice(0, 60).map(a => (

                              <div style={{ fontFamily: mono, color: HUD.dim2 }}>{fmtWhen(a.cuando)}</div>

                              <div style={{ ...rotulo(9, HUD.dim2) }}>{ANOMALIA_ES[a.tipo] || a.tipo}</div>
                              <div style={{ color: HUD.fg2 }}>{a.detalle || '—'}</div>
                            </div>

                          poder preguntarlo.
                          {QUE_ES_ANOMALIA.filter(([t]) => trabas.anomalias.some(a => a.tipo === t)).map(([t, que]) => (
                            <span key={t} style={{ display: 'block', marginTop: 4 }}>
                              <strong>{ANOMALIA_ES[t]}</strong>: {que}
                            </span>
                          ))}
                        </Pie>
                      </div>

                    <Pie>
                      Todo esto es de la <strong>ruta</strong>, no de un chofer: para lo de cada combi
                      está «Señal y presencia» en Números. Las paradas y los cortes se guardan
                      {' '}<strong>30 días</strong>; para llevárselo a una planilla, el CSV de paradas está en
                      Informes.
                    </Pie>
                  </div>
                );
              })()}
            </div>)}

            {/* ─── INFORMES ─────────────────────────────────────── */}
            {tab === 'informes' && (() => {
              const informes = [
                ['vueltas', 'Vueltas y brechas (CSV)', true],
                ['tramos', 'Medias vueltas: idas y retornos (CSV)', false],
                ['horas', 'Turnos por persona (CSV)', false],
                ['desvios', 'Salidas del recorrido (CSV)', false],

                ['mensajes', 'Chat, notas de voz y fotos (CSV)', false],
                ['actividad', 'Actividad de administración (CSV)', false],

              const aMs = (iso, fin) => {
                const d = new Date(iso + (fin ? 'T23:59:59' : 'T00:00:00'));
                return isNaN(d.getTime()) ? null : d.getTime();
              };
              const desde = aMs(rangoInf.desde, false);
              const hasta = aMs(rangoInf.hasta, true);
              const dias = desde && hasta ? Math.max(1, Math.round((hasta - desde) / 86400e3)) : null;
              const bajar = (tipo) => {
                if (!desde || !hasta || hasta < desde) {
                  setError('Revisá las fechas: la de fin tiene que ser posterior a la de inicio');
                  return;
                }
                // El navegador no manda el token en una descarga normal, así que
                // se pide con fetch y se guarda el archivo desde acá.
                const ruta = esSupervisor && currentRoute ? `&routeId=${encodeURIComponent(currentRoute)}` : '';
                fetch(`${HTTP_URL}/admin/informe/${tipo}.csv?desde=${desde}&hasta=${hasta}${ruta}`, {

                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${(session.companyId || 'informe').toLowerCase()}-${tipo}-${rangoInf.desde}.csv`;
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 5000);

                  <div style={{
                    display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))',

                        <input type="date" value={rangoInf.hasta}
                          onChange={e => setRangoInf(r => ({ ...r, hasta: e.target.value }))}
                          style={{ ...campo(40), fontFamily: mono, fontSize: 13, flex: '1 1 130px' }} />
                      </div>
                      <div style={{ fontSize: 12, color: HUD.dim2, marginTop: 12 }}>
                        {dias ? `${dias} día${dias === 1 ? '' : 's'}` : 'fechas incompletas'}
                        {' · '}{(vehicles || []).filter(v => !(esSupervisor && currentRoute) || v.routeId === currentRoute).length} unidades
                        {' · '}{esSupervisor && currentRoute ? currentRoute : `${routeList.length} ruta${routeList.length === 1 ? '' : 's'}`}
                      </div>
                      {/* El servidor recorta el rango a 90 días y lo dice en
                          la primera línea del archivo — pero recién cuando ya
                          se bajó. La pantalla no decía nada: se elegían seis
                          meses, se bajaba un CSV de tres, y el que lo abría
                          tenía que leer la cabecera para enterarse
                          (REVISION-2026-09-10.md, E19). */}
                      {dias > 90 && (
                        <div style={{ fontSize: 12, color: HUD.amber, marginTop: 8, fontWeight: 700 }}>
                          El período máximo son 90 días: el informe va a salir con
                          los últimos 90 del rango que elegiste, no con los {dias}.
                        </div>

                    </div>

                    <div style={tarjeta(18)}>
                      <div style={{ ...rotulo(9), marginBottom: 12 }}>Descargar</div>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'flex-start' }}>
                        {informes.map(([tipo, etiqueta, principal]) => (
                          <button key={tipo} onClick={() => bajar(tipo)}
                            style={{
                              ...(principal ? btnPrimario(40) : btnSecundario(40)),
                              // que un rótulo largo baje de renglón y no se salga
                              height: 'auto', minHeight: 40, padding: '9px 14px',
                              whiteSpace: 'normal', textAlign: 'left', maxWidth: '100%',
                            }}>{etiqueta}</button>
                        ))}
                      </div>
                    </div>
                  </div>
                  <Pie>
                    Los informes bajan en <strong>CSV</strong>: se abren en Excel y se
                    pueden sumar y filtrar. Cada uno arranca diciendo el período y
                    <strong> con qué se midió</strong> — si la ruta no tiene recorrido
                    cargado, las vueltas son estimaciones y el archivo lo aclara, para
                    que nadie tome por exacto un número que no lo es. El período máximo
                    son 90 días.
                  </Pie>
                </div>

            })()}

            {/* ─── EMPRESA ──────────────────────────────────────── */}

                    [empresa.resumen.personas, empresa.resumen.personas === 1 ? 'persona' : 'personas', 'personas'],
                    [empresa.resumen.despacho, empresa.resumen.despacho === 1 ? 'cuenta de despacho' : 'cuentas de despacho', 'gestion'],

                    <div>
                      <div style={{ ...rotulo(9), marginBottom: 6 }}>Nombre</div>
                      <input value={empForm.name} placeholder="Cooperativa de Transportes…"

                    </div>

                      </div>
                    </div>
                    {/* A dónde llama o manda un SMS el chofer cuando el SOS no

                    <div>
                      <div style={{ ...rotulo(9), marginBottom: 6 }}>Teléfono de la central para emergencias</div>

                        data-telefono-central

                      <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start', marginTop: 8, padding: '11px 13px',

                      <button disabled={busy} onClick={() => run(async () => {

                      <button onClick={() => setEmpForm({

                      })} style={btnSecundario(42)}>Descartar</button>
                    </div>
                  </div>

                  </div>

                </Pie>
              </div>)}
            </div>)}

            {/* ─── NÚMEROS (GERENCIA) ──────────────────────────────

            {tab === 'gerencia' && (<div>

                {/* Las opciones salen de la lista de rutas de la cooperativa y no

                {resumenGer && !resumenGer.alcance?.fijo && routeList.length > 1 && (

                    style={{ ...btnSecundario(38), padding: '0 10px', fontFamily: 'inherit' }}>

                {resumenGer && !(!resumenGer.alcance?.fijo && routeList.length > 1) && (
                  <span style={{ ...rotulo(10, HUD.dim2) }}>

                  </span>
                )}
                <div style={{ flex: 1 }} />
                {/* Los nombres son los del servidor (`INFORMES`), no los de la

                <Menu etiqueta="Descargar CSV" icono="descargar" data={{ 'data-descargas': '' }}
                  items={[['vueltas', 'vueltas'], ['tramos', 'medias'], ['horas', 'turnos'], ['desvios', 'salidas'], ['paradas', 'paradas'], ['senal', 'señal'], ['anomalias', 'anomalías'], ['sos', 'SOS'], ['mensajes', 'mensajes']].map(([tipo, rotulo]) => ({
                    label: `CSV ${rotulo}`, icono: 'informe', onClick: async () => {
                    try {
                      // El MISMO período que el cuadro de arriba: días de
                      // calendario, no las últimas N × 24 h (E19).
                      const hasta = Date.now(), desde = inicioDePeriodo(diasGer);
                      // Y la MISMA ruta: con una elegida en pantalla, el CSV

                      const conRuta = rutaGer ? `&routeId=${encodeURIComponent(rutaGer)}` : '';
                      const r = await fetch(`${HTTP_URL}/gerencia/informe/${tipo}.csv?desde=${desde}&hasta=${hasta}${conRuta}`,
                        { headers: { Authorization: 'Bearer ' + session.token } });
                      if (!r.ok) throw new Error('No se pudo descargar');
                      const url = URL.createObjectURL(await r.blob());
                      const a = document.createElement('a');
                      a.href = url;
                      a.download = `${(session.companyId || 'gerencia').toLowerCase()}-${rutaGer ? rutaGer.toLowerCase() + '-' : ''}${tipo}-${diasGer}d.csv`;
                      a.click();
                      // Diferido, como en Informes: revocar en el acto puede
                      // cancelar la descarga en algunos navegadores.
                      setTimeout(() => URL.revokeObjectURL(url), 5000);
                    } catch (e) { setError(e.message); }
                  } }))} />
              </div>

                {(() => {

                    ['Horas trabajadas', `${(resumenGer.totales.horasSec / 3600).toFixed(1)} h`],
                    // Las que trabajaron en el período, sobre la flota entera (E5)

                    ['Cortes de señal', resumenGer.totales.cortes ?? 0],

                {resumenGer.porUnidad.length === 0 && (

                {resumenGer.porUnidad.length > 0 && (

                {resumenGer.porUnidad.some(u => u.senal && (u.senal.cortes || u.senal.ausencias || u.senal.saltos ||

                        const gps = [s.gpsSimulado && `${s.gpsSimulado} falso`, s.gpsSospechoso && `${s.gpsSospechoso} sosp.`,

                            <div title={s.ausenteEnMarcha ? `${s.ausenteEnMarcha} vez/veces ausente y en marcha sobre el trazado` : undefined}

                              {s.reloj || s.descartadas ? `${s.reloj}${s.descartadas ? ` · ${s.descartadas} desc.` : ''}` : '—'}</div>

                              style={{ fontFamily: mono, fontWeight: (s.gpsSimulado || s.gpsSospechoso) ? 800 : 400, color: gps.length ? HUD.amber : HUD.dim3 }}>

                              style={{ fontFamily: mono, color: s.paradas ? HUD.fg : HUD.dim3 }}>
                              {s.paradas ? `${s.paradas} · ${Math.round((s.paradasSec || 0) / 60)}′` : '—'}</div>

                            <div title="Veces que entró a la ruta con el circuito ya avanzado, en vez de desde el inicio"

                      {' '}<strong>Paradas</strong> son las que MIDIÓ el servidor —más de tres minutos
                      detenido sobre el recorrido—, las haya avisado el chofer o no: veces y minutos

                  {' '}{Math.round((resumenGer.toleranciaCumple || 0.15) * 100)} % del objetivo de SU ruta —

                  juzga contra el objetivo que regía cuando se cerró, no contra
                  el de hoy.

// NUNCA un hueco. Un cuadro vacío donde va la marca se lee como que el panel
// está roto; dos letras se leen como "todavía no subieron el logo", que es la
// verdad, y funciona desde el primer día sin que nadie haga nada.
function Marca({ marca, tam = 30 }) {
  const caja = {
    width: tam, height: tam, borderRadius: 7, flexShrink: 0,
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    overflow: 'hidden',
  };
  if (marca?.logo) {
    return <img src={marca.logo} alt={marca.nombre || ''} title={marca.nombre || ''}
      style={{ ...caja, objectFit: 'contain', background: '#fff' }} />;
  }
  return (
    <div style={{ ...caja, background: marca?.color || HUD.bright }} title={marca?.nombre || ''}>
      <span style={{ fontFamily: black, fontSize: Math.round(tam * 0.42), color: '#fff', letterSpacing: 0.5 }}>
        {marca?.iniciales || '·'}
      </span>
    </div>
  );
}

// Subir el logo. Se achica ACÁ, en el navegador, antes de mandarlo.
//
// Nadie tiene a mano un PNG de 256 px: lo que sube una persona es el archivo
// que le pasó el diseñador, de 2000 px y 3 MB. Rechazarlo y pedirle que lo
// achique es empujarle un problema que la máquina resuelve en un segundo —y
// que además hay que resolver igual, porque este logo va a viajar al celular
// de cada chofer.
const LADO_LOGO = 256;

function achicarLogo(archivo) {
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onerror = () => reject(new Error('No se pudo leer el archivo'));
    lector.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Ese archivo no es una imagen'));
      img.onload = () => {
        const escala = Math.min(1, LADO_LOGO / Math.max(img.width, img.height));
        const lienzo = document.createElement('canvas');
        lienzo.width = Math.max(1, Math.round(img.width * escala));
        lienzo.height = Math.max(1, Math.round(img.height * escala));
        // PNG y no JPEG: un logo suele tener fondo transparente, y el JPEG lo
        // rellena de negro. Es la diferencia entre un escudo y un cuadrado.
        lienzo.getContext('2d').drawImage(img, 0, 0, lienzo.width, lienzo.height);
        resolve(lienzo.toDataURL('image/png'));
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}

function SubirLogo({ marca, token, onListo, onOk, onError }) {
  const entrada = React.useRef(null);
  const [ocupado, setOcupado] = React.useState(false);

  const mandar = async (logo) => {
    setOcupado(true); onError?.(null); onOk?.(null);
    try {
      const r = await fetch(`${HTTP_URL}/admin/company/logo`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ logo }),
      });
      const cuerpo = await r.json().catch(() => ({}));
      if (!r.ok) { onError?.(cuerpo.error || 'No se pudo guardar el logo'); return; }
      onOk?.(logo ? 'Logo actualizado' : 'Logo quitado');
      onListo?.();
    } catch {
      onError?.('No se pudo guardar el logo');
    } finally {
      setOcupado(false);
      if (entrada.current) entrada.current.value = '';
    }
  };

  return (
    <div>
      <div style={{ ...rotulo(9), marginBottom: 6 }}>Logo de la cooperativa</div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
        <Marca marca={marca} tam={64} />
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <button disabled={ocupado} style={btnSecundario(40)}
            onClick={() => entrada.current?.click()}>
            {ocupado ? 'Subiendo…' : marca?.logo ? 'Cambiar' : 'Subir logo'}
          </button>
          {marca?.logo && (
            <button disabled={ocupado} style={btnSecundario(40)} onClick={() => mandar(null)}>
              Quitar
            </button>
          )}
        </div>
      </div>
      <div style={{ fontSize: 12, color: HUD.dim2, marginTop: 8, lineHeight: 1.5 }}>
        PNG, JPG o WEBP. Se achica solo a {LADO_LOGO} px — no hace falta que lo prepares.
        Sin logo se muestran las iniciales, que es lo que ven hoy tus choferes.
      </div>
      <input ref={entrada} type="file" accept="image/png,image/jpeg,image/webp"
        style={{ display: 'none' }}
        onChange={async (e) => {
          const f = e.target.files?.[0];
          if (!f) return;
          try { await mandar(await achicarLogo(f)); }
          catch (err) { onError?.(err.message); setOcupado(false); }
        }} />
    </div>
  );
}

// La marca se pide aparte del login: así Despacho la cambia y las pantallas
// la ven sin que nadie tenga que volver a entrar, y cada login no arrastra
// ~100 kB de imagen.
function useMarca(token) {
  const [marca, setMarca] = React.useState(null);
  const traer = React.useCallback(() => {
    if (!token) return;
    fetch(`${HTTP_URL}/marca`, { headers: { Authorization: 'Bearer ' + token } })
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d?.marca) setMarca(d.marca); })
      .catch(() => {});
  }, [token]);
  React.useEffect(() => { traer(); }, [traer]);
  return [marca, traer];
}

function Panel({ session, onLogout, onAuthError, modo, onAlternarModo }) {
  const [marca, refrescarMarca] = useMarca(session.token);
  const [connected, setConnected] = React.useState(false);
  const [units, setUnits] = React.useState([]);
  // Los choferes que entraron y no salieron a ruta (opción A, 30/10): lo
  // manda el servidor sólo a Despacho, con la hora a la que entraron
  const [puerta, setPuerta] = React.useState([]);
  // La salud del teléfono de cada persona de la ruta (PENDIENTES 0.4):
  // personId → { bateria, cargando, optimizada, origen, version, versionEstado, en }
  const [telefonos, setTelefonos] = React.useState({});
  const [gaps, setGaps] = React.useState({});
  const [messages, setMessages] = React.useState([]);
  // Las emergencias SIN ATENDER, en el orden en que llegaron. Era una sola:
  // un segundo SOS a los pocos segundos pisaba al primero en el cartel, y
  // ATENDIDO sobre el segundo hacía desaparecer el primero de la pantalla
  // (barrido 22/9). El cartel muestra la más vieja y dice cuántas esperan.
  const [sosLista, setSosLista] = React.useState([]);
  const sos = sosLista[0] || null;
  const [sosError, setSosError] = React.useState(null);
  // ATENDIDO se arma recién un momento después de que el cartel muestra ESTE
  // SOS. Con dos en la lista, el segundo aparece en el mismo lugar apenas se
  // confirma el primero, y un doble clic lo cerraba sin que nadie lo leyera
  // —y al chofer le llegaba «Despacho vio tu SOS»— (auditoría 11/11).
  const claveSos = sos ? `${sos.sosId}:${sos.timestamp}` : null;
  const [sosArmado, setSosArmado] = React.useState(null);
  React.useEffect(() => {
    if (!claveSos) return;
    const t = setTimeout(() => setSosArmado(claveSos), 1200);
    return () => clearTimeout(t);
  }, [claveSos]);
  const sosListo = !!claveSos && sosArmado === claveSos;
  // Suena mientras haya alguno sin atender; calla al vaciarse la lista o al salir
  React.useEffect(() => {
    if (sosLista.length) alarmaSos.sonar(); else alarmaSos.callar();
  }, [sosLista.length]);
  React.useEffect(() => () => alarmaSos.callar(), []);
  // ¿Puede sonar? (el navegador la tiene muda hasta el primer gesto) y ¿hay
  // permiso de notificaciones? Si falta algo, la cabecera lo ofrece.
  const [, refrescarAlarma] = React.useState(0);
  React.useEffect(() => alarmaSos.suscribir(() => refrescarAlarma(n => n + 1)), []);
  const permisoNotif = ('Notification' in window) ? Notification.permission : 'denied';
  const faltaAlarma = (alarmaSos.soportada() && !alarmaSos.lista()) || permisoNotif === 'default';
  const activarAlarma = () => {
    alarmaSos.desbloquear();
    if ('Notification' in window && Notification.permission === 'default') {
      try { Notification.requestPermission().then(() => refrescarAlarma(n => n + 1)).catch(() => {}); } catch {}
    }
  };
  // El título de la pestaña parpadea: se ve desde otra pestaña
  React.useEffect(() => {
    if (!sosLista.length) return;
    const base = document.title;
    const primero = sosLista[0];
    const marca = `SOS · ${(primero.vehicleId || primero.unitId || '').toUpperCase()}` +
      (sosLista.length > 1 ? ` y ${sosLista.length - 1} más` : '');
    let prendido = true;
    document.title = marca;
    const t = setInterval(() => { prendido = !prendido; document.title = prendido ? marca : base; }, 1000);
    return () => { clearInterval(t); document.title = base; };
  }, [sosLista]);
  // ATENDIDO es de la base, no de esta pantalla: se cierra en todos los
  // paneles y queda quién y cuándo. Sin socket no se finge: se dice.
  const atenderSos = (s) => {
    const ws = wsRef.current;
    if (s.sosId == null) { setSosLista(l => l.filter(x => x !== s)); return; }
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      setSosError('Sin conexión: ATENDIDO no salió. Probá de nuevo.');
      return;
    }
    // Se saca de la lista recién cuando el servidor lo confirma (el
    // `sos_atendido` que les manda a todos los paneles, éste incluido). Con
    // la conexión medio muerta el envío no da error y no sale nada: antes se
    // daba por atendido igual, y no lo estaba (revisión integral del 04/11).
    ws.send(JSON.stringify({ type: 'sos_atender', sosId: s.sosId }));
    setSosError(null);
    setSosLista(l => l.map(x => x.sosId === s.sosId ? { ...x, atendiendo: Date.now() } : x));
    setTimeout(() => {
      setSosLista(l => {
        const sigue = l.find(x => x.sosId === s.sosId && x.atendiendo);
        if (!sigue) return l;
        setSosError('ATENDIDO no se confirmó: la conexión está fallando. Probá de nuevo.');
        return l.map(x => x.sosId === s.sosId ? { ...x, atendiendo: null } : x);
      });
    }, 8000);
  };
  // La combi en emergencia se reconoce por el VEHÍCULO: `unitId` del SOS es
  // la persona, y en el estado `unitId` es la combi. Con un cobrador o un
  // chofer cuyo usuario no es el código de la combi, nunca se pintaba.
  const enSos = (unitId) => sosLista.some(s => (s.vehicleId || s.unitId) === unitId);
  const [adminOpen, setAdminOpen] = React.useState(false);
  // Multi-ruta: la ruta que se está mirando y los datos que llegan de ella
  const [routes, setRoutes] = React.useState([]);
  const [trazado, setTrazado] = React.useState({ ida: [], vuelta: [] });
  // Conversación privada abierta (vehicleId) o null = el grupo de la ruta
  const [privadoCon, setPrivadoCon] = React.useState(null);
  // Privados sin leer por unidad, para el punto en la lista
  const [noLeidos, setNoLeidos] = React.useState({});
  // Cómo se llama cada persona con la que hay un privado PERSONAL ('p:pedro'
  // → 'Pedro'): lo dicen sus mensajes, la tarjeta de su combi o Personas
  const [nombres, setNombres] = React.useState({});
  const [routeInfo, setRouteInfo] = React.useState({
    routeId: session.routeId || null,
    routeName: session.routeName || null,
    targetGapMin: TARGET_GAP_DEFAULT,
  });
  // La ruta del estado ANTERIOR. Va en un ref y no se lee del estado porque
  // el estado se acaba de pisar unas líneas más arriba: ver el comentario
  // del cierre de la conversación privada, abajo.
  const rutaPreviaRef = React.useRef(session.routeId || null);
  // De qué ruta es cada privado personal ('p:pedro' → 'R-14'): su hilo vive ahí
  const rutaDelPrivadoRef = React.useRef({});
  // La ruta que el supervisor ELIGIÓ mirar. El servidor arranca cada
  // conexión en la primera ruta y no recuerda el `watch`: tras un corte de
  // 3 s mirando R-20 se volvía en silencio a R-14, y lo que se escribía iba
  // al grupo equivocado (P4). Al reconectar se la vuelve a pedir.
  const rutaMiradaRef = React.useRef(null);
  const esSupervisor = !!session.supervisor;
  // Un reloj de 1 s para los tiempos relativos de la lista («EN TRÁFICO ·
  // N MIN», «OÍDO HACE N S»): se calculaban en el render y quedaban
  // congelados cuando caía el WebSocket (P7).
  const [ahora, setAhora] = React.useState(() => Date.now());
  React.useEffect(() => {
    const t = setInterval(() => setAhora(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  // Avisos del nivel de arriba (la administración del sistema): banner
  // persistente hasta que alguien de la cooperativa lo marque visto. Se
  // piden al entrar y cada 5 minutos — un aviso de deuda no corre con la
  // urgencia del tiempo real, pero tampoco puede depender de recargar.
  const [avisos, setAvisos] = React.useState([]);
  React.useEffect(() => {
    let vivo = true;
    const cargar = () => {
      fetch(HTTP_URL + '/admin/avisos', { headers: { Authorization: 'Bearer ' + session.token } })
        .then(r => (r.ok ? r.json() : null))
        .then(d => { if (vivo && d) setAvisos(d.avisos || []); })
        .catch(() => {});
    };
    cargar();
    const t = setInterval(cargar, 5 * 60_000);
    return () => { vivo = false; clearInterval(t); };
  }, [session.token]);
  const marcarAviso = async (id) => {
    try {
      const r = await fetch(`${HTTP_URL}/admin/avisos/${id}/visto`, {
        method: 'POST', headers: { Authorization: 'Bearer ' + session.token },
      });
      if (r.ok) setAvisos(a => a.filter(x => x.id !== id));
    } catch {}
  };

  // El mismo panel sirve en PC y en celular: bajo 900px pasa a vista
  // única (Unidades / Mapa / Chat) con navegación inferior.
  const [isMobile, setIsMobile] = React.useState(window.innerWidth < 900);
  // Entre 900 y 1280 px la cabecera no entra entera: cede el nombre de la
  // ruta (el código queda) y no el de la cooperativa.
  const [compacto, setCompacto] = React.useState(window.innerWidth < 1280);
  const [view, setView] = React.useState('map');
  React.useEffect(() => {
    const onResize = () => { setIsMobile(window.innerWidth < 900); setCompacto(window.innerWidth < 1280); };
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  // Cambiar de tema cambia los tiles sin recargar la página
  React.useEffect(() => {
    if (tilesRef.current) tilesRef.current.setUrl(HUD.tiles);
  }, [modo]);

  // El recorrido de la ruta, debajo de las unidades. La vuelta va punteada
  // para distinguirla de la ida cuando comparten calle.
  React.useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    if (trazadoRef.current) { trazadoRef.current.remove(); trazadoRef.current = null; }
    const capa = L.layerGroup();
    let hay = false;
    if (trazado?.ida?.length > 1) {
      L.polyline(trazado.ida, { color: HUD.bright, weight: 5, opacity: 0.55 }).addTo(capa);
      hay = true;
    }
    if (trazado?.vuelta?.length > 1) {
      L.polyline(trazado.vuelta, {
        color: HUD.bright, weight: 5, opacity: 0.55, dashArray: '8 8',
      }).addTo(capa);
      hay = true;
    }
    if (hay) { capa.addTo(map); trazadoRef.current = capa; }
  }, [trazado, modo]);

  // Leaflet necesita re-medirse cuando su contenedor aparece o cambia
  React.useEffect(() => {
    if (mapRef.current && !adminOpen && (!isMobile || view === 'map')) {
      setTimeout(() => mapRef.current.invalidateSize(), 60);
    }
  }, [isMobile, view, adminOpen]);
  const wsRef = React.useRef(null);
  const mapRef = React.useRef(null);
  const tilesRef = React.useRef(null);
  const trazadoRef = React.useRef(null);   // la polilínea del recorrido en el mapa
  const markersRef = React.useRef({});
  const fittedRef = React.useRef(false);

  const pushMsg = (m) => setMessages(ms => [...ms.slice(-149), m]);
  // Un privado de una unidad que no estoy mirando queda marcado. Vale para el
  // texto, la voz y la foto: sólo el texto sumaba, y la foto privada de un
  // accidente no aparecía en ningún lado si no se abría ese privado (22/9).
  const marcarNoLeido = (msg) => {
    const clave = msg.toPersonId ? 'p:' + msg.toPersonId : msg.toVehicleId;
    if (msg.toPersonId && msg.routeId) rutaDelPrivadoRef.current[clave] = msg.routeId;
    // El nombre, de lo que escribe la PERSONA: el eco de lo que le manda
    // Despacho viene firmado «Despacho» y pisaba el de ella
    if (msg.toPersonId && msg.unitId === msg.toPersonId) {
      setNombres(n => ({ ...n, [clave]: msg.driverName || msg.toPersonId }));
    }
    if (!clave || msg.role === 'dispatch' || msg.role === 'manager') return;
    setPrivadoCon(actual => {
      if (actual !== clave) {
        setNoLeidos(n => ({ ...n, [clave]: (n[clave] || 0) + 1 }));
      }
      return actual;
    });
  };

  const mapMsg = (m, kind) => ({ ...mapMsgSinClave(m, kind), k: ++SEQ_MSG });
  const mapMsgSinClave = (m, kind) => {
    const own = m.unitId === session.unitId;
    if (kind === 'sos') {
      return {
        // El ancla para cuando llegue el tipo (`sos_tipo`): la emergencia
        // del hilo se actualiza en el lugar, no se duplica.
        sosId: m.sosId ?? null,
        from: m.driverName || m.unitId, unit: m.vehicleId || null, tone: 'sos',
        text: `SOS — ${m.driverName || m.unitId} pide ayuda${m.vehicleId ? ' desde ' + m.vehicleId : ''}` +
          (TIPOS_SOS[m.sosTipo] ? ` · ${TIPOS_SOS[m.sosTipo].toUpperCase()}` : ''),
        // Quién lo atendió y a qué hora, aparte del texto: el sufijo del
        // tipo se reemplaza por el final y no puede tener nada detrás
        atendido: m.atendidoEn ? `Atendido por ${m.atendidoPorNombre || m.atendidoPor || 'Despacho'} · ${horaChat(m.atendidoEn)}` : null,
        time: horaChat(m.timestamp),
      };
    }
    const base = {
      from: m.role === 'dispatch' ? 'DESPACHO' : m.role === 'manager' ? 'GERENCIA' : (m.driverName || m.unitId || 'Conductor'),
      role: own ? 'dispatch-self' : m.role,
      unit: m.role === 'dispatch' ? null : (m.vehicleId || null),
      // Con qué combi ('M-05') o persona ('p:pedro') es la conversación
      // privada; null = mensaje del grupo
      para: m.toPersonId ? 'p:' + m.toPersonId : (m.toVehicleId || null),
      time: horaChat(m.timestamp),
      tone: 'normal',
      // Para marcarlo como evidencia (PENDIENTES 0.8)
      msgId: m.msgId ?? null,
      // Sin contenido porque no entró en el historial: se pide al tocarla
      aparte: !!m.aparte,
      evidencia: m.evidencia ? { por: m.evidenciaPorNombre || null, motivo: m.evidenciaMotivo || '' } : null,
    };
    if (kind === 'voice') return { ...base, voice: m.duration, audio: m.data || null, expired: m.expired };
    // La foto puede llegar sin imagen: expiró (más de 30 días) o no entró en
    // el historial (`aparte`). El pie de foto se queda, para que se sepa que
    // existió.
    if (kind === 'photo') return { ...base, photo: true, image: m.data || null, text: m.text || 'Foto' };
    return { ...base, text: m.text };
  };

  // ─── WebSocket propio del panel (sin GPS: Despacho no está en ruta)
  React.useEffect(() => {
    let closedByUs = false;
    let reconnect = null;
    let ws = null;
    let oidoEn = Date.now();   // la última vez que llegó algo (ver el latido)
    let intentos = 0;          // reconexiones seguidas sin éxito

    const open = () => {
      ws = new WebSocket(SERVER_URL);
      wsRef.current = ws;
      ws.onopen = () => {
        intentos = 0;
        setConnected(true);
        oidoEn = Date.now();
        ws.send(JSON.stringify({ type: 'identify', token: session.token }));
        // Y la ruta que se estaba mirando, si se eligió una
        if (rutaMiradaRef.current) ws.send(JSON.stringify({ type: 'watch', routeId: rutaMiradaRef.current }));
      };
      ws.onmessage = (ev) => {
        oidoEn = Date.now();
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === 'pong') return;
        if (msg.type === 'state') {
          // Al reconectar, el servidor manda primero el estado de la ruta
          // inicial y recién después atiende el `watch`: ese estado no es de
          // la ruta que se está mirando, y tomarlo cerraba el privado,
          // borraba los no leídos y reencuadraba el mapa (barrido 22/9).
          if (rutaMiradaRef.current && msg.routeId !== rutaMiradaRef.current) return;
          // Cambió la ruta: la conversación privada abierta era de la OTRA,
          // y los no leídos también. Se compara contra un ref y NO desde
          // adentro de un `setRouteInfo(prev => …)`: ahí `prev` ya es el
          // valor que se acaba de poner en la línea de abajo —React aplica
          // la cola en orden—, así que `prev.routeId` era siempre igual a
          // `msg.routeId`, la condición nunca daba verdadera y el privado
          // quedaba abierto apuntando a una combi de la ruta anterior.
          if (rutaPreviaRef.current && rutaPreviaRef.current !== msg.routeId) {
            // Menos el personal de alguien de ESTA ruta: «Escribir» a una
            // persona de otra ruta pasa primero a mirar la suya, y esto lo
            // cerraba apenas llegaba el estado (revisión previa a la APK).
            // Los no leídos personales tampoco son de una ruta: se quedan.
            const sigue = (clave) => esPrivadoPersona(clave) && (rutaDelPrivadoRef.current[clave] || msg.routeId) === msg.routeId;
            setPrivadoCon(actual => sigue(actual) ? actual : null);
            setNoLeidos(n => Object.fromEntries(Object.entries(n).filter(([k]) => esPrivadoPersona(k))));
            // Reencuadrar SÓLO al cambiar de ruta. Estaba afuera de este if y
            // corría con cada estado: cada ~3 s el mapa volvía a la flota
            // entera y no había forma de quedarse mirando un SOS (22/9).
            fittedRef.current = false;
          }
          rutaPreviaRef.current = msg.routeId;
          setUnits(msg.units || []);
          setGaps(msg.gaps || {});
          setRouteInfo({
            routeId: msg.routeId,
            routeName: msg.routeName,
            targetGapMin: msg.targetGapMin || TARGET_GAP_DEFAULT,
            desvio: msg.desvio || null,
            // Cuántas combis tiene la ruta dadas de alta: el denominador
            // del "N de M" de la cabecera de la lista.
            flota: msg.flota ?? null,
            // Los conteos del servidor: la cadena (con las que perdieron
            // señal), cuántas de ésas están calladas, cuántas van yendo y
            // cuántas ausentes. `units.length` contaba todo junto (P6).
            enRuta: msg.totalOnRoute ?? null,
            sinSenal: msg.sinSenal ?? 0,
            yendo: msg.yendo ?? 0,
            ausentes: msg.ausentes ?? 0,
          });
        } else if (msg.type === 'puerta') {
          // De la ruta que se mira, y de ninguna otra (como el estado)
          if (rutaMiradaRef.current && msg.routeId !== rutaMiradaRef.current) return;
          setPuerta(msg.items || []);
        } else if (msg.type === 'telefonos') {
          if (rutaMiradaRef.current && msg.routeId !== rutaMiradaRef.current) return;
          setTelefonos(msg.items || {});
        } else if (msg.type === 'routes') {
          setRoutes(msg.routes || []);
        } else if (msg.type === 'route_geometry') {
          // El trazado llega una vez (al conectar, al cambiar de ruta o
          // cuando alguien lo edita), no en cada estado
          setTrazado(msg.tramos || { ida: [], vuelta: [] });
        } else if (msg.type === 'chat_msg') {
          pushMsg(mapMsg(msg, 'chat'));
          marcarNoLeido(msg);
        } else if (msg.type === 'voice_msg') {
          pushMsg(mapMsg(msg, 'voice'));
          marcarNoLeido(msg);
        } else if (msg.type === 'photo_msg') {
          pushMsg(mapMsg(msg, 'photo'));
          marcarNoLeido(msg);
        } else if (msg.type === 'sos_alert') {
          pushMsg(mapMsg(msg, 'sos'));
          setSosLista(l => l.some(x => x.sosId != null && x.sosId === msg.sosId)
            ? l : [...l, { ...msg, receivedAt: Date.now() }]);
          notificarSos(msg);
        } else if (msg.type === 'evidencia') {
          setMessages(ms => ms.map(x => (x.msgId != null && x.msgId === msg.msgId)
            ? { ...x, evidencia: msg.marcada ? { por: msg.por, motivo: msg.motivo } : null } : x));
        } else if (msg.type === 'sos_abiertos') {
          // Los que siguen sin atender, al conectar: el que llegó mientras
          // el panel recargaba (o estaba cerrado) vuelve a estar acá
          // Es la lista ENTERA de los abiertos: el que otro panel atendió
          // mientras éste estaba cortado se va (antes se quedaba sonando
          // hasta que alguien tocara ATENDIDO acá; revisión integral 04/11)
          setSosLista(l => {
            const abiertos = new Set((msg.items || []).map(x => x.sosId));
            const siguen = l.filter(x => x.sosId == null || abiertos.has(x.sosId));
            const ya = new Set(siguen.map(x => x.sosId));
            const nuevos = (msg.items || []).filter(x => !ya.has(x.sosId)).map(x => ({ ...x, receivedAt: Date.now() }));
            return [...siguen, ...nuevos].sort((a, b) => a.timestamp - b.timestamp);
          });
        } else if (msg.type === 'sos_atendido') {
          // Lo atendió alguien (este panel u otro): se cierra en todos, y el
          // hilo dice quién
          setSosLista(l => l.filter(x => x.sosId !== msg.sosId));
          setSosError(null);
          setMessages(ms => ms.map(x => (x.sosId != null && x.sosId === msg.sosId)
            ? { ...x, atendido: `Atendido por ${msg.por || 'Despacho'} · ${horaChat(msg.en)}` } : x));
        } else if (msg.type === 'sos_tipo') {
          // El chofer le puso nombre a la emergencia ya disparada: "falla
          // mecánica" pide una grúa, "accidente" una ambulancia, "policía"
          // otra llamada. Se actualizan el cartel y la línea del hilo — la
          // emergencia sigue siendo UNA, ahora con más información.
          if (TIPOS_SOS[msg.tipo]) {
            setSosLista(l => l.map(x => x.sosId === msg.sosId ? { ...x, sosTipo: msg.tipo } : x));
            // El sufijo viejo se quita con un patrón DERIVADO de TIPOS_SOS:
            // una copia a mano de las etiquetas era una segunda lista que se
            // separaba sola al agregar un tipo — y las correcciones del
            // chofer acumulaban etiquetas en vez de reemplazarlas.
            const sufijos = new RegExp(' · (' +
              Object.values(TIPOS_SOS).map(t => t.toUpperCase()).join('|') + ')$');
            setMessages(ms => ms.map(x => (x.sosId != null && x.sosId === msg.sosId)
              ? { ...x, text: x.text.replace(sufijos, '') +

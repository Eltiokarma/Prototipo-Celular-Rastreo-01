<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panel de Despacho — Control de flota</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- PWA: el panel se instala como app fija en un celular o tablet -->
<link rel="manifest" href="manifest-despacho.json">
<meta name="theme-color" content="#F7FAFD">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Despacho">

<!-- Leaflet: mapa de calles reales. Lo sirve ESTE servidor, no un CDN.
     Pasó en producción con el panel del creador: unpkg no entregó leaflet.js
     y la página quedaba en blanco sin un solo error visible, porque el mapa
     se inicializaba con `L` sin existir. Despacho es la pantalla que mira el
     que despacha durante ocho horas: no puede depender de la red de otro. -->
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<script src="vendor/leaflet/leaflet.js"></script>
<!-- La caída al CDN es para el caso en que este HTML se publique en un
     hosting estático sin el servidor Node al lado: ahí la copia local da 404.
     El navegador ejecuta este bloque recién después del <script> de arriba,
     así que `L` ya está definido o no lo estará nunca. -->
<script>
if (typeof L === 'undefined') {
  document.write('<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />');
  document.write('<scr' + 'ipt src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/scr' + 'ipt>');
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">

<!-- Si el servidor Node sirve esta página, config.js apunta el tiempo
     real a este mismo origen; en hosting estático da 404 y no pasa nada -->
<script src="config.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  /* Las fija Root al aplicar el tema (día por defecto) */
  :root { --bg: #F7FAFD; --fg: #0B2239; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif;
    overflow: hidden;
  }
  #root { height: 100%; }
  /* El banner de SOS ocupa el ancho entero: el anillo de sombra que servía
     para un punto no se ve en una franja. Late en opacidad. */
  @keyframes sosPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .82; }
  }
  @media (prefers-reduced-motion: reduce) {
    [style*="sosPulse"] { animation: none !important; }
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #1c2836; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div id="root"></div>

<!-- Producción, no desarrollo: react-dom pasa de 1054 kB a 128. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">

// Mismo servidor que la app del chofer
const SERVER_URL = window.REALTIME_SERVER_URL ||
  'wss://prototipo-celular-rastreo-01-production.up.railway.app';
const HTTP_URL = SERVER_URL.replace(/^ws/, 'http');

// El fondo del mapa: Geoapify, mismo diseño que las tiles de CARTO de antes
// (`positron` = light_all, `dark-matter` = dark_all) pero con licencia que
// permite uso comercial. La clave la pone el servidor en /config.js desde su
// variable de entorno GEOAPIFY_API_KEY; acá nunca hay una clave escrita.
//
// Este panel usa el proveedor DIRECTO, a propósito, y no la cascada del mapa
// propio que usan las pantallas del chofer: el mapa propio (v1) no tiene
// nombres de calles, y acá se trazan rutas — los nombres valen. Son ~30
// paneles contra 2000 choferes: la cuota del proveedor ni se entera.
// Decisión de Gerson, 2026-08.
const TILES_KEY = window.TILES_KEY || '';
const tilesUrl = (estilo) =>
  `https://maps.geoapify.com/v1/tile/${estilo}/{z}/{x}/{y}{r}.png?apiKey=${TILES_KEY}`;
// OSM la exige (ODbL) y Geoapify la pide en su plan gratuito. Se muestra.
const TILES_ATRIB = 'Powered by <a href="https://www.geoapify.com/">Geoapify</a> · © OpenMapTiles · © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';

// Tokens HUD compartidos con la app
// Dos temas. DÍA es el de fábrica: el encargado puede estar en la calle o en
// el paradero con el celular en la mano, no en una oficina con luz tenue.
// NOCHE es el diseño oscuro original, para turnos de madrugada.
const TEMAS = {
  day: {
    bg: '#F7FAFD', surface: '#FFFFFF', line: '#C3D4E4', divider: '#E1E9F2',
    green: '#1F8A4F', amber: '#A67300', red: '#C2001D',
    fg: '#0B2239', fg2: '#2A4864', dim: '#41627F', dim2: '#496A86', dim3: '#5A7591',
    bright: '#1668C4', sky: '#1668C4',
    hueco: '#EDF2F8',       // cajas de alta, fondos hundidos
    campo: '#FFFFFF',       // inputs
    campoLinea: '#C3D4E4',
    boton: '#E3EDF7',       // botones secundarios
    apagado: '#B9C9D8',     // punto de "desconectado"
    burbuja: '#FFFFFF',      burbujaInk: '#0B2239',
    burbujaPropia: '#DCEBFB', burbujaPropiaInk: '#0A2E52',
    burbujaSos: '#FFE1E7',   burbujaSosInk: '#68001A',
    okFondo: '#E4F7EA', okClave: '#0B6B33',
    cargando: '#7FA8D4',
    // Superficies de estado: fondo + borde + tinta que se lee encima. Son
    // derivados del juego de arriba, no una paleta nueva; existen para que
    // un aviso se distinga sin bajar el contraste del texto.
    verdeFondo: '#E9F7EF', verdeBorde: '#BEE3CD', verdeTinta: '#0B6B33',
    ambarFondo: '#FDF6E4', ambarBorde: '#E4C88A', ambarTinta: '#4A3200', ambarTinta2: '#6B4A00',
    rojoFondo: '#FCEBEE',  rojoBorde: '#E6BFC6',  rojoTinta: '#5C0010',
    azulFondo: '#E7F0FB',  azulBorde: '#C9DDF4',  azulTinta: '#0A2E52',
    filaCritica: '#FDF3F5', // fila de unidad en rojo
    filaActiva: '#F7FBFF',  // tarjeta de la ruta que se está mirando
    celda: '#F4F8FC',       // fondo de las celdas de brecha
    tinta: '#0B2239',       // botón principal del creador, segmentado activo
    flotante: 'rgba(255,255,255,.94)', // tarjetas sobre el mapa
    velo: 'rgba(11,34,57,.42)',        // overlay de modal
    tiles: tilesUrl('positron'),
    oscuro: false,
  },
  night: {
    bg: '#03060a', surface: '#0d1116', line: '#1c2836', divider: '#16222f',
    green: '#39FF14', amber: '#FFD400', red: '#FF2D55',
    fg: '#EAF4FF', fg2: '#C6D6E6', dim: '#8FA8C0', dim2: '#6E88A2', dim3: '#63809D',
    bright: '#2E9DFF', sky: '#71BCFF',
    hueco: '#0a0f15',
    campo: '#10161d',
    campoLinea: '#232b36',
    boton: '#1a222c',
    apagado: '#2a3644',
    burbuja: '#141a21',      burbujaInk: '#DCE8F5',
    burbujaPropia: '#0e2a45', burbujaPropiaInk: '#D8ECFF',
    burbujaSos: '#2b0812',   burbujaSosInk: '#FFD9E0',
    okFondo: '#08251a', okClave: '#7DF06A',
    cargando: '#1D598F',
    // Mismos papeles que en día, resueltos para fondo oscuro
    verdeFondo: '#08251a', verdeBorde: '#14512f', verdeTinta: '#7DF06A',
    ambarFondo: '#221900', ambarBorde: '#4a3800', ambarTinta: '#FFD400', ambarTinta2: '#C9A83A',
    rojoFondo: '#2b0812',  rojoBorde: '#5a1122',  rojoTinta: '#FFD9E0',
    azulFondo: '#0e2a45',  azulBorde: '#1d4570',  azulTinta: '#D8ECFF',
    filaCritica: '#1a0810',
    filaActiva: '#0b1620',
    celda: '#0a0f15',
    tinta: '#EAF4FF',
    flotante: 'rgba(13,17,22,.94)',
    velo: 'rgba(0,0,0,.6)',
    tiles: tilesUrl('dark-matter'),
    oscuro: true,
  },
};

// Se muta en vez de reemplazarse: así las referencias HUD.* de todo el panel
// siguen valiendo sin pasar el tema por props.
const HUD = { ...TEMAS.day };
function aplicarTema(modo) {
  Object.assign(HUD, TEMAS[modo] || TEMAS.day);
}

// Cualquier dato que se meta en HTML crudo (los pines del mapa se arman así,
// que es como los pide Leaflet) pasa por acá. El servidor ya limita los
// identificadores a caracteres seguros; esto es la segunda pared, para las
// bases que ya tuvieran algo raro cargado de antes.
function escaparHtml(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

const JULIACA_CENTER = [-15.4904, -70.1333];
// Objetivo de brecha por defecto; cada ruta manda el suyo en el estado
const TARGET_GAP_DEFAULT = 2;

// Los tipos de emergencia. El chofer los elige DESPUÉS de deslizar el SOS
// —la alerta ya llegó acá—; llegan como mensaje `sos_tipo` y actualizan la
// emergencia ya mostrada. Sin tipo, es el SOS genérico de siempre.
const TIPOS_SOS = { mecanica: 'Falla mecánica', accidente: 'Accidente', policia: 'Policía' };

function parseMin(s) {
  if (!s) return null;
  const [m, sec] = String(s).split(':').map(Number);
  return m + (sec || 0) / 60;
}

// Minutos con decimales → "2:00". El objetivo se guarda como número y se
// lee al lado de las brechas, que vienen en m:ss: mostrarlo como "2 min"
// obligaría a convertir de cabeza cada vez que se compara.
function fmtMin(min) {
  if (min === null || min === undefined || isNaN(min)) return '—';
  const total = Math.round(min * 60);
  return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
}

function gapColor(gapStr, target = TARGET_GAP_DEFAULT) {
  const v = parseMin(gapStr);
  if (v === null || isNaN(v)) return HUD.dim3;
  const dev = Math.abs(v - target) / target;
  if (dev <= 0.15) return HUD.green;
  if (dev <= 0.30) return HUD.amber;
  return HUD.red;
}

// El mismo juicio que `gapColor`, en palabras.
//
// Verde y ámbar son EL MISMO COLOR para un daltónico rojo-verde: medido con el
// validador de paletas, el par queda en ΔE 5,4 bajo protanopia, por debajo del
// piso aceptable. Y no se arregla moviendo el color — corriendo el ámbar hacia
// el naranja se despega del verde pero se pega al rojo. La salida es no
// depender del color: el número de la brecha ya estaba, pero *si esa brecha
// está bien o se está yendo* lo decía únicamente el color, así que un
// despachador daltónico veía el dato y no veía el juicio.
//
// Las palabras son las de la leyenda que ya está en el mapa, para que la fila
// y la leyenda no digan lo mismo de dos maneras distintas. Sin dato no hay
// palabra: el "—" del valor ya dice todo lo que se sabe.
function gapWord(gapStr, target = TARGET_GAP_DEFAULT) {
  const c = gapColor(gapStr, target);
  if (c === HUD.green) return 'EN OBJETIVO';
  if (c === HUD.amber) return 'AL LÍMITE';
  if (c === HUD.red) return 'CRÍTICA';
  return null;
}

function nowTime(ts) {
  const d = ts ? new Date(ts) : new Date();
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

// "hoy 14:05" / "ayer 09:12" / "12/07 18:40" — para la última conexión
function fmtWhen(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const dias = Math.floor((hoy - new Date(d).setHours(0, 0, 0, 0)) / 86400000);
  const hora = nowTime(ts);
  if (dias <= 0) return `hoy ${hora}`;
  if (dias === 1) return `ayer ${hora}`;
  return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')} ${hora}`;
}

const mono = 'JetBrains Mono, ui-monospace, monospace';
const black = '"Archivo Black", system-ui, sans-serif';

// ─── Piezas que se repiten en todo el panel.
// Se calculan al llamarlas, no una sola vez: HUD se muta al cambiar de tema
// y una constante congelaría los colores del tema con el que arrancó.
const btnPrimario = (alto = 36) => ({
  height: alto, padding: '0 14px', background: HUD.bright, color: '#fff',
  border: 'none', borderRadius: 9, fontSize: 13, fontWeight: 700,
  fontFamily: 'inherit', cursor: 'pointer', whiteSpace: 'nowrap',
});
const btnSecundario = (alto = 36) => ({
  height: alto, padding: '0 12px', background: HUD.surface, color: HUD.dim2,
  border: `1px solid ${HUD.line}`, borderRadius: 9, fontSize: 13, fontWeight: 700,
  fontFamily: 'inherit', cursor: 'pointer', whiteSpace: 'nowrap',
});
// Botón de fila: el de las acciones dentro de una tabla o una tarjeta
const btnChico = (tinta, borde) => ({
  padding: '5px 9px', background: HUD.surface, color: tinta || HUD.fg2,
  border: `1px solid ${borde || HUD.line}`, borderRadius: 7,
  fontSize: 12, fontWeight: 700, fontFamily: 'inherit', cursor: 'pointer',
  whiteSpace: 'nowrap',
});
// Etiqueta en mayúscula: encabezado de columna, label de campo, kicker
const rotulo = (tam = 9, tinta) => ({
  fontFamily: mono, fontSize: tam, fontWeight: 700,
  letterSpacing: tam <= 9 ? 1.3 : 1.5, color: tinta || HUD.dim3,
  textTransform: 'uppercase',
});
const tarjeta = (relleno = 14) => ({
  border: `1px solid ${HUD.divider}`, borderRadius: 12, padding: relleno,
  background: HUD.surface,
});
const campo = (alto = 40) => ({
  height: alto, padding: '0 12px', background: HUD.campo, color: HUD.fg,
  border: `1px solid ${HUD.campoLinea}`, borderRadius: 10,
  fontSize: 14, fontFamily: 'inherit', outline: 'none', minWidth: 0,
});

// ═══════════════════════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════════════════════
// El nombre de la cooperativa sobrevive al cierre de sesión: al volver a
// entrar, el encargado ve el suyo y no una marca fija que puede no ser la
// de su empresa. En una máquina recién instalada no hay ninguno todavía.
function coopRecordada() {
  try { return localStorage.getItem('r14_coop_panel') || null; } catch { return null; }
}

function Login({ onSuccess, notice }) {
  const [user, setUser] = React.useState('DESPACHO');
  const [pass, setPass] = React.useState('');
  // Ver lo tipeado a pedido: las claves acá las dicta una persona a otra
  // por teléfono, y un error de tipeo a ciegas cuesta un bloqueo por
  // intentos. El de la app del chofer ya lo tiene; este es el mismo gesto.
  const [verPass, setVerPass] = React.useState(false);
  const [error, setError] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const coop = coopRecordada();

  const submit = async () => {
    if (!user.trim() || pass.length < 4) {
      setError('Completá usuario y contraseña (mínimo 4 caracteres)');
      return;
    }
    setLoading(true);
    setError(null);
    try {
      const res = await fetch(HTTP_URL + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: user.trim(), password: pass }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Error de autenticación');
      // Despacho y gerencia comparten este panel: el gerente es la cuenta
      // de arriba, con más permisos (vehículos, datos de la empresa, logo).
      if (data.role !== 'dispatch' && data.role !== 'manager') {
        throw new Error('Esta cuenta no es de Despacho ni de gerencia');
      }
      try {
        localStorage.setItem('r14_dispatch_session', JSON.stringify(data));
        if (data.companyName) localStorage.setItem('r14_coop_panel', data.companyName);
      } catch {}
      onSuccess(data);
    } catch (e) {
      setLoading(false);
      setError(e.message === 'Failed to fetch' ? 'No se pudo conectar con el servidor' : e.message);
    }
  };

  const inputStyle = {
    width: '100%', padding: '14px 16px', fontSize: 18, fontWeight: 600,
    background: HUD.campo, border: `1px solid ${HUD.campoLinea}`, borderRadius: 12,
    color: HUD.fg, outline: 'none', fontFamily: 'inherit',
  };

  return (
    <div style={{
      height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: `radial-gradient(80% 60% at 50% 30%, #0a1626 0%, ${HUD.bg} 70%)`,
    }}>
      <div style={{
        width: 380, background: HUD.surface, border: `1px solid ${HUD.line}`,
        borderRadius: 20, padding: 32,
      }} onKeyDown={e => { if (e.key === 'Enter') submit(); }}>
        <div style={{ fontFamily: black, fontSize: 26, letterSpacing: -0.5 }}>
          {coop || 'Panel de Despacho'}
        </div>
        <div style={{
          fontFamily: mono, fontSize: 13, fontWeight: 700, letterSpacing: 1,
          color: HUD.bright, textTransform: 'uppercase', marginBottom: 24,
        }}>{coop ? 'Panel de Despacho' : 'Control de flota'}</div>

        <div style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, letterSpacing: 1, color: HUD.dim2, marginBottom: 6 }}>USUARIO</div>
        <input value={user} onChange={e => setUser(e.target.value)} style={{ ...inputStyle, marginBottom: 14 }} />
        <div style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, letterSpacing: 1, color: HUD.dim2, marginBottom: 6 }}>CONTRASEÑA</div>
        <div style={{ position: 'relative', marginBottom: 18 }}>
          <input type={verPass ? 'text' : 'password'} value={pass} autoFocus
            onChange={e => setPass(e.target.value)} style={{ ...inputStyle, paddingRight: 78 }} />
          <button type="button" onClick={() => setVerPass(v => !v)} style={{
            position: 'absolute', right: 12, top: '50%', transform: 'translateY(-50%)',
            background: 'transparent', border: 'none', cursor: 'pointer',
            fontFamily: mono, fontSize: 11, fontWeight: 700, letterSpacing: 1, color: HUD.dim2,
          }}>{verPass ? 'OCULTAR' : 'VER'}</button>
        </div>

        {(error || notice) && (
          <div style={{
            background: 'rgba(255,45,85,.1)', border: `1px solid ${HUD.red}`,
            borderRadius: 10, padding: '10px 12px', marginBottom: 16,
            fontSize: 14, fontWeight: 600, color: HUD.red,
          }}>{error || notice}</div>
        )}

        <button onClick={submit} disabled={loading} style={{
          width: '100%', padding: 16, fontSize: 17, letterSpacing: 2,
          fontFamily: black, background: loading ? HUD.cargando : HUD.bright,
          color: '#fff', border: 'none', borderRadius: 12,
          cursor: loading ? 'wait' : 'pointer',
        }}>{loading ? 'VERIFICANDO...' : 'INGRESAR'}</button>

        <div style={{ marginTop: 18, fontSize: 12, color: HUD.dim3, lineHeight: 1.5 }}>
          La primera vez que se ingresa como DESPACHO, esa contraseña queda
          registrada. En producción se fija con la variable DISPATCH_PASSWORD.
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// CHAT (columna derecha)
// ═══════════════════════════════════════════════════════════════
function ChatColumn({ messages, onSend, routeId, privadoCon, onCerrarPrivado }) {
  const [draft, setDraft] = React.useState('');
  const scrollRef = React.useRef(null);
  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages]);

  const send = () => {
    const text = draft.trim();
    if (!text) return;
    onSend(text);
    setDraft('');
  };

  return (
    <div style={{
      display: 'flex', flexDirection: 'column', height: '100%', minHeight: 0,
      background: HUD.surface,
    }}>
      <div style={{
        padding: '14px 16px', borderBottom: `1px solid ${HUD.divider}`,
        display: 'flex', alignItems: 'center', gap: 10,
      }}>
        {privadoCon ? (
          <>
            <button onClick={onCerrarPrivado} title="Volver al grupo de la ruta"
              style={btnChico(HUD.fg2)}>← Grupo</button>
            <span style={{ fontFamily: black, fontSize: 14 }}>{privadoCon}</span>
            <div style={{ flex: 1 }} />
            <span style={{ ...rotulo(10, HUD.ambarTinta2), letterSpacing: 1.5 }}>Solo esa unidad</span>
          </>
        ) : (
          <>
            <span style={{ ...rotulo(10, HUD.dim2), letterSpacing: 1.5 }}>
              Canal de ruta{routeId ? ` · ${routeId}` : ''}
            </span>
            <div style={{ flex: 1 }} />
          </>
        )}
      </div>

      <div ref={scrollRef} style={{
        flex: 1, overflowY: 'auto', padding: '14px 16px',
        display: 'flex', flexDirection: 'column', gap: 12, minHeight: 0,
      }}>
        {messages.filter(m => (m.para || null) === (privadoCon || null)).map((m, i) => {
          const own = m.role === 'dispatch-self';
          const sos = m.tone === 'sos';
          return (
            <div key={i} style={{ display: 'flex', justifyContent: own ? 'flex-end' : 'flex-start' }}>
              <div style={{
                maxWidth: '82%', padding: '9px 11px', borderRadius: 12,
                background: sos ? HUD.rojoFondo : own ? HUD.azulFondo : HUD.surface,
                border: `1px solid ${sos ? HUD.rojoBorde : own ? HUD.azulBorde : HUD.divider}`,
                color: sos ? HUD.burbujaSosInk : own ? HUD.azulTinta : HUD.fg,
              }}>
                {/* Quién habla y desde qué combi: con cobradores a bordo el
                    nombre ya no alcanza para saber de qué unidad viene */}
                <div style={{
                  ...rotulo(9, sos ? HUD.red : own ? HUD.bright : HUD.dim3),
                  marginBottom: 4,
                }}>
                  {own ? 'Despacho' : m.from}
                  {!own && m.unit && m.unit !== m.from ? ` · ${m.unit}` : ''} · {m.time}
                </div>
                <div style={{ fontSize: 14, lineHeight: 1.45 }}>
                  {m.voice
                    ? (m.audio
                        ? <audio controls src={m.audio} style={{ width: 220, height: 36 }} />
                        : <span style={{ color: HUD.dim3 }}>🎙 nota de voz ({m.voice}s{m.expired ? ' · expirada' : ''})</span>)
                    : m.photo
                    ? (m.image
                        // Se abre en pestaña nueva: lo que mandan —una chapa,
                        // un desperfecto— hay que poder mirarlo en grande.
                        ? <div>
                            <a href={m.image} target="_blank" rel="noreferrer">
                              <img src={m.image} alt={m.text}
                                style={{ maxWidth: 240, borderRadius: 8, display: 'block', cursor: 'zoom-in' }} />
                            </a>
                            {m.text && m.text !== 'Foto' && <div style={{ marginTop: 4 }}>{m.text}</div>}
                          </div>
                        : <span style={{ color: HUD.dim3 }}>📷 {m.text} · ya no disponible</span>)
                    : m.text}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ padding: '12px 14px', borderTop: `1px solid ${HUD.divider}`, display: 'flex', gap: 8 }}>
        <input
          value={draft}
          onChange={e => setDraft(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') send(); }}
          placeholder={privadoCon ? `Mensaje solo para ${privadoCon}…` : 'Escribí al canal de la ruta…'}
          style={{ ...campo(40), flex: 1 }}
        />
        <button onClick={send} style={{
          width: 44, height: 40, borderRadius: 10, border: 'none',
          background: HUD.bright, color: '#fff', fontSize: 16, cursor: 'pointer',
        }}>➤</button>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// TRAZADOR DE RECORRIDO
// Carga la geometría real de una ruta. Sin esto el progreso es una
// proyección lineal entre dos puntos y las brechas son aproximaciones.
//
// La forma de cargarlo es tocar el mapa en el orden en que maneja la combi:
// es lo que se entiende sin que nadie lo explique, y funciona igual en PC
// con el mouse que en un celular con el dedo. Para quien quiera precisión
// de verdad, se puede importar el GPX de una vuelta grabada manejando.
// ═══════════════════════════════════════════════════════════════

// Metros entre dos puntos GPS (la misma cuenta que hace el servidor)
const METROS_POR_GRADO = 111320;
function metrosEntre(a, b) {
  const kLng = Math.cos((a[0] + b[0]) / 2 * Math.PI / 180);
  return Math.hypot((b[0] - a[0]) * METROS_POR_GRADO, (b[1] - a[1]) * METROS_POR_GRADO * kLng);
}
function largoDe(puntos) {
  let m = 0;
  for (let i = 1; i < puntos.length; i++) m += metrosEntre(puntos[i - 1], puntos[i]);
  return m;
}

// Douglas-Peucker: saca los puntos que no cambian la forma del trazado.
// Un GPX de una vuelta trae miles de puntos y no hacen falta: con tolerancia
// de ~10 m el recorrido queda igual con una fracción de los puntos.
function simplificar(puntos, toleranciaM = 10) {
  if (puntos.length < 3) return puntos;
  const distAlSegmento = (p, a, b) => {
    const kLng = Math.cos(a[0] * Math.PI / 180);
    const px = (p[1] - a[1]) * METROS_POR_GRADO * kLng, py = (p[0] - a[0]) * METROS_POR_GRADO;
    const bx = (b[1] - a[1]) * METROS_POR_GRADO * kLng, by = (b[0] - a[0]) * METROS_POR_GRADO;
    const largo2 = bx * bx + by * by;
    const t = largo2 === 0 ? 0 : Math.max(0, Math.min(1, (px * bx + py * by) / largo2));
    return Math.hypot(px - t * bx, py - t * by);
  };
  const conservar = new Array(puntos.length).fill(false);
  conservar[0] = conservar[puntos.length - 1] = true;
  const pila = [[0, puntos.length - 1]];
  while (pila.length) {
    const [ini, fin] = pila.pop();
    let peor = 0, idx = -1;
    for (let i = ini + 1; i < fin; i++) {
      const d = distAlSegmento(puntos[i], puntos[ini], puntos[fin]);
      if (d > peor) { peor = d; idx = i; }
    }
    if (idx !== -1 && peor > toleranciaM) {
      conservar[idx] = true;
      pila.push([ini, idx], [idx, fin]);
    }
  }
  return puntos.filter((_, i) => conservar[i]);
}

// GPX (<trkpt lat lon>) y GeoJSON (LineString). Es lo que exporta cualquier
// app de grabar recorridos.
function leerRecorrido(texto) {
  const t = texto.trim();
  if (t.startsWith('{')) {
    const j = JSON.parse(t);
    const busca = (o) => {
      if (!o || typeof o !== 'object') return null;
      if (o.type === 'LineString' && Array.isArray(o.coordinates)) {
        return o.coordinates.map(c => [Number(c[1]), Number(c[0])]);  // GeoJSON va [lng, lat]
      }
      for (const v of Object.values(o)) {
        const r = Array.isArray(v) ? v.map(busca).find(Boolean) : busca(v);
        if (r) return r;
      }
      return null;
    };
    const p = busca(j);
    if (!p) throw new Error('El GeoJSON no tiene un LineString');
    return p;
  }
  const puntos = [];
  const re = /<(?:trkpt|rtept|wpt)\s[^>]*?lat="([-\d.]+)"[^>]*?lon="([-\d.]+)"/gi;
  let m;
  while ((m = re.exec(t))) puntos.push([Number(m[1]), Number(m[2])]);
  if (!puntos.length) throw new Error('No se encontraron puntos en el archivo');
  return puntos;
}

// Arriba de este tope los puntos dejan de ser arrastrables (miles de
// marcadores hacen inusable el mapa): se ve la línea y se puede deshacer.
const TOPE_ARRASTRABLES = 200;

function Trazador({ routeId, routeName, variantes, api, onClose, onGuardado }) {
  // Sobre cuál de los trazados se está dibujando. Arranca en el que está
  // midiendo, que es el caso normal; dibujar uno guardado no le mueve el
  // mapa a nadie hasta que Despacho lo active.
  const lista = variantes && variantes.length ? variantes : [];
  const [variantId, setVariantId] = React.useState(
    () => (lista.find(v => v.activa) || lista[0] || {}).variantId || null);
  const variante = lista.find(v => v.variantId === variantId) || null;

  // Los dos tramos del circuito. Se dibuja el activo; el otro queda de fondo
  // para poder calzarlos (la vuelta suele ir pegada a la ida).
  const [tramos, setTramos] = React.useState(null);   // null = cargando
  const [tramo, setTramo] = React.useState('ida');
  const [error, setError] = React.useState(null);
  const [aviso, setAviso] = React.useState(null);
  const [guardando, setGuardando] = React.useState(false);
  // Las grabaciones de la calle (3.4): null = todavía no se pidieron
  const [grabaciones, setGrabaciones] = React.useState(null);
  const [verGrabaciones, setVerGrabaciones] = React.useState(false);
  const mapRef = React.useRef(null);
  const capaRef = React.useRef(null);
  const archivoRef = React.useRef(null);
  const encuadradoRef = React.useRef(false);
  const tramoRef = React.useRef('ida');
  // Bajo 900 px el panel se pone arriba del mapa en vez de al costado
  const [angosto, setAngosto] = React.useState(window.innerWidth < 900);
  React.useEffect(() => {
    const onResize = () => {
      setAngosto(window.innerWidth < 900);
      if (mapRef.current) setTimeout(() => mapRef.current.invalidateSize(), 60);
    };
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  React.useEffect(() => { tramoRef.current = tramo; }, [tramo]);

  const puntos = tramos ? tramos[tramo] : null;
  const setPuntos = (fn) => setTramos(t => ({ ...t, [tramoRef.current]:
    typeof fn === 'function' ? fn(t[tramoRef.current]) : fn }));

  // El recorrido que ya tenía esa variante. Se recarga al cambiar de una a
  // otra: cada una tiene su propio dibujo.
  React.useEffect(() => {
    setTramos(null);
    const q = variantId ? `?variantId=${variantId}` : '';
    api(`/admin/routes/${encodeURIComponent(routeId)}/points${q}`)
      .then(d => setTramos({
        ida: (d.tramos?.ida || []).map(p => [p.lat, p.lng]),
        vuelta: (d.tramos?.vuelta || []).map(p => [p.lat, p.lng]),
      }))
      .catch(e => { setError(e.message); setTramos({ ida: [], vuelta: [] }); });
  }, [routeId, variantId]);

  const initMap = React.useCallback((node) => {
    if (!node || mapRef.current) return;
    const map = L.map(node, { center: JULIACA_CENTER, zoom: 14, zoomControl: true, attributionControl: true });
    map.attributionControl.setPrefix(false);
    L.tileLayer(HUD.tiles, { maxZoom: 19, attribution: TILES_ATRIB }).addTo(map);
    capaRef.current = L.layerGroup().addTo(map);
    // Tocar el mapa agrega un punto al final del tramo que se esté dibujando
    map.on('click', (e) => {
      setPuntos(p => [...(p || []), [e.latlng.lat, e.latlng.lng]]);
      setAviso(null);
    });
    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 80);
    setTimeout(() => map.invalidateSize(), 400);
  }, []);

  // Redibuja línea y puntos cada vez que cambian
  React.useEffect(() => {
    const map = mapRef.current, capa = capaRef.current;
    if (!map || !capa || !tramos) return;
    capa.clearLayers();

    // El tramo que NO se está editando, punteado y apagado de fondo: el
    // contraste dice cuál es cuál sin leer nada.
    const otro = tramo === 'ida' ? 'vuelta' : 'ida';
    if (tramos[otro].length > 1) {
      L.polyline(tramos[otro], {
        color: HUD.dim3, weight: 4, opacity: 0.55, dashArray: '6 6',
      }).addTo(capa);
    }

    // Ámbar cuando lo que se dibuja no es el trazado que mide hoy: el mismo
    // color que la franja de aviso de arriba.
    const tinta = variante && !variante.activa ? HUD.amber : HUD.bright;
    const activos = tramos[tramo];
    if (activos.length > 1) {
      L.polyline(activos, { color: tinta, weight: 5, opacity: 0.9 }).addTo(capa);
    }

    const arrastrables = activos.length <= TOPE_ARRASTRABLES;
    activos.forEach((p, i) => {
      const extremo = i === 0 || i === activos.length - 1;
      if (!arrastrables) {
        L.circleMarker(p, { radius: 4, color: tinta, weight: 2, fillColor: '#fff', fillOpacity: 1 }).addTo(capa);
        return;
      }
      // A y B se quedan: son lo único que dice en qué sentido se maneja.
      const etiqueta = i === 0 ? 'A' : i === activos.length - 1 ? 'B' : '';
      const marcador = L.marker(p, {
        draggable: true,
        icon: L.divIcon({
          className: '',
          iconSize: [extremo ? 22 : 12, extremo ? 22 : 12],
          iconAnchor: [extremo ? 11 : 6, extremo ? 11 : 6],
          html: `<div style="width:100%;height:100%;border-radius:50%;
            background:#fff; border:2px solid ${tinta}; color:${tinta};
            box-sizing:border-box;
            display:flex;align-items:center;justify-content:center;
            font:700 11px/1 system-ui,sans-serif;">${etiqueta}</div>`,
        }),
      }).addTo(capa);
      marcador.on('dragend', (e) => {
        const { lat, lng } = e.target.getLatLng();
        setPuntos(ps => ps.map((q, j) => (j === i ? [lat, lng] : q)));
      });
      // Tocar un punto lo borra (arrastrar no dispara click en Leaflet)
      marcador.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        setPuntos(ps => ps.filter((_, j) => j !== i));
      });
    });

    // Encuadrar una sola vez, cuando llega el recorrido que ya existía
    const todos = [...tramos.ida, ...tramos.vuelta];
    if (!encuadradoRef.current && todos.length > 1) {
      map.fitBounds(L.latLngBounds(todos).pad(0.15));
      encuadradoRef.current = true;
    }
  }, [tramos, tramo, variante]);

  const importar = (texto) => {
    try {
      const crudos = leerRecorrido(texto);
      const simple = simplificar(crudos, 10);
      const final = simple.slice(0, 2000);
      setPuntos(final);
      encuadradoRef.current = false;
      setError(null);
      setAviso(`Importados ${crudos.length} puntos a la ${tramo}, simplificados a ${final.length} sin cambiar la forma` +
        (simple.length > 2000 ? ' (recortado al tope de 2000)' : ''));
    } catch (e) {
      setError('No se pudo leer el archivo: ' + e.message);
    }
  };

  const guardar = async () => {
    setGuardando(true); setError(null);
    try {
      const aPuntos = (ps) => ps.map(p => ({ lat: p[0], lng: p[1] }));
      const r = await api(`/admin/routes/${encodeURIComponent(routeId)}/points`, {
        method: 'PUT',
        body: JSON.stringify({
          variantId: variantId || undefined,
          tramos: { ida: aPuntos(tramos.ida), vuelta: aPuntos(tramos.vuelta) },
        }),
      });
      onGuardado && onGuardado(r);
      onClose();
    } catch (e) { setError(e.message); }
    setGuardando(false);
  };

  // La franja de aviso y los mensajes le cambian el alto al mapa; Leaflet
  // necesita que le avisen o queda con los mosaicos cortados.
  React.useEffect(() => {
    if (mapRef.current) setTimeout(() => mapRef.current.invalidateSize(), 60);
  }, [variante, error, aviso, angosto]);

  const kmDe = (ps) => (largoDe(ps || []) / 1000).toFixed(1);

  // Guardar con la vuelta a medias sería un circuito roto
  const vueltaIncompleta = tramos && tramos.vuelta.length === 1;
  const idaIncompleta = tramos && tramos.ida.length === 1;
  const sinIda = tramos && !tramos.ida.length && tramos.vuelta.length > 0;
  const trabado = guardando || !tramos || vueltaIncompleta || idaIncompleta || sinIda;
  const midiendo = lista.find(v => v.activa) || null;
  const desalineado = !!(variante && !variante.activa);

  const importarArchivo = () => archivoRef.current?.click();

  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 4000, background: HUD.bg,
      display: 'flex', flexDirection: 'column',
    }}>
      {/* cabecera */}
      <div style={{
        height: 60, flexShrink: 0, padding: '0 18px', background: HUD.surface,
        borderBottom: `1px solid ${HUD.divider}`,
        display: 'flex', alignItems: 'center', gap: 12,
      }}>
        <span style={{ fontFamily: black, fontSize: 17 }}>Trazador</span>
        <span style={{
          ...rotulo(10, HUD.dim2), letterSpacing: 1.5, minWidth: 0,
          overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
        }}>{routeId}{routeName ? ` · ${routeName}` : ''}</span>
        <div style={{ flex: 1 }} />
        {(vueltaIncompleta || idaIncompleta || sinIda) && (
          <span style={{ fontSize: 12, color: HUD.amber, fontWeight: 700, textAlign: 'right' }}>
            {sinIda ? 'Falta la ida: el circuito arranca por ahí'
              : `La ${idaIncompleta ? 'ida' : 'vuelta'} tiene un solo punto`}
          </span>
        )}
        <button onClick={onClose} style={btnSecundario(36)}>Cancelar</button>
        <button onClick={guardar} disabled={trabado}
          style={{ ...btnPrimario(36), opacity: trabado ? .5 : 1, cursor: trabado ? 'not-allowed' : 'pointer' }}>
          {guardando ? 'Guardando…' : 'Guardar recorrido'}
        </button>
      </div>

      {/* Dibujar un trazado guardado es lo normal cuando se prepara un desvío
          antes de que empiece la obra. Pero hay que decirlo, y decirlo acá:
          si no, se guarda creyendo que se corrigió el recorrido de hoy y no
          cambió nada. No es un toast, no se descarta y no se esconde. */}
      {desalineado && (
        <div style={{
          flexShrink: 0, padding: '14px 20px', background: HUD.ambarFondo,
          borderBottom: `2px solid ${HUD.amber}`,
          display: 'flex', gap: 13, alignItems: 'flex-start',
        }}>
          <span style={{ fontFamily: black, fontSize: 15, color: HUD.amber, flexShrink: 0 }}>ATENCIÓN</span>
          <span style={{ fontSize: 14, lineHeight: 1.55, color: HUD.ambarTinta }}>
            Estás dibujando <strong>«{variante.name}»</strong>, que <strong>no es el
            trazado con el que se está midiendo hoy</strong>
            {midiendo ? <> (hoy mide «{midiendo.name}»)</> : null}. Guardar acá no
            corrige el recorrido de las unidades que están en ruta: para eso hay que
            cambiar la medición en Gestión ▸ Rutas.
          </span>
        </div>
      )}

      {error && (
        <div style={{
          flexShrink: 0, padding: '10px 20px', background: HUD.rojoFondo,
          borderBottom: `1px solid ${HUD.rojoBorde}`,
          color: HUD.rojoTinta, fontSize: 13, fontWeight: 700,
        }}>{error}</div>
      )}
      {aviso && (
        <div style={{
          flexShrink: 0, padding: '10px 20px', background: HUD.verdeFondo,
          borderBottom: `1px solid ${HUD.verdeBorde}`,
          color: HUD.verdeTinta, fontSize: 13, fontWeight: 700,
        }}>{aviso}</div>
      )}

      <div style={{
        flex: 1, minHeight: 0, display: 'flex',
        flexDirection: angosto ? 'column' : 'row',
      }}>
        {/* panel */}
        <div style={{
          flexShrink: 0, width: angosto ? 'auto' : 300, background: HUD.bg,
          borderRight: angosto ? 'none' : `1px solid ${HUD.divider}`,
          borderBottom: angosto ? `1px solid ${HUD.divider}` : 'none',
          padding: 16, overflowY: 'auto',
          display: 'flex', flexDirection: 'column', gap: 16,
        }}>
          {/* Sobre cuál trazado se dibuja. Con uno solo no hay nada que elegir. */}
          <div>
            <div style={{ ...rotulo(9), marginBottom: 8 }}>Trazado que estás dibujando</div>
            {lista.length > 1 ? (
              <span style={{ position: 'relative', display: 'block' }}>
                <span style={{
                  display: 'flex', alignItems: 'center', gap: 8, height: 40, padding: '0 12px',
                  background: HUD.surface, border: `1px solid ${HUD.line}`, borderRadius: 10,
                }}>
                  <span style={{
                    fontFamily: black, fontSize: 14, flex: 1, minWidth: 0,
                    overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                  }}>{variante ? variante.name : '—'}</span>
                  <span style={{ fontSize: 11, color: HUD.dim3 }}>▾</span>
                </span>
                <select value={variantId || ''} onChange={e => setVariantId(Number(e.target.value))}
                  title="Sobre cuál de los trazados de esta ruta estás dibujando"
                  style={{ position: 'absolute', inset: 0, width: '100%', opacity: 0, cursor: 'pointer' }}>
                  {lista.map(v => (
                    <option key={v.variantId} value={v.variantId}>
                      {v.name}{v.activa ? ' · midiendo' : ''}
                    </option>
                  ))}
                </select>
              </span>
            ) : (
              <div style={{
                height: 40, padding: '0 12px', display: 'flex', alignItems: 'center',
                background: HUD.surface, border: `1px solid ${HUD.line}`, borderRadius: 10,
                fontFamily: black, fontSize: 14,
              }}>{variante ? variante.name : (routeName || routeId)}</div>
            )}
            {desalineado && (
              <div style={{ ...rotulo(10, HUD.amber), letterSpacing: 1, marginTop: 8 }}>
                ◇ No es el que mide hoy
              </div>
            )}
          </div>

          <div style={{ height: 1, background: HUD.divider }} />

          {/* Tramo que se está dibujando. El circuito son dos: la combi va y
              vuelve, y no siempre por la misma calle. */}
          <div>
            <div style={{ ...rotulo(9), marginBottom: 8 }}>Tramo</div>
            <div style={{ display: 'flex', background: HUD.hueco, borderRadius: 10, padding: 3 }}>
              {[['ida', 'Ida'], ['vuelta', 'Vuelta']].map(([k, etiqueta]) => {
                const activo = tramo === k;
                return (
                  <button key={k} onClick={() => setTramo(k)} style={{
                    flex: 1, height: 34, borderRadius: 8, cursor: 'pointer',
                    fontSize: 13, fontWeight: 700, fontFamily: 'inherit',
                    background: activo ? HUD.surface : 'transparent',
                    border: `1px solid ${activo ? HUD.line : 'transparent'}`,
                    color: activo ? HUD.fg : HUD.dim2,
                  }}>{etiqueta}</button>
                );
              })}
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <div style={{ ...tarjeta('11px 12px'), borderRadius: 10 }}>
              <div style={rotulo(9)}>Puntos</div>
              <div style={{ fontFamily: black, fontSize: 22, marginTop: 4 }}>
                {puntos ? puntos.length : '—'}
              </div>
            </div>
            <div style={{ ...tarjeta('11px 12px'), borderRadius: 10 }}>
              <div style={rotulo(9)}>Largo</div>
              <div style={{ fontFamily: black, fontSize: 22, marginTop: 4 }}>
                {puntos ? kmDe(puntos) : '—'}
                <span style={{ fontFamily: mono, fontSize: 11, fontWeight: 700, color: HUD.dim2, marginLeft: 4 }}>KM</span>
              </div>
            </div>
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <button onClick={importarArchivo}
              title={`Un GPX o GeoJSON para la ${tramo}, por ejemplo de esa mitad grabada manejando`}
              style={{ ...btnSecundario(38), width: '100%', color: HUD.fg2 }}>
              Importar GPX o GeoJSON
            </button>
            {/* Las grabaciones de la calle (3.4): un chofer manejó la vuelta
                con el grabador de la app y el recorrido quedó en el servidor.
                Cargarlo acá lo pone como los puntos del tramo elegido — entra
                por el MISMO import (y su misma simplificación) que un GPX. */}
            <button onClick={() => {
              setVerGrabaciones(v => !v);
              if (!grabaciones) {
                api('/admin/grabaciones')
                  .then(d => setGrabaciones(d.grabaciones || []))
                  .catch(e => { setGrabaciones([]); setError(e.message); });
              }
            }} style={{ ...btnSecundario(38), width: '100%', color: HUD.fg2 }}>
              {verGrabaciones ? 'Ocultar grabaciones' : 'Grabaciones de la calle'}
            </button>
            {verGrabaciones && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                {!grabaciones && <span style={{ fontSize: 12, color: HUD.dim3 }}>Cargando…</span>}
                {grabaciones && grabaciones.length === 0 && (
                  <span style={{ fontSize: 12, color: HUD.dim3 }}>
                    No hay ninguna. Se graban desde la app del chofer: Perfil → Grabador de recorrido.
                  </span>
                )}
                {(grabaciones || []).map(g => (
                  <div key={g.id} style={{
                    ...tarjeta('8px 10px'), borderRadius: 8, display: 'flex',
                    alignItems: 'center', gap: 8,
                  }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{
                        fontSize: 12, fontWeight: 700, overflow: 'hidden',
                        textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                      }}>{g.nombre || `Recorrido de ${g.quien}`}</div>
                      <div style={{ fontFamily: mono, fontSize: 10, color: HUD.dim3 }}>
                        {g.quien} · {(g.largoM / 1000).toFixed(1)} km · {g.puntos} pts
                        · {new Date(g.createdAt).toLocaleDateString()}
                      </div>
                    </div>
                    <button onClick={() => {
                      api(`/admin/grabaciones/${g.id}.geojson`)
                        .then(geo => { importar(JSON.stringify(geo)); setVerGrabaciones(false); })
                        .catch(e => setError(e.message));
                    }} style={{ ...btnChico(HUD.fg2), flexShrink: 0 }}
                      title={`Cargar estos puntos como la ${tramo} (después ajustás y guardás como siempre)`}>
                      Usar en la {tramo}
                    </button>
                  </div>
                ))}
              </div>
            )}
            <button onClick={() => setPuntos(p => p.slice(0, -1))}
              disabled={!puntos || !puntos.length}
              style={{ ...btnSecundario(38), width: '100%', color: HUD.fg2, opacity: puntos && puntos.length ? 1 : .5 }}>
              Deshacer último punto
            </button>
            <button onClick={() => { setPuntos([]); setAviso(null); }}
              disabled={!puntos || !puntos.length}
              style={{
                ...btnSecundario(38), width: '100%', color: HUD.red,
                borderColor: HUD.rojoBorde, opacity: puntos && puntos.length ? 1 : .5,
              }}>
              Borrar la {tramo}
            </button>
            <input ref={archivoRef} type="file" accept=".gpx,.geojson,.json,.xml,text/*"
              style={{ display: 'none' }}
              onChange={(e) => {
                const f = e.target.files?.[0];
                if (!f) return;
                const fr = new FileReader();
                fr.onload = () => importar(String(fr.result));
                fr.onerror = () => setError('No se pudo abrir el archivo');
                fr.readAsText(f);
                e.target.value = '';
              }} />
          </div>

          <div style={{ fontSize: 12, color: HUD.dim3, lineHeight: 1.55 }}>
            Marcá el recorrido tocando el mapa en el orden en que se maneja: el
            primer punto es la salida (<strong>A</strong>) y el último el final
            (<strong>B</strong>).
            {puntos && puntos.length > TOPE_ARRASTRABLES
              ? ` Con más de ${TOPE_ARRASTRABLES} puntos no se pueden arrastrar (serían miles de marcadores): usá Deshacer.`
              : ' Arrastrá un punto para corregirlo, tocalo para borrarlo.'}
            {' '}El tramo que no estás editando queda punteado de fondo.
          </div>
        </div>

        {/* mapa */}
        <div style={{ flex: 1, minHeight: angosto ? 320 : 0, position: 'relative' }}>
          <div ref={initMap} style={{ position: 'absolute', inset: 0, cursor: 'crosshair' }} />
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// ADMINISTRACIÓN (fase 2)
// Personas, vehículos, rutas, vueltas y auditoría contra /admin/*.
//
// Ojo con la distinción, que es el corazón del modelo: una PERSONA
// (chofer o cobrador, con su nombre real y su alias) va arriba de un
// VEHÍCULO. Dos personas pueden compartir el mismo vehículo; el que
// reporta GPS es uno solo.
// ═══════════════════════════════════════════════════════════════
// ─── Piezas de Gestión ───────────────────────────────────────────
// Cada sección abre diciendo para qué sirve. La bajada no es decoración:
// es la diferencia entre que alguien toque un botón sabiendo qué hace y
// que lo toque a ver qué pasa.
function Seccion({ titulo, bajada, children }) {
  return (
    <div>
      <div style={{ fontFamily: black, fontSize: 24, letterSpacing: -0.3 }}>{titulo}</div>
      <div style={{
        fontSize: 13, color: HUD.dim2, lineHeight: 1.5,
        maxWidth: 640, margin: '8px 0 20px',
      }}>{bajada}</div>
      {children}
    </div>
  );
}

// Cabecera y filas comparten la misma rejilla, así las columnas quedan
// alineadas sin una <table>. La última columna va a la derecha (siempre es
// acciones o el número que se lee de un vistazo). En pantallas angostas la
// tabla se desplaza en horizontal en vez de aplastar las columnas.
function Tabla({ cols, cabeceras, ancho, children }) {
  const rejilla = { display: 'grid', gridTemplateColumns: cols, gap: 12, alignItems: 'center' };
  return (
    <div style={{ overflowX: 'auto' }}>
      <div style={{
        border: `1px solid ${HUD.divider}`, borderRadius: 12, overflow: 'hidden',
        minWidth: ancho || 0,
      }}>
        <div style={{
          ...rejilla, padding: '10px 14px', background: HUD.bg,
          borderBottom: `1px solid ${HUD.divider}`,
        }}>
          {cabeceras.map((c, i) => (
            <div key={i} style={{
              ...rotulo(9),
              textAlign: i === cabeceras.length - 1 && cabeceras.length > 1 ? 'right' : 'left',
            }}>{c}</div>
          ))}
        </div>
        {children}
      </div>
    </div>
  );
}

function FilaTabla({ cols, children }) {
  return (
    <div style={{
      display: 'grid', gridTemplateColumns: cols, gap: 12, alignItems: 'center',
      padding: '11px 14px', borderBottom: `1px solid ${HUD.hueco}`,
    }}>{children}</div>
  );
}

// Nota al pie de una sección: lo que hay que saber y no entra en la bajada
function Pie({ children }) {
  return (
    <div style={{ marginTop: 14, fontSize: 12, color: HUD.dim3, lineHeight: 1.5 }}>{children}</div>
  );
}

function Vacio({ children }) {
  return <div style={{ padding: '18px 14px', fontSize: 14, color: HUD.dim3 }}>{children}</div>;
}

// Punto de conexión
function Punto({ on, title }) {
  return <span title={title} style={{
    width: 7, height: 7, borderRadius: '50%', flexShrink: 0,
    background: on ? HUD.green : HUD.apagado,
  }} />;
}

// Confirmación que nombra sobre qué. Se usa en los dos únicos lugares donde
// una acción de Despacho le cambia el día a gente que está manejando.
function Confirmacion({ kicker, tono, titulo, cuerpo, aceptar, onAceptar, onCancelar }) {
  const fondo = tono === 'red' ? HUD.rojoFondo : HUD.ambarFondo;
  const borde = tono === 'red' ? HUD.rojoBorde : HUD.ambarBorde;
  const tinta = tono === 'red' ? HUD.rojoTinta : HUD.ambarTinta;
  const fuerte = tono === 'red' ? HUD.red : HUD.amber;
  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 4000, background: HUD.velo,
      display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16,
    }} onClick={onCancelar}>
      <div onClick={e => e.stopPropagation()} style={{
        width: 520, maxWidth: '100%', background: HUD.surface,
        border: `1px solid ${HUD.line}`, borderRadius: 16, padding: 24,
        boxShadow: '0 30px 60px -30px rgba(11,34,57,.55)',
      }}>
        <div style={{ ...rotulo(10, fuerte), letterSpacing: 1.6, marginBottom: 10 }}>{kicker}</div>
        <div style={{ fontFamily: black, fontSize: 21, lineHeight: 1.25 }}>{titulo}</div>
        <div style={{
          background: fondo, border: `1px solid ${borde}`, borderLeft: `3px solid ${fuerte}`,
          borderRadius: 11, padding: 13, margin: '16px 0 20px',
          fontSize: 13, lineHeight: 1.6, color: tinta,
        }}>{cuerpo}</div>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <button onClick={onAceptar} style={{
            ...btnPrimario(42), background: fuerte, borderRadius: 10,
          }}>{aceptar}</button>
          <button onClick={onCancelar} style={{ ...btnSecundario(42), borderRadius: 10 }}>
            No cambiar nada
          </button>
        </div>
      </div>
    </div>
  );
}

function AdminModal({ session, onClose, onAuthError, routes, currentRoute }) {
  const [tab, setTab] = React.useState('users'); // users | vehicles | routes | metrics | audit
  const [users, setUsers] = React.useState(null);
  const [events, setEvents] = React.useState(null);
  const [metrics, setMetrics] = React.useState(null);
  const [routeList, setRouteList] = React.useState(routes || []);
  const [vehicles, setVehicles] = React.useState(null);
  const [shifts, setShifts] = React.useState(null);
  const [rangoTurnos, setRangoTurnos] = React.useState('hoy'); // hoy | ayer | semana
  const [vueltas, setVueltas] = React.useState(null);
  // Alta de persona: cerrada de entrada. Ocho formularios abiertos a la vez
  // era lo que hacía que la pantalla se leyera como un tablero de controles.
  const [altaAbierta, setAltaAbierta] = React.useState(false);
  const [filtroRol, setFiltroRol] = React.useState('');
  // Rango de los informes, en fechas y no en botones de "últimos N días":
  // la cooperativa pide "del 1 al 15", no "los últimos 14 días".
  const [rangoInf, setRangoInf] = React.useState(() => {
    const iso = (t) => new Date(t).toISOString().slice(0, 10);
    return { desde: iso(Date.now() - 29 * 86400e3), hasta: iso(Date.now()) };
  });
  // Cambio del trazado con el que se mide: { ruta, v, actual }
  const [confirmVar, setConfirmVar] = React.useState(null);
  // Bajo 900 px el riel no cabe al lado del contenido. No vuelve a ser una
  // fila de ocho pestañas: se convierte en un desplegable.
  const [angosto, setAngosto] = React.useState(window.innerWidth < 900);
  React.useEffect(() => {
    const onResize = () => setAngosto(window.innerWidth < 900);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  const [empresa, setEmpresa] = React.useState(null);
  const [empForm, setEmpForm] = React.useState({ name: '', ruc: '', contacto: '' });
  // Los números de gerencia (pestaña Números, solo del gerente)
  const [resumenGer, setResumenGer] = React.useState(null);
  const [diasGer, setDiasGer] = React.useState(7);
  const [nuevoVeh, setNuevoVeh] = React.useState({ vehicleId: '', label: '' });
  // Ruta cuyo recorrido se está trazando (null = trazador cerrado)
  const [trazando, setTrazando] = React.useState(null);
  const esSupervisor = !!session.supervisor;
  // El gerente usa este mismo panel con más permisos: los ACTIVOS (vehículos
  // con placa, datos de la empresa, logo) son suyos; la operación del día es
  // de los dos.
  const esGerente = session.role === 'manager';
  const [error, setError] = React.useState(null);
  const [okMsg, setOkMsg] = React.useState(null);
  // personRole: 'driver' (chofer, maneja y reporta GPS) | 'collector' (cobrador)
  // name es obligatorio; alias es opcional y es lo que se muestra en el chat.
  const [form, setForm] = React.useState({
    unitId: '', name: '', alias: '', personRole: 'driver', vehicleId: '', password: '',
    routeId: session.routeId || currentRoute || '',
  });
  const [resetFor, setResetFor] = React.useState(null);
  const [resetPass, setResetPass] = React.useState('');
  // Corregir nombre/alias de alguien ya cargado (las cuentas viejas quedaron
  // con el código de la unidad como nombre)
  const [editFor, setEditFor] = React.useState(null);
  const [editForm, setEditForm] = React.useState({ name: '', alias: '' });
  const [confirmDel, setConfirmDel] = React.useState(null);
  const [busy, setBusy] = React.useState(false);
  const [filter, setFilter] = React.useState('');
  // Credenciales recién generadas: se muestran UNA vez, para dictarlas o
  // anotarlas. Después ya no hay forma de recuperar la clave (va cifrada).
  const [credential, setCredential] = React.useState(null);
  const [copied, setCopied] = React.useState(false);

  const api = async (path, opts = {}) => {
    const res = await fetch(HTTP_URL + path, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + session.token,
        ...(opts.headers || {}),
      },
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) { onAuthError(); throw new Error('Sesión expirada'); }
    if (!res.ok) throw new Error(data.error || 'Error del servidor');
    return data;
  };

  const load = () => api('/admin/users')
    .then(d => { setUsers(d.users); })
    .catch(e => setError(e.message));

  const loadAudit = () => api('/admin/audit')
    .then(d => { setEvents(d.events); })
    .catch(e => setError(e.message));

  const loadMetrics = () => api('/admin/metrics')
    .then(d => { setMetrics(d.metrics); })
    .catch(e => setError(e.message));

  const loadRoutes = () => api('/admin/routes')
    .then(d => { setRouteList(d.routes || []); })
    .catch(e => setError(e.message));

  const loadVehicles = () => api('/admin/vehicles')
    .then(d => { setVehicles(d.vehicles || []); })
    .catch(e => setError(e.message));

  // Los tres rangos se piden con el mismo `desde`. "Ayer" se recorta acá
  // porque el endpoint no toma un `hasta`, y no vale la pena inventarle uno
  // a la API para acotar una lista de 500 filas.
  const inicioDeHoy = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const loadShifts = (rango = rangoTurnos) => {
    const hoy = inicioDeHoy();
    const desde = rango === 'hoy' ? hoy : rango === 'ayer' ? hoy - 86400e3 : hoy - 6 * 86400e3;
    return api(`/admin/shifts?desde=${desde}`)
      .then(d => setShifts({ ...d, rango }))
      .catch(e => setError(e.message));
  };

  const loadVueltas = () => {
    const ruta = esSupervisor && currentRoute ? `?routeId=${encodeURIComponent(currentRoute)}` : '';
    return api('/admin/vueltas' + ruta)
      .then(d => setVueltas(d))
      .catch(e => setError(e.message));
  };

  const loadGerencia = (dias = diasGer) => {
    const hasta = Date.now();
    return api(`/gerencia/resumen?desde=${hasta - dias * 86400000}&hasta=${hasta}`)
      .then(setResumenGer).catch(e => setError(e.message));
  };
  const loadEmpresa = () => api('/admin/company')
    .then(d => {
      setEmpresa(d);
      setEmpForm({
        name: d.empresa.name || '', ruc: d.empresa.ruc || '',
        contacto: d.empresa.contacto || '',
      });
    })
    .catch(e => setError(e.message));

  React.useEffect(() => { load(); loadRoutes(); loadVehicles(); }, []);
  React.useEffect(() => {
    if (tab === 'audit') loadAudit();
    if (tab === 'metrics') { loadMetrics(); loadVueltas(); }
    if (tab === 'routes') loadRoutes();
    if (tab === 'vehicles') loadVehicles();
    if (tab === 'shifts') loadShifts();
    if (tab === 'empresa') loadEmpresa();
    if (tab === 'gerencia') loadGerencia();
  }, [tab]);

  const run = async (fn, ok) => {
    setBusy(true); setError(null); setOkMsg(null); setCredential(null); setCopied(false);
    try { await fn(); if (ok) setOkMsg(ok); await load(); }
    catch (e) { setError(e.message); }
    setBusy(false);
  };

  // Cambiar el trazado con el que se mide una ruta le cambia el mapa a todos
  // los que están manejando en ese momento y descarta las vueltas en curso.
  // Por eso se confirma, y el cartel dice qué se pierde.
  const pedirCambioDeTrazado = (ruta, variantId) => {
    const v = (ruta.variantes || []).find(x => x.variantId === variantId);
    if (!v || v.activa) return;
    if (!v.puntos) {
      setError(`"${v.name}" todavía no tiene recorrido dibujado. Cargalo antes de activarla.`);
      return;
    }
    setConfirmVar({ ruta, v, actual: (ruta.variantes || []).find(x => x.activa) || null });
  };

  const confirmarCambioDeTrazado = () => {
    const { ruta, v } = confirmVar;
    setConfirmVar(null);
    run(async () => {
      await api(`/admin/routes/${encodeURIComponent(ruta.routeId)}/variantes/${v.variantId}/activar`,
        { method: 'POST' });
      await loadRoutes();
    }, `${ruta.routeId} ahora mide con "${v.name}"`);
  };

  const cambiarObjetivo = (routeId, cambio) => run(async () => {
    await api(`/admin/routes/${encodeURIComponent(routeId)}/target`, {
      method: 'POST', body: JSON.stringify(cambio),
    });
    await loadRoutes();
  }, 'Objetivo actualizado');

  const crearVehiculo = () => run(async () => {
    await api('/admin/vehicles', {
      method: 'POST',
      body: JSON.stringify({ ...nuevoVeh, routeId: form.routeId || undefined }),
    });
    setNuevoVeh({ vehicleId: '', label: '' });
    await loadVehicles();
  }, 'Vehículo creado');

  // Clave fácil de dictar por teléfono: sin caracteres ambiguos
  const suggestPassword = () => {
    const words = ['combi', 'ruta', 'puno', 'juliaca', 'terminal', 'micro', 'andes', 'titicaca'];
    const w = words[Math.floor(Math.random() * words.length)];
    return `${w}${Math.floor(1000 + Math.random() * 9000)}`;
  };

  const create = () => run(async () => {
    const payload = { ...form, password: form.password || suggestPassword() };
    const r = await api('/admin/users', { method: 'POST', body: JSON.stringify(payload) });
    setCredential({
      unitId: payload.unitId, password: payload.password, routeId: r.routeId,
      isNew: true, name: payload.name, alias: payload.alias,
      role: r.role, vehicleId: r.vehicleId,
    });
    setForm(f => ({
      unitId: '', name: '', alias: '', personRole: f.personRole,
      vehicleId: '', password: '', routeId: f.routeId,
    }));
    // Un alta de chofer puede haber creado su vehículo sola
    await loadVehicles();
  }, null);

  const editarIdentidad = (unitId) => run(async () => {
    await api(`/admin/users/${encodeURIComponent(unitId)}/identity`, {
      method: 'POST', body: JSON.stringify(editForm),
    });
    setEditFor(null);
    await loadVehicles();
  }, 'Identidad actualizada');

  const resetPassword = (unitId) => run(async () => {
    const password = resetPass || suggestPassword();
    await api(`/admin/users/${encodeURIComponent(unitId)}/password`, {
      method: 'POST', body: JSON.stringify({ password }),
    });
    setCredential({ unitId, password, isNew: false });
    setResetFor(null); setResetPass('');
  }, null);

  const remove = (unitId) => run(async () => {
    await api(`/admin/users/${encodeURIComponent(unitId)}`, { method: 'DELETE' });
    setConfirmDel(null);
  }, `${unitId} dado de baja`);

  // Buscar por cualquiera de sus datos: quien atiende despacho puede saber
  // el alias y no el nombre, o tener a mano solo el número de la combi.
  const coincide = (u, q) =>
    [u.unitId, u.name, u.alias, u.driverName, u.vehicleId, u.routeId]
      .filter(Boolean).join(' ').toLowerCase().includes(q);

  if (trazando) {
    return (
      <Trazador
        routeId={trazando.routeId}
        routeName={trazando.name}
        variantes={trazando.variantes}
        api={api}
        onClose={() => setTrazando(null)}
        onGuardado={() => loadRoutes()}
      />
    );
  }

  // El riel en tres grupos. Nombra para qué es cada cosa antes de nombrar la
  // cosa: "operación del día" y "ruta y medición" no se mezclan aunque las
  // ocho secciones vivan en el mismo lugar.
  const GRUPOS = [
    ['Operación del día', [
      ['users', 'Personas', users ? users.length : null],
      ['vehicles', 'Vehículos', vehicles ? vehicles.length : null],
      ['shifts', 'Turnos', { hoy: 'hoy', ayer: 'ayer', semana: '7 días' }[rangoTurnos]],
    ]],
    ['Ruta y medición', [
      ['routes', 'Rutas', routeList.length || null],
      ['metrics', 'Vueltas', vueltas ? vueltas.resumen.cerradas : null],
      ['informes', 'Informes', null],
    ]],
    ['La cooperativa', [
      ['empresa', 'Empresa', null],
      // Los números del período — la vieja pantalla de gerencia.html, ahora
      // adentro del panel. Solo la ve la cuenta de gerencia: nadie audita su
      // propio trabajo.
      ...(esGerente ? [['gerencia', 'Números', null]] : []),
      ['audit', 'Actividad', '↺'],
    ]],
  ];
  const TITULOS = {
    users: ['Personas', 'Choferes, cobradores y encargados de la cooperativa. Acá se dan de alta, se corrigen los datos, se resetean claves y se dan de baja.'],
    vehicles: ['Vehículos', 'Las combis físicas de la cooperativa y quién va arriba de cada una hoy.'],
    routes: ['Rutas', 'Objetivo de brecha, recorrido cargado y con cuál de los trazados se está midiendo. Los trazados los crea el nivel de arriba; acá se elige.'],
    shifts: ['Turnos', 'Entradas y salidas de la jornada, por unidad.'],
    metrics: ['Vueltas', 'Cada vuelta cerrada con su duración y la brecha promedio que mantuvo.'],
    informes: ['Informes', 'Descargas para la cooperativa: vueltas, brechas y turnos en un rango de fechas.'],
    empresa: ['Empresa', 'Datos de la cooperativa que se muestran en el panel y en la app del chofer.'],
    audit: ['Actividad', 'Todo lo que se hizo en el panel de esta cooperativa. Solo la de ustedes.'],
    gerencia: ['Números', 'Cumplimiento, vueltas, horas y SOS del período, por unidad. Cada vuelta se juzga contra el objetivo que regía cuando se cerró.'],
  };

  const fmtSeg = (s) => s == null ? '—'
    : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
  const hhmm = (ts) => {
    const d = new Date(ts);
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  };

  const rielItem = (key, etiqueta, cuenta) => (
    <button key={key} onClick={() => setTab(key)} style={{
      display: 'flex', alignItems: 'center', gap: 10, width: '100%',
      padding: '9px 10px', borderRadius: 9, border: 'none', cursor: 'pointer',
      textAlign: 'left', fontSize: 13, fontWeight: 700, fontFamily: 'inherit',
      background: tab === key ? HUD.surface : 'transparent',
      color: tab === key ? HUD.fg : HUD.dim,
    }}>
      <span style={{
        width: 3, height: 16, borderRadius: 2, flexShrink: 0,
        background: tab === key ? HUD.bright : 'transparent',
      }} />
      <span style={{ flex: 1, minWidth: 0 }}>{etiqueta}</span>
      {cuenta !== null && cuenta !== undefined && (
        <span style={{ fontFamily: mono, fontSize: 10, fontWeight: 700, color: HUD.dim3 }}>{cuenta}</span>
      )}
    </button>
  );

  const [tituloSec, bajadaSec] = TITULOS[tab] || ['', ''];

  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 3000, background: HUD.bg,
      display: 'flex', flexDirection: 'column',
    }}>
      {/* header */}
      <div style={{
        height: 60, flexShrink: 0, display: 'flex', alignItems: 'center', gap: 12,
        padding: '0 18px', background: HUD.surface,
        borderBottom: `1px solid ${HUD.divider}`,
      }}>
        <span style={{ fontFamily: black, fontSize: 17 }}>Gestión</span>
        <span style={{
          ...rotulo(10, HUD.dim2), letterSpacing: 1.5, minWidth: 0,
          overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
        }}>
          {session.companyName || session.companyId || ''}{currentRoute ? ` · ${currentRoute}` : ''}
        </span>
        <div style={{ flex: 1 }} />
        <button onClick={onClose} style={btnSecundario(36)}>✕ Volver al mapa</button>
      </div>

      <div style={{
        flex: 1, minHeight: 0,
        display: 'grid', gridTemplateColumns: angosto ? '1fr' : '232px 1fr',
      }}>
        {!angosto && (
          <div style={{
            background: HUD.bg, borderRight: `1px solid ${HUD.divider}`,
            padding: '16px 12px', overflowY: 'auto',
          }}>
            {GRUPOS.map(([titulo, items]) => (
              <div key={titulo} style={{ marginBottom: 14 }}>
                <div style={{ ...rotulo(9), letterSpacing: 1.6, padding: '0 8px 8px' }}>{titulo}</div>
                {items.map(([k, e, c]) => rielItem(k, e, c))}
              </div>
            ))}
          </div>
        )}

        {/* contenido */}
        <div style={{ overflowY: 'auto', padding: angosto ? '16px 14px 40px' : '24px 28px 40px' }}>
          <div style={{ maxWidth: 940 }}>
            {angosto && (
              <select value={tab} onChange={e => setTab(e.target.value)}
                style={{ ...campo(44), width: '100%', marginBottom: 18, fontWeight: 700, cursor: 'pointer' }}>
                {GRUPOS.map(([titulo, items]) => (
                  <optgroup key={titulo} label={titulo}>
                    {items.map(([k, e2, c]) => (
                      <option key={k} value={k}>{e2}{c !== null && c !== undefined ? ` (${c})` : ''}</option>
                    ))}
                  </optgroup>
                ))}
              </select>
            )}
            {error && (
              <div style={{
                background: HUD.rojoFondo, border: `1px solid ${HUD.rojoBorde}`,
                borderLeft: `3px solid ${HUD.red}`, borderRadius: 11,
                padding: '11px 13px', marginBottom: 16,
                fontSize: 13, fontWeight: 700, color: HUD.rojoTinta,
              }}>{error}</div>
            )}
            {okMsg && (
              <div style={{
                background: HUD.verdeFondo, border: `1px solid ${HUD.verdeBorde}`,
                borderRadius: 11, padding: '11px 13px', marginBottom: 16,
                fontSize: 13, fontWeight: 700, color: HUD.verdeTinta,
              }}>{okMsg}</div>
            )}

            <Seccion titulo={tituloSec} bajada={bajadaSec}>

            {/* ─── PERSONAS ─────────────────────────────────────── */}
            {tab === 'users' && (<div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 14 }}>
                <input placeholder="Buscar por nombre, alias o unidad" value={filter}
                  onChange={e => setFilter(e.target.value)}
                  style={{ ...campo(40), flex: '1 1 260px' }} />
                <span style={{ position: 'relative', display: 'inline-flex' }}>
                  <span style={{
                    display: 'flex', alignItems: 'center', gap: 8, height: 40, padding: '0 12px',
                    background: HUD.surface, border: `1px solid ${HUD.line}`, borderRadius: 10,
                    fontSize: 13, fontWeight: 700, color: HUD.fg2, whiteSpace: 'nowrap',
                  }}>
                    {{ '': 'Todos los roles', driver: 'Choferes', collector: 'Cobradores', dispatch: 'Despacho' }[filtroRol]}
                    <span style={{ fontSize: 11, color: HUD.dim3 }}>▾</span>
                  </span>
                  <select value={filtroRol} onChange={e => setFiltroRol(e.target.value)}
                    style={{ position: 'absolute', inset: 0, opacity: 0, cursor: 'pointer', width: '100%' }}>
                    <option value="">Todos los roles</option>
                    <option value="driver">Choferes</option>
                    <option value="collector">Cobradores</option>
                    <option value="dispatch">Despacho</option>
                  </select>
                </span>
                <button onClick={() => setAltaAbierta(a => !a)} style={btnPrimario(40)}>
                  {altaAbierta ? '✕ Cerrar' : '+ Persona'}
                </button>
              </div>

              {/* alta de PERSONA: nombre obligatorio, alias opcional, rol y vehículo */}
              {altaAbierta && (
                <div style={{
                  background: HUD.bg, border: `1px solid ${HUD.divider}`,
                  borderRadius: 12, padding: 14, marginBottom: 16,
                }}>
                  <div style={{ ...rotulo(9), marginBottom: 10 }}>Alta de persona</div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 8 }}>
                    <span style={{ display: 'flex', flex: '0 0 auto', borderRadius: 10, overflow: 'hidden', border: `1px solid ${HUD.line}` }}>
                      {[['driver', 'CHOFER'], ['collector', 'COBRADOR']].map(([k, l]) => (
                        <button key={k} onClick={() => setForm(f => ({ ...f, personRole: k }))}
                          title={k === 'driver'
                            ? 'Maneja y su celular reporta la posición de la unidad'
                            : 'Va arriba, ve brechas y chat, pero no reporta posición'}
                          style={{
                            border: 'none', padding: '0 14px', height: 40, cursor: 'pointer',
                            fontFamily: mono, fontSize: 11, fontWeight: 700, letterSpacing: 1,
                            background: form.personRole === k ? HUD.bright : HUD.surface,
                            color: form.personRole === k ? '#fff' : HUD.dim2,
                          }}>{l}</button>
                      ))}
                    </span>
                    <input placeholder="Nombre y apellido *" value={form.name}
                      onChange={e => setForm(f => ({ ...f, name: e.target.value }))}
                      title="Obligatorio: es el nombre que queda en los registros de la empresa"
                      style={{ ...campo(40), flex: '2 1 180px' }} />
                    <input placeholder="Alias (opcional)" value={form.alias}
                      onChange={e => setForm(f => ({ ...f, alias: e.target.value }))}
                      title="Cómo lo llaman en la ruta. Si lo pones, es lo que se ve en el chat"
                      style={{ ...campo(40), flex: '1 1 130px' }} />
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                    {esSupervisor && routeList.length > 0 && (
                      <select value={form.routeId}
                        onChange={e => setForm(f => ({ ...f, routeId: e.target.value, vehicleId: '' }))}
                        title="Ruta en la que trabaja"
                        style={{ ...campo(40), flex: '0 1 110px', cursor: 'pointer' }}>
                        {routeList.map(r => <option key={r.routeId} value={r.routeId}>{r.routeId}</option>)}
                      </select>
                    )}
                    <input placeholder="Usuario para entrar *" value={form.unitId}
                      onChange={e => setForm(f => ({ ...f, unitId: e.target.value }))}
                      title="Con esto se identifica en la app (ej. M-21 para el chofer, M-21C para su cobrador)"
                      style={{ ...campo(40), flex: '1 1 140px' }} />
                    <select value={form.vehicleId}
                      onChange={e => setForm(f => ({ ...f, vehicleId: e.target.value }))}
                      title="Vehículo en el que va"
                      style={{ ...campo(40), flex: '1 1 150px', cursor: 'pointer' }}>
                      <option value="">
                        {form.personRole === 'driver' ? 'Vehículo: crear con su código' : 'Vehículo… (obligatorio)'}
                      </option>
                      {(vehicles || [])
                        .filter(v => !form.routeId || v.routeId === form.routeId)
                        .map(v => (
                          <option key={v.vehicleId} value={v.vehicleId}>
                            {v.vehicleId}{v.label ? ` · ${v.label}` : ''}
                          </option>
                        ))}
                    </select>
                    <span style={{ display: 'flex', flex: '1 1 150px', gap: 4, minWidth: 0 }}>
                      <input placeholder="Contraseña (o generar →)" value={form.password}
                        onChange={e => setForm(f => ({ ...f, password: e.target.value }))}
                        style={{ ...campo(40), flex: 1 }} />
                      <button title="Generar una clave fácil de dictar"
                        onClick={() => setForm(f => ({ ...f, password: suggestPassword() }))}
                        style={{ ...btnSecundario(40), width: 40, padding: 0 }}>⟳</button>
                    </span>
                    <button onClick={create} disabled={busy} style={btnPrimario(40)}>+ Alta</button>
                  </div>
                  <div style={{ fontSize: 12, color: HUD.dim3, marginTop: 10, lineHeight: 1.5 }}>
                    {form.personRole === 'driver'
                      ? 'El chofer maneja: su celular es el que reporta la posición de la unidad. Si no eliges vehículo, se crea uno con el mismo código del usuario.'
                      : 'El cobrador necesita un vehículo ya creado. Ve brechas, mapa y chat, pero su GPS no se usa.'}
                  </div>
                </div>
              )}

              {/* credenciales para dictar — se ven una sola vez */}
              {credential && (
                <div style={{
                  background: HUD.verdeFondo, border: `1px solid ${HUD.verdeBorde}`,
                  borderLeft: `3px solid ${HUD.green}`,
                  borderRadius: 12, padding: 16, marginBottom: 16,
                }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: HUD.verdeTinta, marginBottom: 10 }}>
                    {credential.isNew
                      ? `✓ ${credential.role === 'collector' ? 'Cobrador' : 'Chofer'} dado de alta${
                          credential.vehicleId ? ' en ' + credential.vehicleId : ''}${
                          credential.routeId ? ' · ruta ' + credential.routeId : ''}`
                      : '✓ Contraseña reseteada — su sesión fue cerrada'}
                    {' '}· anotá o dictá estos datos ahora
                  </div>
                  {credential.isNew && credential.name && (
                    <div style={{ fontSize: 14, color: HUD.fg2, marginBottom: 10 }}>
                      {credential.name}{credential.alias ? ` — le dicen “${credential.alias}”` : ''}
                    </div>
                  )}
                  <div style={{ display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'flex-end' }}>
                    <div>
                      <div style={rotulo(9)}>Usuario</div>
                      <div style={{ fontFamily: black, fontSize: 22 }}>{credential.unitId}</div>
                    </div>
                    <div>
                      <div style={rotulo(9)}>Contraseña</div>
                      <div style={{ fontFamily: black, fontSize: 22, color: HUD.okClave, userSelect: 'all' }}>{credential.password}</div>
                    </div>
                    <div style={{ flex: 1 }} />
                    <span style={{ display: 'flex', gap: 8 }}>
                      <button onClick={() => {
                        const txt = `Unidad: ${credential.unitId}\nContraseña: ${credential.password}`;
                        navigator.clipboard?.writeText(txt).then(() => setCopied(true)).catch(() => {});
                      }} style={btnChico(HUD.verdeTinta, HUD.verdeBorde)}>{copied ? '✓ Copiado' : 'Copiar'}</button>
                      <button onClick={() => setCredential(null)} style={btnChico(HUD.dim2)}>Ocultar</button>
                    </span>
                  </div>
                  <div style={{ fontSize: 12, color: HUD.dim2, marginTop: 10, lineHeight: 1.5 }}>
                    Las contraseñas se guardan cifradas y no se pueden volver a ver: si un
                    chofer la pierde, se le genera una nueva con <strong>Clave</strong>.
                  </div>
                </div>
              )}

              {!users && <Vacio>Cargando…</Vacio>}
              {users && (() => {
                const q = filter.trim().toLowerCase();

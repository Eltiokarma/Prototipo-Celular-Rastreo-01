                const rolDe = (u) => u.role === 'dispatch' ? 'dispatch'
                  : u.role === 'collector' ? 'collector' : 'driver';
                const lista = users.filter(u =>
                  (!q || coincide(u, q)) && (!filtroRol || rolDe(u) === filtroRol));
                const cols = '150px 1fr 96px 90px 128px 200px';
                return (
                  <Tabla cols={cols} ancho={880}
                    cabeceras={['Persona', 'Identidad', 'Rol', 'Unidad', 'Última conexión', 'Acciones']}>
                    {lista.length === 0 && <Vacio>Nadie coincide con lo buscado.</Vacio>}
                    {lista.map(u => (
                      <React.Fragment key={u.unitId}>
                        <FilaTabla cols={cols}>
                          <span style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
                            <Punto on={u.online} title={u.online ? 'Conectado' : 'Desconectado'} />
                            <span style={{
                              fontFamily: black, fontSize: 14, minWidth: 0,
                              overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                            }}>{u.unitId}</span>
                          </span>
                          <span style={{
                            fontSize: 13, color: HUD.fg2, minWidth: 0,
                            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                          }}>
                            {u.alias
                              ? <>{u.name || u.driverName} <span style={{ color: HUD.dim3 }}>({u.alias})</span></>
                              : (u.name || u.driverName || '—')}
                          </span>
                          <span style={rotulo(10, HUD.dim2)}>
                            {u.role === 'dispatch' ? 'Despacho' : u.role === 'collector' ? 'Cobrador' : 'Chofer'}
                          </span>
                          <span style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color: HUD.fg2 }}>
                            {u.vehicleId || '—'}
                          </span>
                          <span style={{ fontFamily: mono, fontSize: 11, color: u.lastLogin || u.online ? HUD.dim3 : HUD.amber }}>
                            {u.online ? 'conectado' : u.lastLogin ? fmtWhen(u.lastLogin) : 'nunca entró'}
                          </span>
                          <span style={{ display: 'flex', gap: 6, justifyContent: 'flex-end' }}>
                            <button onClick={() => { setResetFor(u.unitId); setConfirmDel(null); setEditFor(null); setResetPass(''); }}
                              style={btnChico(HUD.fg2)}>Clave</button>
                            {u.role !== 'dispatch' && (
                              <button title="Corregir nombre o alias"
                                onClick={() => {
                                  setEditFor(u.unitId);
                                  setEditForm({ name: u.name || u.driverName || '', alias: u.alias || '' });
                                  setResetFor(null); setConfirmDel(null);
                                }}
                                style={btnChico(HUD.fg2)}>Editar</button>
                            )}
                            {u.role !== 'dispatch' && (
                              confirmDel === u.unitId ? (
                                <button onClick={() => remove(u.unitId)} disabled={busy}
                                  style={{ ...btnChico('#fff', HUD.red), background: HUD.red }}>¿Confirmar?</button>
                              ) : (
                                <button onClick={() => { setConfirmDel(u.unitId); setResetFor(null); setEditFor(null); }}
                                  style={btnChico(HUD.red, HUD.rojoBorde)}>Baja</button>
                              )
                            )}
                          </span>
                        </FilaTabla>
                        {/* El formulario abre debajo de su fila en vez de
                            exprimirse dentro de la columna de acciones */}
                        {editFor === u.unitId && (
                          <div style={{
                            display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center',
                            padding: '12px 14px', background: HUD.bg,
                            borderBottom: `1px solid ${HUD.hueco}`,
                          }}>
                            <span style={rotulo(9)}>Corregir</span>
                            <input autoFocus placeholder="Nombre y apellido *" value={editForm.name}
                              onChange={e => setEditForm(f => ({ ...f, name: e.target.value }))}
                              onKeyDown={e => { if (e.key === 'Enter') editarIdentidad(u.unitId); }}
                              style={{ ...campo(36), flex: '1 1 200px' }} />
                            <input placeholder="Alias" value={editForm.alias}
                              onChange={e => setEditForm(f => ({ ...f, alias: e.target.value }))}
                              onKeyDown={e => { if (e.key === 'Enter') editarIdentidad(u.unitId); }}
                              style={{ ...campo(36), flex: '1 1 140px' }} />
                            <button onClick={() => editarIdentidad(u.unitId)} disabled={busy}
                              style={btnPrimario(36)}>Guardar</button>
                            <button onClick={() => setEditFor(null)} style={btnSecundario(36)}>Cancelar</button>
                          </div>
                        )}
                        {resetFor === u.unitId && (
                          <div style={{
                            display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center',
                            padding: '12px 14px', background: HUD.bg,
                            borderBottom: `1px solid ${HUD.hueco}`,
                          }}>
                            <span style={rotulo(9)}>Nueva clave de {u.unitId}</span>
                            <input autoFocus placeholder="Dejala vacía y se genera una" value={resetPass}
                              onChange={e => setResetPass(e.target.value)}
                              onKeyDown={e => { if (e.key === 'Enter') resetPassword(u.unitId); }}
                              style={{ ...campo(36), flex: '1 1 200px' }} />
                            <button onClick={() => resetPassword(u.unitId)} disabled={busy}
                              style={btnPrimario(36)}>Resetear</button>
                            <button onClick={() => { setResetFor(null); setResetPass(''); }}
                              style={btnSecundario(36)}>Cancelar</button>
                          </div>
                        )}
                      </React.Fragment>
                    ))}
                  </Tabla>
                );
              })()}
              <Pie>
                Cada persona tiene <strong>su propia cuenta</strong>: el alta se hace
                solo desde acá y el login de la app rechaza usuarios no registrados.
                Resetear la clave o dar de baja cierra su sesión al instante, y no
                toca a nadie más que vaya en el mismo vehículo.
              </Pie>
            </div>)}

            {/* ─── VEHÍCULOS ────────────────────────────────────── */}
            {tab === 'vehicles' && (<div>
              {!esGerente && (
                <div style={{
                  background: HUD.bg, border: `1px solid ${HUD.divider}`,
                  borderRadius: 12, padding: '12px 14px', marginBottom: 16,
                  fontSize: 13, color: HUD.dim2, lineHeight: 1.5,
                }}>
                  Los vehículos (con su placa) los da de alta la <strong>cuenta de
                  gerencia</strong>: son los activos de la cooperativa. Acá se ve la
                  flota y quién va arriba de cada una.
                </div>
              )}
              {esGerente && (
              <div style={{
                background: HUD.bg, border: `1px solid ${HUD.divider}`,
                borderRadius: 12, padding: 14, marginBottom: 16,
                display: 'flex', flexWrap: 'wrap', gap: 8,
              }}>
                <div style={{ ...rotulo(9), width: '100%' }}>Alta de vehículo</div>
                {esSupervisor && routeList.length > 0 && (
                  <select value={form.routeId}
                    onChange={e => setForm(f => ({ ...f, routeId: e.target.value }))}
                    title="Ruta en la que trabaja el vehículo"
                    style={{ ...campo(40), flex: '0 1 120px', cursor: 'pointer' }}>
                    {routeList.map(r => <option key={r.routeId} value={r.routeId}>{r.routeId}</option>)}
                  </select>
                )}
                <input placeholder="Código (ej. M-21)" value={nuevoVeh.vehicleId}
                  onChange={e => setNuevoVeh(v => ({ ...v, vehicleId: e.target.value }))}
                  style={{ ...campo(40), flex: '1 1 130px' }} />
                <input placeholder="Placa o descripción (opcional)" value={nuevoVeh.label}
                  onChange={e => setNuevoVeh(v => ({ ...v, label: e.target.value }))}
                  style={{ ...campo(40), flex: '1 1 180px' }} />
                <button onClick={crearVehiculo} disabled={busy} style={btnPrimario(40)}>+ Vehículo</button>
              </div>
              )}

              {!vehicles && <Vacio>Cargando…</Vacio>}
              {vehicles && vehicles.length === 0 && (
                <Vacio>Todavía no hay vehículos. Los da de alta la cuenta de gerencia (o se crean solos cuando la gerencia carga a un chofer con su combi).</Vacio>
              )}
              {vehicles && vehicles.length > 0 && (() => {
                const cols = '120px 84px 1fr 220px 96px';
                return (
                  <Tabla cols={cols} ancho={760}
                    cabeceras={['Vehículo', 'Ruta', 'Placa', 'Tripulación', 'Estado']}>
                    {vehicles.map(v => {
                      const asignados = (users || []).filter(u => u.vehicleId === v.vehicleId);
                      const arriba = (v.tripulacion || []).length;
                      return (
                        <FilaTabla key={v.vehicleId} cols={cols}>
                          <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                            <Punto on={v.enLinea} title={v.enLinea ? 'En ruta ahora' : 'Fuera de ruta'} />
                            <span style={{ fontFamily: black, fontSize: 14 }}>{v.vehicleId}</span>
                          </span>
                          <span style={{ fontFamily: mono, fontSize: 11, fontWeight: 700, color: HUD.bright }}>
                            {v.routeId || '—'}
                          </span>
                          <span style={{
                            fontSize: 13, color: v.label ? HUD.fg2 : HUD.dim3, minWidth: 0,
                            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                          }}>{v.label || 'sin placa'}</span>
                          <span style={{
                            fontFamily: mono, fontSize: 11, color: HUD.dim2, minWidth: 0,
                            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                          }}>
                            {asignados.length === 0 ? 'sin asignar'
                              : asignados.map(u => `${u.alias || u.name}${u.role === 'collector' ? ' (cobr.)' : ''}`).join(' · ')}
                          </span>
                          <span style={{
                            ...rotulo(10, arriba ? HUD.green : v.enLinea ? HUD.amber : HUD.dim3),
                            textAlign: 'right',
                          }}>{arriba ? `${arriba} arriba` : v.enLinea ? 'en línea' : 'parada'}</span>
                        </FilaTabla>
                      );
                    })}
                  </Tabla>
                );
              })()}
              <Pie>
                El vehículo es la combi física; las personas se dan de alta en
                <strong> Personas</strong> y se le asignan. Pueden ir dos arriba
                (chofer y cobrador) pero <strong>solo el chofer reporta la
                posición</strong>: así la unidad no salta entre dos celulares.
              </Pie>
            </div>)}

            {/* ─── RUTAS ────────────────────────────────────────── */}
            {tab === 'routes' && (<div>
              {routeList.length === 0 && <Vacio>Cargando…</Vacio>}
              {routeList.map(r => {
                const activa = (r.variantes || []).find(v => v.activa);
                const modo = r.objetivo ? r.objetivo.modo : null;
                const chip = !r.objetivo ? null
                  : modo === 'auto'
                    ? [`AUTO · ${r.objetivo.vueltas} vueltas`, HUD.verdeFondo, HUD.verdeTinta]
                    : modo === 'esperando'
                      ? [r.objetivo.motivo === 'unidades'
                          ? 'AUTO · sin unidades en ruta'
                          : `AUTO · faltan vueltas (${r.objetivo.vueltas}/3)`, HUD.ambarFondo, HUD.ambarTinta2]
                      : ['A MANO', HUD.hueco, HUD.dim2];
                return (
                  <div key={r.routeId} style={{
                    border: `1px solid ${HUD.divider}`, borderRadius: 12, padding: 16, marginBottom: 14,
                    background: r.routeId === currentRoute ? HUD.filaActiva : HUD.surface,
                  }}>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, flexWrap: 'wrap', marginBottom: 12 }}>
                      <span style={{ fontFamily: black, fontSize: 19 }}>{r.routeId}</span>
                      <span style={{ fontSize: 14, color: HUD.dim }}>{r.name}</span>
                      <div style={{ flex: 1 }} />
                      <span style={{
                        fontFamily: mono, fontSize: 11, fontWeight: 700,
                        color: r.enLinea > 0 ? HUD.green : HUD.dim3,
                      }}>{r.unidades} UNID · {r.enLinea} EN LÍNEA</span>
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 12 }}>
                      <div style={{ ...tarjeta('11px 12px'), borderRadius: 10 }}>
                        <div style={rotulo(9)}>Objetivo de brecha</div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', margin: '6px 0 10px' }}>
                          <span style={{ fontFamily: black, fontSize: 20 }}>
                            {fmtMin(r.objetivo ? r.objetivo.min : r.targetGapMin)}
                          </span>
                          {chip && (
                            <span title={
                              modo === 'auto'
                                ? `Vuelta promedio de ${r.objetivo.dia || 'todos los días'} sobre ${r.objetivo.unidades} unidades en ruta`
                                : modo === 'esperando'
                                  ? `Por ahora vale el manual de ${r.objetivo.manual} min`
                                  : 'Fijado a mano'
                            } style={{
                              ...rotulo(10, chip[2]), letterSpacing: .8,
                              background: chip[1], borderRadius: 5, padding: '3px 7px',
                            }}>{chip[0]}</span>
                          )}
                        </div>
                        <button
                          onClick={() => cambiarObjetivo(r.routeId, { auto: !r.autoTarget })}
                          title={r.autoTarget
                            ? 'Volver al objetivo fijado a mano'
                            : 'Calcular el objetivo solo: vuelta promedio ÷ unidades en ruta'}
                          disabled={busy} style={btnChico(HUD.fg2)}>
                          {r.autoTarget ? 'Automático encendido' : 'Automático apagado'}
                        </button>
                      </div>

                      <div style={{ ...tarjeta('11px 12px'), borderRadius: 10 }}>
                        <div style={rotulo(9)}>Recorrido cargado</div>
                        <div style={{
                          fontFamily: black, fontSize: 20, margin: '6px 0 10px',
                          color: r.puntos ? HUD.fg : HUD.amber,
                        }}>
                          {r.puntos ? `${r.puntos} pts · ${(r.largoM / 1000).toFixed(1)} km` : 'sin recorrido'}
                        </div>
                        <button onClick={() => setTrazando(r)}
                          title="Cargar o corregir el recorrido de esta ruta en el mapa"
                          style={btnChico(HUD.fg2)}>Abrir trazador</button>
                      </div>

                      {/* Despacho ELIGE entre los trazados cargados; crearlos y
                          borrarlos es cartografía y se hace desde el nivel de
                          arriba. Con uno solo, elegir no es una decisión. */}
                      <div style={{ ...tarjeta('11px 12px'), borderRadius: 10 }}>
                        <div style={rotulo(9)}>Se mide con</div>
                        <div style={{
                          fontFamily: black, fontSize: 20, margin: '6px 0 10px',
                          overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                        }}>{activa ? activa.name : '—'}</div>
                        {r.variantes && r.variantes.length > 1 ? (
                          <span style={{ position: 'relative', display: 'inline-flex' }}>
                            <span style={btnChico(HUD.fg2)}>Cambiar trazado…</span>
                            <select value={activa ? activa.variantId : ''} disabled={busy}
                              onChange={e => pedirCambioDeTrazado(r, Number(e.target.value))}
                              title="Cambia el trazado con el que se miden progreso, brechas y desvíos"
                              style={{ position: 'absolute', inset: 0, opacity: 0, cursor: 'pointer', width: '100%' }}>
                              {r.variantes.map(v => (
                                <option key={v.variantId} value={v.variantId}>
                                  {v.name}{v.puntos ? '' : ' (sin dibujar)'}
                                </option>
                              ))}
                            </select>
                          </span>
                        ) : (
                          <span style={{ fontSize: 12, color: HUD.dim3 }}>Es el único cargado</span>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
              <Pie>
                Despacho <strong>elige</strong> con cuál de los trazados cargados se
                mide. Crearlos y borrarlos es cartografía y se hace desde el nivel de
                arriba, igual que dar de alta una ruta nueva.
                {' '}El <strong>objetivo</strong> es la separación ideal entre unidades
                y el recorrido cuánto tarda de punta a punta: con esos dos números se
                convierte la distancia en minutos. Con <strong>Automático</strong> el
                objetivo se calcula solo — vuelta promedio ÷ unidades en ruta — y
                hasta juntar 3 vueltas sigue valiendo el número cargado a mano.
              </Pie>
            </div>)}

            {/* ─── TURNOS ───────────────────────────────────────── */}
            {tab === 'shifts' && (<div>
              <div style={{
                display: 'inline-flex', background: HUD.hueco, borderRadius: 10,
                padding: 3, marginBottom: 16,
              }}>
                {[['hoy', 'Hoy'], ['ayer', 'Ayer'], ['semana', 'Esta semana']].map(([k, l]) => (
                  <button key={k} onClick={() => { setRangoTurnos(k); setShifts(null); loadShifts(k); }}
                    style={{
                      padding: '7px 14px', borderRadius: 8, border: 'none', cursor: 'pointer',
                      fontSize: 13, fontWeight: 700, fontFamily: 'inherit',
                      background: rangoTurnos === k ? HUD.tinta : 'transparent',
                      color: rangoTurnos === k ? (HUD.oscuro ? HUD.bg : '#fff') : HUD.dim2,
                    }}>{l}</button>
                ))}
              </div>

              {!shifts && <Vacio>Cargando…</Vacio>}
              {shifts && (() => {
                // "Ayer" se recorta acá: el endpoint toma desde, no hasta.
                const hoy = inicioDeHoy();
                const turnos = rangoTurnos === 'ayer'
                  ? shifts.turnos.filter(t => t.startedAt < hoy)
                  : shifts.turnos;
                if (!turnos.length) {
                  return (
                    <Vacio>
                      {rangoTurnos === 'hoy'
                        ? 'Todavía nadie salió a ruta hoy. El turno se abre solo cuando alguien entra a su unidad.'
                        : 'No hay turnos en ese rango.'}
                    </Vacio>
                  );
                }
                const horas = (sec) => {
                  // Se redondea a minutos PRIMERO y después se parte en horas:
                  // al revés, 4 h 59 min 59 s salía como "4 h 60 min".
                  const min = Math.round(sec / 60);
                  const h = Math.floor(min / 60);
                  return h ? `${h} h ${String(min % 60).padStart(2, '0')} min` : `${min} min`;
                };
                const cols = '110px 1fr 110px 110px 120px';
                return (
                  <Tabla cols={cols} ancho={700}
                    cabeceras={['Unidad', 'Tripulación', 'Entrada', 'Salida', 'En ruta']}>
                    {turnos.map(t => (
                      <FilaTabla key={t.id} cols={cols}>
                        <span style={{ fontFamily: black, fontSize: 14 }}>{t.vehicleId}</span>
                        <span style={{
                          fontSize: 13, color: HUD.fg2, minWidth: 0,
                          overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                        }}>
                          {t.alias || t.name || t.personId}
                          {t.role === 'collector' && <span style={{ color: HUD.dim3 }}> · cobrador</span>}
                        </span>
                        <span style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color: HUD.dim2 }}>
                          {hhmm(t.startedAt)}
                        </span>
                        <span style={{
                          fontFamily: mono, fontSize: 12, fontWeight: 700,
                          color: t.abierto ? HUD.green : HUD.dim2,
                        }}>{t.abierto ? 'en ruta' : hhmm(t.endedAt)}</span>
                        <span style={{ fontFamily: black, fontSize: 14, textAlign: 'right' }}>
                          {horas(t.duracionSec)}
                        </span>
                      </FilaTabla>
                    ))}
                  </Tabla>
                );
              })()}
              <Pie>
                El turno se abre solo cuando alguien entra a su unidad y se cierra
                cuando se va. Un corte de señal <strong>no</strong> parte el turno: si
                vuelve dentro de los 15 minutos, se retoma el mismo. Si el servidor se
                reinicia, los turnos que quedaron abiertos se cierran con la última
                señal que se les vio.
              </Pie>
            </div>)}

            {/* ─── VUELTAS ──────────────────────────────────────── */}
            {tab === 'metrics' && (<div>
              {!vueltas && <Vacio>Cargando…</Vacio>}
              {vueltas && (() => {
                const R = vueltas.resumen;
                const obj = vueltas.objetivoSec;
                const kpis = [
                  ['Vueltas cerradas hoy', R.cerradas,
                    `${R.unidades} unidad${R.unidades === 1 ? '' : 'es'}${vueltas.routeId ? ' · ' + vueltas.routeId : ''}`],
                  ['Vuelta promedio', fmtSeg(R.duracionProm),
                    R.duracionPromAyer ? `ayer ${fmtSeg(R.duracionPromAyer)}` : 'sin dato de ayer'],
                  ['Brecha promedio', fmtSeg(R.brechaProm),
                    obj ? `objetivo ${fmtSeg(obj)}` : 'mirando todas las rutas'],
                  ['Vueltas en pelotón', R.enPeloton === null ? '—' : R.enPeloton,
                    R.umbralPelotonSec ? `brecha bajo ${fmtSeg(R.umbralPelotonSec)}` : 'hace falta elegir una ruta'],

                const cols = '110px 130px 130px 1fr 120px';
                return (
                  <div>
                    <div style={{
                      display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))',

                        <div key={et} style={{ ...tarjeta(14), background: HUD.bg }}>
                          <div style={rotulo(9)}>{et}</div>
                          <div style={{ fontFamily: black, fontSize: 26, margin: '6px 0 4px' }}>{val}</div>
                          <div style={{ fontSize: 11, color: HUD.dim2 }}>{nota}</div>
                        </div>
                      ))}
                    </div>

                    {R.sinBrecha > 0 && (
                      <div style={{
                        background: HUD.ambarFondo, border: `1px solid ${HUD.ambarBorde}`,
                        borderLeft: `3px solid ${HUD.amber}`, borderRadius: 11,
                        padding: '11px 13px', marginBottom: 16,
                        fontSize: 13, lineHeight: 1.55, color: HUD.ambarTinta,
                      }}>
                        {R.sinBrecha} de {R.cerradas} vueltas no tienen brecha guardada
                        —{' '}son de antes de que existiera el dato, o se dieron con una
                        sola unidad en ruta. No entran en el promedio: no cuentan como cero.
                      </div>
                    )}

                    {vueltas.vueltas.length === 0 && (
                      <Vacio>
                        Todavía no se cerró ninguna vuelta hoy. Se registran solas cuando

                      </Vacio>
                    )}
                    {vueltas.vueltas.length > 0 && (
                      <Tabla cols={cols} ancho={760}
                        cabeceras={['Unidad', 'Salió', 'Volvió', 'Brecha promedio', 'Vuelta']}>
                        {vueltas.vueltas.map(l => {
                          // La barra se lee contra el objetivo: llena = en el
                          // objetivo, corta = pegada al de adelante. Contra el
                          // de ESA vuelta si lo tiene guardado: con objetivo
                          // automático el número se mueve dentro del mismo día,
                          // y esta lista abarca las últimas 24 horas.
                          const vara = l.objetivoSec || obj;
                          const color = l.brechaProm === null ? HUD.dim3
                            : gapColor(fmtSeg(l.brechaProm), vara ? vara / 60 : TARGET_GAP_DEFAULT);
                          const parte = l.brechaProm === null || !vara ? 0
                            : Math.max(0.04, Math.min(1, l.brechaProm / vara));
                          return (
                            <FilaTabla key={l.id} cols={cols}>
                              <span style={{ fontFamily: black, fontSize: 14 }}>{l.unitId}</span>
                              <span style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color: HUD.dim2 }}>
                                {hhmm(l.startedAt)}
                              </span>
                              <span style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color: HUD.dim2 }}>
                                {hhmm(l.finishedAt)}
                              </span>
                              <span style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0 }}>
                                <span style={{
                                  flex: 1, minWidth: 40, height: 6, borderRadius: 3,
                                  background: HUD.hueco, overflow: 'hidden',
                                }}>
                                  <span style={{
                                    display: 'block', height: '100%', width: `${parte * 100}%`,
                                    background: color, borderRadius: 3,
                                  }} />
                                </span>
                                <span style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color, flexShrink: 0 }}>
                                  {l.brechaProm === null ? '—' : fmtSeg(l.brechaProm)}
                                </span>
                              </span>
                              <span style={{ fontFamily: black, fontSize: 14, textAlign: 'right' }}>
                                {fmtSeg(l.durationSec)}
                              </span>
                            </FilaTabla>
                          );
                        })}
                      </Tabla>
                    )}
                  </div>
                );
              })()}

              {/* El acumulado por unidad sigue estando: es lo que se mira para
                  comparar entre combis, no vuelta por vuelta. */}
              {metrics && metrics.length > 0 && (() => {
                const cols = '110px 80px 80px 1fr 110px 110px';
                return (
                  <div style={{ marginTop: 26 }}>
                    <div style={{ ...rotulo(9), marginBottom: 10 }}>Acumulado por unidad</div>
                    <Tabla cols={cols} ancho={700}
                      cabeceras={['Unidad', 'Hoy', 'Total', 'Última', 'Promedio', 'Mejor']}>
                      {metrics.map(m => (
                        <FilaTabla key={m.unitId} cols={cols}>
                          <span style={{ fontFamily: black, fontSize: 14 }}>{m.unitId}</span>
                          <span style={{
                            fontFamily: mono, fontSize: 13, fontWeight: 700,
                            color: m.lapsToday > 0 ? HUD.green : HUD.dim3,
                          }}>{m.lapsToday}</span>
                          <span style={{ fontFamily: mono, fontSize: 13, fontWeight: 700, color: HUD.dim }}>{m.lapsTotal}</span>
                          <span style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color: HUD.fg2 }}>{fmtSeg(m.lastSec)}</span>
                          <span style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color: HUD.fg2 }}>{fmtSeg(m.avgSec)}</span>
                          <span style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color: HUD.bright, textAlign: 'right' }}>{fmtSeg(m.bestSec)}</span>
                        </FilaTabla>
                      ))}
                    </Tabla>
                  </div>
                );
              })()}

              <Pie>
                La <strong>brecha promedio</strong> es la separación que la unidad
                mantuvo contra la de adelante durante toda la vuelta. Empieza a
                existir el día que se enciende: las vueltas viejas quedan sin el dato
                y no se puede reconstruir. La base retiene 120 días de vueltas.
              </Pie>
            </div>)}

            {/* ─── INFORMES ─────────────────────────────────────── */}
            {tab === 'informes' && (() => {
              const informes = [
                ['vueltas', 'Vueltas y brechas (CSV)', true],
                ['horas', 'Turnos por persona (CSV)', false],
                ['desvios', 'Salidas del recorrido (CSV)', false],
                ['sos', 'Emergencias (CSV)', false],
                ['actividad', 'Actividad de administración (CSV)', false],
              ];
              const aMs = (iso, fin) => {
                const d = new Date(iso + (fin ? 'T23:59:59' : 'T00:00:00'));
                return isNaN(d.getTime()) ? null : d.getTime();
              };
              const desde = aMs(rangoInf.desde, false);
              const hasta = aMs(rangoInf.hasta, true);
              const dias = desde && hasta ? Math.max(1, Math.round((hasta - desde) / 86400e3)) : null;
              const bajar = (tipo) => {
                if (!desde || !hasta || hasta < desde) {
                  setError('Revisá las fechas: la de fin tiene que ser posterior a la de inicio');
                  return;
                }
                // El navegador no manda el token en una descarga normal, así que
                // se pide con fetch y se guarda el archivo desde acá.
                const ruta = esSupervisor && currentRoute ? `&routeId=${encodeURIComponent(currentRoute)}` : '';
                fetch(`${HTTP_URL}/admin/informe/${tipo}.csv?desde=${desde}&hasta=${hasta}${ruta}`, {
                  headers: { Authorization: 'Bearer ' + session.token },
                })
                  .then(r => r.ok ? r.blob() : Promise.reject(new Error('No se pudo generar el informe')))
                  .then(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${(session.companyId || 'informe').toLowerCase()}-${tipo}-${rangoInf.desde}.csv`;
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                    setError(null);
                    setOkMsg(`Informe de ${tipo} descargado`);
                  })
                  .catch(e => setError(e.message));
              };
              return (
                <div>
                  <div style={{
                    display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))',
                    gap: 12, alignItems: 'start',
                  }}>
                    <div style={tarjeta(18)}>
                      <div style={{ ...rotulo(9), marginBottom: 12 }}>Rango</div>
                      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                        <input type="date" value={rangoInf.desde}
                          onChange={e => setRangoInf(r => ({ ...r, desde: e.target.value }))}
                          style={{ ...campo(40), fontFamily: mono, fontSize: 13, flex: '1 1 130px' }} />
                        <input type="date" value={rangoInf.hasta}
                          onChange={e => setRangoInf(r => ({ ...r, hasta: e.target.value }))}
                          style={{ ...campo(40), fontFamily: mono, fontSize: 13, flex: '1 1 130px' }} />
                      </div>
                      <div style={{ fontSize: 12, color: HUD.dim2, marginTop: 12 }}>
                        {dias ? `${dias} día${dias === 1 ? '' : 's'}` : 'fechas incompletas'}
                        {' · '}{(vehicles || []).length} unidades
                        {' · '}{esSupervisor && currentRoute ? currentRoute : `${routeList.length} ruta${routeList.length === 1 ? '' : 's'}`}
                      </div>
                    </div>

                    <div style={tarjeta(18)}>
                      <div style={{ ...rotulo(9), marginBottom: 12 }}>Descargar</div>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'flex-start' }}>
                        {informes.map(([tipo, etiqueta, principal]) => (
                          <button key={tipo} onClick={() => bajar(tipo)}
                            style={principal ? btnPrimario(40) : btnSecundario(40)}>{etiqueta}</button>
                        ))}
                      </div>
                    </div>
                  </div>
                  <Pie>
                    Los informes bajan en <strong>CSV</strong>: se abren en Excel y se
                    pueden sumar y filtrar. Cada uno arranca diciendo el período y
                    <strong> con qué se midió</strong> — si la ruta no tiene recorrido
                    cargado, las vueltas son estimaciones y el archivo lo aclara, para
                    que nadie tome por exacto un número que no lo es. El período máximo
                    son 90 días.
                  </Pie>
                </div>
              );
            })()}

            {/* ─── EMPRESA ──────────────────────────────────────── */}
            {tab === 'empresa' && (<div>
              {!empresa && <Vacio>Cargando…</Vacio>}
              {empresa && (<div>
                <div style={{
                  display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))',
                  gap: 12, marginBottom: 22,
                }}>
                  {[
                    ['Rutas', empresa.resumen.rutas],
                    ['Vehículos', empresa.resumen.vehiculos],
                    ['Personas', empresa.resumen.personas],
                    ['Cuentas de despacho', empresa.resumen.despacho],
                    ['En línea ahora', empresa.resumen.enLinea],
                  ].map(([etiqueta, valor]) => (
                    <div key={etiqueta} style={{ ...tarjeta(14), background: HUD.bg }}>
                      <div style={{ fontFamily: black, fontSize: 22 }}>{valor}</div>
                      <div style={{ ...rotulo(9), marginTop: 4 }}>{etiqueta}</div>
                    </div>
                  ))}
                </div>

                {empresa.puedeEditar ? (
                  <div style={{ maxWidth: 560, display: 'grid', gap: 14 }}>
                    <SubirLogo marca={marca} token={session.token} onListo={refrescarMarca}
                      onOk={setOkMsg} onError={setError} />
                    <div>
                      <div style={{ ...rotulo(9), marginBottom: 6 }}>Nombre</div>
                      <input value={empForm.name} placeholder="Cooperativa de Transportes…"
                        onChange={e => setEmpForm({ ...empForm, name: e.target.value })}
                        style={{ ...campo(44), width: '100%' }} />
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
                      <div>
                        <div style={{ ...rotulo(9), marginBottom: 6 }}>RUC (opcional)</div>
                        <input value={empForm.ruc} placeholder="20123456789"
                          onChange={e => setEmpForm({ ...empForm, ruc: e.target.value })}
                          style={{ ...campo(44), width: '100%', fontFamily: mono }} />
                      </div>
                      <div>
                        <div style={{ ...rotulo(9), marginBottom: 6 }}>Contacto (opcional)</div>
                        <input value={empForm.contacto} placeholder="Nombre y teléfono"
                          onChange={e => setEmpForm({ ...empForm, contacto: e.target.value })}
                          style={{ ...campo(44), width: '100%', fontFamily: mono }} />
                      </div>
                    </div>
                    <div style={{ display: 'flex', gap: 10 }}>
                      <button disabled={busy} onClick={() => run(async () => {
                        await api('/admin/company', { method: 'POST', body: JSON.stringify(empForm) });
                        await loadEmpresa();
                      }, 'Datos de la cooperativa guardados')} style={btnPrimario(42)}>Guardar</button>
                      <button onClick={() => setEmpForm({
                        name: empresa.empresa.name || '', ruc: empresa.empresa.ruc || '',
                        contacto: empresa.empresa.contacto || '',
                      })} style={btnSecundario(42)}>Descartar</button>
                    </div>
                  </div>
                ) : (
                  <div style={{ fontSize: 13, color: HUD.dim2, lineHeight: 1.6 }}>
                    <div style={{ fontFamily: black, fontSize: 22, color: HUD.fg, marginBottom: 6 }}>
                      {empresa.empresa.name}
                    </div>
                    {empresa.empresa.ruc && <div>RUC · {empresa.empresa.ruc}</div>}
                    {empresa.empresa.contacto && <div>Contacto · {empresa.empresa.contacto}</div>}
                    <div style={{ marginTop: 8 }}>Estos datos, y el logo, los corrige la cuenta de gerencia.</div>
                  </div>
                )}

                <Pie>
                  El código de la cooperativa es <strong>{empresa.empresa.companyId}</strong> y
                  no se puede cambiar: de él cuelga todo lo demás.
                  {' '}Cada cooperativa es un mundo aparte —sus rutas, su gente, su flota
                  y sus informes—; ninguna ve nada de otra, ni desde el panel ni desde
                  el mapa. Dar de alta una cooperativa nueva se hace desde el nivel de
                  arriba, no desde acá.
                </Pie>
              </div>)}
            </div>)}

            {/* ─── NÚMEROS (GERENCIA) ──────────────────────────────
                La vieja pantalla de gerencia.html, adentro del panel. Solo
                la ve el gerente (la pestaña ni figura para Despacho, y el
                servidor igual responde 403). */}
            {tab === 'gerencia' && (<div>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap', marginBottom: 16 }}>
                {[7, 14, 30].map(d => (
                  <button key={d} disabled={busy}
                    onClick={() => { setDiasGer(d); setResumenGer(null); loadGerencia(d); }}
                    style={{
                      ...btnSecundario(36),
                      background: diasGer === d ? HUD.bright : 'transparent',
                      color: diasGer === d ? '#fff' : HUD.dim,
                    }}>{d} días</button>
                ))}
                <div style={{ flex: 1 }} />
                {/* Los nombres son los del servidor (`INFORMES`), no los de la
                    pantalla: "turnos" no existe y el botón devolvía 404 con un
                    "No se pudo descargar" que no decía nada. El de horas se

                {resumenGer.porUnidad.length === 0 && (
                  <Vacio>Sin vueltas cerradas en el período.</Vacio>

                {resumenGer.porUnidad.length > 0 && (
                  <Tabla cols="110px 90px 1fr 1fr 1fr 1fr 1fr" ancho={720}
                    cabeceras={['Unidad', 'Ruta', 'Vueltas', 'Cumple', 'Brecha prom.', 'Horas', 'Salidas']}>
                    {resumenGer.porUnidad.map(u => (
                      <div key={u.unitId} style={{

                          {u.brechaProm === null ? '—' : fmtSeg(u.brechaProm)}

                        <div>{(u.horasSec / 3600).toFixed(1)} h</div>
                        {/* Cuántas veces se salió del recorrido y cuánto duró

                <Pie>
                  Una vuelta cumple si su brecha quedó dentro del

                  el mismo criterio que pinta de verde el mapa. Cada vuelta se
                  juzga contra el objetivo que regía cuando se cerró, no contra

                  {/* Mientras queden vueltas anteriores a que el objetivo se

                      exacto un promedio que todavía no lo es. Con el tiempo

                    <span style={{ color: HUD.amber }}>
                      {' '}De las {resumenGer.totales.conObjetivoViejo + resumenGer.totales.conObjetivoPropio}
                      {' '}vueltas juzgadas, {resumenGer.totales.conObjetivoViejo} son anteriores a que el
                      objetivo se guardara con cada vuelta y se miden contra el de hoy.
                    </span>
                  )}
                </Pie>
              </div>)}
            </div>)}

            {/* ─── ACTIVIDAD ────────────────────────────────────── */}
            {tab === 'audit' && (<div>
              {!events && <Vacio>Cargando…</Vacio>}
              {events && events.length === 0 && <Vacio>Sin actividad registrada.</Vacio>}
              {events && events.length > 0 && (() => {
                const ACTION = {
                  login: { label: 'inició sesión', color: HUD.dim },
                  login_bloqueado: { label: 'bloqueado por intentos fallidos', color: HUD.amber },
                  alta: { label: 'dio de alta a', color: HUD.green },

                  alta_ruta: { label: 'creó la ruta', color: HUD.green },
                  editar_identidad: { label: 'corrigió los datos de', color: HUD.bright },
                  reset_clave: { label: 'reseteó la clave de', color: HUD.amber },
                  baja: { label: 'dio de baja a', color: HUD.red },
                  sos: { label: 'disparó un SOS', color: HUD.red },
                  // Las dos del perfil del chofer (se edita él, desde la app)
                  alias_propio: { label: 'se puso el alias', color: HUD.bright },
                  clave_propia: { label: 'cambió su propia contraseña', color: HUD.amber },
                };
                const cols = '120px 150px 1fr';
                return (
                  <Tabla cols={cols} ancho={620} cabeceras={['Cuándo', 'Quién', 'Qué']}>
                    {events.map((ev, i) => {
                      const a = ACTION[ev.action] || { label: ev.action, color: HUD.dim };
                      const d = new Date(ev.timestamp);
                      const when = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')} ${hhmm(ev.timestamp)}`;
                      return (
                        <FilaTabla key={i} cols={cols}>
                          <span style={{ fontFamily: mono, fontSize: 11, color: HUD.dim3 }}>{when}</span>
                          <span style={{
                            fontFamily: black, fontSize: 13, minWidth: 0,

                          }}>{ev.actor}</span>
                          <span style={{ fontSize: 13, color: HUD.fg2, minWidth: 0 }}>
                            <span style={{ color: a.color, fontWeight: 700 }}>{a.label}</span>
                            {ev.target && <span style={{ fontFamily: black, fontSize: 13, color: HUD.fg }}> {ev.target}</span>}
                            {ev.detail && <span style={{ color: HUD.dim3 }}> · {ev.detail}</span>}
                          </span>
                        </FilaTabla>
                      );
                    })}
                  </Tabla>
                );
              })()}
              <Pie>
                Últimos 100 movimientos de <strong>esta</strong> cooperativa: logins,
                altas, resets de clave, bajas y SOS. El registro guarda hasta 1000
                eventos por cooperativa en la base.
              </Pie>
            </div>)}

            </Seccion>
          </div>
        </div>
      </div>

      {/* Cambiar el trazado con el que se mide le cambia el mapa a quien está
          manejando ahora. Nombra la ruta y los dos trazados, siempre. */}
      {confirmVar && (
        <Confirmacion
          kicker="Confirmar cambio de medición"
          tono="amber"
          titulo={`${confirmVar.ruta.routeId} va a medirse con «${confirmVar.v.name}»${
            confirmVar.actual ? ` en lugar de «${confirmVar.actual.name}»` : ''}`}
          cuerpo={<>
            Les cambia el mapa {confirmVar.ruta.enLinea
              ? <>a las <strong>{confirmVar.ruta.enLinea} unidades que están manejando ahora</strong></>
              : <>a las unidades que salgan a ruta</>}
            {' '}y <strong>descarta las vueltas en curso</strong> — se venían midiendo
            con el trazado anterior. Las brechas se recalculan sobre el trazado nuevo.
          </>}
          aceptar={`Sí, medir con «${confirmVar.v.name}»`}
          onAceptar={confirmarCambioDeTrazado}
          onCancelar={() => setConfirmVar(null)}
        />
      )}
    </div>
  );
}

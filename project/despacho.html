                              ` · ${TIPOS_SOS[msg.tipo].toUpperCase()}` }
              : x));
          }
        } else if (msg.type === 'chat_history') {
          setMessages((msg.items || []).map(it => mapMsg(
            { ...it, expired: (it.kind === 'voice' || it.kind === 'photo') && !it.data && !it.aparte },
            it.kind
          )));
        } else if (msg.type === 'auth_error') {
          closedByUs = true;
          try { localStorage.removeItem('r14_dispatch_session'); } catch {}
          onAuthError(msg.error || null);
        }
      };
      ws.onclose = () => {
        setConnected(false);
        // Espera creciente con azar (±50 %): fija en 3 s, tras un deploy todos
        // los paneles y teléfonos volvían en el mismo segundo (auditoría 11/11)
        const espera = Math.round(Math.min(3000 * 2 ** intentos, 30000) * (0.5 + Math.random()));
        intentos++;
        if (!closedByUs) reconnect = setTimeout(open, espera);
      };
    };
    open();
    // El latido, igual que la app web: un ping cada 15 s y, si en 40 s no
    // llegó NADA, el socket está muerto aunque no lo sepa (wifi que cambió,
    // notebook que se durmió): se lo cierra y se reconecta. Sin esto, un SOS
    // podía no llegar y ATENDIDO podía no salir (revisión integral del 04/11).
    const latido = setInterval(() => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      if (Date.now() - oidoEn > 40_000) { try { ws.close(); } catch {} return; }
      try { ws.send(JSON.stringify({ type: 'ping' })); } catch {}
    }, 15_000);

    return () => {
      closedByUs = true;
      clearInterval(latido);
      clearTimeout(reconnect);
      if (ws) ws.close();
    };
  }, [session.token]);

  // ─── Leaflet
  const initMap = React.useCallback((node) => {
    if (!node || mapRef.current) return;
    const map = L.map(node, { center: JULIACA_CENTER, zoom: 14, zoomControl: true, attributionControl: true });
    map.attributionControl.setPrefix(false);
    tilesRef.current = L.tileLayer(HUD.tiles, { maxZoom: 19, attribution: TILES_ATRIB }).addTo(map);
    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 100);
  }, []);
  // Al salir del panel el mapa se libera: Leaflet deja su listener de resize
  // colgado y con él el mapa entero, uno por cada salida y entrada (22/9).
  React.useEffect(() => () => {
    if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; }
    markersRef.current = {};
  }, []);

  // Marcadores: un pin con etiqueta por unidad en ruta
  React.useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    const existing = markersRef.current;
    const ids = new Set(units.filter(u => u.lat).map(u => u.unitId));

    Object.keys(existing).forEach(id => {
      if (!ids.has(id)) { existing[id].remove(); delete existing[id]; }
    });

    units.forEach(u => {
      if (!u.lat || !u.lng) return;
      const isSos = enSos(u.unitId);
      // El pin lleva el mismo color que la fila: mirando el mapa se ve dónde
      // está el pelotón sin cruzar con la lista.
      const g = gaps[u.unitId] || {};
      const cA = gapColor(g.toAhead, routeInfo.targetGapMin);
      const cB = gapColor(g.toBehind, routeInfo.targetGapMin);
      const color = isSos ? HUD.red
        : [HUD.red, HUD.amber, HUD.green, HUD.dim3].find(c => c === cA || c === cB) || HUD.dim3;
      // El desvío también se ve en el mapa, no solo en la lista: es donde
      // Despacho está mirando cuando pasa. Anillo ámbar alrededor del punto.
      const fuera = !!u.fueraDeRuta;
      const halo = fuera
        ? `box-shadow:0 0 0 3px ${HUD.bg},0 0 0 6px ${HUD.amber};`
        : '';
      // La que perdió señal se dibuja apagada y hueca: el punto está donde
      // estuvo, no donde está. Un pin lleno del color de su brecha diría que
      // esa posición es de ahora, y es de hace minutos.
      const callada = !!u.sinSenal;
      // Las que no están EN la cadena se apagan igual que las calladas: la
      // ausente está comiendo y la que va yendo todavía no pisó el trazado.
      // Ninguna de las dos es una combi contra la que alguien se mida.
      const fueraDeCadena = u.presencia === 'ausente' || (u.presencia === 'ruta' && u.enRuta === false);
      const colorPin = (callada || fueraDeCadena) ? HUD.dim3 : color;
      const relleno = (callada || fueraDeCadena) ? HUD.bg : '#fff';
      const sufijo = u.presencia === 'ausente' ? ' · AUSENTE'
        : (u.presencia === 'ruta' && u.enRuta === false) ? ' · YENDO' : '';
      // La familia va con comillas simples: con las dobles de `black` el
      // atributo style se cortaba en «font-family:» y la etiqueta salía como
      // texto suelto, sin fondo, pisándose con el trazado.
      // width:max-content porque el icono de Leaflet mide 0×0: sin eso la
      // etiqueta se parte en dos líneas dentro de un contenedor sin ancho.
      const html = `<div style="width:max-content;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:${fuera ? 6 : 3}px;${(callada || fueraDeCadena) ? 'opacity:.65;' : ''}">
        <div style="font-family:${black.replace(/"/g, "'")};font-size:11px;color:#fff;background:${colorPin};padding:2px 7px;border-radius:7px;white-space:nowrap;border:1.5px solid ${HUD.surface};box-shadow:${HUD.sombra};">${escaparHtml(u.unitId)}${fuera ? ' ◇' : ''}${callada ? ' ⌁' : ''}${sufijo}</div>
        <div style="width:10px;height:10px;border-radius:50%;background:${relleno};border:3px solid ${colorPin};box-sizing:content-box;${halo}"></div>
      </div>`;
      const icon = L.divIcon({ html, className: '', iconSize: [0, 0], iconAnchor: [0, 0] });
      if (existing[u.unitId]) {
        existing[u.unitId].setLatLng([u.lat, u.lng]);
        existing[u.unitId].setIcon(icon);
      } else {
        existing[u.unitId] = L.marker([u.lat, u.lng], { icon }).addTo(map);
      }
    });

    // Encuadrar la flota la primera vez que hay unidades
    const withGps = units.filter(u => u.lat);
    if (!fittedRef.current && withGps.length) {
      fittedRef.current = true;
      const bounds = L.latLngBounds(withGps.map(u => [u.lat, u.lng]));
      map.fitBounds(bounds.pad(0.4), { maxZoom: 15 });
    }
  }, [units, sosLista, gaps, routeInfo.targetGapMin, modo]);

  const focusUnit = (u) => {
    if (u.lat && mapRef.current) mapRef.current.panTo([u.lat, u.lng], { animate: true });
  };

  const sendChat = (text) => {
    const ws = wsRef.current;
    if (ws && ws.readyState === WebSocket.OPEN) {
      // Con una conversación abierta el mensaje va solo a esa unidad
      try {
        // Con una persona: `toPerson`; con una combi: `to`
        const destino = esPrivadoPersona(privadoCon) ? { toPerson: privadoCon.slice(2) }
          : privadoCon ? { to: privadoCon } : {};
        ws.send(JSON.stringify({
          type: 'chat', text, ...destino, timestamp: Date.now(),
        }));
        return true;
      } catch { return false; }
    }
    return false;
  };

  const silenciarDesvio = async (minutos) => {
    if (!routeInfo.routeId) return;
    try {
      await fetch(`${HTTP_URL}/admin/routes/${encodeURIComponent(routeInfo.routeId)}/desvio`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.token },
        body: JSON.stringify({ silenciarMin: minutos }),
      });
    } catch {}
  };

  // Marcar o desmarcar un mensaje como evidencia. La burbuja se actualiza con
  // el aviso que el servidor manda a todos los paneles (este incluido).
  const marcarEvidencia = async (msgId, marcar, motivo) => {
    const r = await fetch(`${HTTP_URL}/admin/mensajes/${msgId}/evidencia`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.token },
      body: JSON.stringify({ marcar, motivo }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'No se pudo');
    setMessages(ms => ms.map(x => (x.msgId === msgId)
      ? { ...x, evidencia: d.marcada ? { por: d.por, motivo: d.motivo } : null } : x));
  };

  // Una foto o nota de voz que vino `aparte` (no entró en el historial)
  const cargarContenido = async (msgId) => {
    try {
      const r = await fetch(`${HTTP_URL}/admin/mensajes/${msgId}/contenido`, {
        headers: { Authorization: 'Bearer ' + session.token },
      });
      const d = await r.json().catch(() => ({}));
      setMessages(ms => ms.map(x => x.msgId !== msgId ? x
        : !r.ok ? { ...x, aparte: false, expired: true }
        : x.voice ? { ...x, aparte: false, audio: d.data } : { ...x, aparte: false, image: d.data }));
    } catch {}
  };

  // `clave` es la combi ('M-05') o la persona ('p:pedro'); `nombre`, cómo
  // mostrar a la persona.
  //
  // Una persona de OTRA ruta: primero se pasa a mirar la suya, que es donde
  // está su hilo (el historial es por ruta). Sin esto el hilo se abría vacío
  // y lo que ella contestaba no se veía (revisión previa a la APK).
  const abrirPrivado = (clave, nombre, routeId) => {
    const suya = routeId || (esPrivadoPersona(clave) ? rutaDelPrivadoRef.current[clave] : null);
    if (suya && esPrivadoPersona(clave)) rutaDelPrivadoRef.current[clave] = suya;
    const mirada = rutaMiradaRef.current || routeInfo.routeId;
    if (suya && suya !== mirada && routes.some(r => r.routeId === suya)) cambiarRuta(suya);
    if (nombre && esPrivadoPersona(clave)) setNombres(n => ({ ...n, [clave]: nombre }));
    setPrivadoCon(clave);
    setNoLeidos(n => ({ ...n, [clave]: 0 }));
    if (isMobile) setView('chat');
  };

  // Cambiar de ruta: el servidor responde con el estado y el chat de la nueva
  const cambiarRuta = (routeId) => {
    const ws = wsRef.current;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    setUnits([]); setGaps({}); setMessages([]); setTelefonos({});
    rutaMiradaRef.current = routeId;
    ws.send(JSON.stringify({ type: 'watch', routeId }));
  };

  // Un pin PROPIO para cada SOS sin atender con posición. «Ver en mapa»
  // centraba el mapa donde estaba la combi y ahí no había nada si el
  // teléfono murió tras el SOS (la combi se olvida a los 3 min) o si se
  // estaba mirando otra ruta (auditoría 11/11). Este pin no depende de la
  // combi: vive mientras el SOS esté sin atender.
  const pinesSosRef = React.useRef({});
  React.useEffect(() => {
    const map = mapRef.current;
    if (!map || typeof L === 'undefined') return;
    const vivos = new Set();
    for (const s of sosLista) {
      if (s.lat == null || s.lng == null) continue;
      const clave = String(s.sosId ?? `${s.unitId}:${s.timestamp}`);
      vivos.add(clave);
      if (pinesSosRef.current[clave]) continue;
      const pin = L.marker([s.lat, s.lng], {
        zIndexOffset: 2000,
        icon: L.divIcon({
          className: '', iconSize: [0, 0],
          html: `<div data-pin-sos style="width:max-content;transform:translate(-50%,-130%);font-family:${black.replace(/"/g, "'")};font-size:12px;color:#fff;background:${HUD.red};padding:3px 8px;border-radius:7px;white-space:nowrap;border:1.5px solid ${HUD.surface};box-shadow:${HUD.sombra}">SOS · ${escaparHtml((s.vehicleId || s.unitId || '').toUpperCase())}</div>`,
        }),
      }).addTo(map);
      pinesSosRef.current[clave] = pin;
    }
    for (const [clave, pin] of Object.entries(pinesSosRef.current)) {
      if (!vivos.has(clave)) { try { pin.remove(); } catch {} delete pinesSosRef.current[clave]; }
    }
  }, [sosLista]);

  // El cartel del SOS, armado una vez y puesto en dos lugares: arriba del
  // mapa y arriba de Gestión. Gestión tapa la pantalla entera y el cartel
  // quedaba debajo: el gerente en Números no se enteraba (auditoría 11/11).
  const bannerSos = sos && (
    <div style={{
      flexShrink: 0, background: HUD.red, color: '#fff',
      padding: '13px 18px', display: 'flex', alignItems: 'center', gap: 16,
      flexWrap: isMobile ? 'wrap' : 'nowrap',
      animation: 'sosPulse 1.2s ease-in-out infinite',
    }}>
      <span style={{ fontFamily: black, fontSize: 20, letterSpacing: 3 }}>SOS</span>
      <span style={{ fontSize: 15, fontWeight: 700 }}>
        {(sos.driverName || sos.unitId || 'Unidad').toUpperCase()}
        {sos.vehicleId ? ` · ${sos.vehicleId.toUpperCase()}` : ''} pide ayuda
        {TIPOS_SOS[sos.sosTipo] ? ` — ${TIPOS_SOS[sos.sosTipo].toUpperCase()}` : ''} · {nowTime(sos.timestamp)}
        {sos.routeId && sos.routeId !== routeInfo.routeId ? ` · RUTA ${sos.routeId}` : ''}
        {sos.lat ? ` · ${sos.lat.toFixed(4)}, ${sos.lng.toFixed(4)}` : ''}
        {sosLista.length > 1 ? ` · Y ${sosLista.length - 1} MÁS ESPERANDO` : ''}
      </span>
      <div style={{ flex: 1 }} />
      {sos.lat && (
        <button onClick={() => { setAdminOpen(false); if (isMobile) setView('map'); mapRef.current?.panTo([sos.lat, sos.lng]); }} style={{
          height: 34, padding: '0 12px', background: 'rgba(255,255,255,.16)',
          border: '1px solid rgba(255,255,255,.55)', borderRadius: 8,
          color: '#fff', fontSize: 13, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit',
        }}>Ver en mapa</button>
      )}
      {sosError && <span role="alert" style={{ fontSize: 13, fontWeight: 800 }}>{sosError}</span>}
      {alarmaSos.soportada() && !alarmaSos.lista() && (
        <button onClick={activarAlarma} style={{
          height: 34, padding: '0 12px', background: 'rgba(255,255,255,.16)',
          border: '1px solid rgba(255,255,255,.55)', borderRadius: 8,
          color: '#fff', fontSize: 13, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit',
        }}>Activar sonido</button>
      )}
      <button data-sos-atendido onClick={() => { if (sosListo) atenderSos(sos); }}
        disabled={!!sos.atendiendo || !sosListo} style={{
        height: 34, padding: '0 12px', background: '#fff', border: 'none', borderRadius: 8,
        color: HUD.red, fontSize: 13, fontWeight: 800, fontFamily: 'inherit',
        cursor: sos.atendiendo ? 'wait' : sosListo ? 'pointer' : 'default', opacity: sosListo ? 1 : 0.6,
      }}>{sos.atendiendo ? 'ENVIANDO…' : 'ATENDIDO'}</button>
    </div>
  );

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
      {/* cabecera */}
      <div style={{
        height: 60, flexShrink: 0, display: 'flex', alignItems: 'center',
        gap: isMobile ? 6 : 12,
        padding: isMobile ? '0 8px' : '0 16px',
        borderBottom: `1px solid ${HUD.divider}`, background: HUD.surface,
        overflow: 'hidden',
      }}>
        {/* La marca de la cooperativa, no una marca fija: el mismo panel lo
            usan empresas distintas y cada una tiene que ver la suya. En el
            celular queda SOLO el escudo: ocupa 30 px y sigue diciendo de
            quién es esta pantalla, que es lo que importa. */}
        <Marca marca={marca} tam={isMobile ? 30 : 34} />
        {/* El nombre va primero y con aire: el chip «Despacho» y el separador
            se fueron a una segunda línea chica, y ya no se corta en «Señor de
            Hua…» con cualquier ancho de escritorio. */}
        {!isMobile && (
          <div style={{ minWidth: 120, flex: '0 1 auto', maxWidth: 340, lineHeight: 1.2 }}
            title={marca?.nombre || session.companyName || ''}>
            <div style={{ fontFamily: black, fontSize: 16, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {marca?.nombre || session.companyName || session.companyId || 'Despacho'}
            </div>
            <div style={{ fontSize: 12, fontWeight: 600, color: HUD.dim2 }}>Panel de Despacho</div>
          </div>
        )}

        {/* Selector de ruta: el supervisor cambia; el de ruta la ve fija.
            El <select> nativo va encima, transparente: conserva el desplegable
            del sistema (en celular es el único usable) y deja que debajo se
            dibuje el código y el nombre con tipografías distintas. */}
        {esSupervisor && routes.length > 0 ? (
          <span style={{
            position: 'relative', display: 'flex', alignItems: 'center', gap: 8,
            height: 38, padding: '0 12px', background: HUD.hueco, borderRadius: 10,
            maxWidth: isMobile ? 'none' : 320, minWidth: 0, flexShrink: isMobile ? 0 : 1,
          }}>
            {!isMobile && <Icono n="ruta" tam={16} style={{ color: HUD.dim }} />}
            <span style={{ fontFamily: black, fontSize: 14, flexShrink: 0 }}>{routeInfo.routeId || '—'}</span>
            {!isMobile && !compacto && (
              <span style={{
                fontSize: 13, color: HUD.dim, minWidth: 0,
                overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
              }}>{routeInfo.routeName || ''}</span>
            )}
            <Icono n="abajo" tam={14} style={{ color: HUD.dim2 }} />
            <select
              value={routeInfo.routeId || ''}
              onChange={e => cambiarRuta(e.target.value)}
              title="Ruta que estás mirando"
              style={{
                position: 'absolute', inset: 0, width: '100%', height: '100%',
                opacity: 0, cursor: 'pointer', fontFamily: 'inherit',
              }}>
              {routes.map(r => (
                <option key={r.routeId} value={r.routeId}>{r.routeId} · {r.name}</option>
              ))}
            </select>
          </span>
        ) : (
          <span style={{
            display: 'flex', alignItems: 'center', gap: 8, height: 38, padding: '0 12px',
            background: HUD.hueco, borderRadius: 10,
            maxWidth: isMobile ? 'none' : 320, minWidth: 0, flexShrink: isMobile ? 0 : 1,
          }}>
            {!isMobile && <Icono n="ruta" tam={16} style={{ color: HUD.dim }} />}
            <span style={{ fontFamily: black, fontSize: 14, flexShrink: 0 }}>{routeInfo.routeId || '—'}</span>
            {!isMobile && !compacto && (
              <span style={{
                fontSize: 13, color: HUD.dim, minWidth: 0,
                overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
              }}>{routeInfo.routeName || ''}</span>
            )}
          </span>
        )}

        {/* En el celular es lo único de la cabecera que cede: con todo
            fijo, «Salir» quedaba afuera de la pantalla (terminaba en x=406
            en una de 390). El punto de conexión queda siempre a la vista. */}
        {(() => {
          // «N EN RUTA» es la cadena, no todo lo que se ve: las que van
          // yendo y las ausentes no están trabajando la ruta, y las sin
          // señal sí pero calladas. Cada cosa con su nombre. Se arma en
          // mayúscula y se muestra en caja normal (`oracion`).
          const enRuta = routeInfo.enRuta ?? units.length;
          const extras = [
            routeInfo.sinSenal ? `${routeInfo.sinSenal} SIN SEÑAL` : null,
            routeInfo.yendo ? `${routeInfo.yendo} YENDO` : null,
            routeInfo.ausentes ? `${routeInfo.ausentes} AUSENTE${routeInfo.ausentes > 1 ? 'S' : ''}` : null,
          ].filter(Boolean);
          const base = `${enRuta} EN RUTA`;
          const completo = connected ? oracion(['EN VIVO', base, ...extras].join(' · ')) : 'Reconectando…';
          return (
            <span title={completo} style={{
              display: 'flex', alignItems: 'center', gap: 7, height: 32, padding: isMobile ? '0 9px' : '0 12px',
              borderRadius: 16, flexShrink: isMobile ? 1 : 0, minWidth: 0,
              background: connected ? HUD.verdeFondo : HUD.ambarFondo,
            }}>
              <span style={{
                width: 8, height: 8, borderRadius: '50%', flexShrink: 0,
                background: connected ? HUD.green : HUD.amber,
              }} />
              <span style={{
                fontSize: 13, fontWeight: 700,
                color: connected ? HUD.verdeTinta : HUD.ambarTinta2,
                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
              }}>{connected ? (isMobile ? oracion(base) : completo) : 'Reconectando…'}</span>
            </span>
          );
        })()}

        <div style={{ flex: 1 }} />

        {/* El objetivo de brecha es el número contra el que se lee toda la
            pantalla. Antes solo estaba adentro de Gestión. */}
        {!isMobile && (
          <div title="Objetivo de brecha: la separación ideal entre unidades" style={{ textAlign: 'right', lineHeight: 1.1, flexShrink: 0 }}>
            <div style={rotulo(9)}>{compacto ? 'Objetivo' : 'Objetivo de brecha'}</div>
            <div style={{ fontFamily: black, fontSize: 16, marginTop: 2 }}>
              {fmtMin(routeInfo.targetGapMin)}
              <span style={{ ...dato(11, HUD.dim2), marginLeft: 4 }}>min</span>
            </div>
          </div>
        )}
        {!isMobile && <span style={{ width: 1, height: 28, background: HUD.divider, flexShrink: 0 }} />}
        {/* Gestión es una vista más del panel, no la acción principal: va
            como botón secundario, y con Gestión abierta el mismo botón vuelve
            al mapa. En el celular vive en la barra de abajo. */}
        {!isMobile && (
          <button onClick={() => setAdminOpen(a => !a)} aria-pressed={adminOpen} style={{
            ...btnSecundario(36), flexShrink: 0,
            ...(adminOpen ? { background: HUD.azulFondo, borderColor: HUD.azulBorde, color: HUD.azulTinta } : {}),
          }}>
            <Icono n={adminOpen ? 'mapa' : 'gestion'} tam={16} />{adminOpen ? 'Mapa en vivo' : 'Gestión'}
          </button>
        )}
        {/* Si la alarma está muda o falta el permiso de notificaciones, se
            ofrece acá, siempre a la vista: no puede descubrirse recién con
            un SOS. Ámbar, no rojo: el rojo es del SOS. Es un ESTADO (la
            campana tachada con su punto), no un cartel: antes ocupaba el
            lugar más visible y se leía como una alerta permanente. */}
        {faltaAlarma && !isMobile && (
          <button data-activar-alarma onClick={activarAlarma}
            title="La alarma de SOS está muda en esta pestaña. Tocá para que suene y avise aunque el panel esté tapado por otra ventana."
            style={{ ...btnIcono(false), background: HUD.ambarFondo, color: HUD.ambarTinta }}>
            <Icono n="campanaNo" tam={18} />
            <span style={ocultoVisual}>Activar alarma de SOS</span>
            <span style={{ position: 'absolute', top: 6, right: 6, width: 8, height: 8, borderRadius: '50%',
              background: HUD.amber, boxShadow: `0 0 0 2px ${HUD.ambarFondo}` }} />
          </button>
        )}
        <button onClick={onAlternarModo}
          title={modo === 'day' ? 'Pasar a modo noche' : 'Pasar a modo día'}
          style={btnIcono(false)}>
          <Icono n={modo === 'day' ? 'luna' : 'sol'} tam={18} />
          <span style={ocultoVisual}>{modo === 'day' ? 'Modo noche' : 'Modo día'}</span>
        </button>
        <button onClick={onLogout} title="Cerrar la sesión en esta pantalla" style={{ ...btnFantasma(36), flexShrink: 0, padding: isMobile ? 0 : '0 10px', width: isMobile ? 36 : 'auto' }}>
          <Icono n="salir" tam={17} />
          {isMobile ? <span style={ocultoVisual}>Salir</span> : 'Salir'}
        </button>
      </div>

      {/* En el celular no entra en la cabecera (empujaba «Salir» afuera):
          va en su propia franja, a todo el ancho */}
      {faltaAlarma && isMobile && (
        <button data-activar-alarma onClick={activarAlarma} style={{
          flexShrink: 0, width: '100%', padding: '10px 14px', cursor: 'pointer', textAlign: 'left',
          background: HUD.ambarFondo, color: HUD.ambarTinta, border: 'none',
          borderBottom: `1px solid ${HUD.ambarBorde}`, fontSize: 13, fontWeight: 700, fontFamily: 'inherit',
          display: 'flex', alignItems: 'center', gap: 8,
        }}><Icono n="campanaNo" tam={17} />Activar alarma de SOS: que suene y avise aunque el panel esté tapado</button>
      )}

      {/* banner SOS activo: queda arriba también con Gestión abierta, que
          desde el retoque es una vista debajo de la cabecera y no una capa */}
      {bannerSos}

      {/* Avisos del nivel de arriba. Persistentes a propósito: un aviso de
          deuda o de mantenimiento no puede desaparecer solo ni esconderse
          tras un ícono. Ámbar y no rojo: es atención, no emergencia — el
          rojo es del SOS y de nada más. Marcar visto es de la cooperativa
          entera, y queda auditado quién lo hizo. */}
      {avisos.map(a => (
        <div key={a.id} style={{
          flexShrink: 0, background: HUD.ambarFondo,
          borderBottom: `1px solid ${HUD.ambarBorde}`,
          padding: '10px 18px', display: 'flex', alignItems: 'center', gap: 12,
          flexWrap: isMobile ? 'wrap' : 'nowrap',
        }}>
          <span style={{ ...rotulo(9, HUD.ambarTinta), flexShrink: 0 }}>
            Aviso de la administración del sistema{a.routeId ? ` · ruta ${a.routeId}` : ''}
          </span>
          <span style={{ fontSize: 13, fontWeight: 600, color: HUD.ambarTinta, minWidth: 0 }}>
            {a.texto}
          </span>
          <div style={{ flex: 1 }} />
          {/* fmtWhen y no nowTime: un aviso pendiente puede tener semanas
              (no caducan a propósito), y "14:32" a secas se lee como si
              hubiera llegado hoy — al revés de lo que el aviso certifica. */}
          <span style={{ fontFamily: mono, fontSize: 10, color: HUD.ambarTinta2, flexShrink: 0 }}>
            {fmtWhen(a.creadoEn)}
          </span>
          <button onClick={() => marcarAviso(a.id)}
            title="Lo marca visto para toda la cooperativa; queda registrado quién lo vio"
            style={{
              height: 30, padding: '0 12px', background: HUD.surface,
              border: `1px solid ${HUD.ambarBorde}`, borderRadius: 8,
              color: HUD.ambarTinta, fontSize: 12, fontWeight: 700,
              cursor: 'pointer', fontFamily: 'inherit', flexShrink: 0,
            }}>Marcar visto</button>
        </div>
      ))}

      {/* cuerpo: en PC tres columnas; en celular una vista a la vez */}
      <div style={{
        ...(isMobile
          ? { flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }
          : { flex: 1, display: 'grid', gridTemplateColumns: 'minmax(280px, min(24vw, 340px)) minmax(0, 1fr) minmax(300px, min(27vw, 400px))', minHeight: 0 }),
        ...(adminOpen ? { display: 'none' } : {}),
      }}>
        {/* unidades */}
        <div style={{
          overflowY: 'auto', overflowX: 'hidden', minHeight: 0, background: HUD.bg,
          // Sin conexión, lo que se ve es la última foto: se atenúa para
          // que no se lea como el presente (P7). La cabecera ya dice
          // «RECONECTANDO…»; esto es para el que mira la lista y no arriba.
          opacity: connected ? 1 : 0.55,
          transition: 'opacity .4s',
          ...(isMobile
            ? { flex: 1, display: view === 'units' ? 'block' : 'none' }
            : { borderRight: `1px solid ${HUD.divider}` }),
        }}>
          <div style={{ padding: '14px 16px 10px', display: 'flex', alignItems: 'baseline', gap: 8 }}>
            <span style={{ fontSize: 14, fontWeight: 800, color: HUD.fg }}>Unidades en ruta</span>
            <div style={{ flex: 1 }} />
            {/* «7 de 9»: lo que se ve sobre lo que la ruta TIENE dado de alta.
                El número solo nunca decía cuántas faltaban, y a las 6 de la
                mañana esa es la pregunta. El total llega en el estado
                (`flota`); si un servidor viejo no lo manda, queda el número
                de siempre y no un «de —» que no significa nada. */}
            <span style={{ fontFamily: black, fontSize: 14 }}>{units.length}</span>
            {/* El numerador cuenta por la ruta de la PERSONA y el denominador
                por la del VEHÍCULO, y un supervisor puede dejar a alguien de
                una ruta arriba de una combi de otra. En ese caso el total
                queda corto: antes que mostrar «10 de 9», que se lee como una
                pantalla rota, se muestra el número solo. */}
            {routeInfo.flota >= units.length && routeInfo.flota > 0 && (
              <span
                style={{ ...rotulo(10, HUD.dim3), whiteSpace: 'nowrap' }}
                title={`${units.length} de las ${routeInfo.flota} unidades de la ruta están reportando`}
              >de {routeInfo.flota}</span>
            )}
          </div>

          {/* Desvíos: se agrupan acá en vez de gritar uno por uno. En una
              ciudad siempre hay alguno, así que lo importante es poder
              silenciarlo cuando ya se sabe (obra, desfile, embotellamiento). */}
          {(() => {
            const fuera = units.filter(u => u.fueraDeRuta);
            const mudo = routeInfo.desvio?.mudoHasta;
            if (!fuera.length && !mudo) return null;
            return (
              <div style={{
                margin: '0 12px 10px', padding: '11px 12px', borderRadius: 11,
                background: mudo ? HUD.hueco : HUD.ambarFondo,
                border: `1px solid ${mudo ? HUD.line : HUD.ambarBorde}`,
                borderLeft: `3px solid ${mudo ? HUD.line : HUD.amber}`,
              }}>
                <div style={{
                  fontFamily: black, fontSize: 13, color: mudo ? HUD.dim2 : HUD.ambarTinta,
                  marginBottom: fuera.length ? 6 : 9,
                }}>
                  {mudo
                    ? `Desvíos silenciados hasta ${nowTime(mudo)}`
                    : `${fuera.length} unidad${fuera.length === 1 ? '' : 'es'} fuera del recorrido`}
                </div>
                {fuera.length > 0 && (
                  <div style={{
                    fontFamily: mono, fontSize: 11, fontWeight: 700,
                    color: mudo ? HUD.dim2 : HUD.ambarTinta2, marginBottom: 9,
                  }}>
                    {fuera.map(u => `${u.unitId} (${u.desvioM} m)`).join(' · ')}
                  </div>
                )}
                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                  {mudo ? (
                    <button onClick={() => silenciarDesvio(0)}
                      style={{ ...btnChico(HUD.fg2, HUD.line), fontSize: 11 }}>Volver a avisar</button>
                  ) : (
                    [['Silenciar 1 h', 60], ['3 h', 180], ['el turno', 480]].map(([etiqueta, min]) => (
                      <button key={min} onClick={() => silenciarDesvio(min)}
                        title="Cuando el desvío ya se sabe: una obra, un desfile, un embotellamiento"
                        style={{ ...btnChico(HUD.ambarTinta, HUD.ambarBorde), fontSize: 11 }}>{etiqueta}</button>
                    ))
                  )}
                </div>
              </div>
            );
          })()}
          {/* Entraron y no salieron a ruta. SALIR A RUTA es lo que pone a la
              combi en el mapa, y se olvida: el que guardó el teléfono y
              arrancó trabaja invisible. El servidor no mira dónde está (en la
              puerta la app no manda la ubicación): sabe que entró y que no
              declaró nada. A los diez minutos se pone en ámbar: es para
              llamarlo. */}
          {puerta.length > 0 && (() => {
            const minutos = (e) => Math.max(0, Math.floor((ahora - e.desde) / 60_000));
            const llamar = puerta.some(e => minutos(e) >= 10);
            return (
              <div data-puerta style={{
                margin: '0 12px 10px', padding: '11px 12px', borderRadius: 11,
                background: llamar ? HUD.ambarFondo : HUD.hueco,
                border: `1px solid ${llamar ? HUD.ambarBorde : HUD.line}`,
                borderLeft: `3px solid ${llamar ? HUD.amber : HUD.line}`,
              }}>
                <div style={{ fontFamily: black, fontSize: 13, color: llamar ? HUD.ambarTinta : HUD.fg, marginBottom: 6 }}>
                  {puerta.length === 1 ? '1 chofer entró y no salió a ruta' : `${puerta.length} choferes entraron y no salieron a ruta`}
                </div>
                {puerta.map(e => (
                  <div key={e.personId} style={{
                    display: 'flex', gap: 8, alignItems: 'baseline',
                    fontFamily: mono, fontSize: 11, fontWeight: 700,
                    color: llamar ? HUD.ambarTinta2 : HUD.dim2, lineHeight: 1.6,
                  }}>
                    <span style={{ flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                      {e.nombre} · {e.vehicleId}
                    </span>
                    <span title={`Entró a las ${nowTime(e.desde)}`}>
                      {minutos(e) < 1 ? 'recién' : `hace ${minutos(e)} min`}
                    </span>
                  </div>
                ))}
              </div>
            );
          })()}
          {units.length === 0 && (
            <Vacio icono="vehiculo" titulo="Todavía no hay combis en ruta"
              accion={<button onClick={() => setAdminOpen(true)} style={btnSecundario(36)}><Icono n="personas" tam={16} />Ver quién tiene cuenta</button>}>
              Aparecen acá apenas un chofer toca «Salir a ruta» en su celular. El chat de la ruta ya funciona.
            </Vacio>
          )}
          {units.map(u => {
            const g = gaps[u.unitId] || {};
            const isSos = enSos(u.unitId);
            const cAdelante = gapColor(g.toAhead, routeInfo.targetGapMin);
            const cAtras = gapColor(g.toBehind, routeInfo.targetGapMin);
            // Una sola señal fuerte por tarjeta: el número de la brecha en su
            // color, con la palabra debajo. Antes lo crítico se marcaba cuatro
            // veces (fondo rosado, borde rojo, número rojo y CRÍTICA) y con
            // tres de cinco en crítico la columna entera quedaba rosada. El
            // borde rojo de la tarjeta queda para el SOS y nada más.
            const nombre = u.driverName && u.driverName !== u.unitId ? u.driverName : null;
            return (
              <div key={u.unitId} data-tarjeta onClick={() => focusUnit(u)} style={{
                margin: '0 10px 8px', padding: '11px 12px 12px', cursor: 'pointer',
                borderRadius: 14, background: HUD.surface,
                border: `1px solid ${isSos ? HUD.red : privadoCon === u.unitId ? HUD.azulBorde : HUD.divider}`,
                boxShadow: isSos ? `0 0 0 3px ${HUD.rojoBorde}` : 'none',
              }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <Avatar nombre={nombre || u.unitId} tam={36} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, flexWrap: 'wrap' }}>
                      <span style={{ fontFamily: black, fontSize: 16, color: isSos ? HUD.red : HUD.fg }}>{u.unitId}</span>
                      {/* Sin señal la última velocidad es vieja: mostrarla haría
                          creer que la combi sigue andando a ese ritmo. */}
                      <span style={dato(11, HUD.dim2)}>
                        {u.sinSenal ? '—' : Math.round(u.speed || 0)} km/h
                      </span>
                      {u.tramo && (
                        <span title="Tramo del circuito en el que va" style={{
                          fontSize: 12, fontWeight: 700,
                          color: u.tramo === 'vuelta' ? HUD.dim2 : HUD.bright,
                        }}>{u.tramo === 'vuelta' ? '↩ vuelta' : '↪ ida'}</span>
                      )}
                    </div>
                    {nombre && (
                      <div style={{
                        fontSize: 13, color: HUD.fg2, marginTop: 1,
                        overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                      }}>{nombre}{u.label ? <span style={{ color: HUD.dim2 }}> · {u.label}</span> : null}</div>
                    )}
                  </div>
                  {/* Los dos privados, como íconos: antes eran dos botones con
                      borde que ocupaban un tercio de la tarjeta. El click no
                      debe disparar también el foco del mapa de la fila. */}
                  <span style={{ display: 'flex', gap: 2, flexShrink: 0 }}>
                    <button
                      onClick={(e) => { e.stopPropagation(); abrirPrivado(u.unitId); }}
                      title={`Mensaje directo a ${u.unitId}: lo leen los que van arriba de la combi`}
                      style={btnIcono(privadoCon === u.unitId)}>
                      <Icono n="chat" tam={18} />
                      <span style={ocultoVisual}>Mensaje directo</span>
                      {noLeidos[u.unitId] > 0 && <Insignia n={noLeidos[u.unitId]} />}
                    </button>
                    {/* Y el privado PERSONAL con el que la maneja: lo que es de él
                        y no de la combi (sus horas, «pasá por la oficina»). No lo
                        ve su cobrador ni el que maneje la combi después. */}
                    {u.choferId && (() => {
                      const clave = 'p:' + u.choferId;
                      const abierto = privadoCon === clave;
                      return (
                        <button
                          onClick={(e) => { e.stopPropagation(); abrirPrivado(clave, u.driverName || u.choferId); }}
                          title={`Escribirle solo a ${u.driverName || u.choferId}, en la combi que esté`}
                          style={btnIcono(abierto)}>
                          <Icono n="persona" tam={18} />
                          <span style={ocultoVisual}>Solo a {String(u.driverName || u.choferId).split(' ')[0]}</span>
                          {noLeidos[clave] > 0 && <Insignia n={noLeidos[clave]} />}
                        </button>
                      );
                    })()}
                  </span>
                </div>
                {/* Las dos brechas son lo que más se mira de la fila: van en
                    celda propia y en el tamaño de un dato, no como dos
                    números pegados al pie. El número late una vez cuando
                    cambia de estado (key = su color). */}
                <div style={{
                  display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginTop: 10,
                }}>
                  {[['+1 adelante', g.toAhead, cAdelante], ['−1 atrás', g.toBehind, cAtras]].map(([et, val, color]) => {
                    const palabra = gapWord(val, routeInfo.targetGapMin);
                    return (
                      <div key={et} style={{ padding: '6px 9px 7px', borderRadius: 10, background: HUD.celda }}>
                        <div style={rotulo(8)}>{et}</div>
                        <div key={color} style={{
                          fontFamily: black, fontSize: 18, lineHeight: 1.2, color,
                          animation: 'cambio .22s ease-out', transformOrigin: 'left center',
                        }}>{val || '—'}</div>
                        {/* El juicio en palabras, porque el color solo no lo
                            dice para un daltónico rojo-verde. Ver
                            LIMITACIONES.md, sección Accesibilidad. */}
                        {palabra && (
                          <div style={{ fontSize: 11, fontWeight: 800, color, marginTop: 1 }}>{oracion(palabra)}</div>
                        )}
                      </div>
                    );
                  })}
                </div>
                {/* Entró a la ruta empezada: no salió del paradero inicial,
                    se metió en el medio. No es una alarma —puede tener un
                    motivo— pero tiene que verse EN EL MOMENTO: si aparece al
                    día siguiente en un informe ya no sirve para preguntar. */}
                {u.entradaTardia && (
                  <Estado tinta={HUD.ambarTinta2}
                    title={`Entró a la ruta al ${Math.round((u.entroEn || 0) * 100)} % del circuito, no desde el inicio`}>
                    ↳ ENTRÓ AL {Math.round((u.entroEn || 0) * 100)} % DEL CIRCUITO
                  </Estado>
                )}
                {/* No se puede esconder ni resumir: es el aviso por el que
                    Despacho levanta el teléfono. Va en mayúscula, con ícono y
                    sobre su fondo: más fuerte que antes, no más suave. */}
                {u.fueraDeRuta && (
                  <Estado mayus icono="alerta" tinta={HUD.ambarTinta} fondo={HUD.ambarFondo} borde={HUD.ambarBorde}
                    title={`A ${u.desvioM} m del recorrido${u.fueraDesde ? ' desde ' + nowTime(u.fueraDesde) : ''}`}>
                    FUERA DE RUTA · {u.desvioM} M
                  </Estado>
                )}
                {/* Trabada: N minutos sin avanzar por la ruta (lo midió el
                    servidor) o el chofer avisó tráfico (lo dijo él). Se
                    distinguen con la palabra, y las dos dicen hace cuánto.
                    Es lo que decide si Despacho manda a los de atrás por otro
                    lado, y por eso va antes que la señal. */}
                {(u.trafico || u.parado) && (
                  <Estado icono="reloj" tinta={HUD.ambarTinta2}
                    title={u.trafico ? 'El chofer avisó que está en tráfico' : 'Lleva minutos sin avanzar por la ruta'}>
                    {u.trafico ? 'EN TRÁFICO' : 'PARADA'} · {
                      Math.max(0, Math.round((ahora - (u.trafico ? u.traficoDesde : u.paradoDesde)) / 60000))
                    } MIN{u.trafico ? ' · AVISÓ EL CHOFER' : ''}
                  </Estado>
                )}
                {/* Android marcó la posición como SIMULADA: una app de
                    «fake GPS». No se esconde la unidad —se dice—, y queda en
                    la auditoría. Ver TRUCOS-2026-09-10.md. */}
                {u.gpsSimulado && (
                  <Estado icono="gps" tinta={HUD.ambarTinta} fondo={HUD.ambarFondo} borde={HUD.ambarBorde}
                    title="Android marca estas posiciones como salidas de una app de ubicación simulada (fake GPS). Quedó en la auditoría.">
                    GPS SIMULADO · ANDROID LO MARCA COMO FALSO
                  </Estado>
                )}
                {/* Las últimas doce posiciones tienen la firma de un simulador
                    sin el flag (server/farsa.js). Es una SOSPECHA con motivo:
                    se dice cuál, y queda en la auditoría. */}
                {u.gpsSospechoso && !u.gpsSimulado && (
                  <Estado icono="gps" tinta={HUD.ambarTinta} fondo={HUD.ambarFondo} borde={HUD.ambarBorde}
                    title="Las últimas posiciones tienen la firma de un GPS simulado sin la marca de Android. Es una sospecha, con su motivo; quedó en la auditoría.">
                    GPS SOSPECHOSO · {({
                      velocidad_constante: 'VELOCIDAD QUE NO VARÍA',
                      sin_ruido: 'CLAVADO EN EL TRAZADO',
                      velocidad_incoherente: 'VELOCIDAD QUE NO CUADRA',
                    })[u.gpsSospechoso] || String(u.gpsSospechoso).toUpperCase()}
                  </Estado>
                )}
                {/* El aparato declara más de 100 m de error: la posición está
                    en un círculo, no en un punto. Se muestra igual (es lo mejor
                    que se sabe) pero no se juzga desvío ni parada con ella. */}
                {u.gpsImpreciso && (
                  <Estado icono="gps" tinta={HUD.dim2}
                    title={`El teléfono declara ${u.precisionM} m de error en la posición (ahorro de batería, ubicación «sólo por red»). Con eso no se juzga desvío ni parada.`}>
                    GPS IMPRECISO · ±{u.precisionM} M
                  </Estado>
                )}
                {/* Dejó de reportar. La posición que se ve en el mapa es la
                    última conocida, así que se dice desde cuándo: sin eso,
                    Despacho manda a alguien a un lugar donde la combi estuvo
                    hace tres minutos. Las brechas de arriba ya salen en "—"
                    porque el servidor no las calcula contra una unidad así. */}
                {u.sinSenal && (
                  <Estado icono="sinSenal" tinta={HUD.ambarTinta2}
                    title={`Última posición recibida a las ${nowTime(u.sinSenalDesde || u.timestamp)}`}>
                    SIN SEÑAL DESDE {nowTime(u.sinSenalDesde || u.timestamp)}
                  </Estado>
                )}
                {/* Y si al teléfono se lo sigue oyendo. Son dos cosas distintas
                    que se veían igual: una combi en un cerro (el teléfono no
                    llega) y una app mandando posiciones viejas (llega, pero
                    lo que trae no dice dónde está ahora). La segunda es un
                    problema del celular, no de la calle, y saberlo desde acá
                    ahorra mandar a alguien a buscar una combi que está bien.
                    «Sigue mandando» es que llega DESPUÉS de su última
                    posición. Con «oído hace menos de 60 s» a secas, el
                    teléfono que se calló del todo figuraba 30 s como que
                    seguía mandando: sin señal se marca a los 30 (recorrido
                    del 28/10). */}
                {u.sinSenal && u.oidoEn && (
                  <Estado tinta={HUD.ambarTinta2} mt={4}>
                    {ahora - u.oidoEn <= 60_000 && u.oidoEn - (u.timestamp || 0) > 15_000
                      ? `EL TELÉFONO SIGUE MANDANDO · OÍDO HACE ${Math.max(0, Math.round((ahora - u.oidoEn) / 1000))} S`
                      : `SIN NOTICIAS DEL TELÉFONO HACE ${Math.max(0, Math.round((ahora - u.oidoEn) / 1000))} S`}
                  </Estado>
                )}
                {/* El reloj del teléfono atrasado (lo estima el servidor,
                    ver server/reloj.js). Sus posiciones vienen con esa hora
                    y el servidor ya lo descuenta; acá se dice para que nadie
                    lea «de hace 2 min» donde es de ahora, y para que alguien
                    le arregle la hora al celular. */}
                {u.relojAtrasadoS >= 30 && (
                  <Estado icono="reloj" tinta={HUD.dim2} mt={4}
                    title="El teléfono manda sus posiciones con la hora atrasada; el servidor lo descuenta">
                    EL RELOJ DEL TELÉFONO ATRASA {u.relojAtrasadoS >= 120
                      ? `${Math.round(u.relojAtrasadoS / 60)} MIN` : `${u.relojAtrasadoS} S`}
                  </Estado>
                )}
                {/* El teléfono del que la maneja (PENDIENTES 0.4): batería,
                    ahorro de batería y versión. «No aparece en el mapa» se
                    averiguaba llamándolo; la mitad de las veces era esto. Ámbar
                    lo que pide hacer algo; el resto, gris. */}
                {u.choferId && telefonos[u.choferId] && (() => {
                  const t = telefonos[u.choferId];
                  const baja = t.bateria != null && t.bateria <= 20 && !t.cargando;
                  const minutos = Math.round((ahora - t.en) / 60_000);
                  const partes = [
                    t.bateria != null ? `BATERÍA ${t.bateria} %${t.cargando ? ' · CARGANDO' : ''}` : null,
                    t.origen === 'web' ? 'WEB' : t.version ? `APP ${t.version}${t.actualizacion ? ' · ' + fechaActualizacion(t.actualizacion) : ''}` : null,
                    minutos >= 10 ? `HACE ${minutos} MIN` : null,
                  ].filter(Boolean);
                  return (
                    <div data-telefono={u.choferId} style={{ marginTop: 6 }}>
                      {partes.length > 0 && (
                        <div style={{ fontFamily: mono, fontSize: 10, letterSpacing: .6, color: baja ? HUD.amber : HUD.dim2, fontWeight: baja ? 700 : 400 }}>
                          {partes.join(' · ')}
                        </div>
                      )}
                      {t.bateria != null && t.bateria <= 10 && !t.cargando && (
                        <div style={{ fontFamily: mono, fontSize: 10, fontWeight: 700, letterSpacing: .6, color: HUD.amber, marginTop: 3 }}>
                          SE ESTÁ POR APAGAR: QUE LO ENCHUFE
                        </div>
                      )}
                      {t.optimizada === true && (
                        <div title="Con el ahorro de batería, Android le corta la red a la app con la pantalla apagada: deja de aparecer en el mapa. Se apaga en Ajustes → Batería → la app → «Sin restricciones»."
                          style={{ fontFamily: mono, fontSize: 10, fontWeight: 700, letterSpacing: .6, color: HUD.amber, marginTop: 3 }}>
                          AHORRO DE BATERÍA ACTIVADO: PUEDE DESAPARECER DEL MAPA
                        </div>
                      )}
                      {t.versionEstado === 'vieja' && (
                        <div style={{ fontFamily: mono, fontSize: 10, fontWeight: 700, letterSpacing: .6, color: HUD.amber, marginTop: 3 }}>
                          APP VIEJA: TIENE QUE ACTUALIZAR
                        </div>
                      )}
                      {t.versionEstado === 'hay_nueva' && (
                        <div style={{ fontFamily: mono, fontSize: 10, letterSpacing: .6, color: HUD.dim2, marginTop: 3 }}>
                          HAY UNA VERSIÓN NUEVA DE LA APP
                        </div>
                      )}
                    </div>
                  );
                })()}
                {/* La presencia declarada desde la app. AUSENTE: comiendo o
                    en un repuesto — fuera de la cadena, a la vista. YENDO:
                    marcó "en ruta" pero el GPS todavía no lo vio sobre el
                    trazado (la brecha sale en "—" a propósito). */}
                {u.presencia === 'ausente' && (
                  <Estado icono="reloj" tinta={HUD.dim2}>AUSENTE — FUERA DE LA CADENA</Estado>
                )}
                {u.presencia === 'ruta' && u.enRuta === false && (
                  <Estado icono="ruta" tinta={HUD.ambarTinta2}>YENDO A LA RUTA — ENTRA AL PISAR EL TRAZADO</Estado>
                )}
                {!u.lat && (
                  <Estado icono="sinSenal" tinta={HUD.ambarTinta2}>SIN GPS</Estado>
                )}
              </div>
            );
          })}
        </div>

        {/* mapa */}
        <div style={{
          position: 'relative', minHeight: 0,
          ...(isMobile ? { flex: 1, display: view === 'map' ? 'block' : 'none' } : {}),
        }}>
          {/* Sin conexión el mapa también se apaga, no sólo la lista: los
              pines con colores de «en vivo» sobre un mapa congelado parecían
              la situación de ahora (auditoría 11/11). En el celular no hay
              lista al lado: esto es lo único que avisa. */}
          <div ref={initMap} data-mapa-en-vivo={connected ? '1' : '0'} style={{
            position: 'absolute', inset: 0,
            filter: connected ? 'none' : 'grayscale(1)', opacity: connected ? 1 : 0.55,
            transition: 'opacity .3s, filter .3s',
          }} />
          {!connected && (
            <div role="status" data-mapa-sin-conexion style={{
              position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)', zIndex: 900,
              background: HUD.ambarFondo, color: HUD.ambarTinta, border: `1px solid ${HUD.ambarBorde}`,
              borderRadius: 10, padding: '8px 14px', fontSize: 13, fontWeight: 800, pointerEvents: 'none',
            }}>Sin conexión: el mapa no está en vivo</div>
          )}
          {/* Los tres colores de la fila y del pin no se explican solos.
              Con el objetivo en el header, esto termina de contar contra qué
              se está leyendo cada número. */}
          <div style={{
            position: 'absolute', left: isMobile ? 10 : 14, bottom: isMobile ? 40 : 18, zIndex: 500,
            padding: '11px 13px', borderRadius: 12,
            background: HUD.flotante, border: `1px solid ${HUD.divider}`, boxShadow: HUD.sombra,
          }}>
            <div style={{ ...rotulo(9), marginBottom: 7 }}>Brecha contra el objetivo</div>
            {[[HUD.green, 'Hasta 15 % de desvío'], [HUD.amber, 'Hasta 30 %'], [HUD.red, 'Crítica · pelotón']].map(([c, t]) => (
              <div key={t} style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 5 }}>
                <span style={{ width: 10, height: 10, borderRadius: 3, background: c, flexShrink: 0 }} />
                <span style={{ fontSize: 13, color: HUD.fg2 }}>{t}</span>
              </div>
            ))}
          </div>
        </div>

        {/* chat */}
        <div style={{
          minHeight: 0,
          ...(isMobile
            ? { flex: 1, display: view === 'chat' ? 'flex' : 'none', flexDirection: 'column' }
            : { borderLeft: `1px solid ${HUD.divider}` }),
        }}>
          <ChatColumn messages={messages} onSend={sendChat} routeId={routeInfo.routeId}
            privadoCon={privadoCon} onCerrarPrivado={() => setPrivadoCon(null)}
            nombres={nombres} noLeidos={noLeidos} onAbrir={(clave) => abrirPrivado(clave)}
            onEvidencia={marcarEvidencia} onCargar={cargarContenido} />
        </div>
      </div>

      {/* Gestión: la misma pantalla, no un overlay. La cabecera y el cartel
          de SOS siguen arriba; el mapa queda montado (Leaflet no se rearma). */}
      {/* Con su muro de errores: que se rompa una pestaña de Gestión no se
          lleva el panel (auditoría 11/11). En línea y no como capa: el cartel
          del SOS sigue arriba. */}
      {adminOpen && (
        <Muro lugar="Gestión" onVolver={() => setAdminOpen(false)}>
        <AdminModal
          session={session}
          onClose={() => setAdminOpen(false)}
          onAuthError={onAuthError}
          routes={routes}
          currentRoute={routeInfo.routeId}
          // La pestaña Empresa sube el logo: sin estas dos, el gerente que la
          // abría tumbaba el panel entero con un ReferenceError (barrido 22/9).
          marca={marca}
          refrescarMarca={refrescarMarca}
          // «Escribir» en Personas: abre su privado personal en el mapa
          onEscribir={(personId, nombre, routeId) => { setAdminOpen(false); abrirPrivado('p:' + personId, nombre, routeId); }}
        />
        </Muro>
      )}

      {/* navegación inferior — solo celular. Con ícono y nombre, y Gestión
          como una vista más del panel. */}
      {isMobile && (
        <nav style={{
          flexShrink: 0, display: 'flex',
          borderTop: `1px solid ${HUD.divider}`, background: HUD.surface,
          paddingBottom: 'env(safe-area-inset-bottom)',
        }}>
          {[['units', `Unidades (${units.length})`, 'lista'], ['map', 'Mapa', 'mapa'],
            ['chat', 'Chat', 'chat'], ['gestion', 'Gestión', 'gestion']].map(([k, l, ic]) => {
            const activo = k === 'gestion' ? adminOpen : (!adminOpen && view === k);
            const sinLeer = k === 'chat' ? Object.values(noLeidos).reduce((a, b) => a + (b || 0), 0) : 0;
            return (
              <button key={k} aria-current={activo ? 'page' : undefined}
                onClick={() => { if (k === 'gestion') setAdminOpen(true); else { setAdminOpen(false); setView(k); } }}
                style={{
                  flex: 1, minHeight: 60, padding: '7px 0 9px', position: 'relative',
                  background: 'transparent', border: 'none', cursor: 'pointer',
                  display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3,
                  fontFamily: 'inherit', fontSize: 12, fontWeight: 700,
                  color: activo ? HUD.bright : HUD.dim2,
                  WebkitTapHighlightColor: 'transparent',
                }}>
                <span style={{
                  position: 'relative', width: 56, height: 28, borderRadius: 14,
                  display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                  background: activo ? HUD.azulFondo : 'transparent',
                }}>
                  <Icono n={ic} tam={20} />
                  {sinLeer > 0 && <Insignia n={sinLeer} />}
                </span>
                {l}
              </button>
            );
          })}
        </nav>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// ROOT
// ═══════════════════════════════════════════════════════════════
function Root() {
  // El tema elegido se recuerda en el dispositivo. De fábrica, DÍA.
  const [modo, setModo] = React.useState(() => {
    try {
      const g = localStorage.getItem('r14_modo_panel');
      if (g && TEMAS[g]) return g;
    } catch {}
    return 'day';
  });
  // Antes de renderizar: HUD es un objeto que se muta, así que tiene que
  // estar en su valor final cuando los hijos lo leen.
  aplicarTema(modo);
  React.useEffect(() => {
    try { localStorage.setItem('r14_modo_panel', modo); } catch {}
    const r = document.documentElement.style;
    r.setProperty('--bg', HUD.bg);
    r.setProperty('--fg', HUD.fg);
    // Lo que el CSS global necesita (foco, hover, Leaflet): copiado de HUD,
    // así el <style> no tiene un solo color propio.
    for (const [v, k] of [['--surface', 'surface'], ['--line', 'line'], ['--divider', 'divider'],
      ['--acento', 'bright'], ['--anillo', 'anillo'], ['--realce', 'realce'], ['--hueco', 'hueco'],
      ['--dim', 'dim'], ['--flotante', 'flotante'], ['--sombra', 'sombra']]) r.setProperty(v, HUD[k]);
    document.documentElement.dataset.tema = modo;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', HUD.surface);
  }, [modo]);
  const alternarModo = () => setModo(m => (m === 'day' ? 'night' : 'day'));

  const [session, setSession] = React.useState(() => {
    try {
      const s = JSON.parse(localStorage.getItem('r14_dispatch_session') || 'null');
      // El gerente entra por este mismo panel: su sesión guardada vale
      // igual que la de Despacho. Antes, F5 lo mandaba al ingreso con el
      // token intacto en localStorage (REVISION-2026-09-08.md, P3).
      return s?.token && (s?.role === 'dispatch' || s?.role === 'manager') ? s : null;
    } catch { return null; }
  });
  const [notice, setNotice] = React.useState(null);

  const logout = () => {
    // Salir revoca el token EN EL SERVIDOR (P5): sin esto, un token copiado
    // de esta PC seguía valiendo los 30 días de la sesión. Si no hay red no
    // importa: lo local se borra igual.
    try {
      if (session?.token) {
        fetch(HTTP_URL + '/auth/logout', {
          method: 'POST', keepalive: true,
          headers: { Authorization: 'Bearer ' + session.token },
        }).catch(() => {});
      }
    } catch {}
    try { localStorage.removeItem('r14_dispatch_session'); } catch {}
    setSession(null);
    setNotice(null);
  };

  if (!session) {
    return <Login notice={notice} onSuccess={(s) => { setSession(s); setNotice(null); }} />;
  }
  return <Panel
    session={session}
    onLogout={logout}
    modo={modo}
    onAlternarModo={alternarModo}
    // La sesión guardada se borra SIEMPRE (un 401 de Gestión la dejaba, y al
    // recargar volvía a fallar), y se dice el motivo que mandó el servidor:
    // una baja, una cooperativa suspendida o una ruta sin cargar no son «tu
    // sesión expiró» (auditoría 11/11).
    onAuthError={(motivo) => {
      try { localStorage.removeItem('r14_dispatch_session'); } catch {}
      setSession(null);
      setNotice(motivo && !/expirad|inválid/i.test(motivo) ? `${motivo} Ingresá de nuevo.` : 'Tu sesión expiró. Ingresá de nuevo.');
    }}
  />;
}

// ─── MURO DE ERRORES ───────────────────────────────────────────────
// Sin esto, un error al dibujar desmontaba TODO el árbol (React 18): el
// mapa, el chat y el cartel del SOS desaparecían y quedaba una página en
// blanco. Ya pasó el 22/9 con la pestaña Empresa (auditoría 11/11). Hay dos:
// uno alrededor de Gestión —que se rompa una pestaña no tiene por qué
// llevarse el mapa— y otro alrededor de todo.
//
// El de afuera recarga solo a los 20 s: una pantalla que nadie mira no se
// puede quedar rota toda la noche, y al volver el servidor reenvía los SOS
// sin atender. Con un tope, para no entrar en un bucle si el error vuelve
// apenas carga: tres recargas en cinco minutos y deja de intentarlo.
class Muro extends React.Component {
  constructor(props) { super(props); this.state = { error: null, falta: 20 }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error) {
    try { console.error('[muro]', this.props.lugar || 'panel', error); } catch {}
    if (!this.props.recargaSola) return;
    let veces = [];
    try { veces = JSON.parse(sessionStorage.getItem('r14_muro') || '[]').filter(t => Date.now() - t < 5 * 60_000); } catch {}
    if (veces.length >= 3) { this.setState({ sinRecarga: true }); return; }
    this.reloj = setInterval(() => {
      this.setState(st => {
        if (st.falta <= 1) {
          clearInterval(this.reloj);
          try { sessionStorage.setItem('r14_muro', JSON.stringify([...veces, Date.now()])); } catch {}
          location.reload();
        }
        return { falta: st.falta - 1 };
      });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.reloj); }
  render() {
    const { error, falta, sinRecarga } = this.state;
    if (!error) return this.props.children;
    const caja = (
      <div data-muro={this.props.lugar || 'panel'} style={{
        maxWidth: 640, margin: '80px auto', padding: 24,
        background: HUD.rojoFondo, border: `1px solid ${HUD.rojoBorde}`,
        borderLeft: `3px solid ${HUD.red}`, borderRadius: 14,
        color: HUD.rojoTinta, fontSize: 15, lineHeight: 1.6, fontFamily: 'system-ui, sans-serif',
      }}>
        <div style={{ fontFamily: black, fontSize: 19, marginBottom: 8 }}>
          {this.props.lugar ? `${this.props.lugar} se rompió` : 'El panel se rompió'}
        </div>
        <div>
          Es un error del programa, no tuyo.{' '}
          {this.props.recargaSola
            ? (sinRecarga ? 'Recargá la página.' : `La página se recarga sola en ${falta} s.`)
            : 'El mapa y los SOS siguen funcionando: volvé al mapa.'}
          {' '}Si vuelve a pasar, mandanos una captura de este cartel: el renglón de abajo dice qué se rompió.
        </div>
        <code style={{
          display: 'block', marginTop: 12, padding: '10px 12px',
          background: 'rgba(255,255,255,.6)', borderRadius: 8,
          whiteSpace: 'pre-wrap', wordBreak: 'break-word', fontSize: 12,
        }}>{String((error && (error.message || error)) || 'error desconocido')}</code>
        <div style={{ display: 'flex', gap: 10, marginTop: 14, flexWrap: 'wrap' }}>
          {this.props.onVolver && (
            <button onClick={this.props.onVolver} style={{ ...btnPrimario(40), background: HUD.red, borderRadius: 9 }}>
              Volver al mapa
            </button>
          )}
          <button onClick={() => location.reload()} style={{ ...btnSecundario(40), borderRadius: 9 }}>Recargar</button>
        </div>
      </div>
    );
    // Gestión es una capa fija: su muro también, para no dejar un hueco
    return this.props.capa ? (
      <div style={{ position: 'fixed', inset: 0, zIndex: 3000, background: HUD.bg, overflowY: 'auto', padding: 16 }}>{caja}</div>
    ) : caja;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<Muro recargaSola><Root /></Muro>);

</script>

<!-- PWA: el panel registra su propio service worker. Antes solo lo hacía la
     app del chofer, así que un encargado que instalara únicamente el panel en
     su celular se quedaba sin caché offline. -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(() => console.log('Service Worker registrado'))
        .catch((err) => console.log('Service Worker falló:', err));
    });
  }
</script>

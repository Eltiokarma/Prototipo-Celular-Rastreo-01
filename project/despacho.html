// LOGIN
// ═══════════════════════════════════════════════════════════════
// El nombre de la cooperativa sobrevive al cierre de sesión: al volver a
// entrar, el encargado ve el suyo y no una marca fija que puede no ser la
// de su empresa. En una máquina recién instalada no hay ninguno todavía.
function coopRecordada() {
  try { return localStorage.getItem('r14_coop_panel') || null; } catch { return null; }
}

function Login({ onSuccess, notice }) {
  const [user, setUser] = React.useState('DESPACHO');
  const [pass, setPass] = React.useState('');
  // Ver lo tipeado a pedido: las claves acá las dicta una persona a otra
  // por teléfono, y un error de tipeo a ciegas cuesta un bloqueo por
  // intentos. El de la app del chofer ya lo tiene; este es el mismo gesto.
  const [verPass, setVerPass] = React.useState(false);
  const [error, setError] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const coop = coopRecordada();

  const submit = async () => {
    if (!user.trim() || pass.length < 4) {
      setError('Completá usuario y contraseña (mínimo 4 caracteres)');
      return;
    }
    setLoading(true);
    setError(null);
    try {
      const res = await fetch(HTTP_URL + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: user.trim(), password: pass }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Error de autenticación');
      // Despacho y gerencia comparten este panel: el gerente es la cuenta
      // de arriba, con más permisos (vehículos, datos de la empresa, logo).
      if (data.role !== 'dispatch' && data.role !== 'manager') {
        throw new Error('Esta cuenta no es de Despacho ni de gerencia');
      }
      try {
        localStorage.setItem('r14_dispatch_session', JSON.stringify(data));
        if (data.companyName) localStorage.setItem('r14_coop_panel', data.companyName);
      } catch {}
      onSuccess(data);
    } catch (e) {
      setLoading(false);
      setError(e.message === 'Failed to fetch' ? 'No se pudo conectar con el servidor' : e.message);
    }
  };

  const inputStyle = {
    width: '100%', height: 50, padding: '0 16px', fontSize: 17, fontWeight: 600,
    background: HUD.campo, border: `1px solid ${HUD.campoLinea}`, borderRadius: 12,
    color: HUD.fg, outline: 'none', fontFamily: 'inherit',
  };
  const etiqueta = { display: 'block', fontSize: 13, fontWeight: 700, color: HUD.fg2, marginBottom: 6 };
  const hora = new Date().getHours();
  const saludo = hora < 12 ? 'Buen día' : hora < 19 ? 'Buenas tardes' : 'Buenas noches';

  // El fondo es un token por tema (`fondoLogin`): antes era un #0a1626 fijo,
  // y en el tema día dejaba una mancha oscura enorme detrás de la tarjeta.
  return (
    <div style={{
      height: '100%', overflowY: 'auto', padding: 16,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: `radial-gradient(90% 70% at 50% 0%, ${HUD.fondoLogin} 0%, ${HUD.bg} 72%)`,
    }}>
      <div style={{ width: 400, maxWidth: '100%', animation: 'aparecer .22s ease-out' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, margin: '0 4px 18px' }}>
          <img src="icon-despacho-192.png" alt="" width="44" height="44"
            style={{ borderRadius: 12, display: 'block', flexShrink: 0, boxShadow: HUD.sombra }} />
          <div style={{ minWidth: 0 }}>
            <div style={{
              fontFamily: black, fontSize: 19, lineHeight: 1.2,
              overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
            }}>{coop || 'Control de flota'}</div>
            <div style={{ fontSize: 13, fontWeight: 600, color: HUD.dim2 }}>Panel de Despacho</div>
          </div>
        </div>

        <form onSubmit={e => { e.preventDefault(); submit(); }} style={{
          background: HUD.surface, border: `1px solid ${HUD.divider}`, borderRadius: 20,
          padding: 28, boxShadow: HUD.sombraAlta,
        }}>
          <div style={{ fontFamily: black, fontSize: 26, letterSpacing: -0.3, lineHeight: 1.15 }}>{saludo}</div>
          <div style={{ fontSize: 14, color: HUD.dim2, lineHeight: 1.5, margin: '6px 0 22px' }}>
            Entrá con tu usuario para ver la flota en vivo.
          </div>

          <label htmlFor="r14-usuario" style={etiqueta}>Usuario</label>
          <input id="r14-usuario" value={user} autoComplete="username" autoCapitalize="characters"
            spellCheck={false} onChange={e => setUser(e.target.value)}
            style={{ ...inputStyle, marginBottom: 16 }} />
          <label htmlFor="r14-clave" style={etiqueta}>Contraseña</label>
          <div style={{ position: 'relative', marginBottom: 18 }}>
            <input id="r14-clave" type={verPass ? 'text' : 'password'} value={pass} autoFocus
              autoComplete="current-password"
              onChange={e => setPass(e.target.value)} style={{ ...inputStyle, paddingRight: 104 }} />
            <button type="button" onClick={() => setVerPass(v => !v)}
              aria-label={verPass ? 'Ocultar la contraseña' : 'Ver la contraseña'}
              style={{
                ...btnFantasma(38), position: 'absolute', right: 6, top: '50%',
                transform: 'translateY(-50%)', color: HUD.dim2,
              }}>
              <Icono n={verPass ? 'ojoNo' : 'ojo'} tam={18} />{verPass ? 'Ocultar' : 'Ver'}
            </button>
          </div>

          {(error || notice) && (
            <div role="alert" style={{
              display: 'flex', gap: 8, alignItems: 'flex-start',
              background: HUD.rojoFondo, border: `1px solid ${HUD.rojoBorde}`,
              borderRadius: 12, padding: '10px 12px', marginBottom: 16,
              fontSize: 14, fontWeight: 600, color: HUD.rojoTinta, lineHeight: 1.4,
            }}><Icono n="alerta" tam={17} style={{ marginTop: 1 }} />{error || notice}</div>
          )}

          <button type="submit" disabled={loading} style={{
            ...btnPrimario(50), width: '100%', fontSize: 16, fontWeight: 800, borderRadius: 12,
            background: loading ? HUD.cargando : HUD.bright, cursor: loading ? 'wait' : 'pointer',
          }}>
            {loading ? 'Verificando…' : 'Ingresar'}
            {!loading && <Icono n="flecha" tam={18} grosor={2.2} />}
          </button>

          <details style={{ marginTop: 16 }}>
            <summary style={{ fontSize: 13, fontWeight: 700, color: HUD.bright }}>¿Olvidaste la clave?</summary>
            <div style={{ marginTop: 8, fontSize: 13, color: HUD.fg2, lineHeight: 1.55 }}>
              La de un chofer o un cobrador la cambia Despacho, en Gestión → Personas.
              La de Despacho y la de gerencia, quien les entregó el sistema.
            </div>
          </details>
        </form>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// CHAT (columna derecha)
// ═══════════════════════════════════════════════════════════════
// Una clave por mensaje, puesta al recibirlo. La lista se recorta a 150 y
// con el índice como key cada mensaje nuevo corría a todos un lugar: la nota
// de voz que se estaba escuchando cambiaba de audio a mitad (barrido 22/9).
let SEQ_MSG = 0;

// Los privados son de dos clases (31/10), y la clave del hilo lo dice:
//   'M-05'      Despacho ↔ esa COMBI (los que van arriba hoy y después)
//   'p:pedro'   Despacho ↔ esa PERSONA (la sigue a cualquier combi; no lo
//               ve nadie más)
const esPrivadoPersona = (clave) => typeof clave === 'string' && clave.startsWith('p:');

// Guardar un mensaje como evidencia (PENDIENTES 0.8): la foto del choque, la
// nota de voz de un pasajero agresivo. No se borra con el resto (queda lo
// mismo que un SOS). Con motivo; el que lo marcó y por qué se ven en la burbuja.
function Evidencia({ m, onEvidencia }) {
  const [abierto, setAbierto] = React.useState(false);
  const [motivo, setMotivo] = React.useState('');
  const [error, setError] = React.useState(null);
  if (!onEvidencia || m.msgId == null || m.tone === 'sos') return null;
  const mandar = async (marcar) => {
    setError(null);
    try { await onEvidencia(m.msgId, marcar, motivo); setAbierto(false); setMotivo(''); }
    catch (e) { setError(e.message); }
  };
  if (m.evidencia) {
    return (
      <div data-evidencia={m.msgId} style={{ marginTop: 6, fontSize: 12, color: HUD.ambarTinta, background: HUD.ambarFondo,
        border: `1px solid ${HUD.ambarBorde}`, borderRadius: 10, padding: '6px 9px', lineHeight: 1.4,
        display: 'flex', gap: 6, alignItems: 'flex-start', maxWidth: 320 }}>
        <Icono n="marcador" tam={14} grosor={2} style={{ marginTop: 1 }} />
        <span><b>EVIDENCIA</b> · {m.evidencia.por || 'Despacho'}: {m.evidencia.motivo}
        {' '}<button onClick={() => mandar(false)} style={{ background: 'none', border: 'none', padding: 0, cursor: 'pointer',
          color: HUD.ambarTinta, textDecoration: 'underline', fontSize: 12, fontFamily: 'inherit' }}>quitar</button>
        {error && <span style={{ display: 'block' }}>{error}</span>}</span>
      </div>
    );
  }
  if (!abierto) {
    // Aparece al pasar por el mensaje (en el táctil, siempre): estaba fijo
    // debajo de cada burbuja y el chat se leía como un formulario.
    return (
      <button className="r14-evid" data-marcar-evidencia={m.msgId} onClick={() => setAbierto(true)}
        title="Queda guardado aunque el resto del chat se borre"
        style={{ ...btnFantasma(26), padding: '0 6px', marginTop: 2, fontSize: 12, fontWeight: 600, color: HUD.dim2 }}>
        <Icono n="marcador" tam={13} />Guardar como evidencia
      </button>
    );
  }
  return (
    <div style={{ marginTop: 6, display: 'grid', gap: 6, width: 280, maxWidth: '100%' }}>
      <input data-motivo-evidencia={m.msgId} value={motivo} maxLength={200} autoFocus
        placeholder="Por qué (queda registrado): choque en la Av. Circunvalación"
        onChange={e => setMotivo(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') mandar(true); }}
        style={{ ...campo(34), fontSize: 13 }} />
      <div style={{ display: 'flex', gap: 6 }}>
        <button data-guardar-evidencia={m.msgId} onClick={() => mandar(true)} style={btnChico(HUD.fg2)}>Guardar</button>
        <button onClick={() => { setAbierto(false); setError(null); }} style={{ ...btnFantasma(28), fontSize: 12 }}>Cancelar</button>
      </div>
      {error && <div role="alert" style={{ fontSize: 12, color: HUD.ambarTinta }}>{error}</div>}
    </div>
  );
}

function ChatColumn({ messages, onSend, routeId, privadoCon, onCerrarPrivado, nombres = {}, noLeidos = {}, onAbrir, onEvidencia, onCargar }) {
  const nombreDe = (clave) => esPrivadoPersona(clave) ? (nombres[clave] || clave.slice(2)) : clave;
  // La bandeja: los privados con algo sin leer, para que lo de alguien que no
  // tiene tarjeta a la vista (un cobrador, el que está en la puerta) no se
  // pierda. Sólo en el canal de la ruta.
  const pendientes = Object.entries(noLeidos).filter(([, n]) => n > 0);
  const [draft, setDraft] = React.useState('');
  const [noSalio, setNoSalio] = React.useState(false);
  const scrollRef = React.useRef(null);
  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages]);

  const send = () => {
    const text = draft.trim();
    if (!text) return;
    // Sin conexión el mensaje no sale: el borrador se queda y se dice.
    // Antes se borraba igual y la instrucción se perdía (barrido del 22/9).
    if (onSend(text) === false) { setNoSalio(true); return; }
    setNoSalio(false);
    setDraft('');
  };

  const nombreVisible = (f) => f === 'DESPACHO' ? 'Despacho' : f === 'GERENCIA' ? 'Gerencia' : f;
  const hilo = messages.filter(m => (m.para || null) === (privadoCon || null));

  return (
    <div style={{
      display: 'flex', flexDirection: 'column', height: '100%', minHeight: 0,
      background: HUD.surface,
    }}>
      <div style={{
        padding: '10px 14px', minHeight: 62, borderBottom: `1px solid ${HUD.divider}`,
        display: 'flex', alignItems: 'center', gap: 10,
      }}>
        {privadoCon ? (
          <>
            <button onClick={onCerrarPrivado} title="Volver al grupo de la ruta"
              style={{ ...btnFantasma(34), padding: '0 8px', flexShrink: 0 }}>← Grupo</button>
            {esPrivadoPersona(privadoCon)
              ? <Avatar nombre={nombreDe(privadoCon)} tam={34} />
              : <span style={{ width: 34, height: 34, borderRadius: 10, flexShrink: 0, background: HUD.hueco, color: HUD.fg2,
                  display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}><Icono n="vehiculo" tam={18} /></span>}
            <div style={{ minWidth: 0, flex: 1 }}>
              <div style={{
                fontWeight: 800, fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                ...(esPrivadoPersona(privadoCon) ? {} : { fontFamily: black, fontWeight: 400 }),
              }}>{nombreDe(privadoCon)}</div>
              <div title={esPrivadoPersona(privadoCon)
                  ? 'Sólo esa persona, en la combi que esté. Su cobrador no lo ve.'
                  : 'Los que van arriba de esa combi hoy (chofer y cobrador), y los que la manejen después.'}
                style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 12, fontWeight: 700, color: HUD.ambarTinta2 }}>
                <Icono n="candado" tam={12} grosor={2.2} />
                {esPrivadoPersona(privadoCon) ? 'Solo esa persona' : 'Toda esa combi'}
              </div>
            </div>
          </>
        ) : (
          <>
            <span style={{ width: 34, height: 34, borderRadius: 10, flexShrink: 0, background: HUD.azulFondo, color: HUD.azulTinta,
              display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}><Icono n="chat" tam={18} /></span>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontWeight: 800, fontSize: 14 }}>
                Canal de ruta{routeId ? <span style={{ ...dato(12, HUD.dim2) }}> · {routeId}</span> : null}
              </div>
              <div style={{ fontSize: 12, color: HUD.dim2 }}>Lo leen todos los que van en la ruta</div>
            </div>
          </>
        )}
      </div>

      {!privadoCon && pendientes.length > 0 && (
        <div data-bandeja style={{
          padding: '8px 14px', borderBottom: `1px solid ${HUD.divider}`, background: HUD.ambarFondo,
          display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center',
        }}>
          <span style={{ ...rotulo(9, HUD.ambarTinta) }}>Privados sin leer</span>
          {pendientes.map(([clave, n]) => (
            <button key={clave} onClick={() => onAbrir && onAbrir(clave)}
              title={esPrivadoPersona(clave) ? 'Privado con esa persona' : 'Privado con esa combi'}
              style={{ ...btnChico(HUD.ambarTinta, HUD.ambarBorde), borderRadius: 16, fontSize: 12 }}>
              <Icono n={esPrivadoPersona(clave) ? 'persona' : 'vehiculo'} tam={13} grosor={2} />{nombreDe(clave)} · {n}
            </button>
          ))}
        </div>
      )}

      <div ref={scrollRef} style={{
        flex: 1, overflowY: 'auto', overflowX: 'hidden', padding: '14px 12px', background: HUD.bg,
        display: 'flex', flexDirection: 'column', gap: 10, minHeight: 0,
      }}>
        {hilo.length === 0 && (
          <Vacio icono="chat" titulo={privadoCon ? 'Todavía no se escribieron' : 'El canal está tranquilo'}>
            {privadoCon
              ? `Lo que escribas acá le llega solo a ${nombreDe(privadoCon)}.`
              : 'Lo que escriban los choferes y cobradores de la ruta aparece acá.'}
          </Vacio>
        )}
        {hilo.map((m, i) => {
          const own = m.role === 'dispatch-self';
          const sos = m.tone === 'sos';
          const quien = nombreVisible(m.from);
          return (
            <div key={m.k ?? i} className="r14-msg" style={{
              display: 'flex', gap: 8, alignItems: 'flex-end',
              justifyContent: own ? 'flex-end' : 'flex-start', animation: 'entrarMsg .2s ease-out',
            }}>
              {!own && (sos
                ? <span aria-hidden="true" style={{ width: 28, height: 28, borderRadius: '50%', flexShrink: 0, background: HUD.red, color: '#fff',
                    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', marginBottom: 2 }}><Icono n="alerta" tam={15} grosor={2.2} /></span>
                : <span style={{ marginBottom: 2 }}><Avatar nombre={quien} tam={28} /></span>)}
              <div style={{ maxWidth: '80%', minWidth: 0, display: 'flex', flexDirection: 'column', alignItems: own ? 'flex-end' : 'flex-start' }}>
                <div style={{
                  maxWidth: '100%', padding: '7px 12px 5px', borderRadius: 16,
                  [own ? 'borderBottomRightRadius' : 'borderBottomLeftRadius']: 6,
                  background: sos ? HUD.burbujaSos : own ? HUD.burbujaPropia : HUD.burbuja,
                  color: sos ? HUD.burbujaSosInk : own ? HUD.burbujaPropiaInk : HUD.burbujaInk,
                  border: `1px solid ${sos ? HUD.rojoBorde : own ? HUD.burbujaPropia : HUD.divider}`,
                }}>
                  {/* Quién habla y desde qué combi: con cobradores a bordo el
                      nombre ya no alcanza para saber de qué unidad viene */}
                  {!own && (
                    <div style={{ fontSize: 12, fontWeight: 800, marginBottom: 2, color: sos ? HUD.burbujaSosInk : HUD.fg2 }}>
                      {quien}
                      {m.unit && m.unit !== m.from && <span style={{ ...dato(11, sos ? HUD.burbujaSosInk : HUD.dim2) }}> · {m.unit}</span>}
                    </div>
                  )}
                  <div style={{ fontSize: 14, lineHeight: 1.45, overflowWrap: 'anywhere' }}>
                    {m.voice
                      ? (m.audio
                          ? <audio controls src={m.audio} style={{ width: 220, height: 36, display: 'block' }} />
                          : m.aparte && onCargar
                          // Vino sin contenido para no hacer pesado el
                          // historial: se pide al tocarla
                          ? <button data-cargar={m.msgId} onClick={() => onCargar(m.msgId)} style={btnChico(HUD.fg2)}><Icono n="mic" tam={14} />Cargar nota de voz ({m.voice}s)</button>
                          : <span style={{ color: HUD.dim2, display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icono n="mic" tam={14} />Nota de voz ({m.voice}s{m.expired ? ' · expirada' : ''})</span>)
                      : m.photo
                      ? (m.image
                          // Se abre en pestaña nueva: lo que mandan —una chapa,
                          // un desperfecto— hay que poder mirarlo en grande.
                          ? <div>
                              <a href={m.image} target="_blank" rel="noreferrer">
                                <img src={m.image} alt={m.text}
                                  style={{ maxWidth: 240, borderRadius: 10, display: 'block', cursor: 'zoom-in' }} />
                              </a>
                              {m.text && m.text !== 'Foto' && <div style={{ marginTop: 4 }}>{m.text}</div>}
                            </div>
                          : m.aparte && onCargar
                          ? <button data-cargar={m.msgId} onClick={() => onCargar(m.msgId)} style={btnChico(HUD.fg2)}><Icono n="camara" tam={14} />Cargar foto{m.text && m.text !== 'Foto' ? ` · ${m.text}` : ''}</button>
                          : <span style={{ color: HUD.dim2, display: 'inline-flex', alignItems: 'center', gap: 5 }}><Icono n="camara" tam={14} />{m.text} · ya no disponible</span>)
                      : m.text}
                  </div>
                  <div style={{
                    fontSize: 11, marginTop: 2, textAlign: 'right', fontVariantNumeric: 'tabular-nums',
                    color: sos ? HUD.burbujaSosInk : own ? HUD.burbujaPropiaInk : HUD.dim3,
                  }}>{m.time}</div>
                </div>
                {sos && m.atendido && (
                  <div style={{ ...rotulo(9, HUD.dim2), marginTop: 4, display: 'flex', alignItems: 'center', gap: 4 }}>
                    <Icono n="check" tam={13} grosor={2.2} />{m.atendido}
                  </div>
                )}
                <Evidencia m={m} onEvidencia={onEvidencia} />
              </div>
            </div>
          );
        })}
      </div>

      {noSalio && (
        <div role="alert" style={{ padding: '8px 14px 0', fontSize: 13, fontWeight: 700, color: HUD.ambarTinta2, display: 'flex', gap: 6, alignItems: 'flex-start' }}>
          <Icono n="sinSenal" tam={15} style={{ marginTop: 1 }} />
          Sin conexión: el mensaje no salió. Queda escrito para mandarlo cuando vuelva.
        </div>
      )}
      <div style={{ padding: '10px 12px', borderTop: `1px solid ${HUD.divider}`, display: 'flex', gap: 8, alignItems: 'center' }}>
        <input
          value={draft}
          onChange={e => { setDraft(e.target.value); setNoSalio(false); }}
          onKeyDown={e => { if (e.key === 'Enter') send(); }}
          placeholder={privadoCon ? `Mensaje solo para ${nombreDe(privadoCon)}…` : 'Escribí al canal de la ruta…'}
          style={{ ...campo(44), flex: 1, borderRadius: 22, padding: '0 16px' }}
        />
        <button onClick={send} aria-label="Enviar" title="Enviar" style={{
          width: 44, height: 44, borderRadius: '50%', border: 'none', flexShrink: 0,
          background: HUD.bright, color: '#fff', cursor: 'pointer',
          display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
        }}><Icono n="enviar" tam={19} /></button>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// TRAZADOR DE RECORRIDO
// Carga la geometría real de una ruta. Sin esto el progreso es una
// proyección lineal entre dos puntos y las brechas son aproximaciones.
//
// La forma de cargarlo es tocar el mapa en el orden en que maneja la combi:
// es lo que se entiende sin que nadie lo explique, y funciona igual en PC
// con el mouse que en un celular con el dedo. Para quien quiera precisión
// de verdad, se puede importar el GPX de una vuelta grabada manejando.
// ═══════════════════════════════════════════════════════════════

// Metros entre dos puntos GPS (la misma cuenta que hace el servidor)
const METROS_POR_GRADO = 111320;
function metrosEntre(a, b) {
  const kLng = Math.cos((a[0] + b[0]) / 2 * Math.PI / 180);
  return Math.hypot((b[0] - a[0]) * METROS_POR_GRADO, (b[1] - a[1]) * METROS_POR_GRADO * kLng);
}
function largoDe(puntos) {
  let m = 0;
  for (let i = 1; i < puntos.length; i++) m += metrosEntre(puntos[i - 1], puntos[i]);
  return m;
}

// Douglas-Peucker: saca los puntos que no cambian la forma del trazado.
// Un GPX de una vuelta trae miles de puntos y no hacen falta: con tolerancia
// de ~10 m el recorrido queda igual con una fracción de los puntos.
function simplificar(puntos, toleranciaM = 10) {
  if (puntos.length < 3) return puntos;
  const distAlSegmento = (p, a, b) => {
    const kLng = Math.cos(a[0] * Math.PI / 180);
    const px = (p[1] - a[1]) * METROS_POR_GRADO * kLng, py = (p[0] - a[0]) * METROS_POR_GRADO;
    const bx = (b[1] - a[1]) * METROS_POR_GRADO * kLng, by = (b[0] - a[0]) * METROS_POR_GRADO;
    const largo2 = bx * bx + by * by;
    const t = largo2 === 0 ? 0 : Math.max(0, Math.min(1, (px * bx + py * by) / largo2));
    return Math.hypot(px - t * bx, py - t * by);
  };
  const conservar = new Array(puntos.length).fill(false);
  conservar[0] = conservar[puntos.length - 1] = true;
  const pila = [[0, puntos.length - 1]];
  while (pila.length) {
    const [ini, fin] = pila.pop();
    let peor = 0, idx = -1;
    for (let i = ini + 1; i < fin; i++) {
      const d = distAlSegmento(puntos[i], puntos[ini], puntos[fin]);
      if (d > peor) { peor = d; idx = i; }
    }
    if (idx !== -1 && peor > toleranciaM) {
      conservar[idx] = true;
      pila.push([ini, idx], [idx, fin]);
    }
  }
  return puntos.filter((_, i) => conservar[i]);
}

// GPX (<trkpt lat lon>) y GeoJSON (LineString). Es lo que exporta cualquier
// app de grabar recorridos.
function leerRecorrido(texto) {
  const t = texto.trim();
  if (t.startsWith('{')) {
    const j = JSON.parse(t);
    const busca = (o) => {
      if (!o || typeof o !== 'object') return null;
      if (o.type === 'LineString' && Array.isArray(o.coordinates)) {
        return o.coordinates.map(c => [Number(c[1]), Number(c[0])]);  // GeoJSON va [lng, lat]
      }
      for (const v of Object.values(o)) {
        const r = Array.isArray(v) ? v.map(busca).find(Boolean) : busca(v);
        if (r) return r;
      }
      return null;
    };
    const p = busca(j);
    if (!p) throw new Error('El GeoJSON no tiene un LineString');
    return p;
  }
  // El track y la ruta (<trkpt>, <rtept>) en el orden del archivo, y los
  // waypoints sólo si no hay otra cosa: un GPX trae sus <wpt> —marcadores
  // sueltos— al principio, y mezclarlos pegaba puntos ajenos al comienzo del
  // trazado. Y `lat` y `lon` se leen cada uno por su lado: con
  // `lon="…" lat="…"`, en ese orden, no se encontraba ningún punto
  // (barrido del 22/9).
  const leer = (etiqueta) => {
    const ps = [];
    const re = new RegExp('<(?:' + etiqueta + ')\\s([^>]*)>', 'gi');
    let m;
    while ((m = re.exec(t))) {
      const la = /\blat\s*=\s*["']([-\d.]+)["']/i.exec(m[1]);
      const lo = /\blon\s*=\s*["']([-\d.]+)["']/i.exec(m[1]);
      if (la && lo) ps.push([Number(la[1]), Number(lo[1])]);
    }
    return ps;
  };
  let puntos = leer('trkpt|rtept');
  if (!puntos.length) puntos = leer('wpt');
  if (!puntos.length) throw new Error('No se encontraron puntos en el archivo');
  return puntos;
}

// Arriba de este tope los puntos dejan de ser arrastrables (miles de
// marcadores hacen inusable el mapa): se ve la línea y se puede deshacer.
const TOPE_ARRASTRABLES = 200;

function Trazador({ routeId, routeName, variantes, api, onClose, onGuardado }) {
  // Sobre cuál de los trazados se está dibujando. Arranca en el que está
  // midiendo, que es el caso normal; dibujar uno guardado no le mueve el
  // mapa a nadie hasta que Despacho lo active.
  const lista = variantes && variantes.length ? variantes : [];
  const [variantId, setVariantId] = React.useState(
    () => (lista.find(v => v.activa) || lista[0] || {}).variantId || null);
  const variante = lista.find(v => v.variantId === variantId) || null;

  // Los dos tramos del circuito. Se dibuja el activo; el otro queda de fondo
  // para poder calzarlos (la vuelta suele ir pegada a la ida).
  const [tramos, setTramos] = React.useState(null);   // null = cargando
  const [tramo, setTramo] = React.useState('ida');
  const [error, setError] = React.useState(null);
  const [aviso, setAviso] = React.useState(null);
  const [guardando, setGuardando] = React.useState(false);
  // Las grabaciones de la calle (3.4): null = todavía no se pidieron
  const [grabaciones, setGrabaciones] = React.useState(null);
  const [verGrabaciones, setVerGrabaciones] = React.useState(false);
  // Y los pedidos de grabación (4.5): Despacho le encarga una a una unidad,
  // la app la arranca sola en su próximo reporte. La flota de la ruta se
  // carga una vez para el selector; los pedidos se recargan con cada
  // apertura, porque su estado cambia solo (la app confirma, o termina).
  const [pedidos, setPedidos] = React.useState([]);
  const [flota, setFlota] = React.useState(null);
  const [unidadPedir, setUnidadPedir] = React.useState('');
  const cargarGrabaciones = () => {
    api('/admin/grabaciones')
      .then(d => { setGrabaciones(d.grabaciones || []); setPedidos(d.pedidos || []); })
      .catch(e => { setGrabaciones([]); setError(e.message); });
    if (!flota) {
      api('/admin/vehicles')
        .then(d => setFlota((d.vehicles || []).filter(v => v.routeId === routeId)))
        .catch(() => setFlota([]));
    }
  };
  const pedirGrabacion = () => {
    api('/admin/grabaciones/pedir', { method: 'POST', body: JSON.stringify({ vehicleId: unidadPedir }) })
      .then(d => {
        setPedidos(ps => [{ vehicleId: unidadPedir, estado: d.estado, pedidaEn: Date.now() },
                          ...ps.filter(p => p.vehicleId !== unidadPedir)]);
        setUnidadPedir('');
      })
      .catch(e => setError(e.message));
  };
  const cancelarPedido = (vehicleId) => {
    api(`/admin/grabaciones/pedir/${encodeURIComponent(vehicleId)}`, { method: 'DELETE' })
      .then(() => setPedidos(ps => ps.filter(p => p.vehicleId !== vehicleId)))
      .catch(e => setError(e.message));
  };
  const mapRef = React.useRef(null);
  const capaRef = React.useRef(null);
  const archivoRef = React.useRef(null);
  const encuadradoRef = React.useRef(false);
  const tramoRef = React.useRef('ida');
  // Bajo 900 px el panel se pone arriba del mapa en vez de al costado
  const [angosto, setAngosto] = React.useState(window.innerWidth < 900);
  React.useEffect(() => {
    const onResize = () => {
      setAngosto(window.innerWidth < 900);
      if (mapRef.current) setTimeout(() => mapRef.current.invalidateSize(), 60);
    };
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  React.useEffect(() => { tramoRef.current = tramo; }, [tramo]);

  const puntos = tramos ? tramos[tramo] : null;
  // Sin tramos cargados no se dibuja: tocar el mapa mientras carga (o tras
  // cambiar de variante) tiraba un TypeError y dejaba la pantalla en blanco.
  const setPuntos = (fn) => setTramos(t => t ? ({ ...t, [tramoRef.current]:
    typeof fn === 'function' ? fn(t[tramoRef.current]) : fn }) : t);

  // El recorrido que ya tenía esa variante. Se recarga al cambiar de una a
  // otra: cada una tiene su propio dibujo.
  //
  // Dos cuidados (barrido del 22/9). Si la carga FALLA, `tramos` queda en
  // null —trabado—: antes quedaba vacío, y Guardar sobre eso borraba el
  // recorrido real. Y la respuesta de una variante que ya no es la elegida
  // se descarta: si la de A llegaba después que la de B, se guardaba el
  // dibujo de A dentro de B.
  React.useEffect(() => {
    let vigente = true;
    setTramos(null);
    capaRef.current && capaRef.current.clearLayers();
    const q = variantId ? `?variantId=${variantId}` : '';
    api(`/admin/routes/${encodeURIComponent(routeId)}/points${q}`)
      .then(d => { if (vigente) setTramos({
        ida: (d.tramos?.ida || []).map(p => [p.lat, p.lng]),
        vuelta: (d.tramos?.vuelta || []).map(p => [p.lat, p.lng]),
      }); })
      .catch(e => { if (vigente) setError(`No se pudo cargar el recorrido: ${e.message}. Cerrá y volvé a abrir antes de dibujar.`); });
    return () => { vigente = false; };
  }, [routeId, variantId]);

  // El mapa se libera al cerrar: Leaflet deja colgado su listener de resize
  // y con él el mapa entero, cada vez que se abría y cerraba el trazador.
  React.useEffect(() => () => { mapRef.current && mapRef.current.remove(); mapRef.current = null; }, []);

  const initMap = React.useCallback((node) => {
    if (!node || mapRef.current) return;
    const map = L.map(node, { center: JULIACA_CENTER, zoom: 14, zoomControl: true, attributionControl: true });
    map.attributionControl.setPrefix(false);
    L.tileLayer(HUD.tiles, { maxZoom: 19, attribution: TILES_ATRIB }).addTo(map);
    capaRef.current = L.layerGroup().addTo(map);
    // Tocar el mapa agrega un punto al final del tramo que se esté dibujando
    map.on('click', (e) => {
      setPuntos(p => [...(p || []), [e.latlng.lat, e.latlng.lng]]);
      setAviso(null);
    });
    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 80);
    setTimeout(() => map.invalidateSize(), 400);
  }, []);

  // Redibuja línea y puntos cada vez que cambian
  React.useEffect(() => {
    const map = mapRef.current, capa = capaRef.current;
    if (!map || !capa || !tramos) return;
    capa.clearLayers();

    // El tramo que NO se está editando, punteado y apagado de fondo: el
    // contraste dice cuál es cuál sin leer nada.
    const otro = tramo === 'ida' ? 'vuelta' : 'ida';
    if (tramos[otro].length > 1) {
      L.polyline(tramos[otro], {
        color: HUD.dim3, weight: 4, opacity: 0.55, dashArray: '6 6',
      }).addTo(capa);
    }

    // Ámbar cuando lo que se dibuja no es el trazado que mide hoy: el mismo
    // color que la franja de aviso de arriba.
    const tinta = variante && !variante.activa ? HUD.amber : HUD.bright;
    const activos = tramos[tramo];
    if (activos.length > 1) {
      L.polyline(activos, { color: tinta, weight: 5, opacity: 0.9 }).addTo(capa);
    }

    const arrastrables = activos.length <= TOPE_ARRASTRABLES;
    activos.forEach((p, i) => {
      const extremo = i === 0 || i === activos.length - 1;
      if (!arrastrables) {
        L.circleMarker(p, { radius: 4, color: tinta, weight: 2, fillColor: '#fff', fillOpacity: 1 }).addTo(capa);
        return;
      }
      // A y B se quedan: son lo único que dice en qué sentido se maneja.
      const etiqueta = i === 0 ? 'A' : i === activos.length - 1 ? 'B' : '';
      const marcador = L.marker(p, {
        draggable: true,
        icon: L.divIcon({
          className: '',
          iconSize: [extremo ? 22 : 12, extremo ? 22 : 12],
          iconAnchor: [extremo ? 11 : 6, extremo ? 11 : 6],
          html: `<div style="width:100%;height:100%;border-radius:50%;
            background:#fff; border:2px solid ${tinta}; color:${tinta};
            box-sizing:border-box;
            display:flex;align-items:center;justify-content:center;
            font:700 11px/1 system-ui,sans-serif;">${etiqueta}</div>`,
        }),
      }).addTo(capa);
      marcador.on('dragend', (e) => {
        const { lat, lng } = e.target.getLatLng();
        setPuntos(ps => ps.map((q, j) => (j === i ? [lat, lng] : q)));
      });
      // Tocar un punto lo borra (arrastrar no dispara click en Leaflet)
      marcador.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        setPuntos(ps => ps.filter((_, j) => j !== i));
      });
    });

    // Encuadrar una sola vez, cuando llega el recorrido que ya existía
    const todos = [...tramos.ida, ...tramos.vuelta];
    if (!encuadradoRef.current && todos.length > 1) {
      map.fitBounds(L.latLngBounds(todos).pad(0.15));
      encuadradoRef.current = true;
    }
  }, [tramos, tramo, variante]);

  const importar = (texto) => {
    try {
      const crudos = leerRecorrido(texto);
      const simple = simplificar(crudos, 10);
      const final = simple.slice(0, 2000);
      setPuntos(final);
      encuadradoRef.current = false;
      setError(null);
      setAviso(`Importados ${crudos.length} puntos a la ${tramo}, simplificados a ${final.length} sin cambiar la forma` +
        (simple.length > 2000 ? ' (recortado al tope de 2000)' : ''));
    } catch (e) {
      setError('No se pudo leer el archivo: ' + e.message);
    }
  };

  // Guardar sobre el trazado que ESTÁ MIDIENDO es cambiar el trazado con el
  // que se mide la ruta: el servidor descarta las vueltas en curso. Eso se
  // confirma nombrando qué pasa, igual que el cambio de variante; y guardar
  // un recorrido vacío es borrarlo, que también (barrido del 22/9).
  const [confirmarGuardar, setConfirmarGuardar] = React.useState(false);
  const midiendoEsta = !variantId || !!(variante && variante.activa);
  const pedirGuardar = () => {
    const vacio = tramos && !tramos.ida.length && !tramos.vuelta.length;
    if (midiendoEsta || vacio) setConfirmarGuardar(true);
    else guardar();
  };
  const guardar = async () => {
    setConfirmarGuardar(false);
    setGuardando(true); setError(null);
    try {
      const aPuntos = (ps) => ps.map(p => ({ lat: p[0], lng: p[1] }));
      const r = await api(`/admin/routes/${encodeURIComponent(routeId)}/points`, {
        method: 'PUT',
        body: JSON.stringify({
          variantId: variantId || undefined,
          tramos: { ida: aPuntos(tramos.ida), vuelta: aPuntos(tramos.vuelta) },
        }),
      });
      onGuardado && onGuardado(r);
      onClose();
    } catch (e) { setError(e.message); }
    setGuardando(false);
  };

  // La franja de aviso y los mensajes le cambian el alto al mapa; Leaflet
  // necesita que le avisen o queda con los mosaicos cortados.
  React.useEffect(() => {
    if (mapRef.current) setTimeout(() => mapRef.current.invalidateSize(), 60);
  }, [variante, error, aviso, angosto]);

  const kmDe = (ps) => (largoDe(ps || []) / 1000).toFixed(1);

  // Guardar con la vuelta a medias sería un circuito roto
  const vueltaIncompleta = tramos && tramos.vuelta.length === 1;
  const idaIncompleta = tramos && tramos.ida.length === 1;
  const sinIda = tramos && !tramos.ida.length && tramos.vuelta.length > 0;
  const trabado = guardando || !tramos || vueltaIncompleta || idaIncompleta || sinIda;
  const midiendo = lista.find(v => v.activa) || null;
  const desalineado = !!(variante && !variante.activa);

  const importarArchivo = () => archivoRef.current?.click();

  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 4000, background: HUD.bg,
      display: 'flex', flexDirection: 'column',
    }}>
      {/* cabecera */}
      <div style={{
        height: 60, flexShrink: 0, padding: '0 18px', background: HUD.surface,
        borderBottom: `1px solid ${HUD.divider}`,
        display: 'flex', alignItems: 'center', gap: 12,
      }}>
        <span style={{ fontFamily: black, fontSize: 17 }}>Trazador</span>
        <span style={{
          ...rotulo(10, HUD.dim2), minWidth: 0,
          overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
        }}>{routeId}{routeName ? ` · ${routeName}` : ''}</span>
        <div style={{ flex: 1 }} />
        {(vueltaIncompleta || idaIncompleta || sinIda) && (
          <span style={{ fontSize: 12, color: HUD.amber, fontWeight: 700, textAlign: 'right' }}>
            {sinIda ? 'Falta la ida: el circuito arranca por ahí'
              : `La ${idaIncompleta ? 'ida' : 'vuelta'} tiene un solo punto`}
          </span>
        )}
        <button onClick={onClose} style={btnSecundario(36)}>Cancelar</button>
        <button onClick={pedirGuardar} disabled={trabado}
          style={{ ...btnPrimario(36), opacity: trabado ? .5 : 1, cursor: trabado ? 'not-allowed' : 'pointer' }}>
          {guardando ? 'Guardando…' : 'Guardar recorrido'}
        </button>
      </div>

      {confirmarGuardar && tramos && (
        <Confirmacion
          kicker="Confirmar recorrido"
          tono={!tramos.ida.length ? 'red' : 'amber'}
          titulo={!tramos.ida.length
            ? `Vas a BORRAR el recorrido de ${routeName || routeId}${variante ? ` («${variante.name}»)` : ''}`
            : `${routeName || routeId} va a medirse con este dibujo`}
          cuerpo={<>
            {!tramos.ida.length
              ? <>La ruta queda <strong>sin trazado</strong>: nadie se mide contra nada hasta que se cargue otro.</>
              : <>Es el trazado que está midiendo ahora: les cambia el mapa a las unidades en ruta.</>}
            {midiendoEsta && <>{' '}Y <strong>descarta las vueltas en curso</strong> — se venían midiendo con el dibujo anterior.</>}
          </>}
          aceptar={!tramos.ida.length ? 'Sí, borrar el recorrido' : 'Sí, guardar y medir con esto'}
          onAceptar={guardar}
          onCancelar={() => setConfirmarGuardar(false)}
        />
      )}

      {/* Dibujar un trazado guardado es lo normal cuando se prepara un desvío
          antes de que empiece la obra. Pero hay que decirlo, y decirlo acá:
          si no, se guarda creyendo que se corrigió el recorrido de hoy y no
          cambió nada. No es un toast, no se descarta y no se esconde. */}
      {desalineado && (
        <div style={{
          flexShrink: 0, padding: '14px 20px', background: HUD.ambarFondo,
          borderBottom: `2px solid ${HUD.amber}`,
          display: 'flex', gap: 13, alignItems: 'flex-start',
        }}>
          <span style={{ fontFamily: black, fontSize: 15, color: HUD.amber, flexShrink: 0 }}>ATENCIÓN</span>
          <span style={{ fontSize: 14, lineHeight: 1.55, color: HUD.ambarTinta }}>
            Estás dibujando <strong>«{variante.name}»</strong>, que <strong>no es el
            trazado con el que se está midiendo hoy</strong>
            {midiendo ? <> (hoy mide «{midiendo.name}»)</> : null}. Guardar acá no
            corrige el recorrido de las unidades que están en ruta: para eso hay que
            cambiar la medición en Gestión ▸ Rutas.
          </span>
        </div>
      )}

      {error && (
        <div style={{
          flexShrink: 0, padding: '10px 20px', background: HUD.rojoFondo,
          borderBottom: `1px solid ${HUD.rojoBorde}`,
          color: HUD.rojoTinta, fontSize: 13, fontWeight: 700,
        }}>{error}</div>
      )}
      {aviso && (
        <div style={{
          flexShrink: 0, padding: '10px 20px', background: HUD.verdeFondo,
          borderBottom: `1px solid ${HUD.verdeBorde}`,
          color: HUD.verdeTinta, fontSize: 13, fontWeight: 700,
        }}>{aviso}</div>
      )}

      <div style={{
        flex: 1, minHeight: 0, display: 'flex',
        flexDirection: angosto ? 'column' : 'row',
      }}>
        {/* panel */}
        <div style={{
          flexShrink: 0, width: angosto ? 'auto' : 300, background: HUD.bg,
          borderRight: angosto ? 'none' : `1px solid ${HUD.divider}`,
          borderBottom: angosto ? `1px solid ${HUD.divider}` : 'none',
          padding: 16, overflowY: 'auto',
          display: 'flex', flexDirection: 'column', gap: 16,
        }}>
          {/* Sobre cuál trazado se dibuja. Con uno solo no hay nada que elegir. */}
          <div>
            <div style={{ ...rotulo(9), marginBottom: 8 }}>Trazado que estás dibujando</div>
            {lista.length > 1 ? (
              <span style={{ position: 'relative', display: 'block' }}>
                <span style={{
                  display: 'flex', alignItems: 'center', gap: 8, height: 40, padding: '0 12px',
                  background: HUD.surface, border: `1px solid ${HUD.line}`, borderRadius: 10,
                }}>
                  <span style={{
                    fontFamily: black, fontSize: 14, flex: 1, minWidth: 0,
                    overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                  }}>{variante ? variante.name : '—'}</span>
                  <span style={{ fontSize: 11, color: HUD.dim3 }}>▾</span>
                </span>
                <select value={variantId || ''} onChange={e => setVariantId(Number(e.target.value))}
                  title="Sobre cuál de los trazados de esta ruta estás dibujando"
                  style={{ position: 'absolute', inset: 0, width: '100%', opacity: 0, cursor: 'pointer' }}>
                  {lista.map(v => (
                    <option key={v.variantId} value={v.variantId}>
                      {v.name}{v.activa ? ' · midiendo' : ''}
                    </option>
                  ))}
                </select>
              </span>
            ) : (
              <div style={{
                height: 40, padding: '0 12px', display: 'flex', alignItems: 'center',
                background: HUD.surface, border: `1px solid ${HUD.line}`, borderRadius: 10,
                fontFamily: black, fontSize: 14,
              }}>{variante ? variante.name : (routeName || routeId)}</div>
            )}
            {desalineado && (
              <div style={{ ...rotulo(10, HUD.amber), marginTop: 8 }}>
                ◇ No es el que mide hoy
              </div>
            )}
          </div>

          <div style={{ height: 1, background: HUD.divider }} />

          {/* Tramo que se está dibujando. El circuito son dos: la combi va y
              vuelve, y no siempre por la misma calle. */}
          <div>
            <div style={{ ...rotulo(9), marginBottom: 8 }}>Tramo</div>
            <div style={{ display: 'flex', background: HUD.hueco, borderRadius: 10, padding: 3 }}>
              {[['ida', 'Ida'], ['vuelta', 'Vuelta']].map(([k, etiqueta]) => {
                const activo = tramo === k;
                return (
                  <button key={k} onClick={() => setTramo(k)} style={{
                    flex: 1, height: 34, borderRadius: 8, cursor: 'pointer',
                    fontSize: 13, fontWeight: 700, fontFamily: 'inherit',
                    background: activo ? HUD.surface : 'transparent',
                    border: `1px solid ${activo ? HUD.line : 'transparent'}`,
                    color: activo ? HUD.fg : HUD.dim2,
                  }}>{etiqueta}</button>
                );
              })}
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <div style={{ padding: '12px 14px', borderRadius: 12, background: HUD.bg }}>
              <div style={rotulo(9)}>Puntos</div>
              <div style={{ fontFamily: black, fontSize: 22, marginTop: 4 }}>
                {puntos ? puntos.length : '—'}
              </div>
            </div>
            <div style={{ padding: '12px 14px', borderRadius: 12, background: HUD.bg }}>
              <div style={rotulo(9)}>Largo</div>
              <div style={{ fontFamily: black, fontSize: 22, marginTop: 4 }}>
                {puntos ? kmDe(puntos) : '—'}
                <span style={{ fontFamily: mono, fontSize: 11, fontWeight: 700, color: HUD.dim2, marginLeft: 4 }}>KM</span>
              </div>
            </div>
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <button onClick={importarArchivo}
              title={`Un GPX o GeoJSON para la ${tramo}, por ejemplo de esa mitad grabada manejando`}
              style={{ ...btnSecundario(38), width: '100%', color: HUD.fg2 }}>
              Importar GPX o GeoJSON
            </button>
            {/* Las grabaciones de la calle (3.4): un chofer manejó la vuelta
                con el grabador de la app y el recorrido quedó en el servidor.
                Cargarlo acá lo pone como los puntos del tramo elegido — entra
                por el MISMO import (y su misma simplificación) que un GPX. */}
            <button onClick={() => {
              setVerGrabaciones(v => !v);
              if (!verGrabaciones) cargarGrabaciones();
            }} style={{ ...btnSecundario(38), width: '100%', color: HUD.fg2 }}>
              {verGrabaciones ? 'Ocultar grabaciones' : 'Grabaciones de la calle'}
            </button>
            {verGrabaciones && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                {/* Pedir una a la calle (4.5): el pedido le llega a la app
                    en su próximo reporte de GPS y la grabación arranca sola,
                    con aviso al chofer — que la termina desde su Perfil. */}
                <div style={{ ...tarjeta('8px 10px'), borderRadius: 8 }}>
                  <div style={rotulo(9)}>Pedir una grabación</div>
                  <div style={{ display: 'flex', gap: 6, marginTop: 6 }}>
                    <select value={unidadPedir} onChange={e => setUnidadPedir(e.target.value)}
                      title="A qué unidad de esta ruta se le pide"
                      style={{ ...campo(32), flex: 1, minWidth: 0, fontSize: 12, cursor: 'pointer' }}>
                      <option value="">Unidad…</option>
                      {(flota || []).map(v => (
                        <option key={v.vehicleId} value={v.vehicleId}>
                          {v.vehicleId}{v.label ? ` · ${v.label}` : ''}{v.enLinea ? ' · en línea' : ''}
                        </option>
                      ))}
                    </select>
                    <button disabled={!unidadPedir} onClick={pedirGrabacion}
                      style={{ ...btnChico(HUD.fg2), flexShrink: 0, opacity: unidadPedir ? 1 : .5 }}>
                      Pedir
                    </button>
                  </div>
                  <div style={{ fontSize: 10, color: HUD.dim3, marginTop: 6, lineHeight: 1.5 }}>
                    Le llega a la app del chofer en su próximo reporte y la grabación
                    arranca sola, con aviso. Él la termina y envía desde su Perfil.
                    Necesita la app instalada; si nadie la levanta, el pedido se vence
                    a las 12 horas.
                  </div>
                </div>
                {pedidos.map(p => (
                  <div key={p.vehicleId} style={{
                    ...tarjeta('8px 10px'), borderRadius: 8, display: 'flex',
                    alignItems: 'center', gap: 8,
                  }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 12, fontWeight: 700 }}>{p.vehicleId}</div>
                      <div style={{ fontFamily: mono, fontSize: 10,
                        color: p.estado === 'grabando' ? HUD.green : HUD.dim3 }}>
                        {p.estado === 'grabando' ? '● grabando' : 'esperando a la app'}
                        {' · pedida '}{nowTime(p.pedidaEn)}
                      </div>
                    </div>
                    <button onClick={() => cancelarPedido(p.vehicleId)}
                      title={p.estado === 'grabando'
                        ? 'Deja de esperarla. La grabación en curso no se corta: el chofer la termina o descarta desde su Perfil'
                        : 'La app no va a arrancar ninguna grabación'}
                      style={{ ...btnChico(HUD.fg2), flexShrink: 0 }}>
                      Cancelar
                    </button>
                  </div>
                ))}
                {!grabaciones && <span style={{ fontSize: 12, color: HUD.dim3 }}>Cargando…</span>}
                {grabaciones && grabaciones.length === 0 && (
                  <span style={{ fontSize: 12, color: HUD.dim3 }}>
                    No hay ninguna. Se graban desde la app del chofer: Perfil → Grabador de recorrido.
                  </span>
                )}
                {(grabaciones || []).map(g => (
                  <div key={g.id} style={{
                    ...tarjeta('8px 10px'), borderRadius: 8, display: 'flex',
                    alignItems: 'center', gap: 8,
                  }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{
                        fontSize: 12, fontWeight: 700, overflow: 'hidden',
                        textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                      }}>{g.nombre || `Recorrido de ${g.quien}`}</div>
                      <div style={{ fontFamily: mono, fontSize: 10, color: HUD.dim3 }}>
                        {g.quien} · {(g.largoM / 1000).toFixed(1)} km · {g.puntos} pts
                        · {new Date(g.createdAt).toLocaleDateString()}
                      </div>
                    </div>
                    <button onClick={() => {
                      api(`/admin/grabaciones/${g.id}.geojson`)
                        .then(geo => { importar(JSON.stringify(geo)); setVerGrabaciones(false); })
                        .catch(e => setError(e.message));
                    }} style={{ ...btnChico(HUD.fg2), flexShrink: 0 }}
                      title={`Cargar estos puntos como la ${tramo} (después ajustás y guardás como siempre)`}>
                      Usar en la {tramo}
                    </button>
                  </div>
                ))}
              </div>
            )}
            <button onClick={() => setPuntos(p => p.slice(0, -1))}
              disabled={!puntos || !puntos.length}
              style={{ ...btnSecundario(38), width: '100%', color: HUD.fg2, opacity: puntos && puntos.length ? 1 : .5 }}>
              Deshacer último punto
            </button>
            <button onClick={() => { setPuntos([]); setAviso(null); }}
              disabled={!puntos || !puntos.length}
              style={{
                ...btnSecundario(38), width: '100%', color: HUD.red,
                borderColor: HUD.rojoBorde, opacity: puntos && puntos.length ? 1 : .5,
              }}>
              Borrar la {tramo}
            </button>
            <input ref={archivoRef} type="file" accept=".gpx,.geojson,.json,.xml,text/*"
              style={{ display: 'none' }}
              onChange={(e) => {
                const f = e.target.files?.[0];
                if (!f) return;
                const fr = new FileReader();
                fr.onload = () => importar(String(fr.result));
                fr.onerror = () => setError('No se pudo abrir el archivo');
                fr.readAsText(f);
                e.target.value = '';
              }} />
          </div>

          <div style={{ fontSize: 12, color: HUD.dim3, lineHeight: 1.55 }}>
            Marcá el recorrido tocando el mapa en el orden en que se maneja: el
            primer punto es la salida (<strong>A</strong>) y el último el final
            (<strong>B</strong>).
            {puntos && puntos.length > TOPE_ARRASTRABLES
              ? ` Con más de ${TOPE_ARRASTRABLES} puntos no se pueden arrastrar (serían miles de marcadores): usá Deshacer.`
              : ' Arrastrá un punto para corregirlo, tocalo para borrarlo.'}
            {' '}El tramo que no estás editando queda punteado de fondo.
          </div>
        </div>

        {/* mapa */}
        <div style={{ flex: 1, minHeight: angosto ? 320 : 0, position: 'relative' }}>
          <div ref={initMap} style={{ position: 'absolute', inset: 0, cursor: 'crosshair' }} />
        </div>
      </div>
    </div>
  );
}

// ADMINISTRACIÓN (fase 2)
// Personas, vehículos, rutas, vueltas y auditoría contra /admin/*.
//
// Ojo con la distinción, que es el corazón del modelo: una PERSONA
// (chofer o cobrador, con su nombre real y su alias) va arriba de un
// VEHÍCULO. Dos personas pueden compartir el mismo vehículo; el que
// reporta GPS es uno solo.
// ═══════════════════════════════════════════════════════════════
// ─── Piezas de Gestión ───────────────────────────────────────────
// Cada sección abre diciendo para qué sirve. La bajada no es decoración:
// es la diferencia entre que alguien toque un botón sabiendo qué hace y
// que lo toque a ver qué pasa.
function Seccion({ titulo, bajada, children }) {
  return (
    <div style={{ animation: 'aparecer .2s ease-out' }}>
      <div style={{ fontFamily: black, fontSize: 26, letterSpacing: -0.3, lineHeight: 1.15 }}>{titulo}</div>

        fontSize: 14, color: HUD.fg2, lineHeight: 1.55, textWrap: 'pretty',
        maxWidth: 680, margin: '8px 0 22px',
      }}>{bajada}</div>
      {children}
    </div>
  );
}

// Cabecera y filas comparten la misma rejilla, así las columnas quedan
// alineadas sin una <table>. La última columna va a la derecha (siempre es
// acciones o el número que se lee de un vistazo). En pantallas angostas la
// tabla se desplaza en horizontal en vez de aplastar las columnas.
function Tabla({ cols, cabeceras, ancho, children }) {
  const rejilla = { display: 'grid', gridTemplateColumns: cols, gap: 12, alignItems: 'center' };
  return (
    <div style={{ overflowX: 'auto' }}>
      <div style={{
        border: `1px solid ${HUD.divider}`, borderRadius: 14, overflow: 'hidden',
        minWidth: ancho || 0, background: HUD.surface,
      }}>
        <div style={{
          ...rejilla, padding: '10px 14px', background: HUD.bg,
          borderBottom: `1px solid ${HUD.divider}`,
        }}>
          {cabeceras.map((c, i) => (
            <div key={i} style={{
              ...rotulo(9),
              textAlign: i === cabeceras.length - 1 && cabeceras.length > 1 ? 'right' : 'left',
            }}>{c}</div>
          ))}
        </div>
        {children}
      </div>
    </div>
  );
}

function FilaTabla({ cols, children }) {
  return (
    <div data-fila style={{
      display: 'grid', gridTemplateColumns: cols, gap: 12, alignItems: 'center',
      padding: '11px 14px', borderBottom: `1px solid ${HUD.hueco}`,

}

// Lo que hay que saber y no entra en la bajada. Era letra chica gris al pie;

// El consentimiento firmado de cada chofer y cobrador (Ley 29733,
// PENDIENTES 0.10). El papel lo guarda la cooperativa; acá se anota que
// existe, de qué fecha y de qué versión del formulario. Si el formulario
// cambia de versión, los que firmaron la vieja vuelven a figurar.
function PanelConsentimiento({ users, vigente, api, run, busy }) {
  const [abierto, setAbierto] = React.useState(false);
  const [fechas, setFechas] = React.useState({});
  const [retiro, setRetiro] = React.useState(null);      // { unitId, motivo }
  const hoyIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const gente = (users || []).filter(u => u.role === 'driver' || u.role === 'collector' || !u.role);
  const estado = (u) => !u.consentimientoFecha ? 'falta' : (vigente && u.consentimientoVersion !== vigente) ? 'vieja' : 'ok';
  const faltan = gente.filter(u => estado(u) !== 'ok').length;
  const nombre = (u) => u.alias || u.name || u.driverName || u.unitId;
  const fecha = (iso) => iso ? iso.split('-').reverse().join('/') : '';
  if (!gente.length) return null;
  return (
    <div data-consentimiento style={{ marginBottom: 14, border: `1px solid ${faltan ? HUD.ambarBorde : HUD.line}`,
      background: faltan ? HUD.ambarFondo : HUD.surface, borderRadius: 10, padding: '10px 12px' }}>
      <button data-consentimiento-abrir onClick={() => setAbierto(a => !a)} aria-expanded={abierto}
        style={{ background: 'none', border: 'none', padding: 0, cursor: 'pointer', fontFamily: 'inherit',
          fontSize: 13, fontWeight: 700, color: faltan ? HUD.ambarTinta : HUD.fg2, textAlign: 'left' }}>
        Consentimiento de datos personales: {gente.length - faltan} de {gente.length} firmaron
        {faltan ? ` · faltan ${faltan}` : ''} {abierto ? '▴' : '▾'}
      </button>
      {abierto && (<div style={{ marginTop: 10 }}>
        <div style={{ fontSize: 12, color: HUD.fg2, lineHeight: 1.5, marginBottom: 10 }}>
          Cada chofer y cobrador firma en papel el formulario
          {' '}<a href={`${HTTP_URL}/consentimiento`} target="_blank" rel="noreferrer" style={{ color: HUD.bright }}>(abrir para imprimir)</a>.
          {' '}La cooperativa guarda el original y le da una copia. Acá se anota la fecha del papel.
          {vigente && <> Versión vigente del formulario: <strong>{vigente}</strong>.</>}
        </div>
        {gente.map(u => {
          const e = estado(u);
          return (
            <div key={u.unitId} data-consentimiento-de={u.unitId} style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center',
              gap: 8, padding: '6px 0', borderTop: `1px solid ${HUD.hueco}` }}>
              <span style={{ flex: '1 1 180px', fontSize: 13, color: HUD.fg, minWidth: 0 }}>
                <strong>{nombre(u)}</strong> <span style={{ color: HUD.dim3 }}>{u.unitId}</span>
              </span>
              <span data-estado={e} style={{ fontSize: 12, fontWeight: 700,
                color: e === 'ok' ? HUD.verdeTinta : HUD.ambarTinta }}>
                {e === 'ok' ? `firmó el ${fecha(u.consentimientoFecha)}`
                  : e === 'vieja' ? `firmó la versión ${u.consentimientoVersion}: falta firmar la nueva`
                  : 'falta firmar'}
              </span>
              {e !== 'ok' && (<>
                <input type="date" data-fecha-consentimiento={u.unitId} value={fechas[u.unitId] || hoyIso()} max={hoyIso()}
                  onChange={ev => setFechas(f => ({ ...f, [u.unitId]: ev.target.value }))}
                  aria-label={`Fecha en que firmó ${nombre(u)}`} style={{ ...campo(30), fontSize: 12, width: 150 }} />
                <button data-anotar-consentimiento={u.unitId} disabled={busy}
                  onClick={() => run(() => api(`/admin/users/${encodeURIComponent(u.unitId)}/consentimiento`, {
                    method: 'POST', body: JSON.stringify({ firmado: true, fecha: fechas[u.unitId] || hoyIso() }),
                  }), `Anotado: ${nombre(u)} firmó el consentimiento`)}
                  style={btnChico(HUD.fg2)}>Anotar firma</button>
              </>)}
              {e === 'ok' && retiro?.unitId !== u.unitId && (
                <button data-retiro-consentimiento={u.unitId} onClick={() => setRetiro({ unitId: u.unitId, motivo: '' })}
                  style={{ ...btnChico(HUD.dim2), fontWeight: 400 }}>Lo retiró</button>
              )}
              {retiro?.unitId === u.unitId && (
                <span style={{ display: 'flex', gap: 6, flexWrap: 'wrap', flexBasis: '100%' }}>
                  <input data-motivo-retiro={u.unitId} value={retiro.motivo} maxLength={200}
                    placeholder="Cómo lo pidió (queda registrado): carta del 05/11"
                    onChange={ev => setRetiro(r => ({ ...r, motivo: ev.target.value }))}
                    style={{ ...campo(30), fontSize: 12, flex: '1 1 240px' }} />
                  <button data-confirmar-retiro={u.unitId} disabled={busy}
                    onClick={() => run(async () => {
                      await api(`/admin/users/${encodeURIComponent(u.unitId)}/consentimiento`, {
                        method: 'POST', body: JSON.stringify({ firmado: false, motivo: retiro.motivo }),
                      });
                      setRetiro(null);
                    }, `Anotado: ${nombre(u)} retiró su consentimiento`)}
                    style={btnChico(HUD.ambarTinta, HUD.ambarBorde)}>Anotar que {nombre(u)} lo retiró</button>
                  <button onClick={() => setRetiro(null)} style={btnChico(HUD.dim2)}>Cancelar</button>
                </span>
              )}
            </div>
          );
        })}
      </div>)}
    </div>
  );
}

// Punto de conexión

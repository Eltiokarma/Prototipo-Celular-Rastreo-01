                        width: 8, height: 8, borderRadius: '50%', flexShrink: 0,
                        background: t.abierto ? HUD.green : HUD.apagado,
                        boxShadow: t.abierto ? `0 0 8px ${HUD.green}` : 'none',
                      }} title={t.abierto ? 'Todavía arriba' : 'Terminado'} />
                      <span style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color: HUD.dim2, whiteSpace: 'nowrap' }}>
                        {hora(t.startedAt)} → {t.abierto ? 'ahora' : hora(t.endedAt)}
                      </span>
                      <span style={{ color: HUD.fg2, flex: '1 1 140px', minWidth: 0,
                        overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                        {t.alias || t.name || t.personId}
                        {t.role === 'collector' && <span style={{ color: HUD.dim3 }}> · cobrador</span>}
                      </span>
                      <span style={{ fontFamily: black, fontSize: 13, color: HUD.fg, whiteSpace: 'nowrap' }}>{t.vehicleId}</span>
                      <span style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color: HUD.dim, whiteSpace: 'nowrap' }}>
                        {horas(t.duracionSec)}
                      </span>
                    </div>
                  ))}
                </div>
              );
            })()}
            <div style={{ marginTop: 14, fontSize: 12, color: HUD.dim3, lineHeight: 1.5 }}>
              El turno se abre solo cuando alguien entra a su unidad y se cierra
              cuando se va. Un corte de señal <strong>no</strong> parte el turno: si
              vuelve dentro de los 15 minutos, se retoma el mismo. Si el servidor se
              reinicia, los turnos que quedaron abiertos se cierran con la última
              señal que se les vio.
            </div>
          </div>
        )}

        {tab === 'metrics' && (
          <div>
            {error && <div style={{ color: HUD.red, fontSize: 13, fontWeight: 700, marginBottom: 10 }}>{error}</div>}
            {!metrics && <div style={{ color: HUD.dim3, fontSize: 14 }}>Cargando…</div>}
            {metrics && metrics.length === 0 && (
              <div style={{ color: HUD.dim3, fontSize: 14 }}>
                Todavía no hay vueltas completadas. Se registran solas cuando una
                unidad recorre la ruta de punta a punta.
              </div>
            )}
            {metrics && metrics.length > 0 && (() => {
              const fmtLap = (s) => s == null ? '—'
                : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
              const cell = { padding: '10px 8px', fontFamily: mono, fontSize: 13, fontWeight: 700 };
              const head = { ...cell, color: HUD.dim3, fontSize: 11, letterSpacing: 1, textTransform: 'uppercase' };
              return (
                <div style={{ overflowX: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                  <thead>
                    <tr style={{ borderBottom: `1px solid ${HUD.line}` }}>
                      <th style={{ ...head, textAlign: 'left' }}>Unidad</th>
                      <th style={head}>Hoy</th>
                      <th style={head}>Total</th>
                      <th style={head}>Última</th>
                      <th style={head}>Promedio</th>
                      <th style={head}>Mejor</th>
                      <th style={head}>Vel. prom</th>
                    </tr>
                  </thead>
                  <tbody>
                    {metrics.map(m => (
                      <tr key={m.unitId} style={{ borderBottom: `1px solid ${HUD.divider}`, textAlign: 'center' }}>
                        <td style={{ ...cell, fontFamily: black, fontSize: 15, textAlign: 'left', color: HUD.fg }}>{m.unitId}</td>
                        <td style={{ ...cell, color: m.lapsToday > 0 ? HUD.green : HUD.dim3, fontSize: 15 }}>{m.lapsToday}</td>
                        <td style={{ ...cell, color: HUD.dim }}>{m.lapsTotal}</td>
                        <td style={{ ...cell, color: HUD.fg2 }}>{fmtLap(m.lastSec)}</td>
                        <td style={{ ...cell, color: HUD.fg2 }}>{fmtLap(m.avgSec)}</td>
                        <td style={{ ...cell, color: HUD.sky }}>{fmtLap(m.bestSec)}</td>
                        <td style={{ ...cell, color: HUD.dim }}>{m.avgSpeed} km/h</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                </div>
              );
            })()}
            <div style={{ marginTop: 14, fontSize: 12, color: HUD.dim3, lineHeight: 1.5 }}>
              Tiempos de vuelta en minutos:segundos. Una vuelta se cuenta cuando la
              unidad llega cerca del final de la ruta y vuelve al inicio; la base
              retiene las últimas 2000 vueltas.
            </div>
          </div>
        )}

        {tab === 'audit' && (
          <div>
            {error && <div style={{ color: HUD.red, fontSize: 13, fontWeight: 700, marginBottom: 10 }}>{error}</div>}
            {!events && <div style={{ color: HUD.dim3, fontSize: 14 }}>Cargando…</div>}
            {events && events.length === 0 && <div style={{ color: HUD.dim3, fontSize: 14 }}>Sin actividad registrada.</div>}
            {events && events.map((ev, i) => {
              const ACTION = {
                login: { label: 'inició sesión', color: HUD.dim },
                login_bloqueado: { label: 'bloqueado por intentos fallidos', color: HUD.amber },
                alta: { label: 'dio de alta a', color: HUD.green },
                alta_vehiculo: { label: 'creó el vehículo', color: HUD.green },
                alta_ruta: { label: 'creó la ruta', color: HUD.green },
                editar_identidad: { label: 'corrigió los datos de', color: HUD.sky },
                reset_clave: { label: 'reseteó la clave de', color: HUD.amber },
                baja: { label: 'dio de baja a', color: HUD.red },
                sos: { label: 'disparó un SOS', color: HUD.red },
              };
              const a = ACTION[ev.action] || { label: ev.action, color: HUD.dim };
              const d = new Date(ev.timestamp);
              const when = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
              return (
                <div key={i} style={{
                  display: 'flex', alignItems: 'baseline', gap: 10,
                  padding: '8px 4px', borderBottom: `1px solid ${HUD.divider}`,
                  fontSize: 14,
                }}>
                  <span style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color: HUD.dim3, flexShrink: 0 }}>{when}</span>
                  <span style={{ fontFamily: black, fontSize: 14, color: HUD.fg, flexShrink: 0 }}>{ev.actor}</span>
                  <span style={{ color: a.color }}>{a.label}</span>
                  {ev.target && <span style={{ fontFamily: black, fontSize: 14, color: HUD.fg }}>{ev.target}</span>}
                  {ev.detail && <span style={{ color: HUD.dim3, fontSize: 13 }}>· {ev.detail}</span>}
                </div>
              );
            })}
            <div style={{ marginTop: 14, fontSize: 12, color: HUD.dim3, lineHeight: 1.5 }}>
              Últimos 100 movimientos: logins, altas, resets de clave, bajas y SOS.
              El registro guarda hasta 1000 eventos en la base.
            </div>
          </div>
        )}

        {tab === 'users' && (<div>
        {/* alta de PERSONA: nombre obligatorio, alias opcional, rol y vehículo */}
        <div style={{
          padding: 14, background: HUD.hueco, borderRadius: 14,
          border: `1px solid ${HUD.divider}`, marginBottom: 16,
        }}>
          {/* fila 1 — quién es */}
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 8 }}>
            <span style={{ display: 'flex', flex: '0 0 auto', borderRadius: 10, overflow: 'hidden', border: `1px solid #232b36` }}>
              {[['driver', 'CHOFER'], ['collector', 'COBRADOR']].map(([k, l]) => (
                <button key={k} onClick={() => setForm(f => ({ ...f, personRole: k }))}
                  title={k === 'driver'
                    ? 'Maneja y su celular reporta la posición de la unidad'
                    : 'Va arriba, ve brechas y chat, pero no reporta posición'}
                  style={{
                    border: 'none', padding: '0 14px', height: 40, cursor: 'pointer',
                    fontFamily: black, fontSize: 12, letterSpacing: .5,
                    background: form.personRole === k ? HUD.bright : 'transparent',
                    color: form.personRole === k ? '#fff' : HUD.dim2,
                  }}>{l}</button>
              ))}
            </span>
            <input placeholder="Nombre y apellido *" value={form.name}
              onChange={e => setForm(f => ({ ...f, name: e.target.value }))}
              title="Obligatorio: es el nombre que queda en los registros de la empresa"
              style={{ ...inputStyle, width: 'auto', flex: '2 1 180px' }} />
            <input placeholder="Alias (opcional)" value={form.alias}
              onChange={e => setForm(f => ({ ...f, alias: e.target.value }))}
              title="Cómo lo llaman en la ruta. Si lo pones, es lo que se ve en el chat"
              style={{ ...inputStyle, width: 'auto', flex: '1 1 130px' }} />
          </div>
          {/* fila 2 — con qué entra y en qué anda */}
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
            {esSupervisor && routeList.length > 0 && (
              <select value={form.routeId}
                onChange={e => setForm(f => ({ ...f, routeId: e.target.value, vehicleId: '' }))}
                title="Ruta en la que trabaja"
                style={{ ...inputStyle, width: 'auto', flex: '0 1 110px', cursor: 'pointer' }}>
                {routeList.map(r => <option key={r.routeId} value={r.routeId}>{r.routeId}</option>)}
              </select>
            )}
            <input placeholder="Usuario para entrar *" value={form.unitId}
              onChange={e => setForm(f => ({ ...f, unitId: e.target.value }))}
              title="Con esto se identifica en la app (ej. M-21 para el chofer, M-21C para su cobrador)"
              style={{ ...inputStyle, width: 'auto', flex: '1 1 140px' }} />
            <select value={form.vehicleId}
              onChange={e => setForm(f => ({ ...f, vehicleId: e.target.value }))}
              title="Vehículo en el que va"
              style={{ ...inputStyle, width: 'auto', flex: '1 1 150px', cursor: 'pointer' }}>
              <option value="">
                {form.personRole === 'driver' ? 'Vehículo: crear con su código' : 'Vehículo… (obligatorio)'}
              </option>
              {(vehicles || [])
                .filter(v => !form.routeId || v.routeId === form.routeId)
                .map(v => (
                  <option key={v.vehicleId} value={v.vehicleId}>
                    {v.vehicleId}{v.label ? ` · ${v.label}` : ''}
                  </option>
                ))}
            </select>
            <span style={{ display: 'flex', flex: '1 1 150px', gap: 4, minWidth: 0 }}>
              <input placeholder="Contraseña (o generar →)" value={form.password}
                onChange={e => setForm(f => ({ ...f, password: e.target.value }))}
                style={{ ...inputStyle, width: 'auto', flex: 1 }} />
              <button title="Generar una clave fácil de dictar"
                onClick={() => setForm(f => ({ ...f, password: suggestPassword() }))}
                style={{ ...smallBtn(HUD.boton, HUD.fg2), height: 40, padding: '0 10px' }}>⟳</button>
            </span>
            <button onClick={create} disabled={busy} style={{
              ...smallBtn(HUD.bright, '#fff'), padding: '0 16px', fontSize: 13, height: 40,
            }}>+ ALTA</button>
          </div>
          <div style={{ fontSize: 11, color: HUD.dim3, marginTop: 9, lineHeight: 1.5 }}>
            {form.personRole === 'driver'
              ? 'El chofer maneja: su celular es el que reporta la posición de la unidad. Si no eliges vehículo, se crea uno con el mismo código del usuario.'
              : 'El cobrador necesita un vehículo ya creado. Ve brechas, mapa y chat, pero su GPS no se usa.'}
          </div>
        </div>

        {error && <div style={{ color: HUD.red, fontSize: 13, fontWeight: 700, marginBottom: 10 }}>{error}</div>}
        {okMsg && <div style={{ color: HUD.green, fontSize: 13, fontWeight: 700, marginBottom: 10 }}>{okMsg}</div>}

        {/* credenciales para dictar — se ven una sola vez */}
        {credential && (
          <div style={{
            background: HUD.okFondo, border: `1px solid ${HUD.green}`,
            borderRadius: 14, padding: 16, marginBottom: 16,
          }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: HUD.green, marginBottom: 10 }}>
              {credential.isNew
                ? `✓ ${credential.role === 'collector' ? 'Cobrador' : 'Chofer'} dado de alta${
                    credential.vehicleId ? ' en ' + credential.vehicleId : ''}${
                    credential.routeId ? ' · ruta ' + credential.routeId : ''}`
                : '✓ Contraseña reseteada — su sesión fue cerrada'}
              {' '}· anotá o dictá estos datos ahora
            </div>
            {credential.isNew && credential.name && (
              <div style={{ fontSize: 14, color: HUD.fg2, marginBottom: 10 }}>
                {credential.name}{credential.alias ? ` — le dicen “${credential.alias}”` : ''}
              </div>
            )}
            <div style={{ display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'flex-end' }}>
              <div>
                <div style={{ fontFamily: mono, fontSize: 11, fontWeight: 700, letterSpacing: 1, color: HUD.dim2 }}>USUARIO</div>
                <div style={{ fontFamily: black, fontSize: 22, color: HUD.fg }}>{credential.unitId}</div>
              </div>
              <div>
                <div style={{ fontFamily: mono, fontSize: 11, fontWeight: 700, letterSpacing: 1, color: HUD.dim2 }}>CONTRASEÑA</div>
                <div style={{ fontFamily: black, fontSize: 22, color: HUD.okClave, userSelect: 'all' }}>{credential.password}</div>
              </div>
              <div style={{ flex: 1 }} />
              <span style={{ display: 'flex', gap: 8 }}>
                <button onClick={() => {
                  const txt = `Unidad: ${credential.unitId}\nContraseña: ${credential.password}`;
                  navigator.clipboard?.writeText(txt).then(() => setCopied(true)).catch(() => {});
                }} style={smallBtn(HUD.green, HUD.bg)}>{copied ? '✓ Copiado' : 'Copiar'}</button>
                <button onClick={() => setCredential(null)} style={smallBtn('transparent', HUD.dim2)}>Ocultar</button>
              </span>
            </div>
            <div style={{ fontSize: 12, color: HUD.dim3, marginTop: 10, lineHeight: 1.5 }}>
              Las contraseñas se guardan cifradas y no se pueden volver a ver: si un
              chofer la pierde, se le genera una nueva con <strong>Reset clave</strong>.
            </div>
          </div>
        )}

        {/* buscador */}
        {users && users.length > 6 && (
          <input placeholder="Buscar por nombre, alias, usuario o vehículo…" value={filter}
            onChange={e => setFilter(e.target.value)}
            style={{ ...inputStyle, marginBottom: 10 }} />
        )}

        {/* lista */}
        {!users && <div style={{ color: HUD.dim3, fontSize: 14 }}>Cargando…</div>}
        {users && (() => {
          const q = filter.trim().toLowerCase();
          const shown = q ? users.filter(u => coincide(u, q)) : users;
          const gente = users.filter(u => u.role !== 'dispatch');
          const choferes = gente.filter(u => u.role !== 'collector').length;
          const cobradores = gente.length - choferes;
          return (
            <div style={{
              fontFamily: mono, fontSize: 11, fontWeight: 700, letterSpacing: 1,
              color: HUD.dim3, textTransform: 'uppercase', marginBottom: 6,
            }}>
              {choferes} chofer{choferes === 1 ? '' : 'es'}
              {cobradores > 0 ? ` · ${cobradores} cobrador${cobradores === 1 ? '' : 'es'}` : ''}
              {' '}· {users.filter(u => u.online).length} en línea
              {q ? ` · ${shown.length} coincidencia${shown.length === 1 ? '' : 's'}` : ''}
            </div>
          );
        })()}
        {users && users
          .filter(u => {
            const q = filter.trim().toLowerCase();
            return !q || coincide(u, q);
          })
          .map(u => (
          // La fila envuelve: en celular la identidad se queda arriba y los
          // botones bajan a la línea siguiente, en vez de exprimir el nombre.
          <div key={u.unitId} style={{
            display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap',
            padding: '10px 4px', borderBottom: `1px solid ${HUD.divider}`,
          }}>
            <span style={{
              width: 8, height: 8, borderRadius: '50%', flexShrink: 0,
              background: u.online ? HUD.green : HUD.apagado,
              boxShadow: u.online ? `0 0 8px ${HUD.green}` : 'none',
            }} title={u.online ? 'Conectado' : 'Desconectado'} />
            {u.role === 'collector' && (
              <span title="Cobrador: ve todo, no reporta posición" style={{
                fontFamily: black, fontSize: 10, letterSpacing: .5, flexShrink: 0,
                background: 'rgba(255,255,255,.07)', color: HUD.dim2,
                padding: '2px 6px', borderRadius: 4,
              }}>COBR</span>
            )}
            {u.role !== 'dispatch' && u.vehicleId && (
              <span title="Vehículo asignado" style={{
                fontFamily: black, fontSize: 13, minWidth: 66, flexShrink: 0,
                color: u.role === 'collector' ? HUD.dim : HUD.fg,
              }}>{u.vehicleId}</span>
            )}
            {u.role !== 'dispatch' && (
              <span style={{
                fontFamily: mono, fontSize: 11, fontWeight: 700, color: HUD.sky,
                background: 'rgba(46,157,255,.12)', border: `1px solid ${HUD.line}`,
                padding: '2px 6px', borderRadius: 4, flexShrink: 0,
              }}>{u.routeId || '—'}</span>
            )}
            <span style={{ flex: '1 1 150px', minWidth: 0 }}>
              <span style={{ fontSize: 13, color: HUD.fg2, display: 'block', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                {u.alias
                  ? <>{u.alias} <span style={{ color: HUD.dim3 }}>· {u.name || u.driverName}</span></>
                  : (u.name || u.driverName || u.unitId)}
              </span>
              <span style={{ fontFamily: mono, fontSize: 11, fontWeight: 700, color: u.lastLogin ? HUD.dim3 : HUD.amber }}>
                <span style={{ color: HUD.dim3 }}>{u.unitId} · </span>
                {u.online ? 'conectado ahora'
                  : u.lastLogin ? `última vez ${fmtWhen(u.lastLogin)}`
                  : 'nunca entró'}
              </span>
            </span>
            {u.role === 'dispatch' && (
              <span style={{
                fontFamily: black, fontSize: 10, background: HUD.bright, color: HUD.bg,
                padding: '2px 6px', borderRadius: 4,
              }}>DESPACHO</span>
            )}
            <span style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginLeft: 'auto' }}>
            {editFor === u.unitId ? (
              <span style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                <input autoFocus placeholder="Nombre y apellido *" value={editForm.name}
                  onChange={e => setEditForm(f => ({ ...f, name: e.target.value }))}
                  onKeyDown={e => { if (e.key === 'Enter') editarIdentidad(u.unitId); }}
                  style={{ ...inputStyle, height: 32, width: 'auto', flex: '1 1 130px', fontSize: 13 }} />
                <input placeholder="Alias" value={editForm.alias}
                  onChange={e => setEditForm(f => ({ ...f, alias: e.target.value }))}
                  onKeyDown={e => { if (e.key === 'Enter') editarIdentidad(u.unitId); }}
                  style={{ ...inputStyle, height: 32, width: 'auto', flex: '1 1 100px', fontSize: 13 }} />
                <button onClick={() => editarIdentidad(u.unitId)} disabled={busy} style={smallBtn(HUD.green, HUD.bg)}>OK</button>
                <button onClick={() => setEditFor(null)} style={smallBtn('transparent', HUD.dim2)}>✕</button>
              </span>
            ) : u.role !== 'dispatch' && (
              <button title="Corregir nombre o alias"
                onClick={() => {
                  setEditFor(u.unitId);
                  setEditForm({ name: u.name || u.driverName || '', alias: u.alias || '' });
                  setResetFor(null); setConfirmDel(null);
                }}
                style={smallBtn(HUD.boton, HUD.fg2)}>Nombre</button>
            )}
            {editFor === u.unitId ? null : resetFor === u.unitId ? (
              <span style={{ display: 'flex', gap: 6 }}>
                <input autoFocus placeholder="Nueva clave" value={resetPass}
                  onChange={e => setResetPass(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') resetPassword(u.unitId); }}
                  style={{ ...inputStyle, height: 32, width: 130, fontSize: 13 }} />
                <button onClick={() => resetPassword(u.unitId)} disabled={busy} style={smallBtn(HUD.green, HUD.bg)}>OK</button>
                <button onClick={() => { setResetFor(null); setResetPass(''); }} style={smallBtn('transparent', HUD.dim2)}>✕</button>
              </span>
            ) : (
              <button onClick={() => { setResetFor(u.unitId); setConfirmDel(null); setEditFor(null); }}
                style={smallBtn(HUD.boton, HUD.fg2)}>Reset clave</button>
            )}
            {u.role !== 'dispatch' && editFor !== u.unitId && (
              confirmDel === u.unitId ? (
                <button onClick={() => remove(u.unitId)} disabled={busy}
                  style={smallBtn(HUD.red, '#fff')}>¿Confirmar baja?</button>
              ) : (
                <button onClick={() => { setConfirmDel(u.unitId); setResetFor(null); setEditFor(null); }}
                  style={smallBtn('transparent', HUD.red)}>Baja</button>
              )
            )}
            </span>
          </div>
        ))}

        <div style={{ marginTop: 14, fontSize: 12, color: HUD.dim3, lineHeight: 1.5 }}>
          Cada persona tiene <strong>su propia cuenta</strong>: el alta se hace
          solo desde acá y el login de la app rechaza usuarios no registrados.
          Resetear la clave o dar de baja cierra su sesión al instante, y no
          toca a nadie más que vaya en el mismo vehículo.
        </div>
        </div>)}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// PANEL
// ═══════════════════════════════════════════════════════════════
function Panel({ session, onLogout, onAuthError, modo, onAlternarModo }) {
  const [connected, setConnected] = React.useState(false);
  const [units, setUnits] = React.useState([]);
  const [gaps, setGaps] = React.useState({});
  const [messages, setMessages] = React.useState([]);
  const [sos, setSos] = React.useState(null); // alerta activa hasta que se atienda
  const [adminOpen, setAdminOpen] = React.useState(false);
  // Multi-ruta: la ruta que se está mirando y los datos que llegan de ella
  const [routes, setRoutes] = React.useState([]);
  const [trazado, setTrazado] = React.useState({ ida: [], vuelta: [] });
  // Conversación privada abierta (vehicleId) o null = el grupo de la ruta
  const [privadoCon, setPrivadoCon] = React.useState(null);
  // Privados sin leer por unidad, para el punto en la lista
  const [noLeidos, setNoLeidos] = React.useState({});
  const [routeInfo, setRouteInfo] = React.useState({
    routeId: session.routeId || null,
    routeName: session.routeName || null,
    targetGapMin: TARGET_GAP_DEFAULT,
  });
  const esSupervisor = !!session.supervisor;

  // El mismo panel sirve en PC y en celular: bajo 900px pasa a vista
  // única (Unidades / Mapa / Chat) con navegación inferior.
  const [isMobile, setIsMobile] = React.useState(window.innerWidth < 900);
  const [view, setView] = React.useState('map');
  React.useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < 900);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  // Cambiar de tema cambia los tiles sin recargar la página
  React.useEffect(() => {
    if (tilesRef.current) tilesRef.current.setUrl(HUD.tiles);
  }, [modo]);

  // El recorrido de la ruta, debajo de las unidades. La vuelta va punteada
  // para distinguirla de la ida cuando comparten calle.
  React.useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    if (trazadoRef.current) { trazadoRef.current.remove(); trazadoRef.current = null; }
    const capa = L.layerGroup();
    let hay = false;
    if (trazado?.ida?.length > 1) {
      L.polyline(trazado.ida, { color: HUD.bright, weight: 4, opacity: 0.5 }).addTo(capa);
      hay = true;
    }
    if (trazado?.vuelta?.length > 1) {
      L.polyline(trazado.vuelta, {
        color: HUD.bright, weight: 4, opacity: 0.5, dashArray: '8 8',
      }).addTo(capa);
      hay = true;
    }
    if (hay) { capa.addTo(map); trazadoRef.current = capa; }
  }, [trazado, modo]);

  // Leaflet necesita re-medirse cuando su contenedor aparece o cambia
  React.useEffect(() => {
    if (mapRef.current && (!isMobile || view === 'map')) {
      setTimeout(() => mapRef.current.invalidateSize(), 60);
    }
  }, [isMobile, view]);
  const wsRef = React.useRef(null);
  const mapRef = React.useRef(null);
  const tilesRef = React.useRef(null);
  const trazadoRef = React.useRef(null);   // la polilínea del recorrido en el mapa
  const markersRef = React.useRef({});
  const fittedRef = React.useRef(false);

  const pushMsg = (m) => setMessages(ms => [...ms.slice(-149), m]);

  const mapMsg = (m, kind) => {
    const own = m.unitId === session.unitId;
    if (kind === 'sos') {
      return {
        from: m.driverName || m.unitId, unit: m.vehicleId || null, tone: 'sos',
        text: `SOS — ${m.driverName || m.unitId} pide ayuda${m.vehicleId ? ' desde ' + m.vehicleId : ''}`,
        time: nowTime(m.timestamp),
      };
    }
    const base = {
      from: m.role === 'dispatch' ? 'DESPACHO' : (m.driverName || m.unitId || 'Conductor'),
      role: own ? 'dispatch-self' : m.role,
      unit: m.role === 'dispatch' ? null : (m.vehicleId || null),
      // Con qué unidad es la conversación privada; null = mensaje del grupo
      para: m.toVehicleId || null,
      time: nowTime(m.timestamp),
      tone: 'normal',
    };
    if (kind === 'voice') return { ...base, voice: m.duration, audio: m.data || null, expired: m.expired };
    return { ...base, text: m.text };
  };

  // ─── WebSocket propio del panel (sin GPS: Despacho no está en ruta)
  React.useEffect(() => {
    let closedByUs = false;
    let reconnect = null;
    let ws = null;

    const open = () => {
      ws = new WebSocket(SERVER_URL);
      wsRef.current = ws;
      ws.onopen = () => {
        setConnected(true);
        ws.send(JSON.stringify({ type: 'identify', token: session.token }));
      };
      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === 'state') {
          setUnits(msg.units || []);
          setGaps(msg.gaps || {});
          setRouteInfo({
            routeId: msg.routeId,
            routeName: msg.routeName,
            targetGapMin: msg.targetGapMin || TARGET_GAP_DEFAULT,
            desvio: msg.desvio || null,
          });
          fittedRef.current = false; // reencuadrar el mapa al cambiar de ruta
          setRouteInfo(prev => {
            // Cambió la ruta: la conversación privada abierta era de la otra
            if (prev.routeId && prev.routeId !== msg.routeId) {
              setPrivadoCon(null);
              setNoLeidos({});
            }
            return prev;
          });
        } else if (msg.type === 'routes') {
          setRoutes(msg.routes || []);
        } else if (msg.type === 'route_geometry') {
          // El trazado llega una vez (al conectar, al cambiar de ruta o
          // cuando alguien lo edita), no en cada estado
          setTrazado(msg.tramos || { ida: [], vuelta: [] });
        } else if (msg.type === 'chat_msg') {
          pushMsg(mapMsg(msg, 'chat'));
          // Privado de una unidad que no estoy mirando: queda marcado
          if (msg.toVehicleId && msg.role !== 'dispatch') {
            setPrivadoCon(actual => {
              if (actual !== msg.toVehicleId) {
                setNoLeidos(n => ({ ...n, [msg.toVehicleId]: (n[msg.toVehicleId] || 0) + 1 }));
              }
              return actual;
            });
          }
        } else if (msg.type === 'voice_msg') {
          pushMsg(mapMsg(msg, 'voice'));
        } else if (msg.type === 'sos_alert') {
          pushMsg(mapMsg(msg, 'sos'));
          setSos({ ...msg, receivedAt: Date.now() });
        } else if (msg.type === 'chat_history') {
          setMessages((msg.items || []).map(it => mapMsg(
            { ...it, expired: it.kind === 'voice' && !it.data },
            it.kind
          )));
        } else if (msg.type === 'auth_error') {
          closedByUs = true;
          try { localStorage.removeItem('r14_dispatch_session'); } catch {}
          onAuthError();
        }
      };
      ws.onclose = () => {
        setConnected(false);
        if (!closedByUs) reconnect = setTimeout(open, 3000);
      };
    };
    open();

    return () => {
      closedByUs = true;
      clearTimeout(reconnect);
      if (ws) ws.close();
    };
  }, [session.token]);

  // ─── Leaflet
  const initMap = React.useCallback((node) => {
    if (!node || mapRef.current) return;
    const map = L.map(node, { center: JULIACA_CENTER, zoom: 14, zoomControl: true, attributionControl: false });
    tilesRef.current = L.tileLayer(HUD.tiles, { maxZoom: 19 }).addTo(map);
    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 100);
  }, []);

  // Marcadores: un pin con etiqueta por unidad en ruta
  React.useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    const existing = markersRef.current;
    const ids = new Set(units.filter(u => u.lat).map(u => u.unitId));

    Object.keys(existing).forEach(id => {
      if (!ids.has(id)) { existing[id].remove(); delete existing[id]; }
    });

    units.forEach(u => {
      if (!u.lat || !u.lng) return;
      const isSos = sos && sos.unitId === u.unitId;
      const color = isSos ? HUD.red : HUD.bright;
      const html = `<div style="position:relative;width:14px;height:14px;">
        <div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid ${HUD.bg};box-shadow:0 0 12px ${color};"></div>
        <div style="position:absolute;top:18px;left:50%;transform:translateX(-50%);font-family:${mono};font-size:12px;font-weight:700;color:${color};background:rgba(3,6,10,.85);padding:2px 7px;border-radius:6px;white-space:nowrap;">${escaparHtml(u.unitId)}</div>
      </div>`;
      const icon = L.divIcon({ html, className: '', iconSize: [14, 14], iconAnchor: [7, 7] });
      if (existing[u.unitId]) {
        existing[u.unitId].setLatLng([u.lat, u.lng]);
        existing[u.unitId].setIcon(icon);
      } else {
        existing[u.unitId] = L.marker([u.lat, u.lng], { icon }).addTo(map);
      }
    });

    // Encuadrar la flota la primera vez que hay unidades
    const withGps = units.filter(u => u.lat);
    if (!fittedRef.current && withGps.length) {
      fittedRef.current = true;
      const bounds = L.latLngBounds(withGps.map(u => [u.lat, u.lng]));
      map.fitBounds(bounds.pad(0.4), { maxZoom: 15 });
    }
  }, [units, sos]);

  const focusUnit = (u) => {
    if (u.lat && mapRef.current) mapRef.current.panTo([u.lat, u.lng], { animate: true });
  };

  const sendChat = (text) => {
    const ws = wsRef.current;
    if (ws && ws.readyState === WebSocket.OPEN) {
      // Con una conversación abierta el mensaje va solo a esa unidad
      ws.send(JSON.stringify({
        type: 'chat', text, to: privadoCon || undefined, timestamp: Date.now(),
      }));
    }
  };

  const silenciarDesvio = async (minutos) => {
    if (!routeInfo.routeId) return;
    try {
      await fetch(`${HTTP_URL}/admin/routes/${encodeURIComponent(routeInfo.routeId)}/desvio`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.token },
        body: JSON.stringify({ silenciarMin: minutos }),
      });
    } catch {}
  };

  const abrirPrivado = (vehicleId) => {
    setPrivadoCon(vehicleId);
    setNoLeidos(n => ({ ...n, [vehicleId]: 0 }));
    if (isMobile) setView('chat');
  };

  // Cambiar de ruta: el servidor responde con el estado y el chat de la nueva
  const cambiarRuta = (routeId) => {
    const ws = wsRef.current;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    setUnits([]); setGaps({}); setMessages([]);
    ws.send(JSON.stringify({ type: 'watch', routeId }));
  };

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
      {/* header */}
      <div style={{
        height: 56, flexShrink: 0, display: 'flex', alignItems: 'center',
        gap: isMobile ? 8 : 14,
        padding: isMobile ? '0 10px' : '0 18px',
        borderBottom: `1px solid ${HUD.divider}`, background: HUD.surface,
      }}>
        {/* El nombre de la cooperativa, no una marca fija: el mismo panel lo
            usan empresas distintas y cada una tiene que ver la suya. */}
        {!isMobile && (
          <span style={{
            fontFamily: black, fontSize: 18, maxWidth: 260,
            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
          }} title={session.companyName || ''}>
            {session.companyName || session.companyId || 'Despacho'}
          </span>
        )}
        <span style={{
          fontFamily: mono, fontSize: 12, fontWeight: 700, letterSpacing: 1,
          color: HUD.bright, textTransform: 'uppercase',
        }}>Despacho</span>

        {/* Selector de ruta: el supervisor cambia; el de ruta la ve fija */}
        {esSupervisor && routes.length > 0 ? (
          <select
            value={routeInfo.routeId || ''}
            onChange={e => cambiarRuta(e.target.value)}
            title="Ruta que estás mirando"
            style={{
              background: HUD.campo, color: HUD.fg, border: `1px solid ${HUD.line}`,
              borderRadius: 8, padding: '6px 8px', fontSize: 13, fontWeight: 700,
              fontFamily: 'inherit', cursor: 'pointer', maxWidth: isMobile ? 120 : 220,
            }}>
            {routes.map(r => (
              <option key={r.routeId} value={r.routeId}>
                {r.routeId}{isMobile ? '' : ` · ${r.name}`}
              </option>
            ))}
          </select>
        ) : (
          <span style={{ fontFamily: black, fontSize: 14, color: HUD.fg2, whiteSpace: 'nowrap' }}>
            {routeInfo.routeId || ''}
          </span>
        )}
        <span style={{ display: 'flex', alignItems: 'center', gap: 6, marginLeft: isMobile ? 0 : 10, minWidth: 0 }}>
          <span style={{
            width: 8, height: 8, borderRadius: '50%', flexShrink: 0,
            background: connected ? HUD.green : HUD.amber,
            boxShadow: connected ? `0 0 8px ${HUD.green}` : 'none',
          }} />
          <span style={{
            fontFamily: mono, fontSize: 12, fontWeight: 700,
            color: connected ? HUD.green : HUD.amber,
            whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
          }}>
            {connected ? (isMobile ? `${units.length} EN RUTA` : `EN VIVO · ${units.length} EN RUTA`) : 'RECONECTANDO…'}
          </span>
        </span>
        <div style={{ flex: 1 }} />
        <button onClick={() => setAdminOpen(true)} style={{
          background: HUD.boton, border: `1px solid ${HUD.line}`, borderRadius: 8,
          padding: '6px 12px', color: HUD.fg2, fontSize: 13, fontWeight: 700, cursor: 'pointer',
          marginRight: 10, flexShrink: 0,
        }}>Gestión</button>
        <button onClick={onAlternarModo}
          title={modo === 'day' ? 'Pasar a modo noche' : 'Pasar a modo día'}
          style={{
            background: HUD.boton, border: `1px solid ${HUD.line}`, borderRadius: 8,
            padding: '6px 10px', color: HUD.fg2, fontSize: 14, cursor: 'pointer',
            marginRight: 10, flexShrink: 0, lineHeight: 1,
          }}>{modo === 'day' ? '☾' : '☀'}</button>
        <button onClick={onLogout} style={{
          background: 'transparent', border: `1px solid ${HUD.line}`, borderRadius: 8,
          padding: '6px 12px', color: HUD.dim2, fontSize: 13, fontWeight: 700, cursor: 'pointer',
        }}>Salir</button>
      </div>

      {adminOpen && (
        <AdminModal
          session={session}
          onClose={() => setAdminOpen(false)}
          onAuthError={onAuthError}
          routes={routes}
          currentRoute={routeInfo.routeId}
        />
      )}

      {/* banner SOS activo */}
      {sos && (
        <div style={{
          flexShrink: 0, background: HUD.red, color: '#fff',
          padding: '12px 18px', display: 'flex', alignItems: 'center', gap: 16,
          animation: 'sosPulse 1.2s ease-in-out infinite',
        }}>
          <span style={{ fontFamily: black, fontSize: 20, letterSpacing: 2 }}>SOS</span>
          <span style={{ fontSize: 15, fontWeight: 700 }}>
            {(sos.driverName || sos.unitId || 'Unidad').toUpperCase()}
            {sos.vehicleId ? ` · ${sos.vehicleId.toUpperCase()}` : ''} pide ayuda · {nowTime(sos.timestamp)}
            {sos.routeId && sos.routeId !== routeInfo.routeId ? ` · RUTA ${sos.routeId}` : ''}
            {sos.lat ? ` · ${sos.lat.toFixed(4)}, ${sos.lng.toFixed(4)}` : ''}
          </span>
          <div style={{ flex: 1 }} />
          {sos.lat && (
            <button onClick={() => { mapRef.current?.panTo([sos.lat, sos.lng]); }} style={{
              background: 'rgba(255,255,255,.15)', border: '1px solid rgba(255,255,255,.5)',
              borderRadius: 8, padding: '6px 12px', color: '#fff', fontSize: 13, fontWeight: 700, cursor: 'pointer',
            }}>Ver en mapa</button>
          )}
          <button onClick={() => setSos(null)} style={{
            background: '#fff', border: 'none', borderRadius: 8,
            padding: '6px 12px', color: HUD.red, fontSize: 13, fontWeight: 800, cursor: 'pointer',
          }}>ATENDIDO</button>
        </div>
      )}

      {/* cuerpo: en PC tres columnas; en celular una vista a la vez */}
      <div style={isMobile
        ? { flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }
        : { flex: 1, display: 'grid', gridTemplateColumns: '280px 1fr 360px', minHeight: 0 }}>
        {/* unidades */}
        <div style={{
          overflowY: 'auto', minHeight: 0,
          ...(isMobile
            ? { flex: 1, display: view === 'units' ? 'block' : 'none' }
            : { borderRight: `1px solid ${HUD.divider}` }),
        }}>
          <div style={{
            padding: '14px 16px', fontFamily: mono, fontSize: 12, fontWeight: 700,
            letterSpacing: 1, color: HUD.dim2, textTransform: 'uppercase',
          }}>{routeInfo.routeName || 'Unidades'} · {units.length} en ruta</div>

          {/* Desvíos: se agrupan acá en vez de gritar uno por uno. En una
              ciudad siempre hay alguno, así que lo importante es poder
              silenciarlo cuando ya se sabe (obra, desfile, embotellamiento). */}
          {(() => {
            const fuera = units.filter(u => u.fueraDeRuta);
            const mudo = routeInfo.desvio?.mudoHasta;
            if (!fuera.length && !mudo) return null;
            return (
              <div style={{
                margin: '0 12px 10px', padding: '10px 12px', borderRadius: 12,
                background: mudo ? HUD.hueco : 'rgba(166,115,0,.12)',
                border: `1px solid ${mudo ? HUD.line : HUD.amber}`,
              }}>
                <div style={{
                  fontSize: 13, fontWeight: 700, color: mudo ? HUD.dim2 : HUD.amber,
                  marginBottom: fuera.length ? 6 : 0,
                }}>
                  {mudo
                    ? `Desvíos silenciados hasta ${nowTime(mudo)}`
                    : `${fuera.length} unidad${fuera.length === 1 ? '' : 'es'} fuera del recorrido`}
                </div>
                {fuera.length > 0 && (
                  <div style={{ fontFamily: mono, fontSize: 12, color: HUD.dim, marginBottom: 8 }}>
                    {fuera.map(u => `${u.unitId} (${u.desvioM} m)`).join(' · ')}
                  </div>
                )}
                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                  {mudo ? (
                    <button onClick={() => silenciarDesvio(0)} style={{
                      background: HUD.boton, border: `1px solid ${HUD.line}`, borderRadius: 8,
                      padding: '4px 10px', color: HUD.fg2, fontSize: 12, fontWeight: 700,
                      cursor: 'pointer', fontFamily: 'inherit',
                    }}>Volver a avisar</button>
                  ) : (
                    [['1 h', 60], ['3 h', 180], ['el turno', 480]].map(([etiqueta, min]) => (
                      <button key={min} onClick={() => silenciarDesvio(min)}
                        title="Cuando el desvío ya se sabe: una obra, un desfile, un embotellamiento"
                        style={{
                          background: HUD.boton, border: `1px solid ${HUD.line}`, borderRadius: 8,
                          padding: '4px 10px', color: HUD.fg2, fontSize: 12, fontWeight: 700,
                          cursor: 'pointer', fontFamily: 'inherit',
                        }}>Silenciar {etiqueta}</button>
                    ))
                  )}
                </div>
              </div>
            );
          })()}
          {units.length === 0 && (
            <div style={{ padding: '8px 16px', fontSize: 14, color: HUD.dim3 }}>
              Sin unidades conectadas.
            </div>
          )}
          {units.map(u => {
            const g = gaps[u.unitId] || {};
            const isSos = sos && sos.unitId === u.unitId;
            return (
              <div key={u.unitId} onClick={() => focusUnit(u)} style={{
                padding: '12px 16px', cursor: 'pointer',
                borderBottom: `1px solid ${HUD.divider}`,
                background: isSos ? 'rgba(255,45,85,.12)' : 'transparent',
                borderLeft: isSos ? `3px solid ${HUD.red}` : '3px solid transparent',
              }}>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
                  <span style={{ fontFamily: black, fontSize: 16, color: isSos ? HUD.red : HUD.fg }}>{u.unitId}</span>
                  <span style={{ fontFamily: mono, fontSize: 12, fontWeight: 700, color: HUD.dim2 }}>
                    {u.speed || 0} km/h
                  </span>
                  <div style={{ flex: 1 }} />
                  {!u.lat && <span style={{ fontFamily: mono, fontSize: 11, color: HUD.amber }}>SIN GPS</span>}
                </div>
                {u.fueraDeRuta && (
                  <span title={`A ${u.desvioM} m del recorrido${u.fueraDesde ? ' desde ' + nowTime(u.fueraDesde) : ''}`}
                    style={{
                      fontFamily: mono, fontSize: 10, fontWeight: 700, letterSpacing: .5,
                      marginLeft: 8, padding: '2px 6px', borderRadius: 4,
                      background: 'rgba(166,115,0,.18)', color: HUD.amber,
                      border: `1px solid ${HUD.amber}`,
                    }}>FUERA DE RUTA · {u.desvioM} m</span>
                )}
                {u.tramo && (
                  <span title="Tramo del circuito en el que va" style={{
                    fontFamily: mono, fontSize: 11, fontWeight: 700, marginLeft: 8,
                    color: u.tramo === 'vuelta' ? HUD.dim2 : HUD.sky,
                  }}>{u.tramo === 'vuelta' ? '↩ vuelta' : '↪ ida'}</span>
                )}
                {u.driverName && u.driverName !== u.unitId && (
                  <div style={{
                    fontSize: 12, color: HUD.dim2, marginTop: 2,
                    overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                  }}>{u.driverName}{u.label ? ` · ${u.label}` : ''}</div>
                )}
                {/* Conversación privada con esta unidad. El click no debe
                    disparar también el foco del mapa de la fila. */}
                <button
                  onClick={(e) => { e.stopPropagation(); abrirPrivado(u.unitId); }}
                  title={`Escribirle solo a ${u.unitId}`}
                  style={{
                    marginTop: 7, background: privadoCon === u.unitId ? HUD.bright : HUD.boton,
                    color: privadoCon === u.unitId ? '#fff' : HUD.fg2,
                    border: `1px solid ${HUD.line}`, borderRadius: 8,
                    padding: '4px 9px', fontSize: 12, fontWeight: 700, cursor: 'pointer',
                    fontFamily: 'inherit', display: 'flex', alignItems: 'center', gap: 6,
                  }}>
                  Mensaje directo
                  {noLeidos[u.unitId] > 0 && (
                    <span style={{
                      background: HUD.amber, color: HUD.oscuro ? '#000' : '#fff',
                      borderRadius: 9, minWidth: 18, padding: '0 5px',
                      fontFamily: mono, fontSize: 11, fontWeight: 800, textAlign: 'center',
                    }}>{noLeidos[u.unitId]}</span>
                  )}
                </button>
                <div style={{ display: 'flex', gap: 14, marginTop: 4, fontFamily: mono, fontSize: 13, fontWeight: 700 }}>
                  <span style={{ color: HUD.dim3 }}>+1 <span style={{ color: gapColor(g.toAhead, routeInfo.targetGapMin) }}>{g.toAhead || '—'}</span></span>
                  <span style={{ color: HUD.dim3 }}>−1 <span style={{ color: gapColor(g.toBehind, routeInfo.targetGapMin) }}>{g.toBehind || '—'}</span></span>
                </div>
              </div>
            );
          })}
        </div>

        {/* mapa */}
        <div style={{
          position: 'relative', minHeight: 0,
          ...(isMobile ? { flex: 1, display: view === 'map' ? 'block' : 'none' } : {}),
        }}>
          <div ref={initMap} style={{ position: 'absolute', inset: 0 }} />
        </div>

        {/* chat */}
        <div style={{
          minHeight: 0,
          ...(isMobile
            ? { flex: 1, display: view === 'chat' ? 'flex' : 'none', flexDirection: 'column' }
            : { borderLeft: `1px solid ${HUD.divider}` }),
        }}>
          <ChatColumn messages={messages} onSend={sendChat} routeId={routeInfo.routeId}
            privadoCon={privadoCon} onCerrarPrivado={() => setPrivadoCon(null)} />
        </div>
      </div>

      {/* navegación inferior — solo celular */}
      {isMobile && (
        <div style={{
          flexShrink: 0, display: 'flex',
          borderTop: `1px solid ${HUD.divider}`, background: HUD.surface,
        }}>
          {[['units', `UNIDADES (${units.length})`], ['map', 'MAPA'], ['chat', 'CHAT']].map(([k, l]) => (
            <button key={k} onClick={() => setView(k)} style={{
              flex: 1, padding: '14px 0 18px',
              background: 'transparent', border: 'none', cursor: 'pointer',
              fontFamily: black, fontSize: 13, letterSpacing: 0.5,
              color: view === k ? HUD.bright : HUD.dim3,
              borderTop: view === k ? `3px solid ${HUD.bright}` : '3px solid transparent',
              WebkitTapHighlightColor: 'transparent',
            }}>{l}</button>
          ))}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// ROOT
// ═══════════════════════════════════════════════════════════════
function Root() {
  // El tema elegido se recuerda en el dispositivo. De fábrica, DÍA.
  const [modo, setModo] = React.useState(() => {
    try {
      const g = localStorage.getItem('r14_modo_panel');
      if (g && TEMAS[g]) return g;
    } catch {}
    return 'day';
  });
  // Antes de renderizar: HUD es un objeto que se muta, así que tiene que
  // estar en su valor final cuando los hijos lo leen.
  aplicarTema(modo);
  React.useEffect(() => {
    try { localStorage.setItem('r14_modo_panel', modo); } catch {}
    const r = document.documentElement.style;
    r.setProperty('--bg', HUD.bg);
    r.setProperty('--fg', HUD.fg);
  }, [modo]);
  const alternarModo = () => setModo(m => (m === 'day' ? 'night' : 'day'));

  const [session, setSession] = React.useState(() => {
    try {
      const s = JSON.parse(localStorage.getItem('r14_dispatch_session') || 'null');
      return s?.token && s?.role === 'dispatch' ? s : null;
    } catch { return null; }
  });
  const [notice, setNotice] = React.useState(null);

  const logout = () => {
    try { localStorage.removeItem('r14_dispatch_session'); } catch {}
    setSession(null);
    setNotice(null);
  };

  if (!session) {
    return <Login notice={notice} onSuccess={(s) => { setSession(s); setNotice(null); }} />;
  }
  return <Panel
    session={session}
    onLogout={logout}
    modo={modo}
    onAlternarModo={alternarModo}
    onAuthError={() => { setSession(null); setNotice('Tu sesión expiró. Ingresá de nuevo.'); }}
  />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);

</script>

<!-- PWA: el panel registra su propio service worker. Antes solo lo hacía la
     app del chofer, así que un encargado que instalara únicamente el panel en
     su celular se quedaba sin caché offline. -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(() => console.log('Service Worker registrado'))
        .catch((err) => console.log('Service Worker falló:', err));
    });
  }
</script>
</body>
</html>

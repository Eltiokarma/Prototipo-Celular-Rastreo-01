<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panel de Despacho — Control de flota</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- PWA: el panel se instala como app fija en un celular o tablet -->
<link rel="manifest" href="manifest-despacho.json">
<meta name="theme-color" content="#F7FAFD">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Despacho">
<!-- El ícono de la pestaña. Sin él el navegador pedía /favicon.ico (404) —
     más seguido desde que el título parpadea con un SOS—, y es lo que se ve
     en la pestaña que hay que encontrar entre otras -->
<link rel="icon" type="image/png" href="icon-despacho-192.png">

<!-- Leaflet: mapa de calles reales. Lo sirve ESTE servidor, no un CDN.
     Pasó en producción con el panel del creador: unpkg no entregó leaflet.js
     y la página quedaba en blanco sin un solo error visible, porque el mapa
     se inicializaba con `L` sin existir. Despacho es la pantalla que mira el
     que despacha durante ocho horas: no puede depender de la red de otro. -->
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<script src="vendor/leaflet/leaflet.js"></script>
<!-- La caída al CDN es para el caso en que este HTML se publique en un
     hosting estático sin el servidor Node al lado: ahí la copia local da 404.
     El navegador ejecuta este bloque recién después del <script> de arriba,
     así que `L` ya está definido o no lo estará nunca. -->
<script>
if (typeof L === 'undefined') {
  // Con integrity, como React y Babel: la caída al CDN iba sin, y un unpkg
  // comprometido podía meter código en el panel (auditoría 11/11). Los
  // hashes son los de la copia local, que es el mismo archivo.
  document.write('<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />');
  document.write('<scr' + 'ipt src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"><\/scr' + 'ipt>');
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">

<!-- Si el servidor Node sirve esta página, config.js apunta el tiempo
     real a este mismo origen; en hosting estático da 404 y no pasa nada -->
<script src="config.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  /* Las fija Root al aplicar el tema (día por defecto) */
  :root { --bg: #F7FAFD; --fg: #0B2239; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif;
    overflow: hidden;
  }
  #root { height: 100%; }
  /* El banner de SOS ocupa el ancho entero: el anillo de sombra que servía
     para un punto no se ve en una franja. Late en opacidad. */
  @keyframes sosPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .82; }
  }
  @media (prefers-reduced-motion: reduce) {
    [style*="sosPulse"] { animation: none !important; }
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line, #C3D4E4); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ─── Movimiento: 150–200 ms, nunca más. Todo lo de acá se apaga con
     prefers-reduced-motion (abajo). Los colores salen de las variables que
     Root copia de HUD: acá no hay ni un color propio. */
  button, a, input, select, textarea, [data-tarjeta], [data-fila] {
    transition: background-color .16s ease, border-color .16s ease, color .16s ease,
                box-shadow .18s ease, opacity .16s ease, transform .16s ease, filter .16s ease;
  }
  button:not(:disabled):hover { filter: brightness(.95); }
  html[data-tema="night"] button:not(:disabled):hover { filter: brightness(1.18); }
  button:not(:disabled):active { transform: translateY(1px); }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: none; border-color: var(--acento) !important; box-shadow: 0 0 0 3px var(--anillo);
  }
  [data-fila]:hover { background-color: var(--realce); }
  [data-tarjeta]:hover { background-color: var(--realce) !important; }
  [role="menuitem"]:hover { background-color: var(--realce) !important; filter: none !important; }
  summary { cursor: pointer; }
  summary::-webkit-details-marker { color: var(--acento); }

  @keyframes aparecer { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes entrarMsg { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes velo { from { opacity: 0; } to { opacity: 1; } }
  @keyframes cambio { from { transform: scale(1.12); } to { transform: none; } }
  @keyframes latido { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes cargando { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }

  /* «Guardar como evidencia» aparece al pasar por el mensaje; en pantallas
     táctiles (sin hover) queda siempre a la vista. */
  .r14-msg .r14-evid { opacity: 0; }
  .r14-msg:hover .r14-evid, .r14-msg:focus-within .r14-evid { opacity: 1; }
  @media (hover: none) { .r14-msg .r14-evid { opacity: 1; } }

  /* Leaflet con el mismo vocabulario que el panel */
  .leaflet-container { font-family: inherit; background: var(--hueco); }
  .leaflet-bar { border: none !important; border-radius: 12px !important; overflow: hidden;
                 box-shadow: var(--sombra) !important; }
  .leaflet-bar a, .leaflet-bar a:hover {
    width: 38px !important; height: 38px !important; line-height: 38px !important;
    font: 600 19px/38px system-ui, sans-serif !important;
    background: var(--surface) !important; color: var(--fg) !important;
    border-bottom: 1px solid var(--divider) !important;
  }
  .leaflet-bar a:hover { background: var(--realce) !important; }
  .leaflet-control-attribution { background: var(--flotante) !important; color: var(--dim) !important;
                                 border-radius: 8px 0 0 0; padding: 2px 8px !important; }
  .leaflet-control-attribution a { color: var(--dim) !important; }
  @media (max-width: 899px) { .leaflet-control-attribution { font-size: 9px; line-height: 1.35; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>

<!-- Si React o Babel no llegan del CDN, la página quedaba en blanco sin un
     solo error: Despacho ciego y sin saber por qué (auditoría 11/11). El
     creador ya lo tenía. Espera un rato y, si el panel sigue sin dibujarse,
     lo dice en HTML pelado; si el panel carga después, React lo pisa. -->
<script>
setTimeout(function () {
  var root = document.getElementById('root');
  if (root && !root.children.length) {
    root.innerHTML =
      '<div data-sin-librerias style="max-width:560px;margin:80px auto;padding:24px;' +
      'font-family:system-ui,sans-serif;font-size:15px;line-height:1.6;' +
      'background:#FCEBEE;border:1px solid #E6BFC6;border-left:3px solid #C2001D;' +
      'border-radius:14px;color:#5C0010;">' +
      '<strong>El panel no pudo cargar.</strong><br>' +
      'Sus librerías no llegaron desde internet (unpkg.com). Suele ser un corte ' +
      'de un momento: recargá con Ctrl+Shift+R. Mientras tanto <strong>no ves ' +
      'el mapa ni los SOS</strong>: si hay una emergencia, la central atiende por teléfono.' +
      '<br><button onclick="location.reload()" style="margin-top:12px;padding:10px 18px;' +
      'font-size:14px;background:#C2001D;color:#fff;border:none;border-radius:9px;cursor:pointer">' +
      'Recargar</button></div>';
  }
}, 8000);
</script>

<script type="text/babel" data-presets="react">

// Mismo servidor que la app del chofer
const SERVER_URL = window.REALTIME_SERVER_URL ||
  'wss://prototipo-celular-rastreo-01-production.up.railway.app';
const HTTP_URL = SERVER_URL.replace(/^ws/, 'http');

// El fondo del mapa: Geoapify, mismo diseño que las tiles de CARTO de antes
// (`positron` = light_all, `dark-matter` = dark_all) pero con licencia que
// permite uso comercial. La clave la pone el servidor en /config.js desde su
// variable de entorno GEOAPIFY_API_KEY; acá nunca hay una clave escrita.
//
// Este panel usa el proveedor DIRECTO, a propósito, y no la cascada del mapa
// propio que usan las pantallas del chofer: el mapa propio (v1) no tiene
// nombres de calles, y acá se trazan rutas — los nombres valen. Son ~30
// paneles contra 2000 choferes: la cuota del proveedor ni se entera.
// Decisión de Gerson, 2026-08.
const TILES_KEY = window.TILES_KEY || '';
const tilesUrl = (estilo) =>
  `https://maps.geoapify.com/v1/tile/${estilo}/{z}/{x}/{y}{r}.png?apiKey=${TILES_KEY}`;
// OSM la exige (ODbL) y Geoapify la pide en su plan gratuito. Se muestra.
const TILES_ATRIB = 'Powered by <a href="https://www.geoapify.com/">Geoapify</a> · © OpenMapTiles · © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';

// Tokens HUD compartidos con la app
// Dos temas. DÍA es el de fábrica: el encargado puede estar en la calle o en
// el paradero con el celular en la mano, no en una oficina con luz tenue.
// NOCHE es el diseño oscuro original, para turnos de madrugada.
const TEMAS = {
  day: {
    bg: '#F7FAFD', surface: '#FFFFFF', line: '#C3D4E4', divider: '#E1E9F2',
    green: '#1F8A4F', amber: '#A67300', red: '#C2001D',
    fg: '#0B2239', fg2: '#2A4864', dim: '#41627F', dim2: '#496A86', dim3: '#5A7591',
    bright: '#1668C4', sky: '#1668C4',
    hueco: '#EDF2F8',       // cajas de alta, fondos hundidos
    campo: '#FFFFFF',       // inputs
    campoLinea: '#C3D4E4',
    boton: '#E3EDF7',       // botones secundarios
    apagado: '#B9C9D8',     // punto de "desconectado"
    burbuja: '#FFFFFF',      burbujaInk: '#0B2239',
    burbujaPropia: '#DCEBFB', burbujaPropiaInk: '#0A2E52',
    burbujaSos: '#FFE1E7',   burbujaSosInk: '#68001A',
    okFondo: '#E4F7EA', okClave: '#0B6B33',
    cargando: '#7FA8D4',
    // Superficies de estado: fondo + borde + tinta que se lee encima. Son
    // derivados del juego de arriba, no una paleta nueva; existen para que
    // un aviso se distinga sin bajar el contraste del texto.
    verdeFondo: '#E9F7EF', verdeBorde: '#BEE3CD', verdeTinta: '#0B6B33',
    ambarFondo: '#FDF6E4', ambarBorde: '#E4C88A', ambarTinta: '#4A3200', ambarTinta2: '#6B4A00',
    rojoFondo: '#FCEBEE',  rojoBorde: '#E6BFC6',  rojoTinta: '#5C0010',
    azulFondo: '#E7F0FB',  azulBorde: '#C9DDF4',  azulTinta: '#0A2E52',
    filaCritica: '#FDF3F5', // fila de unidad en rojo
    filaActiva: '#F7FBFF',  // tarjeta de la ruta que se está mirando
    celda: '#F4F8FC',       // fondo de las celdas de brecha
    tinta: '#0B2239',       // botón principal del creador, segmentado activo
    flotante: 'rgba(255,255,255,.94)', // tarjetas sobre el mapa
    velo: 'rgba(11,34,57,.42)',        // overlay de modal
    // Login: el halo detrás de la tarjeta (era un #0a1626 fijo en los dos temas)
    fondoLogin: '#E3EEF9',
    realce: '#F1F6FB',      // hover de filas y tarjetas
    anillo: 'rgba(22,104,196,.22)', // foco de los campos
    sombra: '0 1px 2px rgba(11,34,57,.06), 0 6px 18px -10px rgba(11,34,57,.22)',
    sombraAlta: '0 2px 6px rgba(11,34,57,.06), 0 24px 48px -20px rgba(11,34,57,.35)',
    // Avatares: [fondo, iniciales]. Derivados de la paleta; ninguno es rojo.
    avatares: [['#DCEBFB', '#0A2E52'], ['#DDF2E5', '#0B5A2C'], ['#F8EBCB', '#4A3200'],
               ['#E8E3F8', '#3A2A78'], ['#D7EFEF', '#0B4F52'], ['#E3E9F0', '#22384F']],
    tiles: tilesUrl('positron'),
    oscuro: false,
  },
  night: {
    bg: '#03060a', surface: '#0d1116', line: '#1c2836', divider: '#16222f',
    green: '#39FF14', amber: '#FFD400', red: '#FF2D55',
    fg: '#EAF4FF', fg2: '#C6D6E6', dim: '#8FA8C0', dim2: '#6E88A2', dim3: '#63809D',
    bright: '#2E9DFF', sky: '#71BCFF',
    hueco: '#0a0f15',
    campo: '#10161d',
    campoLinea: '#232b36',
    boton: '#1a222c',
    apagado: '#2a3644',
    burbuja: '#141a21',      burbujaInk: '#DCE8F5',
    burbujaPropia: '#0e2a45', burbujaPropiaInk: '#D8ECFF',
    burbujaSos: '#2b0812',   burbujaSosInk: '#FFD9E0',
    okFondo: '#08251a', okClave: '#7DF06A',
    cargando: '#1D598F',
    // Mismos papeles que en día, resueltos para fondo oscuro
    verdeFondo: '#08251a', verdeBorde: '#14512f', verdeTinta: '#7DF06A',
    ambarFondo: '#221900', ambarBorde: '#4a3800', ambarTinta: '#FFD400', ambarTinta2: '#C9A83A',
    rojoFondo: '#2b0812',  rojoBorde: '#5a1122',  rojoTinta: '#FFD9E0',
    azulFondo: '#0e2a45',  azulBorde: '#1d4570',  azulTinta: '#D8ECFF',
    filaCritica: '#1a0810',
    filaActiva: '#0b1620',
    celda: '#0a0f15',
    tinta: '#EAF4FF',
    flotante: 'rgba(13,17,22,.94)',
    velo: 'rgba(0,0,0,.6)',
    fondoLogin: '#0a1626',
    realce: '#111a24',
    anillo: 'rgba(46,157,255,.32)',
    sombra: '0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.7)',
    sombraAlta: '0 2px 6px rgba(0,0,0,.4), 0 24px 48px -20px rgba(0,0,0,.8)',
    avatares: [['#0e2a45', '#D8ECFF'], ['#08251a', '#9BF08A'], ['#2a2000', '#FFE07A'],
               ['#211a3d', '#D9CCFF'], ['#06282a', '#9EEFEF'], ['#1a222c', '#C6D6E6']],
    tiles: tilesUrl('dark-matter'),
    oscuro: true,
  },
};

// Se muta en vez de reemplazarse: así las referencias HUD.* de todo el panel
// siguen valiendo sin pasar el tema por props.
const HUD = { ...TEMAS.day };
function aplicarTema(modo) {
  Object.assign(HUD, TEMAS[modo] || TEMAS.day);
}

// Cualquier dato que se meta en HTML crudo (los pines del mapa se arman así,
// que es como los pide Leaflet) pasa por acá. El servidor ya limita los
// identificadores a caracteres seguros; esto es la segunda pared, para las
// bases que ya tuvieran algo raro cargado de antes.
function escaparHtml(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

const JULIACA_CENTER = [-15.4904, -70.1333];
// Objetivo de brecha por defecto; cada ruta manda el suyo en el estado
const TARGET_GAP_DEFAULT = 2;

// Los tipos de emergencia. El chofer los elige DESPUÉS de deslizar el SOS
// —la alerta ya llegó acá—; llegan como mensaje `sos_tipo` y actualizan la
// emergencia ya mostrada. Sin tipo, es el SOS genérico de siempre.
const TIPOS_SOS = { mecanica: 'Falla mecánica', accidente: 'Accidente', policia: 'Policía' };

// ─── LA ALARMA DEL SOS (31/10) ──────────────────────────────────
// Un SOS entraba como cartel y línea de chat, en silencio: con otra pestaña o
// ventana adelante, Despacho no se enteraba. Ahora suena —dos tonos cada
// 2,5 s, hasta que alguien marque ATENDIDO—, avisa con una notificación del
// navegador y hace parpadear el título de la pestaña.
//
// Sin archivo de sonido (Web Audio: cero bytes). El navegador no deja sonar
// hasta el primer gesto en la página: el clic en INGRESAR ya cuenta, y al
// retomar una sesión guardada se ofrece «Activar alarma» hasta el primer clic.
const alarmaSos = (() => {
  let ctx = null, reloj = null;
  const oyentes = new Set();
  const avisar = () => oyentes.forEach(fn => { try { fn(); } catch {} });
  const crear = () => {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { ctx = new AC(); ctx.onstatechange = avisar; } catch { ctx = null; }
    return ctx;
  };
  const tonos = () => {
    if (!ctx || ctx.state !== 'running') return;
    const t0 = ctx.currentTime;
    [880, 660, 880, 660].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = t0 + i * 0.25;
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.24);
    });
  };
  return {
    desbloquear() {
      const c = crear();
      if (c && c.state === 'suspended') c.resume().then(avisar, () => {});
      avisar();
    },
    lista: () => !!ctx && ctx.state === 'running',
    soportada: () => !!(window.AudioContext || window.webkitAudioContext),
    sonar() { if (reloj) return; tonos(); reloj = setInterval(tonos, 2500); },
    callar() { clearInterval(reloj); reloj = null; },
    suscribir(fn) { oyentes.add(fn); return () => oyentes.delete(fn); },
  };
})();
['pointerdown', 'keydown'].forEach(ev =>
  document.addEventListener(ev, () => alarmaSos.desbloquear(), { capture: true }));

// La notificación del navegador: se ve aunque el panel esté tapado por otra
// ventana. Queda hasta que se la toca (`requireInteraction`).
function notificarSos(s) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const n = new Notification(`SOS · ${(s.vehicleId || s.unitId || 'Unidad').toUpperCase()}`, {
      body: `${s.driverName || s.unitId || 'Un chofer'} pide ayuda` +
        (s.routeId ? ` · ruta ${s.routeId}` : '') + '. Abrí el panel y marcá ATENDIDO.',
      tag: 'sos-' + (s.sosId ?? s.timestamp), requireInteraction: true,
    });
    n.onclick = () => { try { window.focus(); } catch {} n.close(); };
  } catch {}
}

function parseMin(s) {
  if (!s) return null;
  const [m, sec] = String(s).split(':').map(Number);
  return m + (sec || 0) / 60;
}

// Minutos con decimales → "2:00". El objetivo se guarda como número y se
// lee al lado de las brechas, que vienen en m:ss: mostrarlo como "2 min"
// obligaría a convertir de cabeza cada vez que se compara.
function fmtMin(min) {
  if (min === null || min === undefined || isNaN(min)) return '—';
  const total = Math.round(min * 60);
  return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
}

function gapColor(gapStr, target = TARGET_GAP_DEFAULT) {
  const v = parseMin(gapStr);
  if (v === null || isNaN(v)) return HUD.dim3;
  const dev = Math.abs(v - target) / target;
  if (dev <= 0.15) return HUD.green;
  if (dev <= 0.30) return HUD.amber;
  return HUD.red;
}

// El mismo juicio que `gapColor`, en palabras.
//
// Verde y ámbar son EL MISMO COLOR para un daltónico rojo-verde: medido con el
// validador de paletas, el par queda en ΔE 5,4 bajo protanopia, por debajo del
// piso aceptable. Y no se arregla moviendo el color — corriendo el ámbar hacia
// el naranja se despega del verde pero se pega al rojo. La salida es no
// depender del color: el número de la brecha ya estaba, pero *si esa brecha
// está bien o se está yendo* lo decía únicamente el color, así que un
// despachador daltónico veía el dato y no veía el juicio.
//
// Las palabras son las de la leyenda que ya está en el mapa, para que la fila
// y la leyenda no digan lo mismo de dos maneras distintas. Sin dato no hay
// palabra: el "—" del valor ya dice todo lo que se sabe.
function gapWord(gapStr, target = TARGET_GAP_DEFAULT) {
  const c = gapColor(gapStr, target);
  if (c === HUD.green) return 'EN OBJETIVO';
  if (c === HUD.amber) return 'AL LÍMITE';
  if (c === HUD.red) return 'CRÍTICA';
  return null;
}

function nowTime(ts) {
  const d = ts ? new Date(ts) : new Date();
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

// La hora de un mensaje del chat. El historial guarda 30 días (los SOS, un
// año): un SOS de hace seis días salía con «04:18» a secas y se leía como de
// esta mañana. Si no es de hoy, lleva el día.
function horaChat(ts) {
  if (!ts) return nowTime();
  const d = new Date(ts);
  if (d.toDateString() === new Date().toDateString()) return nowTime(ts);
  return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')} ${nowTime(ts)}`;
}

// Los roles que una persona tuvo en un período, para leer de un vistazo. El
// servidor manda `roles` (lista) y `role` (en el que puso más horas); con una
// pantalla vieja o un turno sin rol, se cae al `role` de siempre.
const ROL_ES = { driver: 'chofer', collector: 'cobrador' };
function rolesTexto(p) {
  const lista = (p.roles && p.roles.length ? p.roles : [p.role]).filter(Boolean);
  if (!lista.length) return '—';
  return lista.map(r => ROL_ES[r] || r).join(' · ');
}
// Si en todo el período manejó alguna vez. Lo que decide si las vueltas y
// las salidas de ruta de la fila son suyas o son un «—».
function manejo(p) {
  return (p.roles && p.roles.length ? p.roles : [p.role]).includes('driver');
}

// "hoy 14:05" / "ayer 09:12" / "12/07 18:40" — para la última conexión
// La etiqueta de una actualización de la app ('20261104-1530') como se lee:
// '04/11 15:30' (PENDIENTES 0.11)
function fechaActualizacion(a) {
  const m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})$/.exec(String(a || ''));
  return m ? `${m[3]}/${m[2]} ${m[4]}:${m[5]}` : '';
}

function fmtWhen(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const dias = Math.floor((hoy - new Date(d).setHours(0, 0, 0, 0)) / 86400000);
  const hora = nowTime(ts);
  if (dias <= 0) return `hoy ${hora}`;
  if (dias === 1) return `ayer ${hora}`;
  return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')} ${hora}`;
}

// ─── Personas antes que placas. Las iniciales del nombre sobre un color que
// sale del nombre: siempre el mismo para la misma persona, en la tarjeta, en
// el chat y en las tablas. Los colores son tokens (`avatares`) y ninguno es
// rojo: el rojo es del SOS.
function iniciales(nombre) {
  const p = String(nombre || '').trim().split(/\s+/)
    .map(w => w.replace(/[^\p{L}\p{N}]/gu, '')).filter(Boolean);
  if (!p.length) return '·';
  const dos = p.length > 1 ? p[0][0] + p[p.length - 1][0] : p[0].slice(0, 2);
  return dos.toUpperCase();
}
function colorDe(nombre) {
  let h = 0;
  for (const c of String(nombre || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return HUD.avatares[h % HUD.avatares.length];
}

// "SIN SEÑAL DESDE 10:32" → "Sin señal desde 10:32". Los estados se escriben
// en mayúscula en el código (las suites los buscan así); se MUESTRAN en caja
// normal. Quedan en mayúscula las siglas y los códigos (M-05, R-14).
function oracion(s) {
  let primera = true;
  return String(s).replace(/[A-Za-zÁÉÍÓÚÑÜáéíóúñü]+/g, (w, i, todo) => {
    let r = w;
    if (w === 'GPS' || w === 'SOS') r = w;
    else if (w === 'ANDROID') r = 'Android';
    else if (todo[i + w.length] === '-' && /\d/.test(todo[i + w.length + 1] || '')) r = w;
    else if (w === w.toUpperCase()) r = w.toLowerCase();
    if (primera) { primera = false; r = r.charAt(0).toUpperCase() + r.slice(1); }
    return r;
  });
}

  const plano = partes.every(c => typeof c === 'string' || typeof c === 'number');
  const texto = plano ? (mayus ? partes.join('') : oracion(partes.join(''))) : children;
  return (
    <div title={title} style={{
      display: 'flex', alignItems: 'flex-start', gap: 6, marginTop: mt,
      fontSize: 12, fontWeight: mayus ? 800 : 600, letterSpacing: mayus ? 0.4 : 0,

// Un menú desplegable (el «⋯» de las filas, el «Descargar ▾» de Números). Se
// dibuja con position: fixed para que una tabla con overflow no lo corte.
function Menu({ etiqueta, icono = 'mas', items, titulo, data, estilo }) {
  const [pos, setPos] = React.useState(null);
  const boton = React.useRef(null);
  const caja = React.useRef(null);
  React.useEffect(() => {
    if (!pos) return;
    const fuera = (e) => {
      if (caja.current?.contains(e.target) || boton.current?.contains(e.target)) return;
      setPos(null);
    };
    const tecla = (e) => { if (e.key === 'Escape') { setPos(null); boton.current?.focus(); } };
    const cerrar = () => setPos(null);
    document.addEventListener('pointerdown', fuera);
    document.addEventListener('keydown', tecla);
    window.addEventListener('resize', cerrar);
    window.addEventListener('scroll', cerrar, true);
    return () => {
      document.removeEventListener('pointerdown', fuera);
      document.removeEventListener('keydown', tecla);
      window.removeEventListener('resize', cerrar);
      window.removeEventListener('scroll', cerrar, true);
    };
  }, [pos]);
  const visibles = (items || []).filter(Boolean);
  if (!visibles.length) return null;
  const abrir = () => {
    if (pos) { setPos(null); return; }
    const r = boton.current.getBoundingClientRect();
    const arriba = r.bottom + 44 * visibles.length + 24 > window.innerHeight;
    setPos({
      right: Math.max(8, window.innerWidth - r.right),
      ...(arriba ? { bottom: window.innerHeight - r.top + 6 } : { top: r.bottom + 6 }),
    });
  };
  return (
    <>
      <button ref={boton} type="button" {...(data || {})} aria-haspopup="menu" aria-expanded={!!pos}
        title={titulo} onClick={(e) => { e.stopPropagation(); abrir(); }}
        style={estilo || (etiqueta ? btnSecundario(36) : { ...btnIcono(false, 32), color: HUD.dim })}>
        {icono && <Icono n={icono} tam={16} />}
        {etiqueta}
        {etiqueta && <Icono n="abajo" tam={14} />}
        {!etiqueta && <span style={ocultoVisual}>Más acciones</span>}
      </button>
      {pos && (
        <div ref={caja} role="menu" onClick={e => e.stopPropagation()} style={{
          position: 'fixed', ...pos, zIndex: 5000, minWidth: 210, padding: 6,
          background: HUD.surface, border: `1px solid ${HUD.divider}`, borderRadius: 12,
          boxShadow: HUD.sombraAlta, display: 'grid', gap: 2, animation: 'aparecer .16s ease-out',
        }}>
          {visibles.map((it, i) => (
            <button key={i} type="button" role="menuitem" {...(it.data || {})} disabled={it.disabled}
              onClick={() => { setPos(null); it.onClick(); }}
              style={{
                display: 'flex', alignItems: 'center', gap: 10, width: '100%', padding: '9px 10px',
                border: 'none', borderRadius: 8, background: 'transparent', cursor: 'pointer',
                textAlign: 'left', fontFamily: 'inherit', fontSize: 13, fontWeight: 600,
                color: it.tono === 'rojo' ? HUD.red : HUD.fg2, whiteSpace: 'nowrap',
              }}>
              {it.icono && <Icono n={it.icono} tam={16} />}{it.label}
            </button>
          ))}
        </div>
      )}
    </>
  );
}

  /* El marco de la página sigue al tema de la app (día por defecto).
     Las variables las fija Root al aplicar el tema. */
  :root {
    --pag-bg: #F0F4F9;
    --pag-fg: #0B2239;
    --pag-dim: #547693;
    --pag-dim2: #7591AB;
  }
  html, body {
    margin: 0; padding: 0;
    background: var(--pag-bg);
    min-height: 100vh;
    font-family: system-ui, sans-serif;
    color: var(--pag-fg);
    overflow-x: hidden;
    transition: background 0.2s;

  .page {
    display: flex; flex-direction: column; align-items: center;
    padding: 36px 20px;
    gap: 20px;

  @keyframes combiFlash {
    0%   { opacity: 0; }
    20%  { opacity: 1; }
    100% { opacity: 1; }
  }
  @keyframes combiBreathe {
    0%, 100% { transform: scale(1); opacity: 0.25; }
    50%      { transform: scale(1.35); opacity: 0; }
  }
  @keyframes combiRing {
    0%   { transform: scale(1); opacity: 0.7; }

// El nombre de la cooperativa sobrevive al cierre de sesión: si no, el

function coopRecordada() {
  try { return localStorage.getItem('r14_coop') || null; } catch { return null; }

// Tokens HUD (rediseño 2a/3a/3b) — se suman a PALETTE sin tocarla.
// Regla: el rojo #FF2D55 queda reservado a emergencia/brecha crítica.
// Tres juegos de tokens. El de DÍA es el de fábrica: el celular va en
// soporte contra el parabrisas y en Juliaca, a 3800 m, el sol pega fuerte —
// una pantalla clara se lee mucho mejor que una oscura. NOCHE es el diseño
// OLED original y SOL EXTREMO sube el contraste al máximo.
//
// Los tokens se aplican mutando HUD (aplicarTema): así las ~300 referencias
// de las tres pantallas no necesitan pasar el tema por props.
const TEMAS = {
  // ─── DÍA (por defecto): superficies claras, tinta navy
  day: {
    bg:      '#F7FAFD',  // fondo de las tres pantallas
    surface: '#E9F0F8',  // pista del SOS, superficies

    divider: '#D6E2EE',  // divisores internos
    green:   '#1F8A4F',  greenInk: '#0B3D22',
    amber:   '#A67300',  amberInk: '#4A3200',
    red:     '#C2001D',  redInk:   '#5C0010',
    fg:      '#0B2239',  // texto primario
    fg2:     '#2A4864',  // texto secundario / iconos
    dim:     '#41627F',  // etiquetas
    dim2:    '#547693',  // metadatos
    dim3:    '#7591AB',  // metadatos mínimos
    // Chat
    headerLine: '#D6E2EE',
    input: '#FFFFFF',      inputLine: '#C3D4E4',
    mic:   '#E3EDF7',      micLine:   '#C3D4E4',
    burbuja:      '#FFFFFF', burbujaInk:    '#0B2239',
    burbujaPropia:'#DCF5E4', burbujaPropiaInk:'#0C3B1E',
    burbujaAdmin: '#DCEBFB',
    burbujaWarn:  '#FFF4D6', burbujaWarnInk: '#5C4100', warnEdge: '#A67300',
    burbujaSos:   '#FFE1E7', burbujaSosInk:  '#68001A',
    // Mapa: tiles claros y tarjetas claras encima
    tiles: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    tarjeta: 'rgba(255,255,255,.92)', tarjetaSolida: 'rgba(255,255,255,.96)',
    resplandor: false,   // el glow no funciona sobre fondo claro
  },
  // ─── SOL EXTREMO: blanco puro, tinta casi negra, cero sutilezas
  sun: {
    bg:      '#FFFFFF',
    surface: '#EDF3FA',
    line:    '#8FA8BE',
    divider: '#BACBDA',
    green:   '#146134',  greenInk: '#04220F',
    amber:   '#7A5400',  amberInk: '#2E2000',
    red:     '#960016',  redInk:   '#3D000B',
    fg:      '#04121F',
    fg2:     '#0B2239',
    dim:     '#20415C',
    dim2:    '#2E5273',
    dim3:    '#4A6C8A',
    headerLine: '#BACBDA',
    input: '#FFFFFF',      inputLine: '#8FA8BE',
    mic:   '#EDF3FA',      micLine:   '#8FA8BE',
    burbuja:      '#FFFFFF', burbujaInk:    '#04121F',
    burbujaPropia:'#D2F2DC', burbujaPropiaInk:'#04220F',
    burbujaAdmin: '#D2E6FA',
    burbujaWarn:  '#FFEFC2', burbujaWarnInk: '#3D2B00', warnEdge: '#7A5400',
    burbujaSos:   '#FFD6DE', burbujaSosInk:  '#3D000B',
    tiles: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    tarjeta: 'rgba(255,255,255,.96)', tarjetaSolida: '#FFFFFF',

  },
  // ─── NOCHE: el diseño OLED original, con resplandor
  night: {
    bg:      '#03060a',
    surface: '#0d1116',
    line:    '#1c2836',
    divider: '#16222f',
    green:   '#39FF14',  greenInk: '#EAFFE4',
    amber:   '#FFD400',  amberInk: '#FFF7D6',
    red:     '#FF2D55',  redInk:   '#FFE0E7',
    fg:      '#EAF4FF',
    fg2:     '#C6D6E6',
    dim:     '#8FA8C0',
    dim2:    '#6E88A2',
    dim3:    '#56708A',
    headerLine: '#121a24',
    input: '#10161d',      inputLine: '#232b36',
    mic:   '#1a222c',      micLine:   '#2b3542',
    burbuja:      '#141a21', burbujaInk:    '#DCE8F5',
    burbujaPropia:'#0b2e17', burbujaPropiaInk:'#DFFFD6',

    resplandor: true,
  },

// HUD son los tokens EN USO. Se mutan en vez de reemplazarse para que todo
// el código que ya los referencia siga funcionando sin pasar props.
const HUD = { ...TEMAS.day };

const HUD_STATUS = {};

function aplicarTema(modo) {
  const t = TEMAS[modo] || TEMAS.day;
  Object.assign(HUD, t);
  // Los colores de estado se derivan del tema, así que se rearman acá
  HUD_STATUS.green  = { c: HUD.green, ink: HUD.greenInk };
  HUD_STATUS.yellow = { c: HUD.amber, ink: HUD.amberInk };
  HUD_STATUS.red    = { c: HUD.red,   ink: HUD.redInk };
  // Un lado sin nadie: apagado, para que no compita con el dato de verdad.
  HUD_STATUS.none   = { c: HUD.dim3, ink: HUD.dim3 };
}
aplicarTema('day');

// Estado por lado: desvío relativo al objetivo (verde ≤15%, ámbar ≤30%)
function sideStatus(gapStr, target) {
  const dev = Math.abs(parseMin(gapStr) - target) / target;
  if (dev <= 0.15) return 'green';
  if (dev <= 0.30) return 'yellow';
  return 'red';
}

// "04:30" → "4:30" (los dígitos héroe no llevan cero inicial)
function fmtGap(v) {
  return String(v || '').replace(/^0(\d)/, '$1');
}

// "+1 · M-08" cuando se sabe la brecha; "M-08 · sin señal" cuando esa unidad
// existe pero dejó de reportar; "sin nadie" cuando de ese lado no hay nadie.
// Las tres frases son distintas a propósito: para el chofer, ser el primero
// de la fila y tener adelante una combi que no ve son situaciones opuestas.
function rotuloLado(lado) {
  if (lado.sinSenal) return `${lado.unit} · sin señal`;
  return lado.vacio ? 'sin nadie' : `${lado.sign} · ${lado.unit}`;
}

// 2 → "2:00", 2.5 → "2:30"
function fmtTarget(min) {
  const m = Math.floor(min);
  const s = Math.round((min - m) * 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

// Modelo compartido del HUD: qué lado es héroe, colores por lado.
// El héroe es el lado con MAYOR desvío absoluto respecto del objetivo.
//
// Con `gapMeta.vivo` el modelo pasa a los datos del servidor y **honra el
// null**: primera y última de la ruta no tienen a nadie adelante ni atrás, y
// ahí el servidor manda null. Antes el `||` de este bloque lo tapaba con los
// valores de `DEFAULT_TWEAKS`, que son los de la maqueta: al primero de la
// fila le aparecía un "ATRÁS −1 · M-21 1:40" que no existía, con el mismo
// tamaño y el mismo color que el dato de verdad. Un lado sin nadie ahora se
// dibuja vacío, que es lo que es.
// Un lado tiene TRES estados, no dos, y el tercero es el que importa acá:
// hay una unidad de ese lado que dejó de reportar. Su última posición es de
// hace minutos y medirse contra ella sería inventar, pero tampoco es "no hay
// nadie": el chofer tiene una combi adelante que no ve en el mapa, y eso es
// justo lo que necesita saber.
function buildHudModel(tweaks, gapMeta) {
  const target = tweaks.targetGap;
  const vivo = !!gapMeta?.vivo;
  const mk = (value, label, sign, unit, sinSenal) => {
    if (!value) {
      const hayAlguien = !!(unit && sinSenal);
      return {
        value: null, label, sign,
        unit: hayAlguien ? unit : null,
        vacio: true, sinSenal: hayAlguien,
        status: 'none',
        color: HUD_STATUS.none.c,
        ink: HUD_STATUS.none.ink,
        display: '—',
      };
    }
    const status = sideStatus(value, target);
    return {
      value, label, sign, unit, sinSenal: false,
      status,
      color: HUD_STATUS[status].c,
      ink: HUD_STATUS[status].ink,
      display: fmtGap(value),
    };
  };
  const frontVal = vivo ? gapMeta.toAhead  : tweaks.frontTime;
  const backVal  = vivo ? gapMeta.toBehind : tweaks.backTime;
  const front = mk(frontVal, 'ADELANTE', '+1', vivo ? gapMeta.aheadUnit  : 'M-08',
                   vivo && gapMeta.aheadSinSenal);
  const back  = mk(backVal,  'ATRÁS',    '−1', vivo ? gapMeta.behindUnit : 'M-21',
                   vivo && gapMeta.behindSinSenal);

  // El héroe es el lado con más desvío, pero un lado vacío nunca puede serlo:
  // el dígito grande es para lo que el chofer tiene que corregir.
  const desvio = v => (v ? Math.abs(parseMin(v) - target) : -1);
  const heroIsBack =
    // Entre dos lados sin número manda el que tiene a alguien sin señal: es
    // lo único que hay para decirle al chofer. Si no, el aviso quedaría en
    // el renglón chico de abajo y el dígito grande no diría nada.
    (back.vacio && front.vacio) ? (back.sinSenal && !front.sinSenal)
    : back.vacio ? false
    : front.vacio ? true
    : desvio(backVal) >= desvio(frontVal);
  return {
    target, vivo,
    front, back,
    hero: heroIsBack ? back : front,
    sec:  heroIsBack ? front : back,
  };
}

// ═══════════════════════════════════════════════════════════════
// GPS MAP
// ═══════════════════════════════════════════════════════════════
// Centro de Juliaca — Plaza de Armas
const JULIACA_CENTER = [-15.4904, -70.1333];

// Todo lo que entre a HTML crudo pasa por acá. Los pines de Leaflet se arman
// con HTML, así que es donde hay que tener cuidado.
function escaparHtml(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

// HTML de los pines (Leaflet divIcon). El ancla siempre es el centro del punto.
// Sobre tiles claros el punto propio en blanco desaparece y el resplandor no
// se ve: en día el pin va navy con borde blanco, y las burbujas de brecha
// llevan fondo claro con tinta de color. En noche queda el diseño original.
function youPinHtml() {
  const claro = !HUD.resplandor;
  const punto = claro ? HUD.fg : '#fff';
  const borde = claro ? '#fff' : HUD.bg;
  const sombra = claro
    ? '0 1px 4px rgba(0,0,0,.45)'
    : '0 0 24px #fff,0 0 48px rgba(255,255,255,.4)';
  return `<div style="position:relative;width:24px;height:24px;">
    <div style="width:24px;height:24px;border-radius:50%;background:${punto};border:3px solid ${borde};box-sizing:border-box;box-shadow:${sombra};"></div>
    <div style="position:absolute;top:29px;left:50%;transform:translateX(-50%);font-family:'Archivo Black',system-ui,sans-serif;font-size:16px;color:${borde};background:${punto};padding:1px 7px;border-radius:8px;">TÚ</div>
  </div>`;
}

function gapPinHtml(color, text) {
  const claro = !HUD.resplandor;
  const borde = claro ? '#fff' : HUD.bg;
  const fondo = claro ? 'rgba(255,255,255,.92)' : 'rgba(3,6,10,.82)';
  const sombraPunto = claro ? '0 1px 3px rgba(0,0,0,.4)' : `0 0 16px ${color}`;
  const sombraTexto = claro ? 'none' : `0 0 14px ${color}99`;
  return `<div style="position:relative;width:16px;height:16px;">
    <div style="width:16px;height:16px;border-radius:50%;background:${color};border:2px solid ${borde};box-sizing:border-box;box-shadow:${sombraPunto};"></div>
    <div style="position:absolute;top:21px;left:50%;transform:translateX(-50%);font-family:'Archivo Black',system-ui,sans-serif;font-size:20px;color:${color};background:${fondo};padding:3px 9px;border-radius:8px;text-shadow:${sombraTexto};font-variant-numeric:tabular-nums;white-space:nowrap;">${escaparHtml(text)}</div>
  </div>`;
}

function otherPinHtml() {
  const borde = HUD.resplandor ? HUD.bg : '#fff';
  return `<div style="width:10px;height:10px;border-radius:50%;background:${HUD.dim3};border:2px solid ${borde};box-sizing:content-box;"></div>`;
}

function GpsMap({ active, otherUnits = [], hud, gapMeta, currentStop, nextStop, routeId, modo, trazado }) {
  const leafletRef = React.useRef(null);
  const tilesRef = React.useRef(null);
  const trazadoRef = React.useRef(null);
  const youMarkerRef = React.useRef(null);
  const otherMarkersRef = React.useRef({});
  const [mapReady, setMapReady] = React.useState(false);
  const [realPos, setRealPos] = React.useState(null);
  const [gpsError, setGpsError] = React.useState(null);

  React.useEffect(() => {
    if (active && leafletRef.current) {
      setTimeout(() => leafletRef.current.invalidateSize(), 50);
    }
  }, [active]);

  // Se ejecuta cuando cambian los otros usuarios O cuando el mapa termina de inicializarse.
  // Las unidades ±1 llevan burbuja de brecha con el mismo valor que muestra el HUD;
  // el resto son puntos de contexto sin texto.
  React.useEffect(() => {
    if (!mapReady || !leafletRef.current) return;
    const map = leafletRef.current;
    const existing = otherMarkersRef.current;
    const currentIds = new Set(otherUnits.map(u => u.unitId));

    Object.keys(existing).forEach(id => {
      if (!currentIds.has(id)) { existing[id].marker.remove(); delete existing[id]; }
    });

    otherUnits.forEach(unit => {
      if (!unit.lat || !unit.lng) return;
      let html, size, anchor;
      if (unit.unitId === gapMeta?.aheadUnit) {
        html = gapPinHtml(hud.front.color, hud.front.display);
        size = [16, 16]; anchor = [8, 8];
      } else if (unit.unitId === gapMeta?.behindUnit) {
        html = gapPinHtml(hud.back.color, hud.back.display);
        size = [16, 16]; anchor = [8, 8];
      } else {
        html = otherPinHtml();
        size = [10, 10]; anchor = [5, 5];
      }
      const entry = existing[unit.unitId];
      if (entry) {
        entry.marker.setLatLng([unit.lat, unit.lng]);
        if (entry.html !== html) {
          entry.marker.setIcon(L.divIcon({ html, className: '', iconSize: size, iconAnchor: anchor }));
          entry.html = html;
        }
      } else {
        const icon = L.divIcon({ html, className: '', iconSize: size, iconAnchor: anchor });
        const marker = L.marker([unit.lat, unit.lng], { icon }).addTo(map);
        existing[unit.unitId] = { marker, html };
      }
    });
  }, [otherUnits, mapReady, hud, gapMeta]);

  const initMap = React.useCallback((node) => {
    if (!node || leafletRef.current) return;

    const map = L.map(node, {
      center: JULIACA_CENTER,
      zoom: 16,
      zoomControl: false,
      attributionControl: false,
    });

    tilesRef.current = L.tileLayer(HUD.tiles, {
      maxZoom: 19,
    }).addTo(map);

    const youIcon = L.divIcon({ html: youPinHtml(), className: '', iconSize: [24,24], iconAnchor: [12,12] });
    const youMarker = L.marker(JULIACA_CENTER, { icon: youIcon, zIndexOffset: 1000 }).addTo(map);
    youMarkerRef.current = youMarker;

    leafletRef.current = map;
    setTimeout(() => map.invalidateSize(), 100);
    setTimeout(() => { map.invalidateSize(); setMapReady(true); }, 500);
  }, []);

  // El recorrido de la ruta, debajo de las unidades: el chofer ve por dónde
  // va la ruta, no solo dónde está él.
  React.useEffect(() => {
    const map = leafletRef.current;
    if (!map) return;
    if (trazadoRef.current) { trazadoRef.current.remove(); trazadoRef.current = null; }
    const capa = L.layerGroup();
    let hay = false;
    const op = HUD.resplandor ? 0.5 : 0.45;
    if (trazado?.ida?.length > 1) {
      L.polyline(trazado.ida, { color: P.bright, weight: 5, opacity: op }).addTo(capa);
      hay = true;
    }
    // La vuelta punteada: si comparte calle con la ida, se distinguen
    if (trazado?.vuelta?.length > 1) {
      L.polyline(trazado.vuelta, {
        color: P.bright, weight: 5, opacity: op, dashArray: '10 10',
      }).addTo(capa);
      hay = true;
    }
    if (hay) { capa.addTo(map); trazadoRef.current = capa; }
    // 'active' entra en las dependencias por precaución: el mapa vive oculto
    // hasta que el chofer llega a su página, y conviene redibujar cuando se
    // vuelve visible y Leaflet ya se remidió.
  }, [trazado, mapReady, modo, active]);

  // Cambiar de modo cambia el mapa en caliente: tiles claros u oscuros y
  // pines redibujados. Sin esto habría que reabrir la app para verlo.
  React.useEffect(() => {
    if (!tilesRef.current) return;
    tilesRef.current.setUrl(HUD.tiles);
    if (youMarkerRef.current) {
      youMarkerRef.current.setIcon(
        L.divIcon({ html: youPinHtml(), className: '', iconSize: [24, 24], iconAnchor: [12, 12] })
      );
    }
    Object.values(otherMarkersRef.current).forEach(e => { e.html = null; });
  }, [modo, mapReady]);

  // Sigue la posición GPS real del celular
  React.useEffect(() => {
    if (!navigator.geolocation) { setGpsError('sin GPS'); return; }
    const id = navigator.geolocation.watchPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        setRealPos({ lat: latitude, lng: longitude });
        if (youMarkerRef.current && leafletRef.current) {
          youMarkerRef.current.setLatLng([latitude, longitude]);
          leafletRef.current.panTo([latitude, longitude], { animate: true, duration: 1 });
        }
      },
      (err) => setGpsError(err.message),
      { enableHighAccuracy: true, maximumAge: 3000 }
    );
    return () => navigator.geolocation.clearWatch(id);
  }, []);

  const chipStyle = {
    position: 'absolute', top: 46,
    fontFamily: '"Archivo Black", system-ui, sans-serif',
    fontSize: 17, whiteSpace: 'nowrap',
    background: HUD.tarjeta, border: `1px solid ${HUD.line}`,
    padding: '8px 12px', borderRadius: 10,
    pointerEvents: 'none', zIndex: 1000,
  };

  return (
    <div style={{ position: 'absolute', inset: 0, background: HUD.bg }}>
      <div ref={initMap} style={{ position: 'absolute', inset: 0 }} data-noswipe="map" />

      {/* Chips superiores: ruta y unidades en línea */}
      <div style={{ ...chipStyle, left: 18, color: HUD.fg }}>{routeId || 'RUTA'} · TERMINAL</div>
      <div style={{ ...chipStyle, right: 18, color: HUD.green }}>
        {otherUnits.length > 0 ? `${otherUnits.length + 1} EN RUTA` : 'SOLO TÚ'}
      </div>

      {/* Barra inferior: la brecha del HUD nunca se pierde */}
      <div style={{
        position: 'absolute', left: 18, right: 18, bottom: 26,
        background: HUD.tarjetaSolida, border: `1px solid ${HUD.line}`,
        borderRadius: 22, padding: '18px 20px',
        display: 'flex', flexDirection: 'column', gap: 14,
        pointerEvents: 'none', zIndex: 1000,
      }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
          <div>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
              <span style={{
                fontFamily: '"Archivo Black", system-ui, sans-serif',
                fontSize: 17, color: hud.hero.color,
              }}>{hud.hero.label}</span>
              <span style={{ fontSize: 15, fontWeight: 700, color: HUD.dim2, fontFamily: 'system-ui, sans-serif' }}>
                {rotuloLado(hud.hero)}
              </span>
            </div>
            {/* El "—" del lado vacío va en la tipografía de texto: en
                Archivo Black se lee como una barra, no como un hueco. */}
            <div style={{
              fontFamily: hud.hero.vacio ? 'system-ui, sans-serif' : '"Archivo Black", system-ui, sans-serif',
              fontSize: hud.hero.vacio ? 34 : 56, lineHeight: 1, letterSpacing: -3,
              color: HUD.resplandor && !hud.hero.vacio ? hud.hero.ink : hud.hero.color,
              textShadow: HUD.resplandor && !hud.hero.vacio
                ? `0 0 10px ${hud.hero.color}, 0 0 34px ${hud.hero.color}` : 'none',
              fontVariantNumeric: 'tabular-nums',
            }}>{hud.hero.display}</div>
          </div>
          <div style={{ textAlign: 'right' }}>
            <div style={{
              fontFamily: '"Archivo Black", system-ui, sans-serif',
              fontSize: 17, color: HUD.fg2,
            }}>{hud.sec.label}</div>
            <div style={{
              fontFamily: hud.sec.vacio ? 'system-ui, sans-serif' : '"Archivo Black", system-ui, sans-serif',
              fontSize: hud.sec.vacio ? 22 : 34, lineHeight: 1.1,
              color: hud.sec.color,
              textShadow: HUD.resplandor && !hud.sec.vacio ? `0 0 14px ${hud.sec.color}80` : 'none',
              fontVariantNumeric: 'tabular-nums',
            }}>{hud.sec.display}</div>
          </div>
        </div>
        <div style={{
          borderTop: `1px solid ${HUD.divider}`, paddingTop: 12,
          display: 'flex', alignItems: 'center', gap: 8,
        }}>
          {/* Los paraderos son de la maqueta: el servidor no los tiene. En
              vivo queda solo la coordenada, que sí es real. */}
          {!hud.vivo && (
            <React.Fragment>
              <span style={{ width: 8, height: 8, borderRadius: '50%', background: P.bright, flexShrink: 0 }} />
              <span style={{
                fontSize: 16, fontWeight: 700, color: HUD.dim,
                fontFamily: 'system-ui, sans-serif',
                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', flex: 1,
              }}>{currentStop} → {nextStop}</span>
            </React.Fragment>
          )}
          {hud.vivo && <span style={{ flex: 1 }} />}
          <span style={{
            fontFamily: 'JetBrains Mono, ui-monospace, monospace',
            fontSize: 13, fontWeight: 700, color: realPos ? HUD.dim3 : HUD.amber,
            whiteSpace: 'nowrap',
          }}>
            {realPos
              ? `${realPos.lat.toFixed(4)}, ${realPos.lng.toFixed(4)}`
              : gpsError ? 'SIN GPS' : 'ESPERANDO GPS…'}
          </span>
        </div>
      </div>
    </div>
  );
}

// 85 → "1:25" (duración de audio, siempre tabular)
function fmtDur(s) {
  return `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
}

function nowTime(ts) {
  const d = ts ? new Date(ts) : new Date();
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

// Onda de 12 barras con alturas fijas del handoff.
// La reproducción es simulada: las barras se van encendiendo con el progreso.
const VOICE_BAR_HEIGHTS = [10, 18, 24, 14, 22, 26, 12, 20, 24, 13, 19, 10];

function VoiceBubble({ seconds, own, audio, expired }) {
  const [playing, setPlaying] = React.useState(false);
  const [elapsed, setElapsed] = React.useState(0);
  const audioRef = React.useRef(null);

  // Sin audio real (mensajes de demo) la reproducción es simulada
  React.useEffect(() => {
    if (audio || !playing) return;
    const id = setInterval(() => {
      setElapsed(e => {
        if (e + 0.1 >= seconds) { setPlaying(false); return 0; }
        return e + 0.1;
      });
    }, 100);
    return () => clearInterval(id);
  }, [playing, seconds, audio]);

  React.useEffect(() => () => { if (audioRef.current) audioRef.current.pause(); }, []);

  const toggle = () => {
    if (expired) return;
    if (audio) {
      if (!audioRef.current) {
        const a = new Audio(audio);
        a.ontimeupdate = () => setElapsed(a.currentTime);
        a.onended = () => { setPlaying(false); setElapsed(0); };
        audioRef.current = a;
      }
      if (playing) {
        audioRef.current.pause();
        setPlaying(false);
      } else {
        audioRef.current.currentTime = 0;
        audioRef.current.play().catch(() => setPlaying(false));
        setPlaying(true);
      }
    } else {
      setElapsed(0);
      setPlaying(p => !p);
    }
  };

  const playBg  = own ? HUD.green : P.bright;
  const litBar  = own ? '#7DF06A' : P.sky;
  const dimBar  = own ? '#2e5c3c' : '#3d5f80';
  const litCount = playing ? Math.max(1, Math.round((elapsed / seconds) * 12)) : 6;

  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, opacity: expired ? 0.45 : 1 }}>
      <div
        data-noswipe="voice"
        onClick={toggle}
        style={{
          width: 38, height: 38, borderRadius: '50%',
          background: playBg, color: HUD.bg,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: 16, flexShrink: 0, cursor: expired ? 'default' : 'pointer',
          userSelect: 'none',
        }}>{playing ? '❚❚' : '▶'}</div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 3, height: 26 }}>
        {VOICE_BAR_HEIGHTS.map((h, i) => (
          <div key={i} style={{
            width: 3, height: h, borderRadius: 1.5,
            background: i < litCount ? litBar : dimBar,
            transition: 'background 0.15s',
          }} />
        ))}
      </div>
      <div style={{
        fontFamily: 'JetBrains Mono, ui-monospace, monospace',
        fontSize: 16, fontWeight: 700, color: litBar,
        fontVariantNumeric: 'tabular-nums', minWidth: 38, textAlign: 'right',
      }}>{playing ? fmtDur(Math.ceil(seconds - elapsed)) : fmtDur(seconds)}</div>
    </div>
  );
}

// Estilos por rol/tono del handoff 3a
function bubbleStyle(msg) {
  const base = {

    fontFamily: 'system-ui, -apple-system, "Helvetica Neue", sans-serif',
    fontSize: 19, fontWeight: 500, lineHeight: 1.35,
  };
  // Un mensaje privado de Despacho es para ESTA unidad: tiene que verse
  // distinto del grupo, porque exige respuesta.
  if (msg.privado && msg.role === 'admin') {
    return {
      ...base, background: HUD.burbujaWarn, color: HUD.burbujaWarnInk,
      borderLeft: `4px solid ${HUD.warnEdge}`,
    };
  }
  if (msg.role === 'you') {
    return { ...base, borderRadius: '16px 16px 5px 16px', background: HUD.burbujaPropia, color: HUD.burbujaPropiaInk };
  }
  if (msg.role === 'admin') {

  if (msg.tone === 'warn') {
    return { ...base, background: HUD.burbujaWarn, borderLeft: `3px solid ${HUD.warnEdge}`, color: HUD.burbujaWarnInk };

  if (msg.tone === 'sos') {
    return { ...base, background: HUD.burbujaSos, borderLeft: `3px solid ${HUD.red}`, color: HUD.burbujaSosInk };
  }
  return { ...base, background: HUD.burbuja, color: HUD.burbujaInk };
}

function ChatScreen({ messages, hud, online, connected, routeId, onSendText, onSendVoice }) {
  const scrollRef = React.useRef(null);
  // 'grupo' = toda la ruta · 'despacho' = solo con Despacho, sobre esta unidad
  const [canal, setCanal] = React.useState('grupo');
  // Cuántos privados de Despacho ya vio el chofer, para que el número de la
  // pestaña sea "lo que falta ver" y no el total de la conversación.
  const [privadosVistos, setPrivadosVistos] = React.useState(0);
  const [draft, setDraft] = React.useState('');
  const [recording, setRecording] = React.useState(false);
  const [recElapsed, setRecElapsed] = React.useState(0);
  const recRef = React.useRef(null); // { recorder, stream, chunks, started }

  // Hilo anclado al mensaje más nuevo, al montar y con cada mensaje
  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages]);

  // Grabación real con el micrófono del celular. Si no hay permiso o no
  // hay MediaRecorder, la nota sale igual pero sin audio (simulada).
  const startRec = () => {
    if (recRef.current) return;
    const rec = { recorder: null, stream: null, chunks: [], started: Date.now() };
    recRef.current = rec;
    setRecording(true);
    if (navigator.mediaDevices?.getUserMedia && window.MediaRecorder) {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        if (recRef.current !== rec) { stream.getTracks().forEach(t => t.stop()); return; } // ya soltó
        const recorder = new MediaRecorder(stream);
        recorder.ondataavailable = (e) => { if (e.data.size) rec.chunks.push(e.data); };
        recorder.start();
        rec.recorder = recorder;
        rec.stream = stream;
      }).catch(() => {}); // sin permiso — nota simulada
    }
  };

  const stopRec = () => {
    const rec = recRef.current;
    if (!rec) return;
    recRef.current = null;
    setRecording(false);
    setRecElapsed(0);
    const dur = Math.round((Date.now() - rec.started) / 1000);
    const privado = canal === 'despacho';
    const finish = (dataUrl) => { if (dur >= 1) onSendVoice(Math.min(dur, 60), dataUrl || null, privado); };
    if (rec.recorder && rec.recorder.state === 'recording') {
      rec.recorder.onstop = () => {
        rec.stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(rec.chunks, { type: rec.recorder.mimeType || 'audio/webm' });
        if (!blob.size || blob.size > 1_500_000) { finish(null); return; }
        const fr = new FileReader();
        fr.onload = () => finish(fr.result);
        fr.onerror = () => finish(null);
        fr.readAsDataURL(blob);
      };
      rec.recorder.stop();
    } else {
      if (rec.stream) rec.stream.getTracks().forEach(t => t.stop());
      finish(null);
    }
  };

  React.useEffect(() => {
    if (!recording) return;
    const started = recRef.current?.started || Date.now();
    const id = setInterval(() => {
      const el = (Date.now() - started) / 1000;
      setRecElapsed(el);
      if (el >= 60) stopRec(); // tope de 60 segundos
    }, 100);
    window.addEventListener('mouseup', stopRec);
    window.addEventListener('touchend', stopRec);
    return () => {
      clearInterval(id);
      window.removeEventListener('mouseup', stopRec);
      window.removeEventListener('touchend', stopRec);
    };
  }, [recording]);

  // Los que manda Despacho: son los que exigen atención del chofer
  const privadosDeDespacho = messages.filter(m => m.privado && m.role === 'admin').length;
  React.useEffect(() => {
    if (canal === 'despacho') setPrivadosVistos(privadosDeDespacho);
  }, [canal, privadosDeDespacho]);
  const privadosPendientes = canal === 'despacho'
    ? 0 : Math.max(0, privadosDeDespacho - privadosVistos);

  const send = () => {
    const text = draft.trim();
    if (!text) return;
    onSendText(text, canal === 'despacho');
    setDraft('');
  };

  const controlH = 56;

  return (
    <div style={{
      width: '100%', height: '100%',
      background: HUD.bg,
      display: 'flex', flexDirection: 'column',

// SOS SLIDER
// ═══════════════════════════════════════════════════════════════
function SosSlider({ status, enableAnim, onFire }) {
  const trackRef = React.useRef(null);
  const [progress, setProgress] = React.useState(0);
  const [dragging, setDragging] = React.useState(false);
  const [fired, setFired] = React.useState(false);
  const startX = React.useRef(0);
  const startProg = React.useRef(0);

  const onDown = (clientX) => {
    if (fired) return;
    setDragging(true);
    startX.current = clientX;
    startProg.current = progress;
  };
  const onMove = (clientX) => {
    if (!dragging || fired) return;
    const track = trackRef.current;
    if (!track) return;
    const trackW = track.offsetWidth - 82; // ancho menos thumb (70) y padding (6+6)
    const dx = clientX - startX.current;
    const p = Math.max(0, Math.min(1, startProg.current + dx / trackW));
    setProgress(p);
    if (p >= 0.98) {
      setFired(true);
      setDragging(false);
      onFire && onFire();
      setTimeout(() => { setFired(false); setProgress(0); }, 2200);
    }
  };
  const onUp = () => {
    setDragging(false);
    if (!fired) setProgress(0);
  };

  React.useEffect(() => {
    if (!dragging) return;
    const mm = (e) => onMove(e.clientX);
    const mu = () => onUp();
    const tm = (e) => onMove(e.touches[0].clientX);
    const tu = () => onUp();
    window.addEventListener('mousemove', mm);
    window.addEventListener('mouseup', mu);
    window.addEventListener('touchmove', tm);
    window.addEventListener('touchend', tu);
    return () => {
      window.removeEventListener('mousemove', mm);
      window.removeEventListener('mouseup', mu);
      window.removeEventListener('touchmove', tm);
      window.removeEventListener('touchend', tu);
    };
  }, [dragging]);

  const trackH = 84;
  const thumbSize = 70;
  const sun = !HUD.resplandor;   // fondo claro
  const suggestSos = status === 'red' && enableAnim;

  return (
    <div ref={trackRef} data-noswipe="sos" style={{
      position: 'relative', width: '100%', height: trackH,
      borderRadius: 20,
      background: HUD.surface,
      border: `2px solid ${HUD.line}`,
      overflow: 'hidden', userSelect: 'none',
      WebkitTapHighlightColor: 'transparent',
      boxSizing: 'border-box',
    }}>
      {suggestSos && !dragging && progress === 0 && (
        <div style={{
          position: 'absolute', inset: -5,
          borderRadius: 24,
          border: `2px solid ${HUD.red}`,
          animation: 'combiRing 1.6s ease-out infinite',
          pointerEvents: 'none',
        }} />
      )}
      {/* relleno de avance */}
      <div style={{
        position: 'absolute', top: 0, bottom: 0, left: 0,
        background: HUD.red,
        width: `calc(${thumbSize/2 + 6}px + ${progress * 100}%)`,
        maxWidth: '100%',
        transition: dragging ? 'none' : 'width 0.25s cubic-bezier(.4,0,.2,1)',
        opacity: 0.22,
      }} />
      {/* etiqueta */}
      <div style={{
        position: 'absolute', inset: 0,
        paddingLeft: thumbSize + 18,
        display: 'flex', alignItems: 'center',
        fontSize: 16, fontWeight: 700, letterSpacing: 0.5,
        fontFamily: 'system-ui, sans-serif',
        color: fired || progress > 0.5 ? HUD.red : HUD.dim2,
        whiteSpace: 'nowrap',
        transition: 'color 0.2s', pointerEvents: 'none', zIndex: 2,
      }}>
        {fired ? 'ENVIANDO...' : progress > 0.5 ? 'SUELTA PARA SOS' : 'DESLIZÁ PARA SOS →'}
      </div>
      {/* thumb arrastrable */}
      <div
        onMouseDown={(e) => onDown(e.clientX)}
        onTouchStart={(e) => onDown(e.touches[0].clientX)}
        style={{
          position: 'absolute',
          left: `calc(${progress} * (100% - ${thumbSize + 12}px) + 6px)`,
          top: 5,
          width: thumbSize, height: thumbSize, borderRadius: 16,
          background: HUD.red, color: '#fff',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontFamily: '"Archivo Black", system-ui, sans-serif',
          fontSize: 19,
          cursor: 'grab',
          transition: dragging ? 'none' : 'left 0.3s cubic-bezier(.4,0,.2,1)',
          boxShadow: sun ? '0 2px 8px rgba(0,0,0,.25)' : '0 0 22px rgba(255,45,85,.5)',
          zIndex: 3, touchAction: 'none',
        }}
      >
        {fired ? '✓' : 'SOS'}
      </div>
    </div>
  );
}

function LoginScreen({ onSuccess, notice }) {
  const [user, setUser] = React.useState(() => {
    try { return localStorage.getItem('r14_lastUser') || ''; } catch { return ''; }
  });
  const [pass, setPass] = React.useState('');
  const [error, setError] = React.useState(null);
  const [offerDemo, setOfferDemo] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  // La cooperativa de la última vez. En un celular recién instalado no hay
  // ninguna, y la pantalla queda genérica hasta el primer ingreso.
  const coop = coopRecordada();

  // Login real contra el servidor. La primera vez que una unidad entra,
  // esa contraseña queda registrada (después Despacho administrará altas).
  const submit = async () => {
    if (!user.trim() || pass.length < 4) {
      setError('Completá usuario y contraseña (mínimo 4 caracteres)');
      return;
    }
    setLoading(true);
    setError(null);
    setOfferDemo(false);
    try {
      const session = await window.RealtimeClient.login(user.trim(), pass);
      try { localStorage.setItem('r14_lastUser', session.unitId); } catch {}
      recordarCoop(session.companyName);
      onSuccess(session);
    } catch (e) {
      setLoading(false);
      if (e.status) {
        setError(e.message);
        if (e.status === 401) setPass('');
      } else {
        // el servidor no responde: se puede probar la app sin conexión
        setError('No se pudo conectar con el servidor');
        setOfferDemo(true);
      }
    }
  };

  const enterDemo = () => {
    const id = user.trim() || 'DEMO';
    onSuccess({ unitId: id, driverName: id, token: null, role: 'driver', demo: true });
  };

  const handleKeyDown = (e) => { if (e.key === 'Enter') submit(); };

  return (
    <div style={{
      width: '100%', height: '100%',
      background: `linear-gradient(180deg, ${P.bg} 0%, ${P.navy} 100%)`,
      display: 'flex', flexDirection: 'column',
      padding: '40px 24px 24px', boxSizing: 'border-box',
      color: P.white, overflowY: 'auto',
    }}>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', marginBottom: 28 }}>
        <CoopLogo size={88} />
        <div style={{
          fontFamily: '"Archivo Black", system-ui, sans-serif',
          fontSize: 26, fontWeight: 900, letterSpacing: -0.5,
          color: P.white, marginTop: 14,
        }}>{coop || COOP.name}</div>
        <div style={{
          fontFamily: 'JetBrains Mono, ui-monospace, monospace',
          fontSize: 10, letterSpacing: 1.5, color: P.sky,
          textTransform: 'uppercase', marginTop: 4, textAlign: 'center',
        }}>{coop ? 'Panel del conductor' : COOP.full}</div>
      </div>

      <div style={{
        display: 'flex', alignItems: 'center', gap: 6,
        alignSelf: 'center', padding: '4px 10px',
        background: P.panel, border: `1px solid ${P.line}`, borderRadius: 100,
        marginBottom: 22,
      }}>
        <span style={{ width: 6, height: 6, borderRadius: '50%', background: P.green, boxShadow: `0 0 8px ${P.green}` }} />
        <span style={{
          fontFamily: 'JetBrains Mono, ui-monospace, monospace',
          fontSize: 10, letterSpacing: 1.5, color: P.green, textTransform: 'uppercase',
        }}>Conectado</span>
      </div>

      <div onKeyDown={handleKeyDown}>
        <Field label="Usuario" value={user} onChange={setUser} autoFocus={true} error={!!error && !user} />
        <Field label="Contraseña" value={pass} onChange={setPass} type="password" error={!!error} />
      </div>

      {(error || notice) && (
        <div style={{
          background: 'rgba(255,77,109,0.12)', border: `1px solid ${P.red}`,
          borderRadius: 10, padding: '10px 12px', marginBottom: 14,
          display: 'flex', alignItems: 'center', gap: 10,
        }}>
          <div style={{
            width: 24, height: 24, borderRadius: '50%',
            background: P.red, color: '#fff',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontFamily: '"Archivo Black", system-ui', fontSize: 14, flexShrink: 0,
          }}>!</div>
          <div style={{ fontSize: 13, fontWeight: 600, color: P.red, fontFamily: '"Helvetica Neue", system-ui' }}>{error || notice}</div>
        </div>
      )}

      {offerDemo && (
        <button onClick={enterDemo} style={{
          width: '100%', padding: '12px',
          fontSize: 14, fontWeight: 700, letterSpacing: 1,
          fontFamily: '"Helvetica Neue", system-ui, sans-serif',
          background: 'transparent', color: P.sky,
          border: `1px solid ${P.deep}`, borderRadius: 10,
          cursor: 'pointer', marginBottom: 14,
        }}>
          ENTRAR EN MODO DEMO (SIN SERVIDOR)

      )}

      <button onClick={submit} disabled={loading} style={{
        width: '100%', padding: '18px',
        fontSize: 20, fontWeight: 900, letterSpacing: 2,

      <div style={{ marginTop: 18, textAlign: 'center', fontFamily: '"Helvetica Neue", system-ui', fontSize: 13, color: P.mute }}>

  const isFirstLap = lapNumber === 1;
  // Lo que se sabe de verdad al abrir el turno. El turno con horario fijo
  // no existe en el modelo: se abre cuando el chofer se conecta y se cierra
  // cuando deja de verse, así que no hay una franja que mostrar. Se muestra

          gap: 10, marginBottom: 16,
        }}>
          {tarjetas.map(([label, val]) => (
            <div key={label} style={{
              background: P.panel, border: `1px solid ${P.line}`, borderRadius: 12,
              padding: '10px 12px', minWidth: 0,

              }}>{label}</div>
              {/* El nombre de una ruta es bastante más largo que "M-12": si
                  no baja de cuerpo se sale de la tarjeta en un celular. */}
              <div style={{
                fontFamily: '"Archivo Black", system-ui',
                fontSize: String(val).length > 10 ? 14 : 20,
                color: P.white, letterSpacing: -0.3, lineHeight: 1.15,

        width: '100%', padding: '22px',

        fontFamily: '"Archivo Black", system-ui, sans-serif',

        cursor: 'pointer', boxShadow: `0 5px 0 ${P.deep}`, marginBottom: 10,

      <button onClick={onRest} disabled={countdown > 0} style={{
        width: '100%', padding: '12px',
        fontSize: 13, fontWeight: 700, letterSpacing: 1,

        background: 'transparent',

        border: `1px solid ${countdown > 0 ? P.line : P.deep}`,
        borderRadius: 10, cursor: countdown > 0 ? 'not-allowed' : 'pointer',
      }}>
        {countdown > 0 ? `Descansar 10 min · disponible en ${countdown}s` : 'Descansar 10 min'}
      </button>
    </div>
  );
}

const DEFAULT_TWEAKS = {
  frontTime: '02:15', backTime: '01:40',
  front2Time: '04:30', back2Time: '03:35',
  targetGap: 2, mode: 'day', microAnims: true,
  startPage: 1, initialScreen: 'login',
  currentStop: 'Tumbes', nextStop: 'Lambayeque', avgSpeed: 28,
};

// "02:15" → 2.25. Un lado sin unidad llega como null y antes reventaba acá
// con un `split` sobre null: la pantalla del chofer quedaba en blanco. Se
// devuelve NaN, que es lo que un tiempo que no existe vale.
function parseMin(s) {
  if (!s) return NaN;
  const [m, sec] = String(s).split(':').map(Number);
  return m + sec / 60;
}

// Estado global = el peor de los dos lados, con tolerancia RELATIVA al objetivo
// (recalibrado por la auditoría: verde ≤ ±15%, ámbar ≤ ±30%, rojo por encima)
function computeStatus(front, back, target) {
  const worst = Math.max(
    Math.abs(parseMin(front) - target),
    Math.abs(parseMin(back) - target)
  ) / target;
  if (worst <= 0.15) return 'green';
  if (worst <= 0.30) return 'yellow';
  return 'red';
}


function AnimatedDigit({ ch, fontSize, color, enableAnim }) {
  const prev = React.useRef(ch);
  const [anim, setAnim] = React.useState(false);
  React.useEffect(() => {
    if (prev.current !== ch && enableAnim) {
      setAnim(true);
      const t = setTimeout(() => setAnim(false), 260);
      return () => clearTimeout(t);
    }
    prev.current = ch;
  }, [ch, enableAnim]);
  return (
    <span style={{
      display: 'inline-block',
      minWidth: ch === ':' ? fontSize * 0.35 : fontSize * 0.62,
      textAlign: 'center', color,
      transform: anim ? 'translateY(-2px)' : 'translateY(0)',
      opacity: anim ? 0.85 : 1,
      transition: 'transform 0.22s cubic-bezier(.2,.8,.2,1), opacity 0.22s',
    }}>{ch}</span>
  );
}

// Fila de dígitos héroe/secundario con la micro-animación por carácter
function HudDigits({ value, fontSize, color, glow, letterSpacing, enableAnim }) {
  return (
    <div style={{
      fontFamily: '"Archivo Black", system-ui, sans-serif',
      fontSize, lineHeight: 0.95, letterSpacing,
      textShadow: glow,
      fontVariantNumeric: 'tabular-nums',
      display: 'flex', maxWidth: '100%',
    }}>
      {value.split('').map((ch, i) => (
        <AnimatedDigit key={i} ch={ch} fontSize={fontSize} color={color} enableAnim={enableAnim} />
      ))}
    </div>
  );
}

// Pantalla RUTA — propuesta 2a "Temporizador".
// Un solo dato dominante: la unidad más desviada del objetivo. El color de
// estado tiñe el halo, la barra superior y el lavado de fondo.
function CenterScreen({ tweaks, gapMeta, connected, unitsOnRoute, gpsRole, onFireSos }) {
  const hud = buildHudModel(tweaks, gapMeta);
  const { hero, sec, target } = hud;

  // Sobre fondo claro (día y sol extremo) el halo no funciona: el dígito va
  // sólido, con el color de estado como tinta. Los tokens ya vienen del tema.
  const sun = !HUD.resplandor;
  const stateColor = hero.color;
  const heroInk = sun ? hero.color : hero.ink;
  const secColor = sec.color;
  const bg = HUD.bg;
  const dim = HUD.dim;
  const dim2 = HUD.dim2;
  const dim3 = HUD.dim3;
  const glow = (spec) => sun ? 'none' : spec;

  // Cadencia de la barra superior según urgencia (tomada del semáforo viejo)
  const edgeDur = hero.status === 'red' ? '0.8s' : hero.status === 'yellow' ? '1.4s' : '2.4s';

  // Instrucción: qué hacer con la brecha, en una línea
  const heroIsBack = hero === hud.back;
  const dev = parseMin(hero.value) - target;
  const speedUp = heroIsBack ? dev < 0 : dev > 0;
  // Sin contra qué medirse no se da una instrucción, pero el motivo cambia
  // todo lo que hay que decir. Con una unidad sin señal, callarse o decir
  // "sos la única" sería peor que no mostrar nada: hay una combi adelante
  // que el chofer no ve en el mapa, y manejar como si no estuviera es
  // exactamente lo que hay que evitar.
  const sinSenalCerca = hud.front.sinSenal || hud.back.sinSenal;
  const instruction = hero.sinSenal
    ? `${hero.unit} se quedó sin señal. Andá con cuidado: sigue en ruta.`
    : hero.vacio
      ? (sinSenalCerca ? 'Sin brecha para medir por ahora.' : 'Sos la única unidad en ruta.')
      : hero.status === 'green'
        ? `Mantené el ritmo. Objetivo ${fmtTarget(target)}.`
        : `${speedUp ? 'Apurá' : 'Aflojá'} un poco. Objetivo ${fmtTarget(target)}.`;

  return (
    <div style={{
      width: '100%', height: '100%', background: bg, color: stateColor,
      display: 'flex', flexDirection: 'column',
      boxSizing: 'border-box', position: 'relative', overflow: 'hidden',
    }}>
      {/* lavado radial de fondo con el color de estado */}
      {!sun && (
        <div style={{
          position: 'absolute', inset: 0, pointerEvents: 'none',
          background: `radial-gradient(110% 55% at 50% 34%, ${stateColor} 0%, transparent 60%)`,
          opacity: 0.14,
        }} />
      )}
      {/* barra de borde superior — pulsa con la urgencia */}
      <div style={{
        position: 'absolute', top: 0, left: 0, right: 0, height: 6,
        background: stateColor,
        boxShadow: sun ? 'none' : `0 0 26px ${stateColor}`,
        animation: tweaks.microAnims ? `combiEdge ${edgeDur} ease-in-out infinite` : 'none',
      }} />

      {/* header: en vivo + velocidad */}
      <div style={{
        padding: '50px 20px 0',
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        position: 'relative',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{
            width: 9, height: 9, borderRadius: '50%',
            background: connected ? HUD.green : HUD.amber,
            boxShadow: sun ? 'none' : `0 0 10px ${connected ? HUD.green : HUD.amber}`,
          }} />
          <span style={{
            fontFamily: 'JetBrains Mono, ui-monospace, monospace',
            fontSize: 15, fontWeight: 700, letterSpacing: 0.5, color: dim,
          }}>{connected ? `EN VIVO · ${unitsOnRoute}` : 'SIMULADO'}</span>
          {/* Acompañante: la posición de la combi la manda el celular del
              chofer. Sin este aviso, el cobrador creería que su GPS falla. */}
          {connected && gpsRole && gpsRole.reporting === false && (
            <span title={gpsRole.reason || 'La posición la reporta el chofer'} style={{
              fontFamily: 'JetBrains Mono, ui-monospace, monospace',
              fontSize: 12, fontWeight: 700, letterSpacing: 0.5,
              color: sun ? '#5A7A99' : HUD.dim2,
              border: `1px solid ${sun ? '#C8D8E8' : '#232b36'}`,
              borderRadius: 5, padding: '2px 6px',
            }}>ACOMPAÑANTE</span>
          )}
        </div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 5 }}>
          <span style={{
            fontFamily: '"Archivo Black", system-ui, sans-serif',
            fontSize: 26, color: sun ? P.navy : HUD.fg,
            fontVariantNumeric: 'tabular-nums',
          }}>{tweaks.avgSpeed}</span>
          <span style={{ fontSize: 15, fontWeight: 700, color: dim, fontFamily: 'system-ui, sans-serif' }}>km/h</span>
        </div>
      </div>

      {/* bloque héroe */}
      <div style={{
        flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center',
        padding: '0 18px', position: 'relative', minHeight: 0,
      }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>
          <span style={{
            fontFamily: '"Archivo Black", system-ui, sans-serif',
            fontSize: 19, letterSpacing: 1, color: stateColor,
            textShadow: glow(`0 0 14px ${stateColor}`),
          }}>{hero.label}</span>
          <span style={{ fontSize: 15, fontWeight: 700, color: dim2, fontFamily: 'system-ui, sans-serif' }}>
            {rotuloLado(hero)}
          </span>
        </div>
        {/* Un lado vacío no lleva dígitos: el "—" en Archivo Black a 118 px
            es una barra maciza que se lee como un dato. El rótulo de arriba
            ya dice "sin nadie". */}
        {!hero.vacio && (
          <div style={{ color: heroInk }}>
            <HudDigits
              value={hero.display}
              fontSize={118}
              color={heroInk}
              letterSpacing={-5}
              glow={glow(`0 0 8px ${stateColor}, 0 0 26px ${stateColor}, 0 0 70px ${stateColor}, 0 0 130px ${stateColor}`)}
              enableAnim={tweaks.microAnims}
            />
          </div>
        )}
        <div style={{
          fontSize: 16, lineHeight: 1.5, color: sun ? '#3D5C7A' : '#93AAC2',
          marginTop: 10, fontFamily: 'system-ui, sans-serif',
        }}>{instruction}</div>

        <div style={{ height: 1, background: sun ? '#C9D8E6' : HUD.divider, margin: '26px 0 20px' }} />

        {/* secundario: el otro lado, subordinado */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
          <div>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
              <span style={{
                fontFamily: '"Archivo Black", system-ui, sans-serif',
                fontSize: 17, color: sun ? '#3D5C7A' : '#A9C0D6',
              }}>{sec.label}</span>
              <span style={{ fontSize: 15, fontWeight: 700, color: dim2, fontFamily: 'system-ui, sans-serif' }}>
                {rotuloLado(sec)}
              </span>
            </div>
            {!sec.vacio && (
              <div style={{ color: secColor }}>
                <HudDigits
                  value={sec.display}
                  fontSize={62}
                  color={secColor}
                  letterSpacing={-2}
                  glow={glow(`0 0 16px ${secColor}8C`)}
                  enableAnim={tweaks.microAnims}
                />
              </div>
            )}
          </div>
          {sec.status === 'green' && (
            <div style={{
              fontSize: 15, fontWeight: 700, color: dim2,
              paddingBottom: 10, fontFamily: 'system-ui, sans-serif',
            }}>OK</div>
          )}
        </div>

        {/* ±2: presentes pero mínimos. El servidor solo manda la de adelante
            y la de atrás; el ±2 es de la maqueta, así que en vivo no va. */}
        {!hud.vivo && (
          <div style={{
            display: 'flex', gap: 18, marginTop: 18,
            fontSize: 15, fontWeight: 700, color: dim3,
            fontFamily: 'system-ui, sans-serif',
          }}>
            <span>+2 <span style={{ color: dim, fontVariantNumeric: 'tabular-nums' }}>{fmtGap(tweaks.front2Time)}</span></span>
            <span>−2 <span style={{ color: dim, fontVariantNumeric: 'tabular-nums' }}>{fmtGap(tweaks.back2Time)}</span></span>
          </div>
        )}
      </div>

      {/* tramo — los paraderos no existen en el modelo del servidor: son de
          la maqueta. En vivo esta línea se calla en vez de decir el nombre
          de dos ciudades que no tienen nada que ver con la ruta. */}
      {!hud.vivo && (
        <div style={{
          padding: '0 18px 14px', position: 'relative',
          display: 'flex', alignItems: 'center', gap: 8,
        }}>
          <span style={{ width: 8, height: 8, borderRadius: '50%', background: P.bright, flexShrink: 0 }} />
          <span style={{
            fontSize: 16, fontWeight: 700, color: dim,
            fontFamily: 'system-ui, sans-serif',
            whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
          }}>{tweaks.currentStop} → {tweaks.nextStop}</span>
        </div>
      )}

      {/* SOS */}
      <div style={{ padding: '0 18px 26px', position: 'relative' }}>
        <SosSlider status={hero.status} enableAnim={tweaks.microAnims} onFire={onFireSos} />
      </div>
    </div>
  );
}

function Carousel({ tweaks, otherUnits = [], gapMeta, routeId, connected, gpsRole, trazado, messages, onSendText, onSendVoice, onSos }) {
  // mapMounted: true la primera vez que el usuario llega a la página del mapa.
  // Leaflet necesita un div visible para inicializarse — si lo montamos antes,
  // mide 0×0 y no renderiza nada.
  const [mapMounted, setMapMounted] = React.useState(false);
  const [page, setPage] = React.useState(tweaks.startPage ?? 1);

  const goToPage = (p) => {
    if (p === 2) setMapMounted(true); // montar el mapa la primera vez
    setPage(p);
  };
  const [dragDx, setDragDx] = React.useState(0);
  const [dragging, setDragging] = React.useState(false);
  const startX = React.useRef(0);
  const startY = React.useRef(0);
  const lockedAxis = React.useRef(null);
  const containerRef = React.useRef(null);
  const [emergencyFired, setEmergencyFired] = React.useState(false);

  React.useEffect(() => {
    if (emergencyFired) {
      const t = setTimeout(() => setEmergencyFired(false), 2000);
      return () => clearTimeout(t);
    }
  }, [emergencyFired]);

  const onDown = (x, y) => {
    setDragging(true);
    startX.current = x;
    startY.current = y;
    lockedAxis.current = null;
  };
  const onMove = (x, y) => {
    if (!dragging) return;
    const dx = x - startX.current;
    const dy = y - startY.current;
    if (!lockedAxis.current) {
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
        lockedAxis.current = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }
    }
    if (lockedAxis.current === 'x') setDragDx(dx);
  };
  const onUp = () => {
    if (!dragging) return;
    const w = containerRef.current?.offsetWidth || 380;
    const threshold = w * 0.25;
    if (lockedAxis.current === 'x') {
      if (dragDx < -threshold && page < 2) goToPage(page + 1);
      else if (dragDx > threshold && page > 0) goToPage(page - 1);
    }
    setDragDx(0);
    setDragging(false);
    lockedAxis.current = null;
  };

  React.useEffect(() => {
    if (!dragging) return;
    const mm = (e) => onMove(e.clientX, e.clientY);
    const mu = () => onUp();
    const tm = (e) => onMove(e.touches[0].clientX, e.touches[0].clientY);
    const tu = () => onUp();
    window.addEventListener('mousemove', mm);
    window.addEventListener('mouseup', mu);
    window.addEventListener('touchmove', tm, { passive: false });
    window.addEventListener('touchend', tu);
    return () => {
      window.removeEventListener('mousemove', mm);
      window.removeEventListener('mouseup', mu);
      window.removeEventListener('touchmove', tm);
      window.removeEventListener('touchend', tu);
    };
  }, [dragging, page, dragDx]);

  const sun = !HUD.resplandor;   // fondo claro (día o sol extremo)
  const hud = buildHudModel(tweaks, gapMeta);
  const unitsOnRoute = otherUnits.length + 1;
  const w = containerRef.current?.offsetWidth || 380;
  const translateX = -page * w + (lockedAxis.current === 'x' ? dragDx : 0);

  return (
    <div ref={containerRef} style={{
      position: 'relative', width: '100%', height: '100%',
      overflow: 'hidden', background: HUD.bg,
    }}
      onMouseDown={(e) => {
        if (e.target.closest('[data-noswipe]')) return;
        onDown(e.clientX, e.clientY);
      }}
      onTouchStart={(e) => {
        if (e.target.closest('[data-noswipe]')) return;
        onDown(e.touches[0].clientX, e.touches[0].clientY);
      }}
    >
      {emergencyFired && (
        <div style={{
          position: 'absolute', inset: 0, zIndex: 99,
          background: HUD.red,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          animation: 'combiFlash 0.5s ease-out',
        }}>
          <div style={{
            color: '#fff', fontFamily: '"Archivo Black", system-ui, sans-serif',
            fontSize: 44, fontWeight: 900, letterSpacing: 4, textAlign: 'center',
          }}>
            SOS<br/><span style={{ fontSize: 18, letterSpacing: 2 }}>ALERTA ENVIADA</span>
          </div>
        </div>
      )}

      <div style={{
        display: 'flex',
        width: `${w * 3}px`, height: '100%',
        transform: `translateX(${translateX}px)`,
        transition: dragging ? 'none' : 'transform 0.32s cubic-bezier(.2,.9,.2,1)',
      }}>
        <div style={{ width: `${w}px`, height: '100%', overflow: 'hidden', flexShrink: 0 }}>
          <ChatScreen
            messages={messages}
            hud={hud}
            online={unitsOnRoute}
            connected={connected}
            routeId={routeId}
            onSendText={onSendText}
            onSendVoice={onSendVoice}
          />
        </div>
        <div style={{ width: `${w}px`, height: '100%', overflow: 'hidden', flexShrink: 0 }}>
          <CenterScreen
            tweaks={tweaks}
            gapMeta={gapMeta}
            connected={connected}
            unitsOnRoute={unitsOnRoute}
            gpsRole={gpsRole}
            onFireSos={() => { setEmergencyFired(true); onSos && onSos(); }}
          />
        </div>
        <div style={{ width: `${w}px`, height: '100%', flexShrink: 0, background: HUD.bg }} />
      </div>

      {/* Mapa fuera del track — así no lo afecta el transform del carrusel */}
      {mapMounted && (
        <div style={{
          position: 'absolute', inset: 0, zIndex: 5,
          visibility: page === 2 ? 'visible' : 'hidden',
          pointerEvents: page === 2 ? 'auto' : 'none',
        }}>
          <GpsMap
            active={page === 2}
            otherUnits={otherUnits}
            hud={hud}
            gapMeta={gapMeta}
            currentStop={tweaks.currentStop}
            nextStop={tweaks.nextStop}
            routeId={routeId}
            modo={tweaks.mode}
            trazado={trazado}
          />
        </div>
      )}

      {/* dots de navegación — fuera del área del dato, sin etiqueta apilada */}
      <div style={{
        position: 'absolute', top: 0, left: 0, right: 0,
        display: 'flex', justifyContent: 'center', alignItems: 'center',
        gap: 8, zIndex: 10, height: 36,
      }}>
        {[0,1,2].map(i => (
          <button key={i}
            onClick={(e) => { e.stopPropagation(); goToPage(i); }}
            onMouseDown={(e) => e.stopPropagation()}
            onTouchStart={(e) => { e.stopPropagation(); goToPage(i); }}
            style={{
              width: 44, height: 36,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              background: 'transparent', border: 'none',
              cursor: 'pointer', padding: 0,
              WebkitTapHighlightColor: 'transparent',
            }}
          >
            <div style={{
              width: i === page ? 24 : 10, height: 10, borderRadius: 5,
              background: i === page ? P.bright : HUD.line,
              transition: 'all 0.3s',
              pointerEvents: 'none',
            }} />
          </button>
        ))}
      </div>
    </div>
  );
}

function TweaksPanel({ tweaks, setTweaks, visible, onNav, currentScreen }) {
  if (!visible) return null;

  const update = (patch) => {
    const next = { ...tweaks, ...patch };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*');
  };

  const scenarios = [
    { l: 'Saludable',     f: '02:00', b: '02:00' },
    { l: 'Adelante lejos', f: '03:30', b: '01:50' },
    { l: 'Atrás pegado',  f: '02:10', b: '00:45' },
    { l: 'Crítico',       f: '04:20', b: '00:20' },
  ];
  const activeScenario = scenarios.find(s => s.f === tweaks.frontTime && s.b === tweaks.backTime);

  return (
    <div style={{
      position: 'fixed', right: 20, top: 20,
      width: 280, maxHeight: '92vh', overflow: 'auto',
      background: '#0a0a0a', color: '#eee',
      borderRadius: 14, padding: 16,
      border: '1px solid #2a2a2a',
      boxShadow: '0 20px 60px rgba(0,0,0,0.6)',
      fontFamily: 'system-ui, sans-serif', zIndex: 9999,
    }}>
      <div style={{
        fontFamily: 'ui-monospace, monospace', fontSize: 11, letterSpacing: 2,
        color: '#fff', textTransform: 'uppercase', marginBottom: 14,
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
      }}>
        <span>Tweaks</span>
        <span style={{ color: '#666', fontSize: 9 }}>v2</span>
      </div>

      <TweakRow label="Pantalla">
        <Seg value={currentScreen || 'app'} onChange={v => { update({ initialScreen: v }); onNav && onNav(v); }}
          options={[{ v: 'login', l: 'Login' }, { v: 'start', l: 'Salir ruta' }, { v: 'app', l: 'App' }]}
        />
      </TweakRow>

      <TweakRow label="Escenario">
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 4 }}>
          {scenarios.map(s => (
            <ScenarioButton key={s.l} label={s.l} active={activeScenario?.l === s.l}
              onClick={() => update({ frontTime: s.f, backTime: s.b })} />
          ))}
        </div>
      </TweakRow>

      {[
        { key: 'frontTime', label: 'Adelante', max: 600 },
        { key: 'backTime',  label: 'Atrás',    max: 600 },
        { key: 'front2Time', label: '+2 unidad lejana adelante', max: 900 },
        { key: 'back2Time',  label: '-2 unidad lejana atrás',    max: 900 },
      ].map(({ key, label, max }) => (
        <TweakRow key={key} label={`${label}: ${tweaks[key]}`}>
          <input type="range" min="0" max={max} step="5"
            value={parseInt(tweaks[key].split(':')[0]) * 60 + parseInt(tweaks[key].split(':')[1])}
            onChange={e => {
              const s = parseInt(e.target.value);
              const m = String(Math.floor(s / 60)).padStart(2, '0');
              const sec = String(s % 60).padStart(2, '0');
              update({ [key]: `${m}:${sec}` });
            }}
            style={{ width: '100%', accentColor: '#fff' }}
          />
        </TweakRow>
      ))}

      <TweakRow label="Pantalla inicial">
        <Seg value={String(tweaks.startPage)} onChange={v => update({ startPage: parseInt(v) })}
          options={[{ v: '0', l: 'Chat' }, { v: '1', l: 'Ruta' }, { v: '2', l: 'Mapa' }]}
        />
      </TweakRow>

      <TweakRow label={`Objetivo: ${tweaks.targetGap} min`}>
        <input type="range" min="1" max="5" step="0.5"
          value={tweaks.targetGap}
          onChange={e => update({ targetGap: parseFloat(e.target.value) })}
          style={{ width: '100%', accentColor: '#fff' }}
        />
      </TweakRow>

      <TweakRow label="Modo de luz">
        <Seg value={tweaks.mode} onChange={v => update({ mode: v })}
          options={[{ v: 'day', l: 'Día' }, { v: 'sun', l: 'Sol extremo' }, { v: 'night', l: 'Noche' }]}
        />
      </TweakRow>

      <TweakRow label="Micro-interacciones">
        <Seg value={tweaks.microAnims ? 'on' : 'off'} onChange={v => update({ microAnims: v === 'on' })}
          options={[{ v: 'on', l: 'Activadas' }, { v: 'off', l: 'Desactivadas' }]}
        />
      </TweakRow>

      <div style={{
        fontFamily: 'ui-monospace, monospace', fontSize: 9, color: '#555', lineHeight: 1.5, marginTop: 8,
      }}>
        Desliza horizontalmente para cambiar pantalla:<br/>
        <strong style={{ color: '#aaa' }}>← Chat · Ruta · Mapa →</strong><br/>
        Desliza el círculo SOS hasta el final para alertar.
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// ROOT
// ═══════════════════════════════════════════════════════════════
function Root() {
  const [tweaks, setTweaks] = React.useState(() => {
    // El modo elegido se recuerda en el celular: el chofer no lo re-elige
    // cada mañana. De fábrica es DÍA, que es como se usa la app.
    try {
      const guardado = localStorage.getItem('r14_modo');
      if (guardado && TEMAS[guardado]) return { ...DEFAULT_TWEAKS, mode: guardado };
    } catch {}
    return DEFAULT_TWEAKS;
  });

  // Los tokens del tema se aplican ANTES de renderizar los hijos: HUD es un
  // objeto que se muta, así que tiene que estar en su valor final cuando las
  // pantallas lo leen. Es idempotente, no importa que corra en cada render.
  aplicarTema(tweaks.mode);
  React.useEffect(() => {
    try { localStorage.setItem('r14_modo', tweaks.mode); } catch {}
    // El marco de la página también, para que no quede un fondo negro
    // rodeando una app clara (ni al revés).
    const r = document.documentElement.style;
    r.setProperty('--pag-bg', HUD.resplandor ? '#0c0c0e' : '#F0F4F9');
    r.setProperty('--pag-fg', HUD.resplandor ? '#eee' : HUD.fg);
    r.setProperty('--pag-dim', HUD.resplandor ? '#888' : HUD.dim2);
    r.setProperty('--pag-dim2', HUD.resplandor ? '#666' : HUD.dim3);
  }, [tweaks.mode]);
  const [tweaksVisible, setTweaksVisible] = React.useState(false);
  const [screen, setScreen] = React.useState(DEFAULT_TWEAKS.initialScreen || 'login');
  const [user, setUser] = React.useState(null);
  const [lap, setLap] = React.useState(1);
  const [connected, setConnected] = React.useState(false);
  const [otherUnits, setOtherUnits] = React.useState([]);
  const [gapMeta, setGapMeta] = React.useState(null); // { aheadUnit, behindUnit }
  const [routeId, setRouteId] = React.useState(null); // ruta del chofer, la manda el servidor
  const [messages, setMessages] = React.useState(CHAT_SEED);
  const [incomingSos, setIncomingSos] = React.useState(null);
  const [authNotice, setAuthNotice] = React.useState(null);
  // { reporting, reason } — si reporting es false, este celular va de
  // acompañante: ve todo, pero la posición de la unidad la manda otro.
  const [gpsRole, setGpsRole] = React.useState({ reporting: true, reason: null });
  // Trazado real de la ruta, por tramos; vacío hasta que Despacho lo cargue
  const [trazado, setTrazado] = React.useState({ ida: [], vuelta: [] });
  const connectedRef = React.useRef(false);
  const myUnitIdRef = React.useRef(null);

  const pushMsg = (m) => setMessages(ms => [...ms.slice(-99), m]);

  // Restaurar la sesión guardada: el chofer no tipea su clave cada día
  React.useEffect(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('r14_session') || 'null');
      if (saved?.unitId && saved?.token) {
        setUser(saved);
        setScreen('start');
      }
    } catch {}
  }, []);

  const onLogin = (session) => {
    setUser(session);
    setAuthNotice(null);
    try {
      if (session.token) localStorage.setItem('r14_session', JSON.stringify(session));
    } catch {}
    setScreen('start');
  };

  const logout = () => {
    try { localStorage.removeItem('r14_session'); } catch {}
    if (window.RealtimeClient) window.RealtimeClient.disconnect();
    setUser(null);
    setScreen('login');
  };

  React.useEffect(() => {
    if (!incomingSos) return;
    const t = setTimeout(() => setIncomingSos(null), 2500);
    return () => clearTimeout(t);
  }, [incomingSos]);

  // Conectar al servidor cuando el chofer sale a ruta.
  // En modo demo (sin token) no hay conexión: todo queda local.
  React.useEffect(() => {
    if (!user || screen !== 'app') return;
    if (!window.RealtimeClient || !user.token) return;

    const myUnitId = user.unitId; // la PERSONA: con esto entra y con esto firma
    myUnitIdRef.current = myUnitId;
    // El VEHÍCULO en el que va: es la clave del mapa y de las brechas. Para
    // un chofer suelen coincidir; para un cobrador no, y para él la brecha
    // que importa es la de la combi en la que viaja.
    const myVehicleId = user.vehicleId || user.unitId;

    // Sesión rechazada (expirada o revocada): limpiar y volver al login
    window.RealtimeClient.on('autherror', () => {
      try { localStorage.removeItem('r14_session'); } catch {}
      setUser(null);
      setAuthNotice('Tu sesión expiró. Ingresá de nuevo.');
      setScreen('login');
    });

    window.RealtimeClient.on('status', ({ connected }) => {
      connectedRef.current = connected;
      setConnected(connected);
    });

    window.RealtimeClient.on('state', (state) => {
      // La ruta y su objetivo de brecha los define el servidor, no la app:
      // cada ruta tiene su propia separación ideal entre unidades.
      setRouteId(state.routeId || null);
      if (state.targetGapMin) {
        setTweaks(t => t.targetGap === state.targetGapMin ? t : { ...t, targetGap: state.targetGapMin });
      }
      const myGaps = state.gaps?.[myVehicleId];
      const miUnidad = state.units?.find(u => u.unitId === myVehicleId);
      if (myGaps) {
        setTweaks(t => ({
          ...t,
          frontTime: myGaps.toAhead || t.frontTime,
          backTime:  myGaps.toBehind || t.backTime,
        }));
      }
      // La velocidad va aparte de las brechas y **sin `||`**: una combi
      // parada manda 0, y `0 || 28` devolvía los 28 km/h de la maqueta. El
      // chofer detenido en el paradero veía que iba a 28.
      if (miUnidad) {
        setTweaks(t => ({ ...t, avgSpeed: Math.round(miUnidad.speed || 0) }));
      }
      // `vivo` le dice al HUD que a partir de acá manda el servidor, null
      // incluido: sin esta marca no hay forma de distinguir "no hay nadie
      // atrás" del valor de arranque de la maqueta. Se pone con el primer
      // estado que llega, no solo cuando hay brechas, porque una unidad sola
      // en la ruta no tiene brechas y es justo el caso que se inventaba.
      setGapMeta({
        vivo: true,
        toAhead: myGaps?.toAhead || null,
        toBehind: myGaps?.toBehind || null,
        aheadUnit: myGaps?.aheadUnit || null,
        behindUnit: myGaps?.behindUnit || null,
        // Hay alguien de ese lado pero dejó de reportar. Es distinto de que
        // no haya nadie, y el chofer tiene que poder distinguirlo: uno
        // significa "sos el primero", el otro "andá con cuidado".
        aheadSinSenal: !!myGaps?.aheadSinSenal,
        behindSinSenal: !!myGaps?.behindSinSenal,
      });
      // Todas las combis en ruta menos la mía (ya vienen solo de mi ruta)
      const others = (state.units || []).filter(u => u.unitId !== myVehicleId && u.lat);
      setOtherUnits(others);
    });

    // Al conectar, el servidor manda los últimos mensajes del grupo:
    // el hilo real reemplaza al de demostración
    window.RealtimeClient.on('history', (items) => {
      setMessages(items.map(it => {
        const own = it.unitId === myUnitId;
        const from = own ? 'TÚ' : (it.driverName || it.unitId || 'Conductor');
        const role = own ? 'you' : 'driver';
        const time = nowTime(it.timestamp);
        const isDispatch = it.role === 'dispatch' && !own;
        const msgRole = own ? 'you' : (isDispatch ? 'admin' : 'driver');
        const tone = isDispatch ? 'info' : 'normal';
        const unit = it.vehicleId && it.vehicleId !== myVehicleId ? it.vehicleId : null;
        const privado = !!it.toVehicleId;
        if (it.kind === 'sos') {
          return { from: it.driverName || it.unitId || 'Conductor', role: 'driver', unit, text: 'SOS — pide ayuda', time, tone: 'sos' };
        }
        if (it.kind === 'voice') {
          // las notas viejas pierden el audio en el servidor: quedan expiradas
          return { from, role: msgRole, unit, privado, voice: it.duration, audio: it.data || null, expired: !it.data, time, tone };
        }
        return { from, role: msgRole, unit, privado, text: it.text, time, tone };
      }));
    });

    // Chat en vivo: el servidor rebota el mensaje a todos (incluido el emisor),
    // así el hilo queda en el mismo orden para todo el grupo
    window.RealtimeClient.on('chat', (m) => {
      const own = m.unitId === myUnitId;
      const isDispatch = m.role === 'dispatch' && !own;
      pushMsg({
        from: own ? 'TÚ' : (m.driverName || m.unitId || 'Conductor'),
        role: own ? 'you' : (isDispatch ? 'admin' : 'driver'),
        unit: m.vehicleId && m.vehicleId !== myVehicleId ? m.vehicleId : null,
        privado: !!m.toVehicleId,
        text: m.text,
        time: nowTime(m.timestamp),
        tone: isDispatch ? 'info' : 'normal',
      });
    });

    // Nota de voz de cualquier unidad (incluida la propia, por el eco)
    window.RealtimeClient.on('voice', (m) => {
      const own = m.unitId === myUnitId;
      const isDispatch = m.role === 'dispatch' && !own;
      pushMsg({
        from: own ? 'TÚ' : (m.driverName || m.unitId || 'Conductor'),
        role: own ? 'you' : (isDispatch ? 'admin' : 'driver'),
        unit: m.vehicleId && m.vehicleId !== myVehicleId ? m.vehicleId : null,
        privado: !!m.toVehicleId,
        voice: m.duration,
        audio: m.data,
        time: nowTime(m.timestamp),
        tone: isDispatch ? 'info' : 'normal',
      });
    });

    // SOS de otra unidad: entra al hilo y dispara el aviso a pantalla completa
    window.RealtimeClient.on('sos', (a) => {
      if (a.unitId === myUnitId) return; // el propio ya tiene su flash local
      pushMsg({
        from: a.driverName || a.unitId || 'Conductor',
        role: 'driver',
        unit: a.vehicleId && a.vehicleId !== myVehicleId ? a.vehicleId : null,
        text: 'SOS — pide ayuda',
        time: nowTime(a.timestamp),
        tone: 'sos',
      });
      setIncomingSos(a);
    });

    // El servidor decide quién reporta la posición de la unidad: uno solo por
    // vehículo. El cobrador —o el chofer al que relevaron— queda en modo
    // acompañante y hay que decírselo, porque si no parece que su GPS falla.
    window.RealtimeClient.on('geometry', (g) => {
      setTrazado(g.tramos || { ida: [], vuelta: [] });
    });

    window.RealtimeClient.on('gpsrole', (r) => {
      setGpsRole({ reporting: r.reporting !== false, reason: r.reason || null });
    });

    window.RealtimeClient.connect({ token: user.token });

    return () => window.RealtimeClient.disconnect();
  }, [user, screen]);

  // privado = solo con Despacho, sobre esta unidad; si no, al grupo de la ruta
  const sendText = (text, privado) => {
    if (connectedRef.current) {
      window.RealtimeClient.sendChat(text, privado); // el eco del servidor lo agrega al hilo
    } else {
      pushMsg({ from: 'TÚ', role: 'you', privado: !!privado, text, time: nowTime(), tone: 'normal' });
    }
  };

  // Nota de voz: si hay audio y conexión va al canal elegido (el eco la
  // agrega al hilo); sin conexión o sin permiso de micrófono queda local
  const sendVoice = (seconds, dataUrl, privado) => {
    if (connectedRef.current && dataUrl) {
      window.RealtimeClient.sendVoice(dataUrl, seconds, privado);
    } else {
      pushMsg({ from: 'TÚ', role: 'you', privado: !!privado, voice: seconds, audio: dataUrl || null, time: nowTime(), tone: 'normal' });
    }
  };

  const fireSos = () => {
    if (connectedRef.current) window.RealtimeClient.sendSos();
  };


  React.useEffect(() => {
    if (tweaks.initialScreen && tweaks.initialScreen !== screen) {
      setScreen(tweaks.initialScreen);
    }
  }, [tweaks.initialScreen]);

  React.useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || !e.data.type) return;
      if (e.data.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  let content;
  if (screen === 'login') {
    content = <LoginScreen onSuccess={onLogin} notice={authNotice} />;
  } else if (screen === 'start') {
    content = <StartRouteScreen
      user={(user?.driverName || user?.unitId || '').toUpperCase()}
      unidad={user?.vehicleId || user?.unitId || null}
      ruta={user?.routeName || user?.routeId || null}
      rutaId={user?.routeId || null}
      lapNumber={lap}
      onStart={() => setScreen('app')}
      onRest={() => setScreen('app')}
      onLogout={logout}
    />;
  } else {
    content = <CombiScreen
      tweaks={tweaks}
      otherUnits={otherUnits}
      gapMeta={gapMeta}
      routeId={routeId || user?.routeId || null}
      connected={connected}
      gpsRole={gpsRole}
      trazado={trazado}
      messages={messages}
      onSendText={sendText}
      onSendVoice={sendVoice}
      onSos={fireSos}
    />;
  }

  return (
    <>
      <AndroidDevice width={380} height={780} dark={HUD.resplandor}>
        {content}
        {/* SOS entrante de otra unidad — aviso a pantalla completa */}
        {incomingSos && (
          <div style={{
            position: 'absolute', inset: 0, zIndex: 100,
            background: HUD.red,
            display: 'flex', flexDirection: 'column',
            alignItems: 'center', justifyContent: 'center', gap: 8,
            animation: 'combiFlash 0.5s ease-out',
          }}>
            <div style={{
              color: '#fff', fontFamily: '"Archivo Black", system-ui, sans-serif',
              fontSize: 44, letterSpacing: 4,
            }}>SOS</div>
            <div style={{
              color: '#fff', fontFamily: '"Archivo Black", system-ui, sans-serif',
              fontSize: 20, letterSpacing: 1, textAlign: 'center', padding: '0 24px',
            }}>{(incomingSos.driverName || incomingSos.unitId || 'UNA UNIDAD').toUpperCase()}
              {incomingSos.vehicleId ? ` · ${incomingSos.vehicleId.toUpperCase()}` : ''}
              <br/>PIDE AYUDA</div>
          </div>
        )}
      </AndroidDevice>
      {ReactDOM.createPortal(
        <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVisible}
          onNav={(s) => setScreen(s)} currentScreen={screen} />,
        document.getElementById('tweaks-mount')
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('stage')).render(<Root />);

</script>

<!-- PWA: registra el service worker en el navegador -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(() => console.log('Service Worker registrado'))
        .catch((err) => console.log('Service Worker falló:', err));
    });
  }
</script>

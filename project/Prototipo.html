const ROUTE_POINTS = [
  { x: 30,  y: 420 },
  { x: 85,  y: 360 },
  { x: 140, y: 340 },
  { x: 200, y: 310 },
  { x: 250, y: 260 },
  { x: 280, y: 210 },
  { x: 300, y: 160 },
  { x: 320, y: 110 },
  { x: 340, y: 60  },
];

function posOnRoute(t) {
  const clamped = Math.max(0, Math.min(1, t));
  const seg = clamped * (ROUTE_POINTS.length - 1);
  const i = Math.floor(seg);
  const frac = seg - i;
  const a = ROUTE_POINTS[i];
  const b = ROUTE_POINTS[Math.min(i + 1, ROUTE_POINTS.length - 1)];
  return { x: a.x + (b.x - a.x) * frac, y: a.y + (b.y - a.y) * frac };
}

// Convierte coordenadas GPS reales de Juliaca a posición en el mapa SVG (0-380, 0-600)
// La ruta R-14 va de Terminal Sur (-15.502, -70.133) a Huancané (-15.457, -70.103)
const JULIACA_BOUNDS = {
  latMin: -15.520, latMax: -15.440,
  lngMin: -70.155, lngMax: -70.090,
};

function gpsToMapXY(lat, lng) {
  const x = ((lng - JULIACA_BOUNDS.lngMin) / (JULIACA_BOUNDS.lngMax - JULIACA_BOUNDS.lngMin)) * 380;
  const y = ((lat - JULIACA_BOUNDS.latMax) / (JULIACA_BOUNDS.latMin - JULIACA_BOUNDS.latMax)) * 600;
  return {
    x: Math.max(10, Math.min(370, x)),
    y: Math.max(10, Math.min(590, y)),
  };
}

// Centro de Juliaca — Plaza de Armas
const JULIACA_CENTER = [-15.4904, -70.1333];

function GpsMap({ frontTime, backTime, status, expanded, active }) {
  const mapRef = React.useRef(null);      // div donde vive el mapa
  const leafletRef = React.useRef(null);  // instancia de Leaflet
  const youMarkerRef = React.useRef(null);

  // Cuando el carrusel muestra esta pantalla, Leaflet necesita recalcular su tamaño
  React.useEffect(() => {
    if (active && leafletRef.current) {
      setTimeout(() => leafletRef.current.invalidateSize(), 50);
    }
  }, [active]);
  const [realPos, setRealPos] = React.useState(null);
  const [gpsError, setGpsError] = React.useState(null);

  const statusColor =
    status === 'green' ? '#00E676' :
    status === 'yellow' ? '#FFD600' : '#FF1744';

  // Crear icono circular para Leaflet
  function makeIcon(color, size, label) {
    const html = `
      <div style="
        width:${size}px; height:${size}px; border-radius:50%;
        background:${color}; border:3px solid #000;
        box-shadow:0 0 ${size}px ${color};
        display:flex; align-items:center; justify-content:center;
        font-family:monospace; font-size:9px; font-weight:900;
        color:#000; white-space:nowrap;
      ">${label || ''}</div>`;
    return L.divIcon({ html, className: '', iconSize: [size, size], iconAnchor: [size/2, size/2] });
  }

  // Inicializar Leaflet cuando el div esté en el DOM
  const initMap = React.useCallback((node) => {
    if (!node || leafletRef.current) return;
    mapRef.current = node;

    const map = L.map(node, {
      center: JULIACA_CENTER,
      zoom: 15,
      zoomControl: false,  // sin botones +/- para no distraer al conductor
      attributionControl: false,
    });

    // Tiles de OpenStreetMap con estilo oscuro (CartoDB Dark Matter)
    // Perfecto para la noche y el sol — alto contraste
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
    }).addTo(map);

    // Marcador "TÚ" — punto blanco pulsante
    const youIcon = makeIcon('#FFFFFF', 20, '');
    const youMarker = L.marker(JULIACA_CENTER, { icon: youIcon, zIndexOffset: 1000 })
      .addTo(map)
      .bindTooltip('TÚ', { permanent: true, direction: 'top', className: 'map-tooltip' });
    youMarkerRef.current = youMarker;

    // Marcadores de unidades adelante y atrás (simuladas por ahora)
    const frontCoords = [-15.484, -70.131];
    const backCoords  = [-15.497, -70.135];
    L.marker(frontCoords, { icon: makeIcon(statusColor, 16, '') })
      .addTo(map)
      .bindTooltip(`+1 · ${frontTime}`, { permanent: true, direction: 'top', className: 'map-tooltip' });
    L.marker(backCoords, { icon: makeIcon(statusColor, 16, '') })
      .addTo(map)
      .bindTooltip(`-1 · ${backTime}`, { permanent: true, direction: 'top', className: 'map-tooltip' });

    leafletRef.current = map;

    // Forzar recálculo de tamaño en varios momentos
    setTimeout(() => map.invalidateSize(), 100);
    setTimeout(() => map.invalidateSize(), 400);
    setTimeout(() => map.invalidateSize(), 1000);
  }, []);

  // Actualizar posición del marcador "TÚ" cuando llega GPS real
  React.useEffect(() => {
    if (!navigator.geolocation) { setGpsError('sin GPS'); return; }
    const id = navigator.geolocation.watchPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        setRealPos({ lat: latitude, lng: longitude });
        if (youMarkerRef.current && leafletRef.current) {
          youMarkerRef.current.setLatLng([latitude, longitude]);
          leafletRef.current.panTo([latitude, longitude], { animate: true, duration: 1 });
        }
      },
      (err) => setGpsError(err.message),
      { enableHighAccuracy: true, maximumAge: 3000 }
    );
    return () => navigator.geolocation.clearWatch(id);
  }, []);

  return (
    <div style={{ position: 'absolute', inset: 0, background: '#0a0e12' }}>
      {/* contenedor del mapa Leaflet */}
      <div ref={initMap} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', zIndex: 1 }} data-noswipe="map" />

      {/* overlay superior con info de ruta */}
      {expanded && (
        <div style={{
          position: 'absolute', top: 16, left: 16, right: 16,
          display: 'flex', gap: 10, justifyContent: 'space-between',
          fontFamily: 'JetBrains Mono, ui-monospace, monospace',
          pointerEvents: 'none', zIndex: 1000,
        }}>
          <div style={{
            background: 'rgba(0,0,0,0.8)', padding: '6px 10px', borderRadius: 6,
            fontSize: 10, color: '#aab4c0', border: '1px solid #1e242c',
          }}>
            <div style={{ color: '#6b7785', fontSize: 8, letterSpacing: 1.5 }}>RUTA</div>
            <div style={{ fontWeight: 700, color: '#fff' }}>R-14 · TERMINAL</div>
          </div>
          <div style={{
            background: 'rgba(0,0,0,0.8)', padding: '6px 10px', borderRadius: 6,
            fontSize: 10, color: '#aab4c0', border: '1px solid #1e242c',
            textAlign: 'right',
          }}>
            <div style={{ color: '#6b7785', fontSize: 8, letterSpacing: 1.5 }}>EN RUTA</div>
            <div style={{ fontWeight: 700, color: '#fff' }}>7 unid.</div>
          </div>
        </div>
      )}

      {/* indicador GPS abajo */}
      <div style={{
        position: 'absolute', bottom: 16, left: 16,
        fontFamily: 'JetBrains Mono, ui-monospace, monospace',
        fontSize: 9, letterSpacing: 1.5, textTransform: 'uppercase',
        background: 'rgba(0,0,0,0.8)', padding: '4px 8px', borderRadius: 6,
        display: 'flex', alignItems: 'center', gap: 5,
        pointerEvents: 'none', zIndex: 1000,
      }}>
        <span style={{
          width: 6, height: 6, borderRadius: '50%',
          background: realPos ? '#00E676' : '#FFD600', flexShrink: 0,
        }} />
        <span style={{ color: realPos ? '#00E676' : '#FFD600' }}>
          {realPos
            ? `GPS REAL · ${realPos.lat.toFixed(4)}, ${realPos.lng.toFixed(4)}`
            : gpsError ? 'GPS NO DISPONIBLE' : 'ESPERANDO GPS...'}
        </span>
      </div>
    </div>
  );
}

  warn:   { bg: '#3a2410', border: '#6a3e16', accent: '#ffb347' },
  normal: { bg: '#1a1e24', border: '#2a2f38', accent: '#aab4c0' },
  you:    { bg: '#0f2a20', border: '#1e5440', accent: '#00E676' },
};

function VoiceBar({ seconds, accent }) {
  const bars = Array.from({ length: 22 }, (_, i) => {
    return 6 + Math.abs(Math.sin(i * 1.7) * 16) + Math.abs(Math.cos(i * 0.7) * 8);
  });
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
      <div style={{
        width: 36, height: 36, borderRadius: '50%',
        background: accent, color: '#000',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: 18, flexShrink: 0,
      }}>▶</div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 2, flex: 1 }}>
        {bars.map((h, i) => (
          <div key={i} style={{
            width: 3, height: h, borderRadius: 1,
            background: accent, opacity: i < 6 ? 1 : 0.4,
          }} />
        ))}
      </div>
      <div style={{
        fontFamily: 'JetBrains Mono, ui-monospace, monospace',
        fontSize: 13, fontWeight: 700, color: accent, minWidth: 28, textAlign: 'right',
      }}>{seconds}"</div>
    </div>
  );
}

// SOS SLIDER
// ═══════════════════════════════════════════════════════════════
function SosSlider({ mode, status, enableAnim, onFire }) {
  const trackRef = React.useRef(null);
  const [progress, setProgress] = React.useState(0);
  const [dragging, setDragging] = React.useState(false);
  const [fired, setFired] = React.useState(false);
  const startX = React.useRef(0);
  const startProg = React.useRef(0);

  const onDown = (clientX) => {
    if (fired) return;
    setDragging(true);
    startX.current = clientX;
    startProg.current = progress;
  };
  const onMove = (clientX) => {
    if (!dragging || fired) return;
    const track = trackRef.current;
    if (!track) return;
    const trackW = track.offsetWidth - 68;
    const dx = clientX - startX.current;
    const p = Math.max(0, Math.min(1, startProg.current + dx / trackW));
    setProgress(p);
    if (p >= 0.98) {
      setFired(true);
      setDragging(false);
      onFire && onFire();
      setTimeout(() => { setFired(false); setProgress(0); }, 2200);
    }
  };
  const onUp = () => {
    setDragging(false);
    if (!fired) setProgress(0);
  };

  React.useEffect(() => {
    if (!dragging) return;
    const mm = (e) => onMove(e.clientX);
    const mu = () => onUp();
    const tm = (e) => onMove(e.touches[0].clientX);
    const tu = () => onUp();
    window.addEventListener('mousemove', mm);
    window.addEventListener('mouseup', mu);
    window.addEventListener('touchmove', tm);
    window.addEventListener('touchend', tu);
    return () => {
      window.removeEventListener('mousemove', mm);
      window.removeEventListener('mouseup', mu);
      window.removeEventListener('touchmove', tm);
      window.removeEventListener('touchend', tu);
    };
  }, [dragging]);

  const trackH = 88;
  const thumbSize = 68;
  const suggestSos = status === 'red' && enableAnim;

  return (
    <div ref={trackRef} data-noswipe="sos" style={{
      position: 'relative', width: '100%', height: trackH,
      borderRadius: trackH / 2,
      background: mode.bg === '#F5F9FF' ? '#f3f3f3' : '#1a1a1a',
      border: `3px solid ${mode.red}`,
      overflow: 'hidden', userSelect: 'none',
      WebkitTapHighlightColor: 'transparent',
    }}>
      {suggestSos && !dragging && progress === 0 && (
        <div style={{
          position: 'absolute', inset: -5,
          borderRadius: (trackH + 10) / 2,
          border: `2px solid ${mode.red}`,
          animation: 'combiRing 1.6s ease-out infinite',
          pointerEvents: 'none',
        }} />
      )}
      <div style={{
        position: 'absolute', inset: 0,
        background: mode.red,
        width: `calc(${thumbSize/2 + 5}px + ${progress * 100}%)`,
        maxWidth: '100%',
        transition: dragging ? 'none' : 'width 0.25s cubic-bezier(.4,0,.2,1)',
        opacity: 0.9,
      }} />
      <div style={{
        position: 'absolute', inset: 0,
        paddingLeft: thumbSize + 16,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: '"Archivo Black", system-ui, sans-serif',
        fontSize: 22, fontWeight: 900, letterSpacing: 2.5,
        color: progress > 0.3 ? '#fff' : mode.red,
        transition: 'color 0.2s', pointerEvents: 'none', zIndex: 2,
        opacity: progress > 0.85 ? 0 : 1,
      }}>
        {fired ? 'ENVIANDO...' : progress > 0.5 ? 'SUELTA PARA SOS' : 'DESLIZA →'}
      </div>
      {!fired && progress < 0.3 && enableAnim && (
        <div style={{
          position: 'absolute', right: 24, top: '50%',
          transform: 'translateY(-50%)',
          display: 'flex', gap: 4,
          color: mode.red, opacity: 0.4,
          pointerEvents: 'none', zIndex: 2,
        }}>
          {[0,1,2].map(i => (
            <span key={i} style={{
              fontFamily: '"Archivo Black", system-ui',
              fontSize: 22, fontWeight: 900,
              animation: `combiChev 1.2s ease-in-out ${i * 0.15}s infinite`,
            }}>›</span>
          ))}
        </div>
      )}
      <div
        onMouseDown={(e) => onDown(e.clientX)}
        onTouchStart={(e) => onDown(e.touches[0].clientX)}
        style={{
          position: 'absolute',
          left: `calc(${progress} * (100% - ${thumbSize + 10}px) + 5px)`,
          top: 5,
          width: thumbSize, height: thumbSize, borderRadius: '50%',
          background: '#fff', color: mode.red,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontFamily: '"Archivo Black", system-ui, sans-serif',
          fontSize: 20, fontWeight: 900,
          cursor: 'grab',
          transition: dragging ? 'none' : 'left 0.3s cubic-bezier(.4,0,.2,1)',
          boxShadow: '0 2px 8px rgba(0,0,0,0.3)',
          zIndex: 3, touchAction: 'none',
        }}
      >
        {fired ? '✓' : 'SOS'}
      </div>
    </div>
  );
}

function parseMin(s) {
  const [m, sec] = s.split(':').map(Number);
  return m + sec / 60;
}

function computeStatus(front, back, target) {
  const f = parseMin(front);
  const b = parseMin(back);
  const worstDev = Math.max(Math.abs(f - target), Math.abs(b - target));
  if (worstDev <= 0.5) return 'green';
  if (worstDev <= 1.0) return 'yellow';
  return 'red';
}

    ? '"JetBrains Mono", ui-monospace, monospace'
    : '"Archivo Black", system-ui, sans-serif';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '4px 14px', opacity: faded ? 0.45 : 1,
    }}>
      <div style={{
        fontFamily: 'JetBrains Mono, ui-monospace, monospace',
        fontSize: 11, fontWeight: 700, letterSpacing: 1.5,
        color: mode.dim, textTransform: 'uppercase', minWidth: 36,
      }}>{label}</div>
      <div style={{
        fontFamily, fontSize: 38, fontWeight: 900,
        color, lineHeight: 1, letterSpacing: -1.5,
        fontVariantNumeric: 'tabular-nums',
      }}>{value}</div>
    </div>
  );
}

function AnimatedDigit({ ch, fontSize, color, enableAnim }) {
  const prev = React.useRef(ch);
  const [anim, setAnim] = React.useState(false);
  React.useEffect(() => {
    if (prev.current !== ch && enableAnim) {
      setAnim(true);
      const t = setTimeout(() => setAnim(false), 260);
      return () => clearTimeout(t);
    }
    prev.current = ch;
  }, [ch, enableAnim]);
  return (
    <span style={{
      display: 'inline-block',
      minWidth: ch === ':' ? fontSize * 0.35 : fontSize * 0.62,
      textAlign: 'center', color,
      transform: anim ? 'translateY(-2px)' : 'translateY(0)',
      opacity: anim ? 0.85 : 1,
      transition: 'transform 0.22s cubic-bezier(.2,.8,.2,1), opacity 0.22s',
    }}>{ch}</span>
  );
}

function BigTime({ value, label, color, mode, numberStyle, enableAnim, heartbeat }) {
  const fontFamily = numberStyle === 'mono'
    ? '"JetBrains Mono", ui-monospace, monospace'
    : '"Archivo Black", system-ui, sans-serif';
  const fontSize = 96;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '2px 0' }}>
      <div style={{
        display: 'flex', alignItems: 'center', gap: 6,
        fontFamily: 'JetBrains Mono, ui-monospace, monospace',
        fontSize: 12, fontWeight: 700, letterSpacing: 2,
        color: mode.dim, textTransform: 'uppercase', marginBottom: 0,
      }}>
        <span style={{
          width: 6, height: 6, borderRadius: '50%',
          background: mode.green,
          opacity: heartbeat && enableAnim ? 1 : 0.4,
          transition: 'opacity 0.4s',
        }} />
        {label}
      </div>
      <div style={{
        fontFamily, fontSize, fontWeight: 900,
        lineHeight: 0.95, letterSpacing: -3,
        fontVariantNumeric: 'tabular-nums', display: 'flex',
      }}>
        {value.split('').map((ch, i) => (
          <AnimatedDigit key={i} ch={ch} fontSize={fontSize} color={color} enableAnim={enableAnim} />
        ))}
      </div>
    </div>
  );
}

function Semaphore({ status, mode, style, enableAnim }) {
  const colors = { red: mode.red, yellow: mode.yellow, green: mode.green };
  const lit = status;
  const pulseDur = status === 'red' ? '0.8s' : status === 'yellow' ? '1.4s' : '2.4s';

  const dot = (key) => {
    const isLit = key === lit;
    return (
      <div key={key} style={{ position: 'relative', width: 34, height: 34 }}>
        {isLit && enableAnim && (
          <div style={{
            position: 'absolute', inset: -6, borderRadius: '50%',
            background: colors[key], opacity: 0.3,
            animation: `combiBreathe ${pulseDur} ease-in-out infinite`,
          }} />
        )}
        <div style={{
          position: 'relative', width: 34, height: 34, borderRadius: '50%',
          background: isLit ? colors[key] : 'transparent',
          border: `3px solid ${isLit ? colors[key] : mode.dim}`,
          opacity: isLit ? 1 : 0.3,
          boxShadow: isLit ? `0 0 24px ${colors[key]}, 0 0 48px ${colors[key]}80` : 'none',
          transition: 'all 0.4s',
        }} />
      </div>
    );
  };

  if (style === 'bar') {
    return (
      <div style={{
        width: '78%', height: 14, borderRadius: 7,
        background: colors[lit], boxShadow: `0 0 28px ${colors[lit]}`,
        animation: enableAnim ? `combiBreathe ${pulseDur} ease-in-out infinite` : 'none',
      }} />
    );
  }
  return (
    <div style={{
      display: 'flex', gap: 14, alignItems: 'center',
      padding: '8px 18px', borderRadius: 40,
      background: mode.panel, border: `1px solid ${mode.line}`,
    }}>
      {dot('red')}{dot('yellow')}{dot('green')}
    </div>
  );
}

function ContextHeader({ currentStop, nextStop, avgSpeed, mode }) {
  const speedTone =
    avgSpeed < 18 ? mode.yellow :
    avgSpeed > 38 ? mode.red :
    mode.bright;
  return (
    <div style={{ display: 'flex', gap: 8, alignItems: 'stretch', padding: '0 4px' }}>
      <div style={{
        flex: 1, background: mode.panel, border: `1px solid ${mode.line}`,
        borderRadius: 12, padding: '8px 12px',
        display: 'flex', flexDirection: 'column', gap: 1, minWidth: 0,
      }}>
        <div style={{
          fontFamily: 'JetBrains Mono, ui-monospace, monospace',
          fontSize: 9, letterSpacing: 1.5, color: mode.dim, textTransform: 'uppercase',
          display: 'flex', alignItems: 'center', gap: 4,
        }}>
          <span style={{
            display: 'inline-block', width: 5, height: 5, borderRadius: '50%',
            background: mode.bright, boxShadow: `0 0 6px ${mode.bright}`,

          Tramo
        </div>
        <div style={{
          fontFamily: '"Archivo Black", system-ui, sans-serif',
          fontSize: 14, color: mode.fg, letterSpacing: -0.2,

      </div>

        display: 'flex', flexDirection: 'column', alignItems: 'flex-end', minWidth: 76,

        <div style={{
          fontFamily: 'JetBrains Mono, ui-monospace, monospace',

        <div style={{ display: 'flex', alignItems: 'baseline', gap: 3, fontFamily: '"Archivo Black", system-ui, sans-serif', color: speedTone }}>
          <span style={{ fontSize: 22, letterSpacing: -1, fontVariantNumeric: 'tabular-nums' }}>{avgSpeed}</span>
          <span style={{ fontSize: 9, letterSpacing: 1, color: mode.dim, fontWeight: 700 }}>KM/H</span>

function CenterScreen({ tweaks, onFireSos }) {

  const [heartbeat, setHeartbeat] = React.useState(true);
  React.useEffect(() => {

  return (
    <div style={{
      width: '100%', height: '100%', background: mode.bg,

      <div style={{ height: 1, background: mode.line, opacity: 0.5 }} />
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>

      </div>
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <BigTime value={tweaks.backTime} label="-1 ATRÁS" color={mode.fg} mode={mode}
          numberStyle={tweaks.numberStyle} enableAnim={tweaks.microAnims} heartbeat={heartbeat} />
      </div>
      <div style={{ height: 1, background: mode.line, opacity: 0.5 }} />

      <div style={{ marginTop: 12 }}>
        <SosSlider mode={mode} status={status} enableAnim={tweaks.microAnims} onFire={onFireSos} />
      </div>

}

function Carousel({ tweaks }) {
  const [page, setPage] = React.useState(tweaks.startPage ?? 1);
  const [dragDx, setDragDx] = React.useState(0);
  const [dragging, setDragging] = React.useState(false);
  const startX = React.useRef(0);
  const startY = React.useRef(0);
  const lockedAxis = React.useRef(null);
  const containerRef = React.useRef(null);
  const [emergencyFired, setEmergencyFired] = React.useState(false);

  React.useEffect(() => {
    if (emergencyFired) {
      const t = setTimeout(() => setEmergencyFired(false), 2000);
      return () => clearTimeout(t);
    }
  }, [emergencyFired]);

  const onDown = (x, y) => {
    setDragging(true);
    startX.current = x;
    startY.current = y;
    lockedAxis.current = null;
  };
  const onMove = (x, y) => {
    if (!dragging) return;
    const dx = x - startX.current;
    const dy = y - startY.current;
    if (!lockedAxis.current) {
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
        lockedAxis.current = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }
    }
    if (lockedAxis.current === 'x') setDragDx(dx);
  };
  const onUp = () => {
    if (!dragging) return;
    const w = containerRef.current?.offsetWidth || 380;
    const threshold = w * 0.25;
    if (lockedAxis.current === 'x') {
      if (dragDx < -threshold && page < 2) setPage(p => p + 1);
      else if (dragDx > threshold && page > 0) setPage(p => p - 1);
    }
    setDragDx(0);
    setDragging(false);
    lockedAxis.current = null;
  };

  React.useEffect(() => {
    if (!dragging) return;
    const mm = (e) => onMove(e.clientX, e.clientY);
    const mu = () => onUp();
    const tm = (e) => onMove(e.touches[0].clientX, e.touches[0].clientY);
    const tu = () => onUp();
    window.addEventListener('mousemove', mm);
    window.addEventListener('mouseup', mu);
    window.addEventListener('touchmove', tm, { passive: false });
    window.addEventListener('touchend', tu);
    return () => {
      window.removeEventListener('mousemove', mm);
      window.removeEventListener('mouseup', mu);
      window.removeEventListener('touchmove', tm);
      window.removeEventListener('touchend', tu);
    };
  }, [dragging, page, dragDx]);

  const mode = MODES[tweaks.mode] || MODES.day;
  const status = computeStatus(tweaks.frontTime, tweaks.backTime, tweaks.targetGap);
  const w = containerRef.current?.offsetWidth || 380;
  const translateX = -page * w + (lockedAxis.current === 'x' ? dragDx : 0);

  return (
    <div ref={containerRef} style={{
      position: 'relative', width: '100%', height: '100%',
      overflow: 'hidden', background: mode.bg,
    }}
      onMouseDown={(e) => {
        if (e.target.closest('[data-noswipe]')) return;
        onDown(e.clientX, e.clientY);
      }}
      onTouchStart={(e) => {
        if (e.target.closest('[data-noswipe]')) return;
        onDown(e.touches[0].clientX, e.touches[0].clientY);
      }}
    >
      {emergencyFired && (
        <div style={{
          position: 'absolute', inset: 0, zIndex: 99,
          background: mode.red,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          animation: 'combiFlash 0.5s ease-out',
        }}>
          <div style={{
            color: '#fff', fontFamily: '"Archivo Black", system-ui, sans-serif',
            fontSize: 44, fontWeight: 900, letterSpacing: 4, textAlign: 'center',
          }}>
            SOS<br/><span style={{ fontSize: 18, letterSpacing: 2 }}>ALERTA ENVIADA</span>
          </div>
        </div>
      )}

      <div style={{
        display: 'flex',
        width: `${w * 3}px`, height: '100%',
        transform: `translateX(${translateX}px)`,
        transition: dragging ? 'none' : 'transform 0.32s cubic-bezier(.2,.9,.2,1)',
      }}>
        <div style={{ width: `${w}px`, height: '100%', overflow: 'hidden', flexShrink: 0 }}>
          <ChatScreen />
        </div>
        <div style={{ width: `${w}px`, height: '100%', overflow: 'hidden', flexShrink: 0 }}>
          <CenterScreen tweaks={tweaks} onFireSos={() => setEmergencyFired(true)} />
        </div>
        <div style={{ width: `${w}px`, height: '100%', position: 'relative', overflow: 'hidden', flexShrink: 0 }}>
          <div style={{ position: 'absolute', inset: 0, background: mode.bg }}>
            <GpsMap frontTime={tweaks.frontTime} backTime={tweaks.backTime} status={status} expanded={true} active={page === 2} />
            <div style={{
              position: 'absolute', top: 16, left: 16,
              fontFamily: 'JetBrains Mono, ui-monospace, monospace',
              fontSize: 10, letterSpacing: 2, color: mode.sky,
              textTransform: 'uppercase', pointerEvents: 'none',
            }}>← volver</div>
          </div>
        </div>
      </div>

      {/* dots de navegación */}
      <div style={{
        position: 'absolute', top: 0, left: 0, right: 0,
        display: 'flex', justifyContent: 'center', alignItems: 'center',
        gap: 8, zIndex: 10, height: 36,
      }}>
        {[0,1,2].map(i => (
          <button key={i}
            onClick={(e) => { e.stopPropagation(); setPage(i); }}
            onMouseDown={(e) => e.stopPropagation()}
            onTouchStart={(e) => { e.stopPropagation(); setPage(i); }}
            style={{
              width: 44, height: 36,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              background: 'transparent', border: 'none',
              cursor: 'pointer', padding: 0,
              WebkitTapHighlightColor: 'transparent',
            }}
          >
            <div style={{
              width: i === page ? 24 : 10, height: 10, borderRadius: 5,
              background: i === page ? mode.bright : mode.line,
              transition: 'all 0.3s',
              pointerEvents: 'none',
            }} />
          </button>
        ))}
      </div>

      {/* etiqueta de pantalla */}
      <div style={{
        position: 'absolute', top: 22, left: 0, right: 0,
        display: 'flex', justifyContent: 'center',
        fontFamily: 'JetBrains Mono, ui-monospace, monospace',
        fontSize: 9, letterSpacing: 2, color: mode.dim,
        textTransform: 'uppercase', pointerEvents: 'none', zIndex: 10, opacity: 0.7,
      }}>
        {page === 0 ? 'CHAT' : page === 1 ? 'RUTA' : 'MAPA'}
      </div>
    </div>
  );
}

function CombiScreen({ tweaks }) {
  return <Carousel tweaks={tweaks} />;
}

function TweakRow({ label, children }) {
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 6,
      paddingBottom: 12, marginBottom: 12,
      borderBottom: '1px solid #2a2a2a',
    }}>
      <label style={{
        fontFamily: 'ui-monospace, monospace', fontSize: 10, letterSpacing: 1.5,
        color: '#888', textTransform: 'uppercase',
      }}>{label}</label>
      {children}
    </div>
  );
}

function Seg({ value, options, onChange }) {
  return (
    <div style={{ display: 'flex', gap: 4, background: '#1a1a1a', borderRadius: 8, padding: 3 }}>
      {options.map(opt => (
        <button key={opt.v} onClick={() => onChange(opt.v)} style={{
          flex: 1, padding: '6px 8px', borderRadius: 6, border: 'none',
          background: value === opt.v ? '#fff' : 'transparent',
          color: value === opt.v ? '#000' : '#ccc',
          fontFamily: 'system-ui', fontSize: 11, fontWeight: 600, cursor: 'pointer',
        }}>{opt.l}</button>
      ))}
    </div>
  );
}

function ScenarioButton({ label, onClick, active }) {
  return (
    <button onClick={onClick} style={{
      flex: 1, padding: '8px 6px', borderRadius: 6,
      border: active ? '1px solid #fff' : '1px solid #333',
      background: active ? '#fff' : '#1a1a1a',
      color: active ? '#000' : '#ccc',
      fontFamily: 'system-ui', fontSize: 10, fontWeight: 600, cursor: 'pointer', textAlign: 'center',
    }}>{label}</button>
  );
}

function TweaksPanel({ tweaks, setTweaks, visible, onNav, currentScreen }) {
  if (!visible) return null;

  const update = (patch) => {
    const next = { ...tweaks, ...patch };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*');
  };

  const scenarios = [
    { l: 'Saludable',     f: '02:00', b: '02:00' },
    { l: 'Adelante lejos', f: '03:30', b: '01:50' },
    { l: 'Atrás pegado',  f: '02:10', b: '00:45' },
    { l: 'Crítico',       f: '04:20', b: '00:20' },
  ];
  const activeScenario = scenarios.find(s => s.f === tweaks.frontTime && s.b === tweaks.backTime);

  return (
    <div style={{
      position: 'fixed', right: 20, top: 20,
      width: 280, maxHeight: '92vh', overflow: 'auto',
      background: '#0a0a0a', color: '#eee',
      borderRadius: 14, padding: 16,
      border: '1px solid #2a2a2a',
      boxShadow: '0 20px 60px rgba(0,0,0,0.6)',
      fontFamily: 'system-ui, sans-serif', zIndex: 9999,
    }}>
      <div style={{
        fontFamily: 'ui-monospace, monospace', fontSize: 11, letterSpacing: 2,
        color: '#fff', textTransform: 'uppercase', marginBottom: 14,
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
      }}>
        <span>Tweaks</span>
        <span style={{ color: '#666', fontSize: 9 }}>v2</span>
      </div>

      <TweakRow label="Pantalla">
        <Seg value={currentScreen || 'app'} onChange={v => { update({ initialScreen: v }); onNav && onNav(v); }}
          options={[{ v: 'login', l: 'Login' }, { v: 'start', l: 'Salir ruta' }, { v: 'app', l: 'App' }]}
        />
      </TweakRow>

      <TweakRow label="Escenario">
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 4 }}>
          {scenarios.map(s => (
            <ScenarioButton key={s.l} label={s.l} active={activeScenario?.l === s.l}
              onClick={() => update({ frontTime: s.f, backTime: s.b })} />
          ))}
        </div>
      </TweakRow>

      {[
        { key: 'frontTime', label: 'Adelante', max: 600 },
        { key: 'backTime',  label: 'Atrás',    max: 600 },
        { key: 'front2Time', label: '+2 unidad lejana adelante', max: 900 },
        { key: 'back2Time',  label: '-2 unidad lejana atrás',    max: 900 },
      ].map(({ key, label, max }) => (
        <TweakRow key={key} label={`${label}: ${tweaks[key]}`}>
          <input type="range" min="0" max={max} step="5"
            value={parseInt(tweaks[key].split(':')[0]) * 60 + parseInt(tweaks[key].split(':')[1])}
            onChange={e => {
              const s = parseInt(e.target.value);
              const m = String(Math.floor(s / 60)).padStart(2, '0');
              const sec = String(s % 60).padStart(2, '0');
              update({ [key]: `${m}:${sec}` });
            }}
            style={{ width: '100%', accentColor: '#fff' }}
          />
        </TweakRow>
      ))}

      <TweakRow label="Pantalla inicial">
        <Seg value={String(tweaks.startPage)} onChange={v => update({ startPage: parseInt(v) })}
          options={[{ v: '0', l: 'Chat' }, { v: '1', l: 'Ruta' }, { v: '2', l: 'Mapa' }]}
        />
      </TweakRow>

      <TweakRow label={`Objetivo: ${tweaks.targetGap} min`}>
        <input type="range" min="1" max="5" step="0.5"
          value={tweaks.targetGap}
          onChange={e => update({ targetGap: parseFloat(e.target.value) })}
          style={{ width: '100%', accentColor: '#fff' }}
        />
      </TweakRow>

      <TweakRow label="Modo de luz">
        <Seg value={tweaks.mode} onChange={v => update({ mode: v })}
          options={[{ v: 'day', l: 'Día' }, { v: 'sun', l: 'Sol extremo' }, { v: 'night', l: 'Noche' }]}
        />
      </TweakRow>

      <TweakRow label="Tipografía de números">
        <Seg value={tweaks.numberStyle} onChange={v => update({ numberStyle: v })}
          options={[{ v: 'mono', l: 'Mono' }, { v: 'sans', l: 'Sans pesada' }]}
        />
      </TweakRow>

      <TweakRow label="Semáforo">
        <Seg value={tweaks.semaphoreStyle} onChange={v => update({ semaphoreStyle: v })}
          options={[{ v: 'dots', l: '3 luces' }, { v: 'bar', l: 'Barra' }]}
        />
      </TweakRow>

      <TweakRow label="Micro-interacciones">
        <Seg value={tweaks.microAnims ? 'on' : 'off'} onChange={v => update({ microAnims: v === 'on' })}
          options={[{ v: 'on', l: 'Activadas' }, { v: 'off', l: 'Desactivadas' }]}
        />
      </TweakRow>

      <div style={{
        fontFamily: 'ui-monospace, monospace', fontSize: 9, color: '#555', lineHeight: 1.5, marginTop: 8,
      }}>
        Desliza horizontalmente para cambiar pantalla:<br/>
        <strong style={{ color: '#aaa' }}>← Chat · Ruta · Mapa →</strong><br/>
        Desliza el círculo SOS hasta el final para alertar.
      </div>
    </div>
  );
}

function Root() {
  const [tweaks, setTweaks] = React.useState(DEFAULT_TWEAKS);
  const [tweaksVisible, setTweaksVisible] = React.useState(false);
  const [screen, setScreen] = React.useState(DEFAULT_TWEAKS.initialScreen || 'login');
  const [user, setUser] = React.useState(null);
  const [lap, setLap] = React.useState(1);
  const [connected, setConnected] = React.useState(false);

  // Conectar al servidor cuando el chofer hace login
  React.useEffect(() => {
    if (!user || screen !== 'app') return;
    if (!window.RealtimeClient) return;

    window.RealtimeClient.on('status', ({ connected }) => setConnected(connected));

    window.RealtimeClient.on('state', (state) => {
      // Buscar los gaps que corresponden a esta unidad
      const myUnit = 'V-247'; // en producción viene del login
      const myGaps = state.gaps?.[myUnit];
      if (!myGaps) return;

      setTweaks(t => ({
        ...t,
        frontTime: myGaps.toAhead || t.frontTime,
        backTime:  myGaps.toBehind || t.backTime,
        avgSpeed:  state.units?.find(u => u.unitId === myUnit)?.speed || t.avgSpeed,
      }));
    });

    window.RealtimeClient.connect('V-247', user.user);

    return () => window.RealtimeClient.disconnect();
  }, [user, screen]);


  React.useEffect(() => {
    if (tweaks.initialScreen && tweaks.initialScreen !== screen) {
      setScreen(tweaks.initialScreen);
    }
  }, [tweaks.initialScreen]);

  React.useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || !e.data.type) return;
      if (e.data.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  let content;
  if (screen === 'login') {
    content = <LoginScreen onSuccess={(u) => { setUser(u); setScreen('start'); }} />;
  } else if (screen === 'start') {
    content = <StartRouteScreen
      user={user?.user?.toUpperCase()}
      lapNumber={lap}
      onStart={() => setScreen('app')}
      onRest={() => setScreen('app')}
    />;
  } else {
    content = <CombiScreen tweaks={tweaks} onFinishLap={() => { setLap(l => l + 1); setScreen('start'); }} />;
  }

  return (
    <>
      <AndroidDevice width={380} height={780} dark={true}>
        {content}
        {/* Indicador de conexión — aparece solo en la pantalla principal */}
        {screen === 'app' && (
          <div style={{
            position: 'absolute', top: 44, right: 14,
            display: 'flex', alignItems: 'center', gap: 4,
            background: 'rgba(0,0,0,0.5)',
            padding: '3px 8px', borderRadius: 100,
            pointerEvents: 'none', zIndex: 20,
          }}>
            <span style={{
              width: 6, height: 6, borderRadius: '50%',
              background: connected ? P.green : P.yellow,
              boxShadow: connected ? `0 0 6px ${P.green}` : 'none',
            }} />
            <span style={{
              fontFamily: 'JetBrains Mono, ui-monospace, monospace',
              fontSize: 8, letterSpacing: 1, color: connected ? P.green : P.yellow,
              textTransform: 'uppercase',
            }}>{connected ? 'EN VIVO' : 'SIMULADO'}</span>
          </div>
        )}
      </AndroidDevice>
      {ReactDOM.createPortal(
        <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVisible}
          onNav={(s) => setScreen(s)} currentScreen={screen} />,
        document.getElementById('tweaks-mount')
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('stage')).render(<Root />);

</script>

<!-- PWA: registra el service worker en el navegador -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(() => console.log('Service Worker registrado'))
        .catch((err) => console.log('Service Worker falló:', err));
    });
  }
</script>

</body>
</html>

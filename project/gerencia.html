<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Gerencia — se mudó al panel de Despacho</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7FAFD">
<link rel="icon" type="image/png" href="icon-despacho-192.png">
<!-- El panel de gerencia se FUSIONÓ con el de Despacho: el gerente entra
     por despacho.html con su misma cuenta y ve todo lo de siempre (los
     números están en Gestión → Números) más el mapa en vivo y el chat.
     Esta página queda solo para los marcadores viejos.

     Misma puerta que el login de Despacho: tema DÍA (valores de `day` de
     despacho.html, copiados a mano), el mismo ícono y Archivo Black en el
     título. Antes tenía una paleta oscura propia. -->
<meta http-equiv="refresh" content="4; url=despacho.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F7FAFD; --surface: #FFFFFF; --divider: #E1E9F2; --fg: #0B2239; --fg2: #2A4864;
          --dim2: #496A86; --bright: #1668C4; --fondoLogin: #E3EEF9; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    box-sizing: border-box;
    background: radial-gradient(90% 70% at 50% 0%, var(--fondoLogin) 0%, var(--bg) 72%);
    color: var(--fg); font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }
  .caja {
    max-width: 440px; padding: 28px; background: var(--surface); border: 1px solid var(--divider);
    border-radius: 20px; box-shadow: 0 2px 6px rgba(11,34,57,.06), 0 24px 48px -20px rgba(11,34,57,.35);
  }
  .marca { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .marca img { border-radius: 12px; display: block; }
  .marca small { display: block; font-size: 13px; font-weight: 600; color: var(--dim2); }
  h1 { font-family: "Archivo Black", system-ui, sans-serif; font-weight: 400; font-size: 24px; line-height: 1.2; margin: 0 0 10px; }
  p { font-size: 15px; line-height: 1.6; color: var(--fg2); margin: 0 0 18px; }
  .boton {
    display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 12px;
    background: var(--bright); color: #fff; font-weight: 800; text-decoration: none; transition: filter .16s ease;
  }
  .boton:hover { filter: brightness(.95); }
  .boton:focus-visible { outline: 2px solid var(--bright); outline-offset: 2px; }
  .nota { font-size: 13px; color: var(--dim2); margin: 12px 0 0; }
  a { color: var(--bright); }
  @media (prefers-reduced-motion: reduce) { .boton { transition: none; } }
</style>
</head>
<body>
<div class="caja">
  <div class="marca">
    <img src="icon-despacho-192.png" alt="" width="44" height="44">
    <div><strong>Control de flota</strong><small>Panel de Despacho</small></div>
  </div>
  <h1>El panel de gerencia se mudó</h1>
  <p>
    Ahora la gerencia entra por el <strong>panel de Despacho</strong>, con su
    misma cuenta y su misma clave. Ahí están los números de siempre
    (Gestión → Números) y además el mapa en vivo y el chat.
  </p>
  <a class="boton" href="despacho.html">Abrir el panel
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  <p class="nota">Te llevamos solos en unos segundos.</p>
</div>
</body>
</html>
